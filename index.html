{t:'order',q:'Put the lines in order to define and call a function that doubles a number.',items:['int doubleIt(int n) {','    return n * 2;','}','std::cout << doubleIt(5);'],e:'The function is defined first, then called with an argument.'}]},
{t:'References and pass-by-reference',c:'refs',teach:'A reference, declared with &, is an alias for an existing variable; int& r = x makes r another name for x. Passing a parameter by reference (void f(int& x)) lets a function modify the caller\'s variable, unlike pass-by-value which copies it. const T& passes efficiently without allowing changes. Pitfall: a reference must be initialized when declared and cannot later refer to a different variable.',code:'void addOne(int& x) {\n    x = x + 1;\n}\nint a = 5;\naddOne(a);\nstd::cout << a;',qs:[
{t:'mc',q:'What does this print?',code:'void addOneVal(int x) { x = x + 1; }\nint a = 5;\naddOneVal(a);\nstd::cout << a;',o:['5','6','7','Error'],a:0,e:'x is a copy, so changing it inside the function does not affect a.'},
{t:'mc',q:'What does this print?',code:'void addOne(int& x) { x = x + 1; }\nint a = 5;\naddOne(a);\nstd::cout << a;',o:['6','5','0','Error'],a:0,e:'x is a reference to a, so modifying x modifies a directly, giving 6.'},
{t:'tf',q:'A reference variable can be reseated to refer to a different variable after it is initialized.',o:TF,a:1,e:'A reference is bound permanently to the variable it was initialized with.'},
{t:'fill',q:'Fill in the symbol that declares r as a reference to x.',code:'int x = 10;\nint ___ r = x;',a:['&'],e:'& after the type declares a reference, an alias for x.'},
{t:'match',q:'Match each parameter style to its behavior.',pairs:[['int x','receives a copy'],['int& x','can modify the caller\'s variable'],['const int& x','reads efficiently, cannot modify'],['int* x','receives an address']],e:'Each style controls whether the function can see or change the original variable.'}]},
{t:'Pointers and arrays',c:'ptrs',teach:'A pointer, declared with *, holds the address of a variable: int* p = &x. *p dereferences it to get or set the pointed-to value. An array name decays to a pointer to its first element, so p[i] and *(p + i) both access element i. Pitfall: dereferencing an uninitialized or null pointer is undefined behavior and can crash the program.',code:'int arr[3] = {1, 2, 3};\nint* p = arr;\nstd::cout << *p << " " << *(p + 1) << " " << p[2];',qs:[
{t:'mc',q:'What does this print?',code:'int arr[3] = {1, 2, 3};\nint* p = arr;\nstd::cout << p[0] << p[2];',o:['13','03','12','Error'],a:0,e:'p[0] is the first element, 1, and p[2] is the third, 3.'},
{t:'mc',q:'What symbol declares a pointer and what symbol dereferences one?',o:['* declares and dereferences; & takes an address','& declares and dereferences','* only declares; & only dereferences','Pointers use no special symbols'],a:0,e:'* is used both in the declaration (int* p) and to dereference (*p); & gets an address (&x).'},
{t:'fill',q:'Fill in the operator to get the address of x.',code:'int x = 7;\nint* p = ___x;',a:['&'],e:'& takes the address of a variable, which a pointer can store.'},
{t:'mc',q:'Find the bug: this is undefined behavior.',code:'int* p;\nstd::cout << *p;',o:['p is never initialized before being dereferenced','* cannot be used with int','p needs to be an array','cout cannot print int*'],a:0,e:'p holds a garbage address, so dereferencing it reads undefined memory.'},
{t:'tf',q:'An array name used in an expression decays to a pointer to its first element.',o:TF,a:0,e:'This is why arr and &arr[0] behave the same way in most expressions.'}]},
{t:'Strings and vectors',c:'stringsvec',teach:'std::string (from <string>) manages text with automatic memory handling; use + or += to join, .length() or .size() for length, .substr(pos, len) to slice. std::vector<T> (from <vector>) is a growable array: push_back adds an element, size() gives the count, and [] or .at() index into it. Both grow and shrink safely. Pitfall: indexing a vector or string past its size with [] does not check bounds.',code:'std::string s = "cat";\ns += "s";\nstd::vector<int> v = {1, 2, 3};\nv.push_back(4);\nstd::cout << s << " " << v.size();',qs:[
{t:'mc',q:'What does this print?',code:'std::string s = "cat";\ns += "s";\nstd::cout << s;',o:['cats','cat','cats ','Error'],a:0,e:'+= appends "s" onto the end of s, giving "cats".'},
{t:'mc',q:'What does this print?',code:'std::vector<int> v = {1, 2, 3};\nv.push_back(4);\nstd::cout << v.size() << " " << v.back();',o:['4 4','3 3','4 3','3 4'],a:0,e:'After push_back the vector has 4 elements and the last one is 4.'},
{t:'mc',q:'What does this print?',code:'std::string s = "hello";\nstd::cout << s.substr(1, 3);',o:['ell','hel','ello','llo'],a:0,e:'substr(1, 3) starts at index 1 and takes 3 characters: e, l, l.'},
{t:'fill',q:'Fill in the method that adds an element to the end of a vector.',code:'std::vector<int> v;\nv.___(5);',a:['push_back'],e:'push_back appends a new element to the end of the vector.'},
{t:'order',q:'Put the lines in order to build and print a vector of three numbers.',items:['std::vector<int> v;','v.push_back(1);','v.push_back(2);','v.push_back(3);','for (int x : v) std::cout << x;'],e:'The vector starts empty, elements are appended in order, then a range-for prints each.'}]},
{t:'const correctness',c:'constc',teach:'const marks a value that cannot be changed after initialization; const int MAX = 100; is a compile-time guarantee, not just a convention. const int& param is the idiomatic way to pass a large object (like a string or vector) efficiently without allowing the function to modify it. Pitfall: trying to assign to a const variable, or calling a non-const method on a const reference, is a compile error.',code:'void printName(const std::string& name) {\n    std::cout << name;\n}\nconst int MAX = 10;',qs:[

{t:'mc',q:'Why pass a std::string as const std::string&  instead of std::string?',o:['It avoids copying the string while still preventing changes to it','It makes the string uppercase','It is required by the compiler for all strings','It allows the function to resize the original string'],a:0,e:'A reference avoids the cost of copying; const promises the function will not modify the caller\'s string.'},
{t:'tf',q:'A function parameter declared as const int& can be used to modify the caller\'s variable.',o:TF,a:1,e:'const blocks modification through that reference, even though it still refers to the original variable.'},
{t:'fill',q:'Fill in the keyword so PI cannot be reassigned after this line.',code:'___ double PI = 3.14159;',a:['const'],e:'const makes PI a compile-time-enforced constant.'},
{t:'match',q:'Match each declaration to what it allows.',pairs:[['int x','read and write x'],['const int x','read x only'],['int& r','read and write through r'],['const int& r','read only through r']],e:'const removes the ability to write through that name, whether it is a plain variable or a reference.'}]},
{t:'Checkpoint: Functions and Data',c:'cp2',teach:'Review: functions can be overloaded by parameter type, references let a function modify the caller\'s variable, pointers hold addresses and are dereferenced with *, arrays decay to pointers, std::string and std::vector manage memory automatically, and const blocks modification.',code:'void grow(std::vector<int>& v) {\n    v.push_back(v.back() + 1);\n}\nstd::vector<int> nums = {1, 2};\ngrow(nums);\nstd::cout << nums.size();',qs:[

{t:'Classes and objects',c:'classes',teach:'A class bundles data (members) and behavior (methods). A constructor, named like the class, runs automatically when an object is created and can take an initializer list: Dog(string n) : name(n) {}. Methods access members directly without passing them in. public members are visible outside the class; private members (the default) are not. Pitfall: forgetting a constructor parameter leaves members default-initialized, which for built-in types means garbage.',code:'class Dog {\npublic:\n    std::string name;\n    Dog(std::string n) : name(n) {}\n    void bark() { std::cout << name << " says woof"; }\n};\nDog d("Rex");\nd.bark();',qs:[
{t:'mc',q:'What does this print?',code:'class Dog {\npublic:\n    std::string name;\n    Dog(std::string n) : name(n) {}\n    void bark() { std::cout << name << " says woof"; }\n};\nDog d("Rex");\nd.bark();',o:['Rex says woof','Dog says woof','says woof','Error'],a:0,e:'The constructor sets name to "Rex", and bark prints it followed by " says woof".'},
{t:'mc',q:'What runs automatically when Dog d("Rex"); executes?',o:["Dog's constructor","Dog's destructor",'The bark method','Nothing until bark is called'],a:0,e:'Declaring an object calls its constructor immediately to initialize it.'},
{t:'tf',q:'By default, members of a class declared with the class keyword are private.',o:TF,a:0,e:'class defaults to private; struct defaults to public. Both can use explicit access labels.'},
{t:'fill',q:'Fill in the keyword for members and methods visible outside the class.',code:'class Cat {\n___:\n    void meow();\n};',a:['public'],e:'public makes members accessible from outside the class; the default is private.'},
{t:'order',q:'Put the lines in order to define a class with a constructor and a method.',items:['class Point {','public:','    int x;','    Point(int xVal) : x(xVal) {}','    void show() { std::cout << x; }','};'],e:'Members and the constructor are declared, then a method can use those members.'}]},
{t:'RAII and destructors',c:'raii',teach:'RAII (Resource Acquisition Is Initialization) means a resource (memory, a file, a lock) is tied to an object\'s lifetime: the constructor acquires it, and the destructor (~ClassName()) releases it automatically when the object goes out of scope. This happens even if an exception is thrown, which is why RAII replaces manual cleanup in idiomatic C++. Pitfall: forgetting that local objects are destroyed at the closing brace of their scope, not at the end of main.',code:'class Dog {\npublic:\n    std::string name;\n    Dog(std::string n) : name(n) { std::cout << "built "; }\n    ~Dog() { std::cout << "destroyed "; }\n};\n{\n    Dog d("Rex");\n}\nstd::cout << "after";',qs:[
{t:'mc',q:'What does this print?',code:'class Dog {\npublic:\n    ~Dog() { std::cout << "bye "; }\n};\n{\n    Dog d;\n}\nstd::cout << "done";',o:['bye done','done bye','bye','done'],a:0,e:'The destructor runs at the closing brace, before "done" is printed.'},
{t:'mc',q:'What is the main idea behind RAII?',o:['Tying a resource\'s lifetime to an object\'s constructor and destructor','Running all destructors at the end of main','Avoiding constructors entirely','Using global variables for shared resources'],a:0,e:'RAII acquires a resource in the constructor and releases it in the destructor, so cleanup is automatic.'},
{t:'tf',q:'A destructor must be called explicitly by the programmer before a local object goes out of scope.',o:TF,a:1,e:'The compiler calls the destructor automatically when the object\'s scope ends.'},
{t:'fill',q:'Fill in the symbol that marks a destructor for class Dog.',code:'class Dog {\npublic:\n    ___Dog() { }\n};',a:['~'],e:'A destructor is written as ~ClassName() with no return type and no parameters.'},
{t:'mc',q:'Find the bug: this class leaks the memory it allocates.',code:'class Buffer {\n    int* data;\npublic:\n    Buffer() { data = new int[100]; }\n};',o:['There is no destructor to delete[] data','new cannot be used in a constructor','data should be a reference','The class needs a public member'],a:0,e:'Without a destructor that calls delete[] data, the allocated memory is never freed when a Buffer is destroyed.'}]},
{t:'Encapsulation and methods',c:'encap',teach:'Encapsulation hides a class\'s internal data (private members) and exposes behavior through public methods, so the class can change its internals without breaking callers. A const method, like double getBalance() const, promises not to modify the object, which lets it be called on const references. Pitfall: making every member public removes the ability to enforce invariants, like a balance that should never go negative.',code:'class Account {\n    double balance;\npublic:\n    Account(double b) : balance(b) {}\n    double getBalance() const { return balance; }\n    void deposit(double amt) { balance += amt; }\n};\nAccount a(100);\na.deposit(50);\nstd::cout << a.getBalance();',qs:[
{t:'mc',q:'What does this print?',code:'class Account {\n    double balance;\npublic:\n    Account(double b) : balance(b) {}\n    double getBalance() const { return balance; }\n    void deposit(double amt) { balance += amt; }\n};\nAccount a(100);\na.deposit(50);\nstd::cout << a.getBalance();',o:['150','100','50','Error'],a:0,e:'deposit adds 50 to the initial balance of 100, giving 150.'},
{t:'mc',q:'Why mark getBalance as const?',o:['It promises not to modify the object, allowing calls on const references','It makes balance a compile-time constant','It prevents the method from being overridden','It is required for every method in a class'],a:0,e:'A const method only reads the object\'s state, which the compiler then allows to be called even through a const reference.'},
{t:'tf',q:'Making balance a private member prevents code outside the class from assigning to it directly.',o:TF,a:0,e:'Private members can only be accessed through the class\'s own methods, like deposit.'},
{t:'fill',q:'Fill in the keyword that keeps balance accessible only inside the class.',code:'class Account {\n    ___ double balance;\n};',a:['private'],e:'private restricts access to within the class itself (it is also the default for class).'},
{t:'match',q:'Match each term to its role in encapsulation.',pairs:[['private member','hidden internal state'],['public method','controlled access to state'],['const method','promises not to modify the object'],['constructor','sets up valid initial state']],e:'Together these let a class protect its own invariants.'}]},
{t:'Inheritance and polymorphism',c:'inherit',teach:'A class can derive from a base class: class Cat : public Animal {}. Marking a base method virtual lets a derived class override it, and calling through a base pointer or reference then runs the derived version (override documents this intent and catches mistakes). Pitfall: without virtual, calling a method through a base pointer always runs the base version, never the derived one, which is called "non-polymorphic" behavior.',code:'class Animal {\npublic:\n    virtual std::string speak() const { return "..."; }\n};\nclass Cat : public Animal {\npublic:\n    std::string speak() const override { return "meow"; }\n};\nAnimal* a = new Cat();\nstd::cout << a->speak();',qs:[
{t:'mc',q:'What does this print?',code:'class Animal {\npublic:\n    virtual std::string speak() const { return "..."; }\n};\nclass Cat : public Animal {\npublic:\n    std::string speak() const override { return "meow"; }\n};\nAnimal* a = new Cat();\nstd::cout << a->speak();',o:['meow','...','Error','Cat'],a:0,e:'speak is virtual, so the call through the base pointer resolves to Cat\'s override, meow.'},
{t:'mc',q:'What keyword must the base class method have for overriding to work polymorphically?',o:['virtual','override','public','static'],a:0,e:'virtual on the base method enables dynamic dispatch; override on the derived method documents the intent and is checked by the compiler.'},
{t:'tf',q:'Without the virtual keyword, calling a method through a base class pointer always runs the base class version.',o:TF,a:0,e:'Non-virtual methods are resolved by the static (declared) type of the pointer, not the actual object.'},
{t:'fill',q:'Fill in the keyword that lets Cat be derived from Animal with public access.',code:'class Cat : ___ Animal {\n};',a:['public'],e:'public inheritance means Cat is-a Animal and keeps Animal\'s public interface public.'},
{t:'order',q:'Put the lines in correct order.',items:['class Animal {','    virtual std::string speak() const;','};','class Cat : public Animal {','    std::string speak() const override;','}'],e:'The base declares virtual, and the derived class overrides it with the same signature.'}]},
{t:'STL containers and algorithms',c:'stl',teach:'The Standard Template Library offers ready-made containers: std::vector (dynamic array), std::map<K,V> (sorted key-value pairs, access with []), and algorithms in <algorithm> like std::sort(begin, end) that work through iterators. m[key] creates the key with a default value if it is missing, so check with m.find(key) == m.end() to test presence without inserting. Pitfall: sort needs begin() and end() iterators, not the container itself.',code:'std::vector<int> v = {5, 3, 1};\nstd::sort(v.begin(), v.end());\nstd::map<std::string,int> m;\nm["a"] = 1;\nstd::cout << v[0] << " " << m["a"];',qs:[
{t:'mc',q:'What does this print?',code:'std::vector<int> v = {5, 3, 1, 4, 2};\nstd::sort(v.begin(), v.end());\nstd::cout << v[0] << v[4];',o:['15','51','54','12'],a:0,e:'After sorting, v becomes {1,2,3,4,5}, so v[0] is 1 and v[4] is 5.'},
{t:'mc',q:'What does this print?',code:'std::map<std::string,int> m;\nm["x"] = 10;\nstd::cout << (m.find("y") == m.end());',o:['1','0','x','Error'],a:0,e:'"y" was never inserted, so find returns end(), and the comparison is true, printed as 1.'},

{t:'mc',q:'Find the bug: this line fails to compile.',code:'std::vector<int> v = {3, 1, 2};\nstd::sort(v);',o:['sort needs two iterator arguments, v.begin() and v.end()','vector cannot be sorted','v must be an array instead','sort requires a map'],a:0,e:'std::sort takes a range as two iterators, not the container itself.'},

U('cpp',{t:'Unit 4 · Templates and Modern C++',l:[
{t:'Function and class templates',c:'templates',teach:'A template lets a function or class work with any type, chosen when it is used: template<typename T> T maxOf(T a, T b) {...}. The compiler generates a version for each type it sees, so maxOf(3,7) and maxOf(2.5,1.5) both work with one definition. Class templates work the same way, like a Box<T> that stores any T. Pitfall: mixing two different types in one call, like maxOf(3, 2.5), fails unless T can be deduced consistently.',code:'template<typename T>\nT maxOf(T a, T b) {\n    return a > b ? a : b;\n}\nstd::cout << maxOf(3, 7) << " " << maxOf(2.5, 1.5);',qs:[
{t:'mc',q:'What does this print?',code:'template<typename T>\nT maxOf(T a, T b) {\n    return a > b ? a : b;\n}\nstd::cout << maxOf(3, 7);',o:['7','3','37','Error'],a:0,e:'T is deduced as int, and 7 > 3, so maxOf returns 7.'},
{t:'mc',q:'What is the main benefit of writing a function as a template?',o:['One definition works for many types, generated at compile time','It runs faster than a normal function at runtime','It removes the need for a return type','It allows the function to change types at runtime'],a:0,e:'The compiler instantiates a version for each type used, avoiding duplicate code, with no runtime cost.'},
{t:'fill',q:'Fill in the keyword that introduces a template type parameter.',code:'template<___ T>\nT identity(T x) { return x; }',a:['typename'],e:'typename (or class) declares T as a placeholder for a type.'},
{t:'tf',q:'A class template like Box<T> must be instantiated with a concrete type, such as Box<int>, to create an object.',o:TF,a:0,e:'T is only a placeholder; a real type is required to actually create a Box object.'},
{t:'mc',q:'Find the bug: this line fails to compile.',code:'template<typename T>\nT maxOf(T a, T b) { return a > b ? a : b; }\nstd::cout << maxOf(3, 2.5);',o:['3 is int and 2.5 is double; T cannot be deduced to one type','maxOf only works with int','Templates cannot use the ?: operator','maxOf needs three arguments'],a:0,e:'Both arguments must deduce to the same T; mixing int and double requires an explicit maxOf<double>(3, 2.5).'}]},
{t:'Smart pointers',c:'smartptr',teach:'std::unique_ptr<T> (from <memory>) owns a heap object exclusively and deletes it automatically when it goes out of scope, implementing RAII for dynamic memory; make_unique<T>(args) creates one safely. std::shared_ptr<T> allows multiple owners and tracks a reference count with use_count(), freeing the object only when the last owner is gone. Pitfall: using raw new/delete directly is error-prone; prefer smart pointers so you never forget to free memory.',code:'auto up = std::make_unique<int>(10);\nstd::cout << *up << "\\n";\nauto sp1 = std::make_shared<int>(5);\nauto sp2 = sp1;\nstd::cout << sp1.use_count();',qs:[
{t:'mc',q:'What does this print?',code:'auto up = std::make_unique<int>(10);\nstd::cout << *up;',o:['10','0','Error','unique_ptr'],a:0,e:'* dereferences the unique_ptr to get the int it owns, 10.'},
{t:'mc',q:'What does this print?',code:'auto sp1 = std::make_shared<int>(5);\nauto sp2 = sp1;\nstd::cout << sp1.use_count();',o:['2','1','5','0'],a:0,e:'sp1 and sp2 both share ownership of the same int, so the reference count is 2.'},
{t:'tf',q:'A unique_ptr can be copied to create a second owner of the same object.',o:TF,a:1,e:'unique_ptr forbids copying (only moving); shared_ptr is the type that allows multiple owners.'},
{t:'fill',q:'Fill in the function that safely creates a unique_ptr<int> holding 42.',code:'auto p = std::___<int>(42);',a:['make_unique'],e:'make_unique allocates the object and wraps it in a unique_ptr in one safe step.'},
{t:'match',q:'Match each smart pointer to its ownership model.',pairs:[['unique_ptr','exactly one owner'],['shared_ptr','multiple owners, reference-counted'],['raw new/delete','manual, error-prone ownership'],['use_count()','number of shared_ptr owners']],e:'Smart pointers encode ownership intent directly in the type.'}]},
{t:'Move semantics',c:'move',teach:'Copying an object duplicates its resources; moving transfers them cheaply, leaving the source in a valid but unspecified state. std::move(x) does not move anything itself, it casts x to an rvalue reference (T&&), signaling that its resources may be taken. Containers like vector use move automatically when they can, for example when growing or when passing a temporary. Pitfall: using an object after std::move(obj) has moved from it should only rely on it being valid, not on its old value.',code:'struct Noisy {\n    std::string name;\n    Noisy(std::string n): name(n) {}\n    Noisy(Noisy&& other) noexcept : name(std::move(other.name)) {}\n};\nstd::vector<Noisy> v;\nv.push_back(Noisy("a"));',qs:[
{t:'mc',q:'What does std::move(x) actually do?',o:['Casts x to an rvalue reference, allowing its resources to be taken','Immediately deletes x','Copies x into a new object','Deallocates the memory x uses'],a:0,e:'std::move is just a cast; the actual transfer happens in a move constructor or move assignment that accepts the rvalue reference.'},
{t:'mc',q:'What type does a move constructor take as its parameter?',o:['T&&','T&','const T&','T'],a:0,e:'T&& is an rvalue reference, which binds to temporaries and to objects explicitly cast with std::move.'},
{t:'tf',q:'After std::string s2 = std::move(s1);, it is safe to rely on s1 holding its original text.',o:TF,a:1,e:'s1 is left in a valid but unspecified state after being moved from; its old value should not be relied on.'},
{t:'fill',q:'Fill in the function that casts other.name to an rvalue reference so it can be moved instead of copied.',code:'Noisy(Noisy&& other) : name(std::___(other.name)) {}',a:['move'],e:'std::move signals that other.name\'s resources may be taken rather than copied.'},
{t:'mc',q:'Why is moving generally cheaper than copying for a type like std::string?',o:['It transfers ownership of the existing buffer instead of allocating a new one','It avoids storing any characters at all','It always happens at compile time','It skips calling any constructor'],a:0,e:'A move can just copy the internal pointer and reset the source, instead of allocating and copying every character.'}]},
{t:'Exceptions',c:'exceptions',teach:'C++ signals errors with exceptions: throw std::runtime_error("message") raises one, and try { ... } catch (const std::exception& e) { ... } catches it, where e.what() gives the message. Execution jumps straight from the throw to a matching catch, skipping the rest of the try block, and RAII still runs destructors along the way. Pitfall: an exception that is never caught terminates the program.',code:'int divide(int a, int b) {\n    if (b == 0) throw std::runtime_error("divide by zero");\n    return a / b;\n}\ntry {\n    divide(10, 0);\n} catch (const std::exception& e) {\n    std::cout << e.what();\n}',qs:[
{t:'mc',q:'What does this print?',code:'int divide(int a, int b) {\n    if (b == 0) throw std::runtime_error("divide by zero");\n    return a / b;\n}\ntry {\n    std::cout << divide(10, 0);\n} catch (const std::exception& e) {\n    std::cout << "caught: " << e.what();\n}',o:['caught: divide by zero','10','Error: unhandled','divide by zero'],a:0,e:'divide throws before returning, so the catch block runs and prints the caught message.'},
{t:'mc',q:'What does e.what() return for a caught std::runtime_error?',o:['The message passed to its constructor','The line number where it was thrown','Nothing, it is always empty','The type name of the exception'],a:0,e:'what() returns the descriptive string given when the exception object was constructed.'},
{t:'tf',q:'Code after the line that throws, still inside the same try block, continues to run before the catch block.',o:TF,a:1,e:'Throwing jumps immediately to a matching catch; the rest of the try block is skipped.'},
{t:'fill',q:'Fill in the keyword that raises an exception.',code:'if (bad) { ___ std::runtime_error("oops"); }',a:['throw'],e:'throw raises the exception object, which unwinds the stack looking for a matching catch.'},
{t:'order',q:'Put the lines in order for a try/catch around a risky call.',items:['try {','    risky();','} catch (const std::exception& e) {','    std::cout << e.what();','}'],e:'try wraps the code that might throw; catch handles the exception if one occurs.'}]},
{t:'Lambdas and modern features',c:'lambdas',teach:'A lambda is an anonymous function: [](int a, int b){ return a + b; } can be called directly or stored in an auto variable. [&] or [=] in the capture list lets the lambda use outer variables by reference or by value. Range-based for (for (int x : v)) iterates a container without manual indices, and auto lets the compiler infer types throughout, reducing noise in modern C++. Pitfall: capturing a local variable by reference ([&]) and using the lambda after that variable is gone leads to undefined behavior.',code:'std::vector<int> nums = {1, 2, 3, 4};\nint total = 0;\nfor (int n : nums) {\n    total += n;\n}\nauto adder = [](int a, int b) { return a + b; };\nstd::cout << total << " " << adder(2, 3);',qs:[
{t:'mc',q:'What does this print?',code:'auto adder = [](int a, int b) { return a + b; };\nstd::cout << adder(2, 3);',o:['5','23','Error','a + b'],a:0,e:'The lambda adds its two arguments, 2 and 3, giving 5.'},
{t:'mc',q:'What does this print?',code:'std::vector<int> v = {1, 2, 3};\nint total = 0;\nfor (int n : v) { total += n; }\nstd::cout << total;',o:['6','3','123','0'],a:0,e:'The range-based for visits each element, and total accumulates 1 + 2 + 3 = 6.'},
{t:'fill',q:'Fill in the capture so the lambda can modify the outer variable total by reference.',code:'int total = 0;\nauto add = [___](int n) { total += n; };',a:['&total','&'],e:'[&total] (or [&]) captures total by reference so the lambda can modify it.'},
{t:'tf',q:'A lambda with an empty capture list, [](){...}, cannot use any variables from its surrounding scope.',o:TF,a:0,e:'An empty capture list means no outer variables are captured; the lambda can only use its own parameters and globals.'},
{t:'mc',q:'Find the bug: calling stale() after danger() returns is undefined behavior.',code:'std::function<int()> danger() {\n    int x = 5;\n    return [&x]() { return x; };\n}\nauto stale = danger();',o:['x is a local variable that no longer exists once danger returns, but the lambda still references it','Lambdas cannot return int','std::function is not a real type','x must be declared static'],a:0,e:'[&x] captures x by reference; once danger() returns, x is destroyed and the reference dangles.'}]},
{t:'Capstone: Bank accounts',c:'capstone',teach:'This program models bank accounts: a class with private balance, public deposit/withdraw, and withdraw throwing when funds are insufficient. main builds a vector of accounts, loops over them by reference to deposit, and uses a try/catch around a withdrawal that is expected to fail. Read it closely: the questions below walk through what it does, how to complete it, and how to find a bug in a changed version.',code:'class Account {\n    std::string owner;\n    double balance;\npublic:\n    Account(std::string o, double b) : owner(o), balance(b) {}\n    void withdraw(double amt) {\n        if (amt > balance) throw std::runtime_error("insufficient funds");\n        balance -= amt;\n    }\n    void deposit(double amt) { balance += amt; }\n    double getBalance() const { return balance; }\n};',qs:[
{t:'mc',q:'Given the Account class above, what does this print?',code:'std::vector<Account> accounts;\naccounts.push_back(Account("Ana", 100));\naccounts.push_back(Account("Bo", 50));\nfor (auto& acc : accounts) {\n    acc.deposit(25);\n}\ndouble total = 0;\nfor (const auto& acc : accounts) {\n    total += acc.getBalance();\n}\nstd::cout << total;',o:['200','150','175','125'],a:0,e:'Each account gets +25: Ana has 125, Bo has 75, and 125 + 75 = 200.'},
{t:'mc',q:'What does this print?',code:'try {\n    Account acc("Bo", 50);\n    acc.withdraw(1000);\n} catch (const std::exception& e) {\n    std::cout << "caught: " << e.what();\n}',o:['caught: insufficient funds','caught: Bo','1000','Error: unhandled'],a:0,e:'withdraw(1000) exceeds the balance of 50, so it throws, and the catch block prints the message.'},
{t:'fill',q:'Complete deposit so it adds amt to balance.',code:'void deposit(double amt) { balance ___ amt; }',a:['+='],e:'+= adds amt to the current balance.'},
{t:'mc',q:'Find the bug: in this changed loop, the deposits do not affect the accounts vector.',code:'std::vector<Account> accounts;\naccounts.push_back(Account("Ana", 100));\nfor (auto acc : accounts) {\n    acc.deposit(25);\n}',o:['auto acc copies each Account; it should be auto& acc to modify the original','deposit does not exist on Account','push_back cannot take an Account','The vector must be declared const'],a:0,e:'Without &, the range-for binds acc to a copy, so deposit changes only the copy, not the element in accounts.'},
{t:'order',q:'Put the lines in order to safely attempt a withdrawal and report failure.',items:['try {','    acc.withdraw(1000);','} catch (const std::exception& e) {','    std::cout << e.what();','}'],e:'The risky call goes in try, and the catch block runs only if withdraw throws.'}]}
]});

  else if(view==='lesson'&&L&&L.state==='q'&&!L.fb){const q=L.qs[L.i],e=q.t==='fill'?$('#fi'):q.t==='code'?$('#ce'):null;e&&e.focus()}}

  if(view!=='lesson'&&!document.hidden&&!document.activeElement.closest('input,textarea,select'))draw()},1000*30);
