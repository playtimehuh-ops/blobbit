{t:'mc',q:'Find the bug: the file ends up as one long line.',code:'with open("o.txt", "w") as f:\n    f.write("a")\n    f.write("b")',o:['write does not add newlines; include "\\n"','"w" cannot write text','with must be removed','a and b must be numbers'],a:0,e:'Write "a\\n" and "b\\n" to get separate lines.'},
{t:'fill',q:'Complete the statement that opens a file for reading and closes it for you.',code:'___ open("a.txt") as f:\n    text = f.read()',a:['with'],e:'with manages the file lifetime.'}]},
{t:'Modules and the standard library',c:'mods',teach:'A module is a Python file you can reuse. import math loads it and you call math.sqrt(9); from math import sqrt lets you use sqrt directly. The standard library ships with Python: math, random, json, datetime, os and more. Your own file util.py can be imported as util. Pitfall: do not name your file the same as a library module.',code:'import math\nfrom random import choice\nimport json\n\nprint(math.sqrt(16))\nprint(choice(["a"]))\nprint(json.dumps({"a": 1}))',qs:[
{t:'mc',q:'What does this print?',code:'import math\nprint(math.floor(2.9))',o:['2','3','2.9','Error'],a:0,e:'floor rounds down to the nearest integer.'},
{t:'mc',q:'What does this print?',code:'import json\nprint(json.loads(\'{"n": 3}\')["n"])',o:['3','n','{"n": 3}','Error'],a:0,e:'loads parses JSON text into a dict; indexing "n" gives 3.'},
{t:'mc',q:'Which line lets you call sqrt(25) without the math. prefix?',o:['from math import sqrt','import sqrt','import math.sqrt as math','use math'],a:0,e:'from ... import name brings that name in directly.'},
{t:'mc',q:'Find the bug: this raises NameError.',code:'import math\nprint(sqrt(9))',o:['It should be math.sqrt(9) or a from-import','math has no sqrt','print needs quotes','import must be at the end'],a:0,e:'After import math, names must be reached as math.name.'},
{t:'match',q:'Match each module with its purpose.',pairs:[['math','square roots and constants'],['random','random numbers and choices'],['json','read and write JSON text'],['datetime','dates and times']],e:'The standard library covers many common tasks.'}]},
{t:'Generators',c:'gen',teach:'A generator produces values one at a time instead of building a whole list. A function with yield is a generator: it pauses at each yield and resumes on the next request. Generator expressions look like comprehensions in parentheses. They save memory and can be used once. Pitfall: after a generator is exhausted it gives nothing more.',code:'def countdown(n):\n    while n > 0:\n        yield n\n        n -= 1\n\nfor x in countdown(3):\n    print(x)\nprint(sum(i * i for i in range(4)))',qs:[
{t:'mc',q:'Which keyword makes a function a generator?',o:['yield','return','gen','pause'],a:0,e:'Any function containing yield returns a generator object.'},
{t:'mc',q:'What does this print?',code:'def g():\n    yield 1\n    yield 2\n\nprint(list(g()))',o:['[1, 2]','[2]','1','<generator>'],a:0,e:'list() runs the generator to the end and collects its values.'},
{t:'mc',q:'What does this print?',code:'g = (n * 2 for n in range(3))\nprint(next(g), next(g))',o:['0 2','2 4','0 1','Error'],a:0,e:'The first two values are 0 and 2.'},
{t:'mc',q:'Find the bug: the second sum is 0.',code:'g = (n for n in range(3))\nprint(sum(g))\nprint(sum(g))',o:['A generator can be consumed only once','sum needs a list','range(3) is empty','g must be a tuple'],a:0,e:'The first sum uses up the values. Make a new generator or use a list.'},
{t:'order',q:'Order the lines of a generator that yields 1 then 2.',items:['def two():','    yield 1','    yield 2'],e:'The def line comes first, then the yields in the order values are produced.'}]},
{t:'Decorators and testing',c:'deco',teach:'A decorator is a function that takes a function and returns a wrapped one; @name above a def applies it. Use it to add behaviour such as logging without editing the original. For tests, assert checks a condition and raises AssertionError when false; test functions named test_... can then be run by pytest or unittest.',code:'def shout(f):\n    def wrapper(*a):\n        return f(*a).upper()\n    return wrapper\n\n@shout\ndef hi(n):\n    return "hi " + n\n\nprint(hi("bo"))\nassert hi("a") == "HI A"',qs:[
{t:'mc',q:'What does @shout above def hi do?',o:['Replaces hi with shout(hi)','Calls hi immediately','Renames hi','Makes hi private'],a:0,e:'@shout is shorthand for hi = shout(hi).'},
{t:'mc',q:'What does this print?',code:'def twice(f):\n    def w(x):\n        return f(f(x))\n    return w\n\n@twice\ndef inc(x):\n    return x + 1\n\nprint(inc(5))',o:['7','6','5','Error'],a:0,e:'The wrapper applies inc twice: 5 -> 6 -> 7.'},
{t:'mc',q:'What happens when this runs?',code:'assert 2 + 2 == 5',o:['AssertionError is raised','Nothing','It prints False','2 + 2 becomes 5'],a:0,e:'A failed assert raises AssertionError.'},
{t:'mc',q:'Find the bug: the decorated function returns None.',code:'def log(f):\n    def w(x):\n        f(x)\n    return w',o:['The wrapper does not return f(x)','log must take two arguments','w cannot call f','Decorators need print'],a:0,e:'Write return f(x) inside the wrapper.'},
{t:'fill',q:'Complete the line that applies the decorator.',code:'___shout\ndef hi():\n    return "hi"',a:['@'],e:'The @ symbol applies a decorator.'}]},
{t:'Capstone: Word counter',c:'cap',teach:'This small program reads text, counts words with a dict and reports the most common one. It combines functions, loops, dictionaries and string methods. Read it carefully before answering.',code:'def count_words(text):\n    counts = {}\n    for w in text.lower().split():\n        counts[w] = counts.get(w, 0) + 1\n    return counts\n\ndef top(counts):\n    return max(counts, key=counts.get)\n\ncounts = count_words("the cat and The dog")\nprint(counts["the"])\nprint(top(counts))',qs:[
{t:'mc',q:'What does the first print show?',code:'counts = count_words("the cat and The dog")\nprint(counts["the"])',o:['2','1','0','KeyError'],a:0,e:'lower() makes The and the equal, so the is counted twice.'},
{t:'mc',q:'What does top(counts) return for the text "a b b c"?',code:'def top(counts):\n    return max(counts, key=counts.get)',o:['b','a','2','c'],a:0,e:'max over the keys, compared by their counts, gives the key with the highest count.'},
{t:'fill',q:'Complete the line so a new word starts at 1.',code:'counts[w] = counts.___(w, 0) + 1',a:['get'],e:'get returns 0 for a missing key, so the first sighting becomes 1.'},
{t:'mc',q:'Find the bug: this raises KeyError on the first word.',code:'for w in words:\n    counts[w] = counts[w] + 1',o:['The key does not exist until it is set; use counts.get(w, 0)','words must be a tuple','counts must be a list','+ cannot be used on ints'],a:0,e:'Reading a missing key fails; get with a default avoids it.'},
{t:'order',q:'Order the steps of count_words.',items:['counts = {}','for w in text.lower().split():','    counts[w] = counts.get(w, 0) + 1','return counts'],e:'Create the dict, loop over words, update the count, and return it.'}]}
]});

C({id:'js',name:'JavaScript',badge:'JS',lvl:'Beginner',pre:'None',goal:'Write and read real JavaScript programs using modern syntax, objects, arrays, closures, classes, promises, async/await and basic DOM scripting.'});

U('js',{t:'Unit 1 · Foundations',l:[
{t:'Variables',c:'vars',teach:'A variable is a named box for a value. Use let when the value will change and const when it will not. const stops you from reassigning the name, which makes code safer and easier to read. Prefer const by default and switch to let only when you need to reassign.',code:'let score = 10;\nscore = score + 5;\nconst name = "Ada";\nconsole.log(name, score);',qs:[
{t:'mc',q:'Which keyword declares a name that cannot be reassigned?',o:['let','const','set','var'],a:1,e:'const creates a binding that cannot be reassigned. let allows reassignment, and set is not a JavaScript keyword.'},
{t:'mc',q:'What does this print?',code:'let a = 2;\nlet b = a;\na = 5;\nconsole.log(b);',o:['2','5','7','undefined'],a:0,e:'b received a copy of the number 2. Changing a later does not change b.'},
{t:'fill',q:'Fill in the keyword so PI cannot be reassigned.',code:'___ PI = 3.14;',a:['const'],e:'const is the keyword for a binding that never changes.'},
{t:'mc',q:'Find the bug: why does this code fail?',code:'const count = 1;\ncount = count + 1;',o:['count is reassigned but was declared with const','Statements must end with a colon','count is a reserved word','const needs a type after the name'],a:0,e:'Reassigning a const throws a TypeError. Use let if the value must change.'},
{t:'order',q:'Put the lines in order so the program prints 10.',items:['let total = 0;','total = total + 4;','total = total + 6;','console.log(total);'],e:'The variable must be declared first, then updated, then printed. Printing early would show 0.'}
]},
{t:'Types and typeof',c:'types',teach:'Every value has a type: number, string, boolean, undefined, null, object, and more. There is one number type for both integers and decimals. The typeof operator tells you a value type as a string. A variable that was declared but never given a value holds undefined.',code:'console.log(typeof 42);\nconsole.log(typeof "hi");\nconsole.log(typeof true);\nlet x;\nconsole.log(typeof x);\nconsole.log(typeof [1, 2]);',qs:[
{t:'mc',q:'What does typeof "5" return?',o:['"number"','"string"','"text"','"char"'],a:1,e:'Anything in quotes is a string, even if it looks like a number.'},
{t:'match',q:'Match each value to its typeof result.',pairs:[['42','"number"'],['"42"','"string"'],['true','"boolean"'],['undefined','"undefined"']],e:'Quotes make a string; bare digits are numbers; true and false are booleans.'},
{t:'mc',q:'What does this print?',code:'console.log(typeof NaN);',o:['number','NaN','undefined','string'],a:0,e:'NaN stands for Not a Number, but it is still a value of the number type.'},
{t:'tf',q:'JavaScript has separate types for integers and decimals (for ordinary numbers).',o:TF,a:1,e:'Ordinary numbers share one number type, so 3 and 3.5 are both numbers.'},
{t:'fill',q:'Complete the check for a variable that has no value yet.',code:'let x;\nconsole.log(x === ___);',a:['undefined'],e:'A declared variable with no assigned value holds undefined.'}
]},
{t:'Operators',c:'ops',teach:'Arithmetic uses + - * / plus % for remainder and ** for powers. Compare with === (strict equality), which checks value and type. Avoid == because it converts types and gives surprises. Pitfall: + joins strings, so 1 + "2" becomes "12", while - always does math.',code:'console.log(7 % 3);\nconsole.log(2 ** 3);\nconsole.log(5 === "5");\nconsole.log(5 == "5");\nconsole.log(1 + "2");',qs:[
{t:'mc',q:'What is 10 % 4?',o:['2','2.5','6','0'],a:0,e:'% gives the remainder: 4 goes into 10 twice (8) with 2 left over.'},
{t:'mc',q:'What does this print?',code:'console.log(1 + "2" + 3);',o:['6','123','33','15'],a:1,e:'1 + "2" becomes the string "12", then "12" + 3 becomes "123".'},
{t:'tf',q:'The expression "5" === 5 is true.',o:TF,a:1,e:'Strict equality compares types too, and a string is not a number.'},
{t:'mc',q:'Find the bug: what is wrong with this check?',code:'if (age = 18) {\n  console.log("adult");\n}',o:['= assigns instead of comparing; use ===','if needs a semicolon after the condition','age must be a string','console.log cannot be inside if'],a:0,e:'A single = assigns a value. Use === to compare.'},
{t:'code',q:'Write a function isEven(n) that returns true when n is even and false otherwise.',starter:'function isEven(n) {\n  // return true when n is even\n}',fn:'isEven',tests:[[[4],true],[[7],false],[[0],true],[[-3],false]],sol:'function isEven(n){ return n % 2 === 0; }',e:'An even number leaves remainder 0 when divided by 2. Comparing -3 % 2 with 0 correctly gives false because the remainder is -1.'}
]},
{t:'Strings',c:'strings',teach:'Strings hold text in single, double or backtick quotes. Backtick strings allow ${expression} inside, called template literals. Useful members: length, indexing with s[0], slice(start, end) where end is excluded, and toUpperCase(). Strings are immutable: methods return new strings and never change the original.',code:'const s = "JavaScript";\nconsole.log(s.length);\nconsole.log(s[0]);\nconsole.log(s.slice(0, 4));\nconsole.log(s.toUpperCase());\nconsole.log(`I love ${s}`);',qs:[
{t:'mc',q:'What does this print?',code:'console.log("Hi there".length);',o:['7','8','2','9'],a:1,e:'The space counts as a character: H, i, space, t, h, e, r, e is 8.'},
{t:'mc',q:'What does this print?',code:'const w = "banana";\nconsole.log(w.slice(1, 3));',o:['an','ana','ba','anan'],a:0,e:'slice(1, 3) takes indexes 1 and 2 and stops before 3, giving "an".'},
{t:'fill',q:'Fill in the variable name to interpolate it.',code:'const name = "Ada";\nconsole.log(`Hello, ${___}!`);',a:['name'],e:'Inside ${ } you write an expression, here the variable name.'},
{t:'tf',q:'After let s = "cat"; s[0] = "b"; the variable s equals "bat".',o:TF,a:1,e:'Strings are immutable, so assigning to an index has no effect.'},
{t:'code',q:'Write shout(word) that returns the word in upper case followed by an exclamation mark.',starter:'function shout(word) {\n  return word;\n}',fn:'shout',tests:[[['hi'],'HI!'],[['ok go'],'OK GO!'],[[''],'!']],sol:'function shout(word){ return word.toUpperCase() + "!"; }',e:'toUpperCase returns a new string, and + appends the exclamation mark.'}
]},
{t:'Conditionals',c:'cond',teach:'if, else if and else choose which block runs. Values are converted to true or false in conditions: false, 0, "", null, undefined and NaN are falsy, and everything else is truthy. The || operator returns the first truthy value, handy for defaults, and the ternary cond ? a : b picks between two values.',code:'const n = 15;\nif (n > 20) {\n  console.log("big");\n} else if (n > 10) {\n  console.log("medium");\n} else {\n  console.log("small");\n}',qs:[
{t:'mc',q:'What does this print?',code:'const n = 5;\nif (n > 20) {\n  console.log("big");\n} else if (n > 10) {\n  console.log("medium");\n} else {\n  console.log("small");\n}',o:['big','medium','small','nothing'],a:2,e:'5 is not above 20 or 10, so the else block runs.'},
{t:'mc',q:'Which group contains only falsy values?',o:['0, "", null','"0", [], {}','"false", 1, -1','[], 0, 1'],a:0,e:'0, the empty string and null are falsy. The strings "0" and "false", and empty arrays and objects, are truthy.'},
{t:'mc',q:'What does this print?',code:'const v = "" || "default";\nconsole.log(v);',o:['""','default','true','undefined'],a:1,e:'The empty string is falsy, so || moves on and returns "default".'},
{t:'fill',q:'Fill in the ternary operator symbol.',code:'const msg = age >= 18 ___ "adult" : "minor";',a:['?'],e:'A ternary has the form condition ? valueIfTrue : valueIfFalse.'},
{t:'code',q:'Write sign(n) returning 1 for positive numbers, -1 for negative numbers and 0 for zero.',starter:'function sign(n) {\n  // return 1, -1 or 0\n}',fn:'sign',tests:[[[5],1],[[-2],-1],[[0],0],[[100],1]],sol:'function sign(n){ if (n > 0) return 1; if (n < 0) return -1; return 0; }',e:'Check the positive and negative cases, and fall through to 0 for everything else.'}
]},
{t:'Checkpoint: Foundations',c:'cp1',teach:'Review: let and const declare variables, typeof reports a type, === compares strictly, + joins strings while - does math, backticks allow templates, and if/else choose a path based on truthiness.',code:'const age = 20;\nconst label = age >= 18 ? "adult" : "minor";\nconsole.log(`Status: ${label}`);',qs:[
{t:'mc',q:'What does this print?',code:'let x = 10;\nx = x % 4;\nconsole.log(x, typeof x);',o:['2 number','2 string','10 number','2.5 number'],a:0,e:'10 % 4 is 2, which is a number.'},
{t:'mc',q:'What does this print?',code:'console.log("5" - 2, "5" + 2);',o:['3 52','3 7','52 3','7 7'],a:0,e:'Minus forces numeric conversion giving 3, while plus joins strings giving "52".'},
{t:'order',q:'Put the lines in order to print odd for 7.',items:['const n = 7;','if (n % 2 === 0) {','  console.log("even");','} else {','  console.log("odd");','}'],e:'Declare first, then test the remainder, with the else branch handling odd numbers.'},
{t:'match',q:'Match each operator with its meaning.',pairs:[['===','strict equality'],['%','remainder'],['**','exponent'],['||','logical OR']],e:'These are the core operators from this unit.'},
{t:'mc',q:'Find the bug: why does greeting not show the name?',code:'const user = "Ada";\nconst greeting = "Hello, ${user}";',o:['Template substitution needs backticks, not double quotes','user must be declared with let','${ } is not valid JavaScript','The string needs a plus sign at the end'],a:0,e:'Only backtick strings interpolate. Double quotes keep ${user} as literal text.'}
]}
]});

U('js',{t:'Unit 2 · Loops, Functions and Arrays',l:[
{t:'Loops',c:'loops',teach:'A for loop has three parts: start, condition, and step. A while loop repeats as long as its condition is true, so something inside must eventually make it false. break leaves the loop early and continue skips to the next iteration. Pitfall: forgetting to update the counter creates an infinite loop.',code:'for (let i = 0; i < 3; i++) {\n  console.log(i);\n}\nlet n = 3;\nwhile (n > 0) {\n  n--;\n}\nconsole.log(n);',qs:[
{t:'mc',q:'What does this print?',code:'let s = "";\nfor (let i = 1; i <= 3; i++) {\n  s += i;\n}\nconsole.log(s);',o:['6','123','321','NaN'],a:1,e:'s starts as a string, so += joins "1", "2", "3" into "123" instead of adding.'},
{t:'fill',q:'Fill in the step so the loop counts 0 to 4.',code:'for (let i = 0; i < 5; ___) {\n  console.log(i);\n}',a:['i++','i += 1','i = i + 1','++i'],e:'The step adds one to i after each pass.'},
{t:'mc',q:'Find the bug: what is wrong with this loop?',code:'let i = 0;\nwhile (i < 3) {\n  console.log(i);\n}',o:['i never changes so the loop never ends','while needs a for keyword','i must be const','console.log cannot be in a loop'],a:0,e:'Without i++ inside the body, the condition stays true forever.'},
{t:'mc',q:'Which statement skips the rest of the current iteration but keeps looping?',o:['continue','break','return','skip'],a:0,e:'continue jumps to the next iteration. break ends the whole loop.'},
{t:'code',q:'Write sumTo(n) that returns 1 + 2 + ... + n using a loop (0 when n is 0).',starter:'function sumTo(n) {\n  // add up 1..n\n}',fn:'sumTo',tests:[[[3],6],[[1],1],[[0],0],[[10],55]],sol:'function sumTo(n){ let t = 0; for (let i = 1; i <= n; i++) t += i; return t; }',e:'Keep a running total starting at 0 and add each i from 1 to n.'}
]},
{t:'Functions',c:'funcs',teach:'A function packages reusable steps. Parameters are inputs and return sends a value back and stops the function. A function with no return gives back undefined. Default values like b = 10 apply when the argument is missing. Pitfall: forgetting return, so the result is undefined.',code:'function add(a, b) {\n  return a + b;\n}\nconsole.log(add(2, 3));\nfunction hi(name = "friend") {\n  return "Hi " + name;\n}\nconsole.log(hi());',qs:[
{t:'mc',q:'What does this print?',code:'function f(x) {\n  x * 2;\n}\nconsole.log(f(4));',o:['8','4','undefined','NaN'],a:2,e:'The function computes x * 2 but never returns it, so the result is undefined.'},
{t:'fill',q:'Fill in the keyword that sends a value back.',code:'function square(n) {\n  ___ n * n;\n}',a:['return'],e:'return hands the value back to the caller.'},
{t:'mc',q:'What does this print?',code:'function g(a, b = 10) {\n  return a + b;\n}\nconsole.log(g(1));',o:['11','1','NaN','10'],a:0,e:'b was not passed, so it uses its default 10, and 1 + 10 is 11.'},
{t:'tf',q:'Code after a return statement in the same function body still runs.',o:TF,a:1,e:'return exits the function immediately.'},
{t:'code',q:'Write maxOf(a, b) returning the larger of two numbers.',starter:'function maxOf(a, b) {\n  // return the larger number\n}',fn:'maxOf',tests:[[[1,2],2],[[5,3],5],[[-1,-1],-1],[[0,-4],0]],sol:'function maxOf(a,b){ return a > b ? a : b; }',e:'Compare the two values and return one of them.'}
]},
{t:'Arrow Functions and Callbacks',c:'arrows',teach:'Arrow functions are a short function syntax: (a, b) => a + b. With one parameter the parentheses are optional, and a single expression is returned automatically. Functions are values, so you can pass them to other functions as callbacks. To return an object literal from an arrow, wrap it in parentheses.',code:'const double = n => n * 2;\nconst add = (a, b) => a + b;\nconst make = () => ({ ok: true });\nconsole.log(double(4), add(1, 2));\nconsole.log([1, 2, 3].map(double));',qs:[
{t:'mc',q:'What does this print?',code:'const f = (a, b) => a - b;\nconsole.log(f(9, 4));',o:['5','13','-5','undefined'],a:0,e:'The arrow returns a - b, which is 9 - 4.'},
{t:'mc',q:'Which arrow function returns the object { a: 1 }?',o:['() => ({ a: 1 })','() => { a: 1 }','() => [a: 1]','=> () { a: 1 }'],a:0,e:'Braces without parentheses are read as a function body with a label. Parentheses make it an object literal.'},
{t:'fill',q:'Fill in the arrow symbol.',code:'const inc = n ___ n + 1;',a:['=>'],e:'The arrow function syntax uses =>.'},
{t:'order',q:'Put the lines in order so the program prints 15.',items:['function run(cb) {','  return cb(5);','}','console.log(run(x => x * 3));'],e:'run must be defined before it is called, and it calls the callback with 5.'},
{t:'tf',q:'Arrow functions must be written with the function keyword.',o:TF,a:1,e:'The arrow syntax replaces the function keyword.'}
]},
{t:'Arrays',c:'arrays',teach:'An array is an ordered list written with square brackets and indexed from 0. Use length for its size, push and pop at the end, shift and unshift at the start, at(-1) for the last item, includes to test membership and indexOf to find a position (-1 when missing). A const array can still be changed; only the name is fixed.',code:'const nums = [10, 20, 30];\nnums.push(40);\nconsole.log(nums.length);\nconsole.log(nums[0]);\nconsole.log(nums.at(-1));\nconsole.log(nums.includes(20));\nconsole.log(nums.indexOf(30));',qs:[
{t:'mc',q:'What does this print?',code:'const a = [1, 2, 3];\na.push(9);\nconsole.log(a.length, a[3]);',o:['4 9','3 9','4 3','3 undefined'],a:0,e:'push adds 9 at index 3, making the length 4.'},
{t:'mc',q:'What does this print?',code:'const a = [1, 2];\nconsole.log(a[5]);',o:['undefined','0','null','It throws an error'],a:0,e:'Reading past the end gives undefined rather than an error.'},
{t:'fill',q:'Fill in the property to get the last item.',code:'const last = items[items.___ - 1];',a:['length'],e:'The last index is length - 1.'},
{t:'match',q:'Match each method with what it does.',pairs:[['push','adds to the end'],['pop','removes from the end'],['shift','removes from the start'],['unshift','adds to the start']],e:'The pairs push/pop and unshift/shift work on opposite ends.'},
{t:'code',q:'Write lastItem(arr) returning the last element, or null if the array is empty.',starter:'function lastItem(arr) {\n  // return the last element or null\n}',fn:'lastItem',tests:[[[[1,2,3]],3],[[[]],null],[[['a']],'a']],sol:'function lastItem(arr){ return arr.length === 0 ? null : arr[arr.length - 1]; }',e:'Handle the empty case first, then read index length - 1.'}
]},
{t:'map, filter and reduce',c:'hof',teach:'Array methods that take callbacks replace many loops. map transforms every item into a new array, filter keeps items where the callback is truthy, reduce folds the array into a single value starting from an initial value, and forEach just runs code. They do not change the original array. Pitfall: braces in an arrow body need an explicit return.',code:'const nums = [1, 2, 3, 4];\nconst dbl = nums.map(n => n * 2);\nconst ev = nums.filter(n => n % 2 === 0);\nconst sum = nums.reduce((acc, n) => acc + n, 0);\nnums.forEach(n => console.log(n));\nconsole.log(dbl, ev, sum);',qs:[
{t:'mc',q:'What does this print?',code:'console.log([1, 2, 3].map(n => n + 1).join("-"));',o:['2-3-4','1-2-3','6','3-4-5'],a:0,e:'map adds 1 to each item giving [2, 3, 4], and join glues them with dashes.'},
{t:'mc',q:'What does this print?',code:'console.log([1, 2, 3, 4].reduce((a, n) => a * n, 1));',o:['24','10','4','1'],a:0,e:'reduce multiplies the running product: 1*1*2*3*4 is 24.'},

{t:'Objects',c:'objects',teach:'An object stores named properties as key: value pairs. Read with dot notation (user.name) or brackets (user["name"]) when the key is a variable. Assign to add or change properties and use delete to remove one. Object.keys and Object.values list them, and "key" in obj tests existence. A const object can still be modified.',code:'const user = { name: "Ada", age: 36 };\nconsole.log(user.name);\nuser.age = 37;\nuser["city"] = "London";\nconsole.log(Object.keys(user));\nconsole.log(Object.values(user));\ndelete user.city;\nconsole.log("age" in user);',qs:[
{t:'mc',q:'What does this print?',code:'const o = { a: 1 };\no.b = 2;\nconsole.log(Object.keys(o).length);',o:['2','1','0','undefined'],a:0,e:'Assigning to a new key adds a property, so there are two keys.'},
{t:'mc',q:'What does this print?',code:'const key = "x";\nconst o = { x: 5 };\nconsole.log(o.key, o[key]);',o:['undefined 5','5 5','5 undefined','undefined undefined'],a:0,e:'o.key looks for a property literally named key. o[key] uses the variable value "x".'},
{t:'fill',q:'Fill in the symbol to read the id property.',code:'const p = { id: 7 };\nconsole.log(p___id);',a:['.'],e:'Dot notation reads a property by its fixed name.'},
{t:'tf',q:'A const object can have its properties changed.',o:TF,a:0,e:'const only prevents reassigning the variable, not mutating the object it points to.'},
{t:'code',q:'Write sumValues(obj) returning the sum of all numeric values of the object.',starter:'function sumValues(obj) {\n  // add up the values\n}',fn:'sumValues',tests:[[[{a:1,b:2}],3],[[{}],0],[[{x:-5}],-5]],sol:'function sumValues(obj){ return Object.values(obj).reduce((a, n) => a + n, 0); }',e:'Object.values gives an array, which reduce can total, starting at 0 for empty objects.'}

{t:'Destructuring and Spread',c:'destruct',teach:'Destructuring unpacks values into variables: [a, b] = array by position and { name } = object by key, with defaults like age = 30. The spread operator ... copies items of an array or properties of an object into a new one, and as ...rest in a parameter list it gathers extra arguments. Spread makes shallow copies, and plain assignment of an array or object copies only the reference.',code:'const [a, b] = [1, 2];\nconst { name, age = 30 } = { name: "Ada" };\nconst arr2 = [...[1, 2], 3];\nconst o2 = { ...{ x: 1 }, y: 2 };\nfunction f(first, ...rest) { return rest.length; }\nconsole.log(a, b, name, age, arr2, o2, f(1, 2, 3));',qs:[
{t:'mc',q:'What does this print?',code:'const [x, , z] = [1, 2, 3];\nconsole.log(x + z);',o:['4','3','5','NaN'],a:0,e:'The empty slot skips the second item, so x is 1 and z is 3.'},
{t:'mc',q:'What does this print?',code:'const o = { a: 1, b: 2 };\nconst c = { ...o, b: 9 };\nconsole.log(c.a, c.b);',o:['1 9','1 2','9 9','undefined 9'],a:0,e:'Spread copies a and b, then b: 9 overrides the copied b.'},
{t:'fill',q:'Fill in the variable name to pull id out of the object.',code:'const { ___ } = { id: 3 };\nconsole.log(id);',a:['id'],e:'Object destructuring uses the property name as the variable name.'},
{t:'mc',q:'What does this print?',code:'const nums = [1, 2, 3];\nconst copy = nums;\ncopy.push(4);\nconsole.log(nums.length);',o:['3','4','undefined','It throws an error'],a:1,e:'copy and nums point to the same array, so pushing through one is visible through the other. Use [...nums] for a real copy.'},
{t:'code',q:'Write merge(a, b) returning a new object with all properties of a and b (b wins on conflicts).',starter:'function merge(a, b) {\n  return a;\n}',fn:'merge',tests:[[[{a:1},{b:2}],{a:1,b:2}],[[{a:1},{a:5}],{a:5}],[[{},{}],{}]],sol:'function merge(a, b){ return { ...a, ...b }; }',e:'Spreading a then b means later properties overwrite earlier ones.'}
]},
{t:'Scope and Closures',c:'closures',teach:'let and const are block scoped: they exist only inside the nearest braces. An inner scope can read outer variables, and a variable with the same name inside shadows the outer one. A closure is a function that remembers the variables from where it was created, even after the outer function has finished. That is how counters and private state work.',code:'function counter() {\n  let n = 0;\n  return () => {\n    n++;\n    return n;\n  };\n}\nconst next = counter();\nconsole.log(next(), next());',qs:[
{t:'mc',q:'What does this print?',code:'function counter() {\n  let n = 0;\n  return () => ++n;\n}\nconst a = counter();\nconst b = counter();\na(); a();\nconsole.log(b());',o:['1','3','2','0'],a:0,e:'Each call to counter creates its own n, so b has a fresh count and its first call returns 1.'},
{t:'mc',q:'What does this print?',code:'if (true) {\n  let k = 1;\n}\nconsole.log(typeof k);',o:['undefined','number','null','It throws an error'],a:0,e:'k only exists inside the braces. typeof on an undeclared name safely gives "undefined".'},
{t:'mc',q:'What does this print?',code:'let x = "outer";\nfunction f() {\n  let x = "inner";\n  return x;\n}\nf();\nconsole.log(x);',o:['outer','inner','undefined','outerinner'],a:0,e:'The inner x shadows the outer one only inside f. The outer x is untouched.'},
{t:'tf',q:'A closure remembers the variables of the scope where it was created.',o:TF,a:0,e:'That memory is what lets a returned function keep using an outer variable.'},
{t:'order',q:'Put the lines in order to build a counter factory.',items:['function makeCounter() {','  let count = 0;','  return () => ++count;','}'],e:'The private variable is declared first, then the returned function uses it.'}
]},
{t:'Classes and Inheritance',c:'classes',teach:'A class is a blueprint for objects. The constructor sets up a new instance using this, methods live in the class body, and new creates an instance. extends makes a subclass that inherits methods, and super calls the parent. In a subclass constructor you must call super(...) before touching this. Pitfall: forgetting this. when setting properties.',code:'class Animal {\n  constructor(name) { this.name = name; }\n  speak() { return this.name + " makes a sound"; }\n}\nclass Dog extends Animal {\n  speak() { return super.speak() + ": woof"; }\n}\nconsole.log(new Dog("Rex").speak());',qs:[
{t:'mc',q:'What does this print?',code:'class P {\n  constructor(x) { this.x = x; }\n  get() { return this.x; }\n}\nconsole.log(new P(7).get());',o:['7','undefined','P','x'],a:0,e:'The constructor stored 7 on the instance and get returns it.'},
{t:'mc',q:'What does this print?',code:'class A { hi() { return "A"; } }\nclass B extends A {\n  hi() { return super.hi() + "B"; }\n}\nconsole.log(new B().hi());',o:['AB','B','A','BA'],a:0,e:'super.hi() returns "A" and then "B" is appended.'},
{t:'fill',q:'Fill in the keyword to make Cat a subclass of Animal.',code:'class Cat ___ Animal {}',a:['extends'],e:'extends sets up inheritance from the parent class.'},
{t:'mc',q:'Find the bug: why is new Box(3).v undefined?',code:'class Box {\n  constructor(v) {\n    v = v;\n  }\n}\nconsole.log(new Box(3).v);',o:['It assigns to the parameter, not to this.v','Classes cannot have constructors','v is a reserved word','new must be omitted'],a:0,e:'v = v only reassigns the parameter. Write this.v = v to store it on the instance.'},
{t:'order',q:'Put the lines in order to define and use a class.',items:['class Counter {','  constructor() { this.n = 0; }','  inc() { this.n++; }','}','const c = new Counter();'],e:'The class must be fully defined before new Counter() creates an instance.'}
]},
{t:'Map and Set',c:'mapset',teach:'A Set stores unique values: adding a duplicate does nothing. A Map stores key/value pairs and, unlike a plain object, accepts any type as a key and keeps a reliable size. Use set, get, has and delete on a Map and add, has and delete on a Set. Both have a size property. Spreading a Set into an array is a quick way to remove duplicates.',code:'const seen = new Set([1, 2, 2, 3]);\nconsole.log(seen.size);\nseen.add(4);\nconsole.log(seen.has(2));\nconst m = new Map();\nm.set("a", 1);\nconsole.log(m.get("a"), m.size);\nconsole.log(m.has("z"));',qs:[
{t:'mc',q:'What does this print?',code:'console.log(new Set("hello").size);',o:['5','4','3','2'],a:1,e:'The unique characters are h, e, l, o, which is 4.'},
{t:'mc',q:'What does this print?',code:'const m = new Map();\nm.set("x", 1);\nm.set("x", 2);\nconsole.log(m.size, m.get("x"));',o:['1 2','2 1','2 2','1 1'],a:0,e:'Setting an existing key replaces its value instead of adding a second entry.'},
{t:'mc',q:'Which expression removes duplicates from the array arr?',o:['[...new Set(arr)]','new Map(arr)','arr.unique()','Set(arr).toArray()'],a:0,e:'A Set drops duplicates and spread turns it back into an array. The others are not valid or do something else.'},
{t:'fill',q:'Fill in the method that returns the value stored for "k".',code:'const m = new Map([["k", 5]]);\nconsole.log(m.___("k"));',a:['get'],e:'get returns the stored value. has would only return true.'},
{t:'code',q:'Write uniqueCount(arr) returning how many distinct values the array contains.',starter:'function uniqueCount(arr) {\n  return arr.length;\n}',fn:'uniqueCount',tests:[[[[1,1,2]],2],[[[]],0],[[['a','b','a']],2]],sol:'function uniqueCount(arr){ return new Set(arr).size; }',e:'A Set keeps one copy of each value, so its size is the distinct count.'}
]},

{t:'mc',q:'What does this print?',code:'const base = { a: 1 };\nconst ext = { ...base, b: 2 };\nbase.a = 9;\nconsole.log(ext.a);',o:['1','9','undefined','2'],a:0,e:'Spread made a copy of the property values, so changing base afterwards does not affect ext.'},
{t:'mc',q:'Find the bug: what is wrong with this subclass?',code:'class Dog extends Animal {\n  constructor(name) {\n    this.name = name;\n  }\n}',o:['It must call super(name) before using this','extends needs parentheses','Dog needs a Map','Constructors cannot take parameters'],a:0,e:'A subclass constructor must call super first, otherwise using this throws a ReferenceError.'},
{t:'match',q:'Match each concept with its description.',pairs:[['closure','function remembering outer variables'],['class','blueprint for objects'],['Set','collection of unique values'],['spread','copies items into a new array or object']],e:'Each is a core tool from this unit.'},
{t:'code',q:'Write countKeys(obj) returning the number of own keys in the object.',starter:'function countKeys(obj) {\n  return 0;\n}',fn:'countKeys',tests:[[[{}],0],[[{a:1,b:2}],2],[[{x:null}],1]],sol:'function countKeys(obj){ return Object.keys(obj).length; }',e:'Object.keys returns an array of the keys and its length is the count.'},

{t:'Errors and JSON',c:'errors',teach:'try runs risky code and catch handles any error thrown, while finally always runs afterwards. Use throw new Error("message") to signal a problem yourself. JSON.stringify turns a value into a JSON text and JSON.parse turns text back, throwing a SyntaxError if the text is invalid. JSON keys and strings must use double quotes.',code:'try {\n  const data = JSON.parse("{bad json");\n} catch (err) {\n  console.log("Invalid:", err.name);\n} finally {\n  console.log("done");\n}\nconsole.log(JSON.stringify({ a: 1, b: [2, 3] }));',qs:[
{t:'mc',q:'What does this print?',code:'try {\n  throw new Error("boom");\n} catch (e) {\n  console.log(e.message);\n} finally {\n  console.log("end");\n}',o:['boom, then end','end, then boom','boom only','end only'],a:0,e:'The error is caught and its message printed, and finally runs last either way.'},
{t:'mc',q:'What does this print?',code:'console.log(JSON.stringify({ a: 1, b: "x" }));',o:['{"a":1,"b":"x"}','{ a: 1, b: x }','{a:1,b:x}','[object Object]'],a:0,e:'JSON.stringify produces valid JSON text with quoted keys and strings.'},
{t:'fill',q:'Fill in the keyword that creates the error object.',code:'throw ___ Error("bad");',a:['new'],e:'Error is a class, so it is created with new.'},
{t:'tf',q:'The finally block runs even when the try block throws.',o:TF,a:0,e:'finally is for cleanup that must happen no matter what.'},
{t:'code',q:'Write safeParse(str) that returns the parsed JSON value, or null if the text is invalid.',starter:'function safeParse(str) {\n  return JSON.parse(str);\n}',fn:'safeParse',tests:[[['{"a":1}'],{a:1}],[['nope'],null],[['[1,2]'],[1,2]]],sol:'function safeParse(str){ try { return JSON.parse(str); } catch (e) { return null; } }',e:'Wrap JSON.parse in try/catch and return null from the catch block.'}
]},
{t:'Timers and Promises',c:'promises',teach:'JavaScript runs one piece of code at a time. Asynchronous work such as setTimeout is scheduled and its callback runs after the current code finishes. A Promise represents a future value and is pending, then fulfilled or rejected. Use .then for success and .catch for failure; .then returns a new promise so calls chain. Promise callbacks run before timer callbacks.',code:'console.log("start");\nsetTimeout(() => console.log("timer"), 0);\nPromise.resolve("ok").then(v => console.log(v));\nconsole.log("end");',qs:[
{t:'mc',q:'What is the output order?',code:'console.log("A");\nsetTimeout(() => console.log("B"), 0);\nconsole.log("C");',o:['A C B','A B C','B A C','C A B'],a:0,e:'The timer callback waits until the current synchronous code has finished.'},
{t:'mc',q:'What is the output order?',code:'setTimeout(() => console.log("T"), 0);\nPromise.resolve().then(() => console.log("P"));\nconsole.log("S");',o:['S P T','S T P','P T S','T P S'],a:0,e:'Synchronous code runs first, then promise callbacks, then timers.'},
{t:'fill',q:'Fill in the method that runs when a promise succeeds.',code:'fetchUser().___(user => console.log(user));',a:['then'],e:'.then registers a callback for the fulfilled value.'},
{t:'order',q:'Put the lines in order to print 6.',items:['Promise.resolve(2)','  .then(n => n * 3)','  .then(n => console.log(n));'],e:'The chain starts with a resolved promise, and each then receives the previous result.'},
{t:'mc',q:'Which are the three states of a promise?',o:['pending, fulfilled, rejected','open, closed, failed','start, running, stop','waiting, done, error'],a:0,e:'A promise starts pending and ends fulfilled or rejected.'},
{t:'tf',q:'setTimeout(fn, 0) runs fn immediately, before the next line.',o:TF,a:1,e:'Even with 0 delay the callback is queued and runs after the current code.'}
]},
{t:'async and await',c:'async',teach:'An async function always returns a promise. Inside it, await pauses that function until a promise settles and gives you the value, so asynchronous code reads like normal code. Handle failures with try/catch. await only works inside async functions (or at the top of modules). Promise.all runs several promises together and waits for all of them.',code:'const wait = ms => new Promise(r => setTimeout(r, ms));\nasync function run() {\n  try {\n    await wait(10);\n    return "done";\n  } catch (e) {\n    return "failed";\n  }\n}\nrun().then(console.log);',qs:[
{t:'mc',q:'What does an async function always return?',o:['A promise','undefined','The raw value','A callback'],a:0,e:'Even when you return 5, callers receive a promise that resolves to 5.'},
{t:'mc',q:'What does this print?',code:'async function f() { return 5; }\nconsole.log(f() === 5);',o:['false','true','5','undefined'],a:0,e:'f() returns a promise, which is never strictly equal to the number 5.'},
{t:'mc',q:'What is the output order?',code:'async function f() {\n  console.log("a");\n  await null;\n  console.log("b");\n}\nf();\nconsole.log("c");',o:['a c b','a b c','c a b','b a c'],a:0,e:'f runs until await, then returns control. "c" prints before the rest of f resumes.'},
{t:'fill',q:'Fill in the keyword that waits for a promise.',code:'const data = ___ getData();',a:['await'],e:'await pauses the async function until getData settles.'},
{t:'mc',q:'Find the bug: why does this code fail?',code:'function load() {\n  const r = await fetchIt();\n  return r;\n}',o:['await is used in a function that is not async','fetchIt must be a class','return cannot follow await','const cannot hold a promise'],a:0,e:'Mark the function async to use await inside it.'}
]},
{t:'Modules',c:'modules',teach:'Modules split code across files. A file shares things with export: many named exports, and at most one default export. Other files import them with import { name } from "./file.js" for named exports, import Name from "./file.js" for the default, or import * as ns to get everything. Pitfall: named imports need braces and the exact exported name.',code:'export const PI = 3.14;\nexport function area(r) {\n  return PI * r * r;\n}\nexport default class Shape {}\n// in another file:\nimport Shape, { PI, area } from "./shapes.js";\nimport * as geo from "./shapes.js";',qs:[
{t:'mc',q:'Which line imports the named export area from "./m.js"?',o:['import { area } from "./m.js";','import area from "./m.js";','require area from "./m.js";','import area = "./m.js";'],a:0,e:'Named exports are imported in braces. Without braces you would get the default export.'},
{t:'fill',q:'Fill in the keyword to complete the import.',code:'import { add } ___ "./math.js";',a:['from'],e:'The syntax is import { names } from "path".'},
{t:'mc',q:'A file contains export default class Tool {}. Which import is correct?',o:['import Tool from "./tool.js";','import { Tool } from "./tool.js";','import * Tool from "./tool.js";','import default Tool from "./tool.js";'],a:0,e:'Default exports are imported without braces, and you can pick any local name.'},
{t:'tf',q:'A module can have many named exports but at most one default export.',o:TF,a:0,e:'Only one export default is allowed per module.'},
{t:'match',q:'Match each syntax with its meaning.',pairs:[['export const x','named export'],['export default x','default export'],['import * as m','all exports in one object'],['import { a as b }','rename while importing']],e:'These cover the common module forms.'},
{t:'mc',q:'Find the bug: math.js has export function sum() and main.js does this. What is wrong?',code:'import sum from "./math.js";',o:['sum is a named export so it needs braces','sum must be imported with require','import must come last','Functions cannot be exported'],a:0,e:'Use import { sum } from "./math.js";.'}
]},
{t:'DOM Basics',c:'dom',teach:'In a browser the page is a tree of elements called the DOM, reached through document. Use document.querySelector with a CSS selector to get one element (or null) and querySelectorAll for all matches. Change text with textContent, add classes with classList, create elements with createElement, and react to events with addEventListener. Prefer textContent over innerHTML for untrusted text.',code:'const btn = document.querySelector("#save");\nconst list = document.querySelector("ul");\nbtn.addEventListener("click", () => {\n  const li = document.createElement("li");\n  li.textContent = "New item";\n  list.append(li);\n  btn.classList.add("used");\n});',qs:[
{t:'mc',q:'Which call selects the element with id "main"?',o:['document.querySelector("#main")','document.querySelector(".main")','document.querySelector("main#")','document.getElement("main")'],a:0,e:'# selects by id and . selects by class in CSS selectors.'},
{t:'fill',q:'Fill in the method that registers a click handler.',code:'btn.___("click", handler);',a:['addEventListener'],e:'addEventListener attaches a listener for an event type.'},
{t:'mc',q:'Why prefer textContent to innerHTML when showing user-typed text?',o:['innerHTML parses HTML, so typed tags could inject scripts','textContent is always faster by a factor of ten','innerHTML cannot change text','textContent allows bold text'],a:0,e:'textContent treats the text as plain text, which avoids injection problems.'},
{t:'order',q:'Put the lines in order to add a paragraph to the page.',items:['const p = document.createElement("p");','p.textContent = "Hello";','document.body.append(p);'],e:'Create the element, fill it, then attach it to the page.'},
{t:'mc',q:'What does this print?',code:'// HTML: <ul><li class="a">x</li><li>y</li></ul>\nconsole.log(document.querySelectorAll("li").length);\nconsole.log(document.querySelector(".a").textContent);',o:['2 then x','1 then x','2 then y','2 then undefined'],a:0,e:'There are two li elements, and .a matches the first one whose text is x.'},

]},

{t:'fill',q:'Complete the filter so only paid orders remain.',code:'const paid = orders.filter(o => o.___);',a:['paid'],e:'The callback returns the paid flag, which is true for paid orders.'},
{t:'mc',q:'Find the bug: this version throws a TypeError for summarize([]). Why?',code:'const total = paid.reduce((s, o) => s + o.amount);',o:['reduce has no initial value, so an empty array throws','amount is a reserved word','reduce cannot add numbers','paid must be a Set'],a:0,e:'Without 0 as the starting value, reducing an empty array has nothing to return. Add , 0.'},
{t:'code',q:'Write summarize(orders) returning { count, total } for the paid orders only.',starter:'function summarize(orders) {\n  // count and total of paid orders\n}',fn:'summarize',tests:[[[[{amount:5,paid:true},{amount:7,paid:false},{amount:10,paid:true}]],{count:2,total:15}],[[[]],{count:0,total:0}],[[[{amount:3,paid:false}]],{count:0,total:0}]],sol:'function summarize(orders){ const paid = orders.filter(o => o.paid); const total = paid.reduce((s, o) => s + o.amount, 0); return { count: paid.length, total }; }',e:'Filter first, then count with length and total with reduce starting at 0 so empty input works.'},
{t:'order',q:'Put the lines in order to load JSON with async/await.',items:['async function load(url) {','  const res = await fetch(url);','  return res.json();','}'],e:'The async keyword enables await, which waits for the response before the next line.'}
]}
]});

C({id:'html',name:'HTML',badge:'HT',lvl:'Beginner',pre:'None',goal:'Write well-structured, accessible, semantic HTML pages with text, links, media, tables, forms and proper metadata.'});

U('html',{t:'Unit 1 · Page Foundations',l:[
{t:'The page skeleton',c:'skeleton',teach:'An HTML page is made of elements written as tags. Every page starts with <!DOCTYPE html>, then one <html> element holding a <head> (information about the page) and a <body> (everything visible). Most elements have an opening and a closing tag; forgetting the closing tag is a common pitfall.',code:'<!DOCTYPE html>\n<html lang="en">\n<head>\n  <title>My page</title>\n</head>\n<body>\n  <p>Hello, web!</p>\n</body>\n</html>',qs:[
{t:'mc',q:'Which element holds everything the visitor sees in the browser window?',o:['<head>','<body>','<title>','<html>'],a:1,e:'<body> holds the visible content. <head> holds information about the page, and <html> wraps both.'},
{t:'tf',q:'The text inside <title> appears in the page content area.',o:TF,a:1,e:'<title> sets the browser tab label and bookmark name. It is not shown inside the page body.'},
{t:'order',q:'Put the page skeleton in order.',items:['<!DOCTYPE html>','<html lang="en">','<head>','</head>','<body>','</body>'],e:'The doctype comes first, then html wrapping head followed by body.'},
{t:'mc',q:'Find the bug: what is wrong with this page?',code:'<html>\n<body>\n  <p>Hi</p>\n</body>\n<head>\n  <title>Test</title>\n</head>\n</html>',o:['head must come before body','title must be in body','p cannot be in body','html needs a class'],a:0,e:'The head must come first, then the body. Browsers may repair the order, but the markup is invalid.'}]},
{t:'Headings and paragraphs',c:'headings',teach:'Headings run from <h1> (most important) to <h6>. Use them for structure, not for making text big. A page normally has one <h1>, and levels should not skip (h2 then h4). Paragraphs use <p>; extra spaces and line breaks in your source are collapsed into a single space.',code:'<h1>Pet Care Guide</h1>\n<h2>Dogs</h2>\n<p>Dogs need   daily\n walks.</p>\n<h2>Cats</h2>\n<p>Cats nap a lot.</p>',qs:[
{t:'mc',q:'Which tag is the highest-level heading?',o:['<h6>','<head>','<h1>','<header>'],a:2,e:'<h1> is the top level; <h6> is the lowest. <head> and <header> are different elements.'},
{t:'mc',q:'How does the browser show this paragraph?',code:'<p>Go    home\n   now</p>',o:['Go home now (one line, single spaces)','Go    home on one line and now on the next','Go home and now on separate lines','Nothing, it is invalid'],a:0,e:'Whitespace runs, including newlines, collapse into one space. Use <br> or separate <p> elements to force breaks.'},
{t:'tf',q:'Choosing <h4> just because it looks small is good practice.',o:TF,a:1,e:'Headings describe document structure. Use CSS for size and keep heading levels logical.'},
{t:'fill',q:'Complete the tag for a second-level heading.',code:'<___>Dogs</h2>',a:['h2'],e:'The closing tag is </h2>, so the opening tag must be <h2>.'}]},
{t:'Inline text',c:'inline',teach:'Inline elements style parts of a line. <strong> marks strong importance and <em> marks emphasis; browsers show them bold and italic, but the meaning matters. <br> forces a line break and <hr> draws a thematic break; both are void elements with no closing tag. <code> marks computer code.',code:'<p>This is <strong>very</strong> <em>important</em>.<br>\nRun <code>npm start</code> now.</p>\n<hr>',qs:[
{t:'mc',q:'Which element marks text of strong importance?',o:['<b>','<strong>','<big>','<mark>'],a:1,e:'<strong> carries meaning of importance. <b> is only visual boldness with no extra meaning.'},
{t:'match',q:'Match each tag with its purpose.',pairs:[['<em>','Emphasised text'],['<br>','Line break'],['<hr>','Thematic break line'],['<code>','Computer code']],e:'Each element has a specific meaning; br and hr are void elements.'},
{t:'tf',q:'<br> needs a closing </br> tag.',o:TF,a:1,e:'<br> is a void element: it has no content, so it has no closing tag.'},
{t:'mc',q:'Find the bug: the author wants the word "now" emphasised.',code:'<p>Do it <em>now</p></em>',o:['The tags overlap; close em before p','em cannot be inside p','The p needs a class','Nothing is wrong'],a:0,e:'Elements must nest properly: the inner element closes first, so write <em>now</em></p>.'}]},
{t:'Lists',c:'lists',teach:'Use <ul> for unordered (bulleted) lists and <ol> for ordered (numbered) lists. Each item is an <li>, and only <li> elements belong directly inside the list. Lists can nest by placing a new list inside an <li>. Use <dl> with <dt> and <dd> for term and description pairs.',code:'<ol>\n  <li>Boil water</li>\n  <li>Add pasta\n    <ul>\n      <li>Salt</li>\n    </ul>\n  </li>\n</ol>',qs:[
{t:'mc',q:'Which element creates a numbered list?',o:['<ul>','<ol>','<nl>','<li>'],a:1,e:'<ol> is an ordered list. <ul> gives bullets and <li> is just an item.'},
{t:'fill',q:'Fill the tag for each list item.',code:'<ul>\n  <___>Apples</li>\n</ul>',a:['li'],e:'Items in ul and ol are <li> elements.'},
{t:'mc',q:'How many numbered items does the outer list show?',code:'<ol>\n  <li>A</li>\n  <li>B\n    <ul><li>B1</li><li>B2</li></ul>\n  </li>\n  <li>C</li>\n</ol>',o:['2','3','5','4'],a:1,e:'The outer ol has three li children (A, B, C). B1 and B2 are bullets in the nested ul.'},
{t:'tf',q:'A <p> may be placed directly inside a <ul>, outside any <li>.',o:TF,a:1,e:'Only <li> (and script-supporting elements) may be direct children of ul and ol.'}]},
{t:'Links',c:'links',teach:'The anchor <a> creates links using the href attribute. Link text should describe the destination. Absolute URLs include the protocol (https://...), relative URLs point within your site (about.html, ../img/a.png), and #id jumps to an element with that id. target="_blank" opens a new tab; add rel="noopener" for safety.',code:'<a href="https://example.com">Example</a>\n<a href="about.html">About us</a>\n<a href="#contact">Contact section</a>\n<a href="mailto:hi@example.com">Email</a>',qs:[
{t:'mc',q:'Which attribute holds the link destination?',o:['src','link','href','url'],a:2,e:'<a> uses href. src is for embedded resources like images.'},
{t:'mc',q:'Where does this link go?',code:'<a href="#faq">Questions</a>',o:['To an element with id="faq" on the same page','To faq.html','To a new tab','Nowhere; # is invalid'],a:0,e:'A fragment starting with # targets the element with that id on the current page.'},
{t:'fill',q:'Complete the attribute that opens the link in a new tab.',code:'<a href="https://example.com" target="___">Open</a>',a:['_blank'],e:'target="_blank" opens a new browsing context.'},
{t:'mc',q:'Which link text is best for accessibility?',o:['click here','Read the 2024 annual report','here','link'],a:1,e:'Descriptive text makes sense out of context, such as in a screen reader links list.'}]},
{t:'Checkpoint: Foundations',c:'cp1',teach:'Review: pages have a doctype, html, head and body; headings give structure; inline elements carry meaning; lists use ul, ol and li; links use href. Nest elements correctly and close what you open.',code:'<!DOCTYPE html>\n<html lang="en">\n<head><title>Recipes</title></head>\n<body>\n  <h1>Recipes</h1>\n  <p>Try <strong>this</strong> one:</p>\n  <ul><li><a href="pie.html">Pie</a></li></ul>\n</body>\n</html>',qs:[
{t:'mc',q:'Which is a valid nesting?',o:['<p><em>Hi</p></em>','<p><em>Hi</em></p>','<em><p>Hi</em></p>','<p><em>Hi</p>'],a:1,e:'The element opened last must be closed first.'},
{t:'match',q:'Match element to role.',pairs:[['<head>','Page information'],['<body>','Visible content'],['<ol>','Numbered list'],['<a>','Hyperlink']],e:'These are the building blocks from this unit.'},
{t:'tf',q:'A page should normally have several <h1> elements for decoration.',o:TF,a:1,e:'Normally one h1 names the page; use lower levels for sections.'},
{t:'mc',q:'Find the bug: why does this link not work?',code:'<a src="team.html">Our team</a>',o:['It uses src instead of href','team.html must be absolute','a cannot hold text','It needs target'],a:0,e:'Anchors need href. src belongs to embedded content such as img.'},
{t:'fill',q:'Complete the void element that draws a horizontal rule.',code:'<p>One</p>\n<___>\n<p>Two</p>',a:['hr'],e:'<hr> draws a thematic break and has no closing tag.'}]}
]});

U('html',{t:'Unit 2 · Media, Layout and Tables',l:[
{t:'Images',c:'images',teach:'<img> embeds an image. It is void and needs src (the file) and alt (a text alternative). Alt text is read by screen readers and shown if the image fails to load; use alt="" for purely decorative images. Setting width and height prevents layout jumps while the image loads. Wrap in <figure> with <figcaption> to add a caption.',code:'<figure>\n  <img src="img/cat.jpg" alt="A grey cat asleep on a sofa" width="400" height="300">\n  <figcaption>Milo at rest</figcaption>\n</figure>',qs:[
{t:'mc',q:'Which attribute gives an image its text alternative?',o:['title','alt','caption','name'],a:1,e:'alt is the text alternative. title only adds a tooltip and is not a substitute.'},
{t:'tf',q:'A purely decorative image should have alt="" rather than no alt attribute.',o:TF,a:0,e:'An empty alt tells assistive technology to skip it. A missing alt may cause the file name to be read out.'},
{t:'fill',q:'Complete the attribute that gives the image file location.',code:'<img ___="logo.png" alt="Company logo">',a:['src'],e:'src (source) points to the image file.'},
{t:'mc',q:'Find the bug: what is wrong?',code:'<img src="dog.jpg">Good dog</img>',o:['img is void, has no closing tag, and lacks alt','img needs href','src must be absolute','Nothing is wrong'],a:0,e:'img has no content or closing tag, and it needs alt. Use figcaption for visible captions.'}]},
{t:'Audio and video',c:'media',teach:'<video> and <audio> embed media natively. Add the controls attribute so users can play and pause. Provide several <source> elements with a type, and the browser picks the first it supports. Text inside the element is fallback content. Avoid autoplay with sound; it harms usability. Give videos captions using <track>.',code:'<video controls width="480">\n  <source src="clip.webm" type="video/webm">\n  <source src="clip.mp4" type="video/mp4">\n  <track kind="captions" src="clip.vtt" srclang="en" label="English">\n  Your browser cannot play video.\n</video>',qs:[
{t:'mc',q:'Which attribute shows play and pause buttons?',o:['play','buttons','controls','ui'],a:2,e:'The boolean attribute controls displays the browser controls.'},
{t:'mc',q:'What is the text inside <video> for?',o:['Fallback for browsers that cannot play it','The caption','The video title','It is shown below the video'],a:0,e:'Browsers that support video ignore that content; older ones show it.'},
{t:'match',q:'Match element to job.',pairs:[['<source>','Offer one media file format'],['<track>','Captions or subtitles'],['<audio>','Sound player'],['<video>','Video player']],e:'source and track live inside audio or video.'},
{t:'tf',q:'Boolean attributes like controls need a value such as controls="true".',o:TF,a:1,e:'Their presence alone turns them on. Writing controls="false" would still enable it.'}]},
{t:'Semantic layout',c:'semantic',teach:'Semantic elements describe what content is. <header> introduces a page or section, <nav> holds main navigation links, <main> is the unique primary content, <section> groups a themed block (usually with a heading), <article> is self-contained content, <aside> is tangential, and <footer> closes a page or section. They beat generic <div>s because browsers and screen readers understand them.',code:'<body>\n  <header><h1>Daily News</h1>\n    <nav><a href="/">Home</a></nav></header>\n  <main>\n    <article><h2>Story</h2><p>Text</p></article>\n    <aside>Related links</aside>\n  </main>\n  <footer>2024</footer>\n</body>',qs:[
{t:'mc',q:'Which element holds the unique main content of a page?',o:['<section>','<main>','<article>','<div>'],a:1,e:'<main> marks the dominant content and should appear once per page.'},
{t:'match',q:'Match semantic element to use.',pairs:[['<nav>','Main navigation links'],['<aside>','Side content'],['<article>','Self-contained post'],['<footer>','Closing info']],e:'Each describes the role of its content.'},
{t:'mc',q:'Which element suits a blog post that makes sense on its own in an RSS feed?',o:['<aside>','<nav>','<article>','<header>'],a:2,e:'article is for independently distributable content.'},
{t:'mc',q:'Find the bug: what is the semantic problem?',code:'<div class="nav">\n  <a href="/">Home</a>\n  <a href="/shop">Shop</a>\n</div>',o:['A <nav> element should be used','div cannot hold links','Links need ids','Nothing; div is best'],a:0,e:'A <nav> gives assistive tech a navigation landmark; a classed div conveys nothing.'}]},
{t:'div, span, classes and ids',c:'divspan',teach:'<div> is a generic block container and <span> a generic inline one; use them only when no semantic element fits. The class attribute labels elements for styling and can be reused and combined (class="card big"). An id must be unique on a page and is also used for link targets. Pitfall: duplicate ids.',code:'<div class="card featured">\n  <h2 id="deal">Deal of the day</h2>\n  <p>Only <span class="price">$5</span> today.</p>\n</div>',qs:[
{t:'mc',q:'Which is an inline generic container?',o:['<div>','<span>','<section>','<p>'],a:1,e:'span flows inside a line of text; div starts on its own line.'},
{t:'tf',q:'Two elements on the same page may share one id.',o:TF,a:1,e:'ids must be unique. Use class for shared labels.'},
{t:'mc',q:'How many classes does this element have?',code:'<div class="card big dark"></div>',o:['1','2','3','It is invalid'],a:2,e:'Space-separated names are separate classes: card, big and dark.'},
{t:'fill',q:'Complete the attribute that can label many elements for styling.',code:'<p ___="note">Hi</p>',a:['class'],e:'class can be reused on many elements; id must be unique.'}]},
{t:'Tables',c:'tables',teach:'Tables show tabular data, not page layout. <table> holds <tr> rows, which hold <th> header cells and <td> data cells. Group rows with <thead>, <tbody> and <tfoot>, and add <caption> to title the table. colspan and rowspan let a cell span columns or rows. Use scope="col" on headers so screen readers pair them with data.',code:'<table>\n  <caption>Scores</caption>\n  <thead><tr><th scope="col">Name</th><th scope="col">Pts</th></tr></thead>\n  <tbody>\n    <tr><td>Ana</td><td>12</td></tr>\n    <tr><td>Bo</td><td>9</td></tr>\n  </tbody>\n</table>',qs:[
{t:'mc',q:'Which element is a table row?',o:['<td>','<tr>','<th>','<row>'],a:1,e:'<tr> is a row; td and th are cells inside it.'},
{t:'mc',q:'How many columns does the first row of this table have?',code:'<table><tr>\n  <td colspan="2">A</td>\n  <td>B</td>\n</tr></table>',o:['2','3','1','4'],a:1,e:'colspan="2" makes A cover two columns, plus B makes three columns.'},
{t:'tf',q:'Tables are the recommended tool for page layout.',o:TF,a:1,e:'Use CSS for layout; tables are for data.'},
{t:'fill',q:'Complete the tag for a header cell.',code:'<tr><___ scope="col">Name</th></tr>',a:['th'],e:'th is the header cell; its closing tag is </th>.'}]},
{t:'Checkpoint: Media, Layout and Tables',c:'cp2',teach:'Review: img needs alt; video and audio use controls and source; semantic elements describe roles; div and span are generic fallbacks; tables hold data in tr, th and td.',code:'<main>\n  <figure><img src="a.png" alt="Chart of sales"><figcaption>Sales</figcaption></figure>\n  <table><tr><th>Q1</th><td>10</td></tr></table>\n</main>',qs:[
{t:'mc',q:'Which is the best element for the site menu?',o:['<nav>','<aside>','<span>','<table>'],a:0,e:'nav marks navigation.'},
{t:'order',q:'Order the table pieces from outermost to innermost.',items:['<table>','<tbody>','<tr>','<td>'],e:'A table holds a body, which holds rows, which hold cells.'},
{t:'tf',q:'alt text is optional for informative images.',o:TF,a:1,e:'Informative images need meaningful alt text; only decorative ones use an empty alt.'},
{t:'mc',q:'Find the bug: why is this table inaccessible?',code:'<table>\n  <tr><td>Name</td><td>Age</td></tr>\n  <tr><td>Ana</td><td>30</td></tr>\n</table>',o:['Header cells use td instead of th','Tables cannot have rows','Missing div wrapper','Missing id'],a:0,e:'Header cells should be th so assistive tech relates data to headers.'},
{t:'fill',q:'Complete the element that captions a figure.',code:'<figure><img src="a.png" alt="Map"><___>City map</figcaption></figure>',a:['figcaption'],e:'figcaption pairs with figure.'}]}
]});

U('html',{t:'Unit 3 · Forms',l:[
{t:'Form basics',c:'formbasics',teach:'A <form> collects user input and sends it somewhere. The action attribute is the URL that receives data, and method is get (data in the URL, for searches) or post (data in the request body, for changes and private data). Each field needs a name; that name is the key in the submitted data. A submit button sends the form.',code:'<form action="/search" method="get">\n  <input type="text" name="q">\n  <button type="submit">Search</button>\n</form>',qs:[
{t:'mc',q:'Which attribute sets the URL that receives the form data?',o:['method','action','href','target'],a:1,e:'action is the destination; method is how it is sent.'},
{t:'mc',q:'What URL is requested after typing "cats" and submitting?',code:'<form action="/s" method="get">\n  <input name="q">\n  <button>Go</button>\n</form>',o:['/s?q=cats','/s/cats','/s','/s?cats'],a:0,e:'GET appends name=value pairs as a query string.'},
{t:'tf',q:'An input without a name attribute is submitted with the form.',o:TF,a:1,e:'Fields without a name are skipped, so always set name.'},
{t:'fill',q:'Complete the method for sending a password in the request body.',code:'<form action="/login" method="___">',a:['post'],e:'POST puts data in the body rather than the visible URL.'}]},
{t:'Input types',c:'inputtypes',teach:'The <input> element changes behaviour with its type: text, email, password, number, date, url, tel, color, range, file and more. The right type gives mobile users the right keyboard and offers built-in checks. input is void. A pitfall is using type="text" for everything. Use placeholder only as a hint, never as a replacement for a label.',code:'<input type="email" name="mail" placeholder="you@example.com">\n<input type="number" name="age" min="0" max="120">\n<input type="date" name="dob">\n<input type="password" name="pw">',qs:[
{t:'mc',q:'Which type hides characters as they are typed?',o:['secret','hidden','password','mask'],a:2,e:'type="password" masks the characters. type="hidden" is an invisible field, not a masked one.'},
{t:'match',q:'Match type to purpose.',pairs:[['email','Address with format check'],['number','Numeric value'],['date','Date picker'],['file','Upload a file']],e:'Specific types give better keyboards and validation.'},
{t:'fill',q:'Complete the type for a colour picker.',code:'<input type="___" name="fav">',a:['color'],e:'type="color" opens a colour chooser.'},
{t:'mc',q:'Find the bug: this age field accepts letters. Why?',code:'<input type="text" name="age">',o:['It should be type="number"','It needs an id','It needs a closing tag','name must be Age'],a:0,e:'type="number" restricts input and shows a numeric keyboard.'}]},
{t:'Labels',c:'labels',teach:'Every control needs a <label>. Connect them by giving the input an id and the label a matching for attribute, or by nesting the input inside the label. Clicking the label then focuses the input, and screen readers announce it. Placeholders disappear when typing and are not labels.',code:'<label for="user">Username</label>\n<input id="user" name="user" type="text">\n\n<label>Email\n  <input name="mail" type="email">\n</label>',qs:[
{t:'mc',q:'How does a label connect to an input by id?',o:['label for="x" matches input id="x"','label id="x" matches input for="x"','label name="x"','They connect automatically'],a:0,e:'The label for value must equal the input id.'},
{t:'tf',q:'A placeholder is an acceptable replacement for a label.',o:TF,a:1,e:'Placeholders vanish when typing and have poor support in assistive tech.'},
{t:'mc',q:'Find the bug: clicking "Name" does not focus the field.',code:'<label for="n">Name</label>\n<input id="name" type="text">',o:['for and id do not match','input needs value','label needs class','type is missing'],a:0,e:'for="n" points to an id that does not exist; the input id is "name".'},
{t:'fill',q:'Complete the attribute linking the label to the input with id="city".',code:'<label ___="city">City</label>\n<input id="city">',a:['for'],e:'The for attribute holds the id of the target control.'}]},
{t:'Choices and text areas',c:'choices',teach:'Radio buttons (type="radio") offer one choice and share the same name to form a group. Checkboxes allow several on or off values. <select> with <option> elements makes a dropdown, and each option can carry a value. <textarea> holds multi-line text and has a closing tag. Group related controls with <fieldset> and <legend>.',code:'<fieldset>\n  <legend>Size</legend>\n  <label><input type="radio" name="size" value="s"> Small</label>\n  <label><input type="radio" name="size" value="l"> Large</label>\n</fieldset>\n<select name="city"><option value="ny">New York</option></select>\n<textarea name="note" rows="3"></textarea>',qs:[
{t:'mc',q:'What makes radio buttons behave as one group?',o:['The same name','The same id','The same value','They sit in a div'],a:0,e:'Radios with the same name allow only one selection.'},
{t:'mc',q:'What is submitted when the user picks "New York"?',code:'<select name="city">\n  <option value="ny">New York</option>\n  <option value="la">Los Angeles</option>\n</select>',o:['city=ny','city=New York','ny=city','Nothing'],a:0,e:'The option value attribute is submitted, not the visible text.'},
{t:'tf',q:'<textarea> is a void element written as <textarea />.',o:TF,a:1,e:'textarea needs a closing tag; its content is the default text.'},
{t:'fill',q:'Complete the element that titles a fieldset.',code:'<fieldset>\n  <___>Size</legend>\n</fieldset>',a:['legend'],e:'legend captions a fieldset.'}]},
{t:'Validation attributes',c:'validation',teach:'Browsers can validate before submitting. required blocks empty fields; minlength and maxlength limit text length; min and max limit numbers and dates; pattern takes a regular expression; type="email" checks format. Client-side checks help users, but they are not security: always validate again on the server.',code:'<form action="/join" method="post">\n  <input type="text" name="user" required minlength="3" maxlength="12">\n  <input type="number" name="age" min="13" max="99">\n  <input type="text" name="zip" pattern="[0-9]{5}">\n  <button>Join</button>\n</form>',qs:[
{t:'mc',q:'Which attribute stops submission when a field is empty?',o:['needed','required','notempty','validate'],a:1,e:'required is a boolean attribute that blocks empty submission.'},
{t:'mc',q:'Can the user submit age 10?',code:'<input type="number" name="age" min="13" max="99">',o:['No, the browser flags it','Yes, no checks exist','Only on mobile','Only with post'],a:0,e:'min="13" makes 10 invalid so the browser blocks submit.'},
{t:'tf',q:'Client-side validation alone is enough to protect a server.',o:TF,a:1,e:'Users can bypass browser checks, so servers must validate too.'},
{t:'fill',q:'Complete the attribute that limits the maximum number of characters.',code:'<input type="text" name="u" ___="12">',a:['maxlength'],e:'maxlength limits text length; max limits numeric values.'}]},
{t:'Checkpoint: Forms',c:'cp3',teach:'Review: forms need action, method and named fields; choose the right input type; connect labels with for and id; group radios by name; validate with required, min, max and pattern.',code:'<form action="/order" method="post">\n  <label for="q">Qty</label>\n  <input id="q" name="qty" type="number" min="1" required>\n  <button>Order</button>\n</form>',qs:[
{t:'mc',q:'Which is the best markup for an accessible email field?',o:['<input placeholder="Email">','<label for="e">Email</label><input id="e" type="email" name="e">','<p>Email</p><input>','<input type="text" name="Email">'],a:1,e:'A real label plus the email type gives accessibility and validation.'},
{t:'order',q:'Order the form pieces.',items:['<form action="/go" method="post">','<label for="a">Age</label>','<input id="a" name="age" type="number">','<button>Send</button>','</form>'],e:'The form wraps label, input and button in a sensible order.'},
{t:'mc',q:'Find the bug: both options can be selected at once.',code:'<input type="radio" name="a" value="1">\n<input type="radio" name="b" value="2">',o:['The names differ so they are not grouped','Radios need ids','Radios need labels only','Radios need min'],a:0,e:'Use the same name for all radios in a group.'},
{t:'match',q:'Match attribute to effect.',pairs:[['required','Field cannot be blank'],['pattern','Regular expression check'],['minlength','Minimum text length'],['placeholder','Hint text, not a label']],e:'These attributes shape input and validation.'},
{t:'tf',q:'A GET form puts its data into the URL.',o:TF,a:0,e:'GET appends fields to the query string.'}]}
]});

U('html',{t:'Unit 4 · Metadata and Accessibility',l:[
{t:'Document metadata',c:'metadata',teach:'The <head> holds metadata. <meta charset="utf-8"> sets text encoding and should come first. <meta name="viewport" content="width=device-width, initial-scale=1"> makes pages scale on phones. <title> names the page and matters for search and tabs, and <meta name="description"> summarises it. <link rel="stylesheet" href="..."> loads CSS and <script> loads JavaScript.',code:'<head>\n  <meta charset="utf-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1">\n  <title>Bakery | Fresh Bread</title>\n  <meta name="description" content="Daily baked bread in Leeds.">\n  <link rel="stylesheet" href="style.css">\n</head>',qs:[
{t:'mc',q:'Which tag loads an external stylesheet?',o:['<style src>','<link rel="stylesheet">','<css>','<script>'],a:1,e:'link with rel="stylesheet" and href loads CSS.'},
{t:'mc',q:'What does the viewport meta tag help with?',o:['Pages scale properly on mobile screens','Faster downloads','Page colours','Cookies'],a:0,e:'Without it, mobile browsers show a zoomed-out desktop layout.'},
{t:'fill',q:'Complete the attribute for the encoding declaration.',code:'<meta ___="utf-8">',a:['charset'],e:'charset sets the character encoding, normally utf-8.'},
{t:'mc',q:'Find the bug: the page tab shows nothing useful.',code:'<head>\n  <meta charset="utf-8">\n</head>',o:['There is no <title>','charset is wrong','head needs class','meta needs closing'],a:0,e:'Every page needs a descriptive <title>.'}]},
{t:'Document language and headings outline',c:'lang',teach:'Set the page language with lang on <html>, such as lang="en", so screen readers use the right pronunciation and browsers translate correctly. Mark passages in other languages with lang on that element. Headings form an outline that assistive technology users navigate by: do not skip levels, and do not pick headings for appearance.',code:'<html lang="en">\n<body>\n  <h1>Paris Guide</h1>\n  <h2>Food</h2>\n  <p>Say <span lang="fr">bon appetit</span>!</p>\n  <h3>Cafes</h3>\n</body>\n</html>',qs:[
{t:'mc',q:'Where should the main language of a page be declared?',o:['On the <html> element','In <title>','In <body> text','In <meta charset>'],a:0,e:'lang on html sets the default language of the whole document.'},
{t:'tf',q:'Skipping from h2 straight to h5 is fine if it looks right.',o:TF,a:1,e:'Skipped levels confuse outline navigation; style with CSS instead.'},
{t:'fill',q:'Complete the attribute that marks a Spanish phrase.',code:'<span ___="es">buenos dias</span>',a:['lang'],e:'lang with a language code, es for Spanish, marks that text.'},
{t:'mc',q:'Which heading order is best?',o:['h1, h2, h3, h2','h1, h3, h2, h5','h2, h1, h4','h3, h3, h3'],a:0,e:'A logical descending structure without skips is easiest to navigate.'}]},
{t:'Accessible interaction',c:'a11y',teach:'Use native elements: <button> for actions and <a> for navigation; they get keyboard focus and Enter or Space handling for free. A clickable div does not. tabindex="0" adds an element to tab order, but prefer native controls. ARIA attributes such as aria-label add names when visible text is missing; the first rule of ARIA is not to use it when a native element works. Never rely on colour alone.',code:'<button type="button" aria-label="Close dialog">X</button>\n<a href="/cart">Cart (2)</a>\n<nav aria-label="Main">\n  <a href="/">Home</a>\n</nav>',qs:[
{t:'mc',q:'Which is the best element for a control that deletes an item?',o:['<button>','<div onclick>','<span>','<a href="#">'],a:0,e:'button is focusable and keyboard operable by default.'},
{t:'mc',q:'What does aria-label do here?',code:'<button aria-label="Search">\n  <img src="mag.svg" alt="">\n</button>',o:['Gives the icon-only button an accessible name','Shows a tooltip only','Changes colour','Disables it'],a:0,e:'With no visible text, aria-label provides the name read by screen readers.'},
{t:'tf',q:'A <div> with a click handler is keyboard accessible by default.',o:TF,a:1,e:'Divs are not focusable; native buttons are.'},
{t:'match',q:'Match each need to the best element.',pairs:[['Run an action','<button>'],['Go to another page','<a href>'],['Group main site links','<nav>'],['Name an icon-only button','aria-label']],e:'Native elements give behaviour for free; aria-label supplies a missing name.'},
{t:'mc',q:'Find the bug: what is wrong for keyboard users?',code:'<div class="btn" onclick="save()">Save</div>',o:['It cannot be tabbed to or activated with the keyboard','The class name','It needs an id','Nothing'],a:0,e:'Use <button> so focus and key handling come for free.'}]},
{t:'Entities, escaping and embedding',c:'entities',teach:'Characters with special meaning must be escaped: &lt; for <, &gt; for >, &amp; for &, &quot; for a double quote. &nbsp; is a non-breaking space. <details> with <summary> makes a built-in show and hide widget, and <iframe> embeds another page; give an iframe a title. HTML comments use <!-- like this -->.',code:'<p>Write &lt;p&gt; to make a paragraph &amp; more.</p>\n<details>\n  <summary>More info</summary>\n  <p>Hidden until opened.</p>\n</details>\n<iframe src="map.html" title="Office map"></iframe>',qs:[
{t:'mc',q:'What does the browser show?',code:'<p>5 &lt; 7 &amp; 8 &gt; 6</p>',o:['5 < 7 & 8 > 6','5 &lt; 7 &amp; 8 &gt; 6','5 7 8 6','Nothing'],a:0,e:'Entities are decoded into the characters they represent.'},
{t:'match',q:'Match entity to character.',pairs:[['&lt;','<'],['&gt;','>'],['&amp;','&'],['&quot;','"']],e:'Entities let you show characters that HTML would otherwise treat as markup.'},
{t:'mc',q:'Which element creates a click-to-expand widget without JavaScript?',o:['<details>','<expand>','<toggle>','<dialog-box>'],a:0,e:'details with summary provides disclosure natively.'},
{t:'tf',q:'An <iframe> should have a title describing its content.',o:TF,a:0,e:'The title lets screen reader users know what the frame holds.'}]},
{t:'Good practice and validation',c:'practice',teach:'Write valid HTML: lowercase tags, quoted attribute values, properly nested and closed elements, unique ids. Use semantic elements first and generic ones last. Keep structure in HTML, presentation in CSS and behaviour in JavaScript. Check pages with the W3C validator and a browser accessibility tool, and test by tabbing through with the keyboard.',code:'<!DOCTYPE html>\n<html lang="en">\n<head>\n  <meta charset="utf-8">\n  <title>Valid page</title>\n</head>\n<body>\n  <main><h1>Clean markup</h1></main>\n</body>\n</html>',qs:[
{t:'mc',q:'Which practice keeps content and style separate?',o:['Put presentation in CSS files','Use font tags everywhere','Use tables for layout','Use br for spacing'],a:0,e:'CSS handles looks; HTML handles meaning.'},
{t:'tf',q:'Valid HTML guarantees the page is accessible.',o:TF,a:1,e:'Validity helps, but accessibility also needs alt text, labels, contrast and keyboard testing.'},
{t:'mc',q:'Find the bug: what breaks the page structure?',code:'<ul>\n  <li>One\n  <li>Two</li>\n  <p>Three</p>\n</ul>',o:['p is placed directly inside ul','li cannot hold text','ul needs id','Nothing'],a:0,e:'Only li elements belong directly in a list.'},
{t:'fill',q:'Complete the value that makes the attribute quoted correctly.',code:'<a href=___https://example.com">Go</a>',a:['"'],e:'Attribute values should be wrapped in matching quotes.'}]},
{t:'Capstone: Contact page',c:'capstone',teach:'Combine everything: a head with metadata, semantic landmarks, a heading outline, an image with alt, and an accessible form with labels and validation. Read the page below, then complete and fix pieces of it.',code:'<!DOCTYPE html>\n<html lang="en">\n<head><meta charset="utf-8"><title>Contact Us</title></head>\n<body>\n<header><h1>Contact</h1></header>\n<main>\n <form action="/send" method="post">\n  <label for="m">Email</label>\n  <input id="m" name="email" type="email" required>\n  <button>Send</button>\n </form>\n</main>\n</body>\n</html>',qs:[
{t:'mc',q:'What happens if the user submits this form with the email field empty?',code:'<input id="m" name="email" type="email" required>',o:['The browser blocks it and shows a message','It sends an empty value','The page reloads silently','The label turns red'],a:0,e:'required stops empty submission.'},
{t:'fill',q:'Complete the landmark that wraps the primary content.',code:'<body>\n  <___>\n    <h1>Contact</h1>\n  </main>\n</body>',a:['main'],e:'The closing tag is </main>.'},
{t:'mc',q:'Find the bug: the Send button does not submit data under the right key.',code:'<label for="m">Email</label>\n<input id="m" type="email" required>',o:['The input has no name attribute','The label is wrong','Email cannot be required','Missing action'],a:0,e:'Without name the value is not included in submission.'},
{t:'order',q:'Order the head contents sensibly.',items:['<meta charset="utf-8">','<meta name="viewport" content="width=device-width, initial-scale=1">','<title>Contact Us</title>','<link rel="stylesheet" href="s.css">'],e:'Charset first, then viewport, title, and stylesheet links.'},
