U('cs',{t:'Unit 2 · Object-Oriented Programming',l:[
{t:'Classes and Objects',c:'classes',teach:'class defines a type with fields and methods. Use new to create an instance. Fields hold data, methods do work. public allows access from outside, private restricts to within the class. Constructors run when an object is created; a class can have multiple constructors with different parameters. this refers to the current instance.',code:'class Person {\n  public string Name { get; set; }\n  public int Age { get; set; }\n  public string Greet() {\n    return $"Hi, I am {Name}";\n  }\n}\nvar p = new Person { Name = "Ada", Age = 25 };\nConsole.WriteLine(p.Greet());',qs:[
{t:'mc',q:'What does new Person() do?',o:['Creates a type','Creates an instance of Person','Calls a static method','Declares a variable'],a:1,e:'new constructs an instance of the class.'},
{t:'mc',q:'What is the purpose of a constructor?',o:['Defining the class','Initializing an instance when it is created','Declaring a field','Saving memory'],a:1,e:'Constructors run when an object is created, setting up initial state.'},
{t:'fill',q:'Complete the access modifier for a method visible outside the class.',code:'___ void Display() { }',a:['public'],e:'public allows calls from other classes; private limits access to within.'},
{t:'tf',q:'A class can have more than one constructor with different parameters.',o:TF,a:0,e:'Constructor overloading is allowed; the compiler picks based on argument types.'},
{t:'match',q:'Match each member to its type.',pairs:[['Name','property/field'],['Greet()','method'],['this','reference to instance'],['public','access modifier']],e:'Classes combine data (fields/properties) and behavior (methods).'}
]},
{t:'Inheritance and Polymorphism',c:'inherit',teach:'Inheritance lets a class extend another using : base. class Dog : Animal extends Animal. virtual on a base method allows derived classes to override it with override. Polymorphism means derived classes can replace base behavior. base calls the parent implementation. An instance of a derived class can be treated as an instance of the base class.',code:'class Animal {\n  public virtual string Speak() {\n    return "Some sound";\n  }\n}\nclass Dog : Animal {\n  public override string Speak() {\n    return "Woof";\n  }\n}\nvar d = new Dog();\nConsole.WriteLine(d.Speak());',qs:[
{t:'mc',q:'What does virtual allow?',o:['Creating instances','Overriding in derived classes','Making methods static','Optional feature'],a:1,e:'virtual marks a method as replaceable by derived classes.'},
{t:'mc',q:'What does : Animal mean in class Dog : Animal?',o:['Dog contains an Animal','Dog inherits from Animal','Creates a static method','Syntax error'],a:1,e:'The colon means inheritance; Dog gets all members from Animal.'},
{t:'fill',q:'Complete the keyword to replace a base method.',code:'class Dog : Animal {\n  ___ string Speak() { return "Woof"; }\n}',a:['override'],e:'override replaces a virtual method from the base class.'},
{t:'mc',q:'What does base.Speak() call?',o:['The current class method','The parent class method','A static method','Error'],a:1,e:'base accesses the parent class implementation.'},
{t:'order',q:'Put in order to set up a derived class.',items:['class Animal { public virtual void Sound() { } }','class Cat : Animal { }','public override void Sound() { Console.Write("Meow"); }'],e:'Define the base with virtual, derive, then override the method.'}
]},
{t:'Interfaces and Abstraction',c:'interfaces',teach:'interface defines a contract: methods and properties that implementations must provide. class implements Interface using : IInterface. abstract class defines common functionality and abstract methods that derived classes must implement. Interfaces promote loose coupling; depend on abstractions, not concrete types.',code:'interface IAnimal {\n  string Name { get; set; }\n  void Make Sound();\n}\nclass Cat : IAnimal {\n  public string Name { get; set; }\n  public void MakeSound() {\n    Console.WriteLine("Meow");\n  }\n}',qs:[
{t:'mc',q:'What does interface define?',o:['A concrete implementation','A contract of methods/properties','A static class','An inheritance hierarchy'],a:1,e:'Interfaces specify what methods and properties a class must have.'},
{t:'mc',q:'What does class Dog : IAnimal mean?',o:['Dog inherits from IAnimal','Dog implements the interface IAnimal','Dog contains IAnimal','Error'],a:1,e:'Implementing an interface means providing all its members.'},
{t:'fill',q:'Complete the interface definition.',code:'___ IDrawable {\n  void Draw();\n}',a:['interface'],e:'interface is the keyword for defining a contract.'},
{t:'tf',q:'An interface can contain implementation code.',o:TF,a:1,e:'Interfaces (before C# 8) define only signatures; classes provide the implementation. C# 8+ added default interface implementations.'},
{t:'match',q:'Match each concept to its use.',pairs:[['interface','define a contract'],['implements','class provides interface methods'],['abstract','base class with abstract methods'],['virtual','method can be overridden']],e:'These enable flexible, maintainable object-oriented design.'}
]},
{t:'Properties and Encapsulation',c:'props',teach:'Properties use get and set to control field access. public string Name { get; set; } creates an auto-property. Properties with logic: get { return _name; } set { _name = value; }. Backing fields store the data, often private. Encapsulation hides details and protects data integrity.',code:'class Rectangle {\n  private double _width;\n  public double Width {\n    get { return _width; }\n    set { _width = value > 0 ? value : 1; }\n  }\n}\nvar r = new Rectangle();\nr.Width = 5;',qs:[
{t:'mc',q:'What is an auto-property?',o:['A method that runs automatically','A property with automatic get and set','A constructor','A static member'],a:1,e:'Auto-properties like public string Name { get; set; } are shorthand for simple properties.'},
{t:'mc',q:'Why use private backing fields?',o:['Required by law','Protects data; validation happens in set','Only stylistic','Prevents inheritance'],a:1,e:'Backing fields let you add logic in getters and setters without exposing raw data.'},
{t:'fill',q:'Complete the property with a getter only.',code:'public int Age { ___ { return _age; } }',a:['get'],e:'get is the accessor for reading; set is for writing.'},
{t:'mc',q:'What does set { value = value; } do when called as prop = 5?',o:['Stores 5 in the property','Assigns 5 to value','Returns 5','Error'],a:0,e:'The value keyword holds what is being assigned; set stores it (here redundantly).'},
{t:'order',q:'Put in order to create a read-only property.',items:['private string _name;','public string Name { get { return _name; } }','this.Name cannot be changed after creation'],e:'Create a backing field, expose via get-only property, then it is read-only.'}
]},
{t:'Static Members',c:'static',teach:'static fields and methods belong to the type, not instances. Math.Sqrt is static; you call it on the class, not an object. Static fields are shared by all instances. static constructors run once when the type loads. Use static for utility methods and shared data.',code:'class Logger {\n  public static int Count { get; set; }\n  public static void Log(string msg) {\n    Count++;\n    Console.WriteLine(msg);\n  }\n}\nLogger.Log("Hello");\nConsole.WriteLine(Logger.Count);',qs:[
{t:'mc',q:'What does static mean?',o:['Unchanged','Belongs to the type, not an instance','Must be initialized','Visible everywhere'],a:1,e:'Static members are called on the class itself, not on instances.'},
{t:'mc',q:'How many instances share a static field?',o:['None; static is not shared','All instances share the same static field','One instance at a time','Only one copy exists in the class'],a:1,e:'Static fields exist once for the entire class; all instances see the same value.'},
{t:'fill',q:'Complete the call to a static method.',code:'int max = ___.Max(3, 5);',a:['Math'],e:'Math is a class with static methods like Max, Sqrt, and Abs.'},
{t:'tf',q:'You need an instance to call a static method.',o:TF,a:1,e:'Static methods and fields are called on the class name, not on instances.'},
{t:'match',q:'Match each static use to its example.',pairs:[['Math.Sqrt','built-in static method'],['Logger.Log()','user-defined static method'],['Logger.Count','static field'],['static class','all members static']],e:'Static enables utility classes and shared data across instances.'}
]},
{t:'Checkpoint: OOP',c:'check2',teach:'Review: Classes define types with fields and methods. Inheritance and virtual/override enable polymorphism. Interfaces define contracts. Properties use get/set for encapsulation. Static members belong to the type, not instances. These enable organized, reusable, and maintainable code.',code:'abstract class Shape {\n  public abstract double Area();\n}\nclass Circle : Shape {\n  public double Radius { get; set; }\n  public override double Area() {\n    return 3.14159 * Radius * Radius;\n  }\n}',qs:[
{t:'mc',q:'What does abstract Shape mean?',o:['Cannot be instantiated directly','Defines methods to override','Is an interface','Is static'],a:0,e:'abstract classes cannot be instantiated; derived classes must provide implementations for abstract members.'},
{t:'mc',q:'When is a property better than a public field?',o:['Never','When you need to add validation or logic','For performance','Stylistic only'],a:1,e:'Properties allow control; you can add validation without changing the API.'},
{t:'fill',q:'Complete the derived class that implements an abstract method.',code:'class Square : Shape {\n  ___ double Area() { return Side * Side; }\n}',a:['override','public override'],e:'override replaces the abstract method; public allows external calls.'},
{t:'tf',q:'An interface and an abstract class serve exactly the same purpose.',o:TF,a:1,e:'Interfaces define contracts; abstract classes share implementation. Abstract is for "is-a"; interface is for "can-do".'},
{t:'order',q:'Put in order to use polymorphism.',items:['List<Shape> shapes = new();','shapes.Add(new Circle());','shapes.Add(new Square());','foreach (var s in shapes) Console.WriteLine(s.Area());'],e:'Create a collection of the base type, add derived instances, then iterate.'}
]}
]});

U('cs',{t:'Unit 3 · LINQ and Collections',l:[
{t:'Collections: List and Array',c:'collections',teach:'List<T> is a dynamic collection that grows and shrinks. new List<int> { 1, 2, 3 } creates and initializes. Array<T> is fixed size: new int[] { 1, 2, 3 }. Both support indexing list[0] and iteration. Methods: Add(item), Remove(item), Contains(item), Count property.',code:'var nums = new List<int> { 1, 2, 3 };\nnums.Add(4);\nConsole.WriteLine(nums[0]);\nConsole.WriteLine(nums.Count);\nforeach (var n in nums) {\n  Console.WriteLine(n);\n}',qs:[
{t:'mc',q:'What is the difference between List<T> and T[]?',o:['List is slower','List grows dynamically; array is fixed size','Array is dynamic','Same thing'],a:1,e:'List is resizable; array size is fixed at creation.'},
{t:'mc',q:'What does nums.Add(5) do?',o:['Returns the new count','Appends 5 to the list','Replaces the first element','Does nothing'],a:1,e:'Add appends an element to a List.'},
{t:'fill',q:'Complete the method to check if a list contains a value.',code:'if (nums.___(10)) { }',a:['Contains'],e:'Contains returns true if the value is in the list.'},
{t:'tf',q:'A List can only hold one type of object.',o:TF,a:0,e:'List<T> is generic and strictly typed to T, so List<int> holds only ints.'},
{t:'match',q:'Match each collection to its property.',pairs:[['List<T>','dynamic size'],['T[]','fixed size'],['Count','number of elements'],['foreach','iterate members']],e:'Collections store multiple values with different characteristics.'}
]},
{t:'LINQ Query Syntax',c:'linq_query',teach:'LINQ (Language Integrated Query) provides SQL-like syntax for filtering and transforming data. from x in nums select x * 2 is equivalent to nums.Select(x => x * 2). where filters, orderby sorts, select transforms, group by groups. Queries are lazy; they execute when evaluated.',code:'var nums = new List<int> { 1, 2, 3, 4, 5 };\nvar evens = from x in nums\n            where x % 2 == 0\n            select x * 10;\nforeach (var e in evens) Console.WriteLine(e);',qs:[
{t:'mc',q:'What does where in a LINQ query do?',o:['Selects columns','Filters rows based on a condition','Sorts results','Groups data'],a:1,e:'where is the filter; it keeps only items matching the condition.'},
{t:'mc',q:'What does select do in from x in list select x * 2?',o:['Filters the list','Transforms each element','Counts elements','Sorts by size'],a:1,e:'select defines what to do with each element; here, double it.'},
{t:'fill',q:'Complete the where clause to keep numbers less than 5.',code:'from x in nums\nwhere x ___ 5\nselect x',a:['<'],e:'The condition filters which elements are included.'},
{t:'mc',q:'When does a LINQ query execute?',o:['Immediately when defined','When you iterate the results','Never','During compilation'],a:1,e:'LINQ queries are deferred; evaluation happens when results are used.'},
{t:'order',q:'Put in order to filter and transform.',items:['var nums = new[] { 1, 2, 3, 4 };','from x in nums','where x > 1','select x * 2'],e:'Create the source, then write query: from, where, select.'}
]},
{t:'LINQ Method Syntax',c:'linq_method',teach:'Method syntax is functional and often shorter: nums.Where(x => x > 2).Select(x => x * 2). Methods chain: filter, then transform, then sort. Any(predicate) returns true if any element matches. First() and FirstOrDefault() get the first element or null. ToList() and ToArray() materialize the query.',code:'var nums = new[] { 1, 2, 3, 4, 5 };\nvar result = nums\n  .Where(x => x > 2)\n  .Select(x => x * 2)\n  .OrderBy(x => x);\nforeach (var r in result) Console.WriteLine(r);',qs:[
{t:'mc',q:'What does nums.Where(x => x % 2 == 0) return?',o:['True or false','A list of even numbers','A count','null'],a:1,e:'Where returns a filtered sequence.'},
{t:'mc',q:'What does nums.Any(x => x > 10) return?',o:['The first element over 10','Count of elements over 10','true if any element is over 10, else false','All elements over 10'],a:2,e:'Any returns a bool: true if the condition is met for any element.'},
{t:'fill',q:'Complete the call to get the first element.',code:'var first = nums.___ ();',a:['First','First()'],e:'First() returns the first element or throws if the sequence is empty.'},
{t:'mc',q:'What does .ToList() do at the end of a query?',o:['Nothing; queries are already lists','Converts the result to a List<T> for storage','Returns null','Sorts the result'],a:1,e:'ToList materializes a LINQ query into an actual List in memory.'},
{t:'match',q:'Match each LINQ method to its effect.',pairs:[['Where','filter by condition'],['Select','transform each element'],['OrderBy','sort ascending'],['Any','true if any match']],e:'Method syntax chains operations for clean data transformations.'}
]},
{t:'Grouping and Aggregation',c:'group_agg',teach:'group by organizes elements by a key. GroupBy returns groups where each has a Key and members. Aggregation: Count() counts, Sum() totals, Average() averages, Max() and Min() find extremes. These work on any collection with foreach iteration.',code:'var people = new List<Person> {\n  new Person { Name = "Alice", Age = 25 },\n  new Person { Name = "Bob", Age = 25 },\n  new Person { Name = "Charlie", Age = 30 }\n};\nvar byAge = from p in people\n            group p by p.Age;\nforeach (var g in byAge) {\n  Console.WriteLine($"Age {g.Key}: {g.Count()} people");\n}',qs:[
{t:'mc',q:'What does group by do?',o:['Sorts the sequence','Organizes elements by a key into groups','Removes duplicates','Counts elements'],a:1,e:'group by creates groups where each group shares a key value.'},
{t:'mc',q:'What is g.Key in foreach (var g in groups)?',o:['The first element of the group','The value all elements in the group share','The count of elements','The type of elements'],a:1,e:'Key is the grouping criterion; all elements in a group have the same key.'},
{t:'fill',q:'Complete the aggregation to sum numbers.',code:'int total = nums.___ ();',a:['Sum'],e:'Sum totals all elements in the sequence.'},
{t:'tf',q:'Average() rounds the result to an integer.',o:TF,a:1,e:'Average() returns a decimal by default; use .ToInt() to convert if needed.'},
{t:'order',q:'Put in order to group by age and count.',items:['from person in people','group person by person.Age','select new { Age = g.Key, Count = g.Count() }'],e:'From source, group by the key, then select the result shape.'}
]},
{t:'Dictionary and Key-Value Pairs',c:'dict',teach:'Dictionary<K, V> maps keys to values. new Dictionary<string, int> { {"a", 1} } creates one. Access with dict["a"] or dict.TryGetValue(key, out value) to check first. Iterate with foreach (var pair in dict) then pair.Key and pair.Value. Add, Remove, ContainsKey are common methods.',code:'var scores = new Dictionary<string, int>\n  { { "Alice", 90 }, { "Bob", 85 } };\nscores.Add("Charlie", 88);\nif (scores.TryGetValue("Alice", out int score)) {\n  Console.WriteLine(score);\n}\nforeach (var kvp in scores) {\n  Console.WriteLine($"{kvp.Key}: {kvp.Value}");\n}',qs:[
{t:'mc',q:'What does Dictionary<string, int> map?',o:['Strings to a list','Strings to integers','Integers to strings','Strings to strings'],a:1,e:'The first type is the key, the second is the value.'},
{t:'mc',q:'What does scores.TryGetValue("Alice", out var v) do?',o:['Throws if key missing','Returns true if found, sets v to the value','Returns the value or null','Adds the key if missing'],a:1,e:'TryGetValue is safer than using [] because [] throws if the key is missing.'},
{t:'fill',q:'Complete the access to a dictionary value.',code:'int val = dict[___];',a:['key'],e:'Use a key (of the Key type) to access the value.'},
{t:'mc',q:'How do you check if a dictionary has a key?',o:['if (dict[key] != null)','if (dict.ContainsKey(key))','if (dict.Keys.Contains(key))','All of these work'],a:1,e:'ContainsKey is the idiomatic way to check before accessing.'},
{t:'match',q:'Match each dictionary method to its purpose.',pairs:[['TryGetValue','safe lookup, returns bool'],['ContainsKey','check if key exists'],['Add','insert key-value pair'],['Remove','delete by key']],e:'Dictionaries provide efficient key-based lookup and manipulation.'}
]},
{t:'Checkpoint: LINQ and Collections',c:'check3',teach:'Review: List<T> is dynamic, arrays are fixed. LINQ Query syntax resembles SQL; method syntax chains. Where filters, Select transforms, grouping aggregates. Dictionaries map keys to values. These enable elegant data processing and storage.',code:'var words = new[] { "apple", "apricot", "banana", "blueberry" };\nvar grouped = from w in words\n              group w by w[0];\nforeach (var g in grouped) {\n  Console.WriteLine($"{g.Key}: {g.Count()}");\n}',qs:[
{t:'mc',q:'What does group w by w[0] do?',o:['Sorts alphabetically','Groups by first character','Groups by length','Removes duplicates'],a:1,e:'w[0] is the first character; grouping by it clusters words starting with the same letter.'},
{t:'mc',q:'Which approach is cleaner for complex queries?',o:['SQL','Method syntax','Query syntax','Both equally'],a:2,e:'Query syntax reads like SQL; method syntax chains. Choose based on readability and team preference.'},
{t:'fill',q:'Complete the call to extract unique values.',code:'var unique = nums.___ ();',a:['Distinct'],e:'Distinct removes duplicates from a sequence.'},
{t:'tf',q:'LINQ works on any IEnumerable<T>, not just List<T>.',o:TF,a:0,e:'LINQ is generic; arrays, lists, dictionaries, and custom collections all work.'},
{t:'order',q:'Put in order to filter, transform, and count.',items:['var nums = new[] { 1, 2, 3, 4, 5 };','nums.Where(x => x > 2)','  .Select(x => x * 2)','  .Count()'],e:'Start with source, filter with Where, transform with Select, then Count.'}
]}
]});

U('cs',{t:'Unit 4 · Async and Error Handling',l:[
{t:'Exception Handling',c:'exceptions',teach:'try-catch-finally handles errors. try { risky code } catch (ExceptionType e) { handle } finally { cleanup }. Each catch can target a specific exception type. catch without a type catches all exceptions. throw raises an exception. finally always runs, even after a return or exception.',code:'try {\n  int n = int.Parse("abc");\n} catch (FormatException e) {\n  Console.WriteLine("Not a number");\n} finally {\n  Console.WriteLine("Done");\n}',qs:[
{t:'mc',q:'What does try-catch-finally do?',o:['Tries to run code; catches errors; always cleans up','Tries three times','Prevents errors','Skips errors'],a:0,e:'try runs code, catch handles exceptions, finally runs regardless for cleanup.'},
{t:'mc',q:'When does finally run?',o:['Only if no exception','Always, even after throw or return','Only if exception caught','Only in try block'],a:1,e:'finally is guaranteed to run, making it ideal for cleanup like closing files.'},
{t:'fill',q:'Complete the catch for a specific exception type.',code:'catch (___ ex) { }',a:['Exception','(Exception ex)'],e:'catch (ExceptionType name) binds the exception to a variable.'},
{t:'mc',q:'What does throw new InvalidOperationException("msg") do?',o:['Returns a value','Raises an exception','Logs a message','Does nothing'],a:1,e:'throw creates and raises an exception, jumping to the nearest catch.'},
{t:'match',q:'Match each clause to its role.',pairs:[['try','code that might fail'],['catch','handle specific exception type'],['finally','guaranteed cleanup'],['throw','raise an exception']],e:'Exception handling makes code robust against errors.'}
]},
{t:'Custom Exceptions and Validation',c:'custom_exc',teach:'Create custom exceptions by extending Exception. Validation throws exceptions when data is invalid. Use ArgumentException for bad arguments, InvalidOperationException for state errors, etc. catch the most specific exceptions first, then more general ones. Logging exceptions helps debugging.',code:'class NegativeNumberException : Exception {\n  public NegativeNumberException(string msg) : base(msg) { }\n}\n\nvoid SetAge(int age) {\n  if (age < 0) {\n    throw new NegativeNumberException("Age cannot be negative");\n  }\n}',qs:[
{t:'mc',q:'Why create custom exceptions?',o:['Required by syntax','Communicates specific error conditions to callers','Speeds up code','Prevents bugs'],a:1,e:'Custom exceptions make error handling precise and semantic.'},
{t:'mc',q:'What does : base(msg) do in a constructor?',o:['Calls the base class constructor','Inherits all members','Creates a new exception','Error'],a:0,e:'base(msg) calls the Exception constructor to set the message.'},
{t:'fill',q:'Complete the throw of an argument exception.',code:'throw new ___Exception("value is null")',a:['Argument'],e:'ArgumentException is thrown for invalid method arguments.'},
{t:'tf',q:'catch (Exception ex) catches all exception types.',o:TF,a:0,e:'Exception is the base class; catch (Exception) catches everything, making it a catch-all.'},
{t:'order',q:'Put in order to validate and throw.',items:['public void Withdraw(int amount) {','if (amount <= 0) {','  throw new ArgumentException("must be positive");','  }','}'],e:'Define method, check validity, throw if invalid, then close.'}
]},
{t:'Async and Await',c:'async_await',teach:'async marks a method that returns a Task or Task<T>. await pauses until a Task completes, then resumes with its result. Never block with .Result or .Wait(); use async all the way. CancellationToken allows canceling long operations. ConfigureAwait(false) avoids context switching.',code:'async Task<string> FetchData(string url) {\n  using (var client = new HttpClient()) {\n    var response = await client.GetAsync(url);\n    return await response.Content.ReadAsStringAsync();\n  }\n}\n\nvar data = await FetchData("https://api.example.com");',qs:[
{t:'mc',q:'What does async do?',o:['Makes the method faster','Enables use of await inside','Returns a Task','Error'],a:1,e:'async indicates the method contains await and returns a Task.'},
{t:'mc',q:'What does await do?',o:['Pauses the method until the Task completes','Waits forever','Throws an exception','Returns immediately'],a:0,e:'await suspends the method until the async operation finishes, then continues.'},
{t:'fill',q:'Complete the method signature for an async function returning a string.',code:'async ___ FetchString() { }',a:['Task<string>'],e:'An async method returning a value has return type Task<T>.'},
{t:'mc',q:'Why not use .Result to block on a Task?',o:['It is faster','It works fine','It can deadlock and hides async intent','It is required'],a:2,e:'Blocking hides the async nature and can deadlock in certain contexts; use await instead.'},
{t:'match',q:'Match each concept to its role.',pairs:[['async','mark method as asynchronous'],['await','pause until Task completes'],['Task<T>','async result of type T'],['ConfigureAwait(false)','avoid context switch']],e:'Async/await enables responsive, scalable applications.'}
]},
{t:'Tasks and Parallelism',c:'tasks',teach:'Task.Run runs code on a thread pool. Task.WhenAll waits for multiple tasks. Task.WhenAny returns when the first completes. Parallel.For runs iterations in parallel. Be careful with shared state; use locks or thread-safe collections. Avoid creating too many tasks; thread pools are limited.',code:'var task1 = Task.Run(() => DoWork(1));\nvar task2 = Task.Run(() => DoWork(2));\nawait Task.WhenAll(task1, task2);\n\nParallel.For(0, 10, i => {\n  Console.WriteLine($"Iteration {i}");\n});',qs:[
{t:'mc',q:'What does Task.Run do?',o:['Runs code immediately','Runs code on a thread pool thread','Creates a variable','Returns nothing'],a:1,e:'Task.Run offloads work to the thread pool for parallel execution.'},
{t:'mc',q:'What does await Task.WhenAll(t1, t2) do?',o:['Runs only t1','Runs t1 and t2 in sequence','Runs t1 and t2 in parallel, then waits for both','Runs whichever finishes first'],a:2,e:'WhenAll starts multiple tasks and waits for all to complete.'},
{t:'fill',q:'Complete the call to wait for any task.',code:'var winner = await Task.___ (task1, task2, task3);',a:['WhenAny'],e:'WhenAny returns as soon as the first task completes.'},
{t:'tf',q:'Parallel.For is faster than a regular for loop for all workloads.',o:TF,a:1,e:'Parallelism has overhead; it is only faster for CPU-bound work on multi-core systems. Lightweight iterations may be slower in parallel.'},
{t:'order',q:'Put in order to run multiple tasks and wait.',items:['var t1 = Task.Run(() => Compute());','var t2 = Task.Run(() => Fetch());','await Task.WhenAll(t1, t2);','var result = t1.Result + t2.Result;'],e:'Start both tasks, await both, then combine results.'}
]},
{t:'Using and Resource Cleanup',c:'using_stmt',teach:'using statement ensures resources are disposed even if an exception occurs. using (var client = new HttpClient()) { } calls Dispose when exiting the block. IDisposable interface defines Dispose() for cleanup. Objects with unmanaged resources should implement IDisposable.',code:'using (var stream = new FileStream("file.txt", FileMode.Read)) {\n  var reader = new StreamReader(stream);\n  string line = reader.ReadLine();\n  Console.WriteLine(line);\n} // Dispose called here',qs:[
{t:'mc',q:'What does using do?',o:['Imports a namespace','Ensures resources are disposed','Creates an instance','Calls a method'],a:1,e:'using guarantees Dispose is called, even if an exception occurs.'},
{t:'mc',q:'What is IDisposable for?',o:['Making objects unique','Defining cleanup logic','Indicating an error','Speeding up code'],a:1,e:'IDisposable provides a Dispose method for releasing resources like files and connections.'},
{t:'fill',q:'Complete the declaration to ensure cleanup.',code:'___ (var f = new File()) { }',a:['using'],e:'using disposes f automatically when the block exits.'},
{t:'mc',q:'When should you implement IDisposable?',o:['Always','When the class has unmanaged resources','Never','Rarely'],a:1,e:'Implement IDisposable if the class holds file handles, database connections, or other resources.'},
{t:'match',q:'Match each construct to its purpose.',pairs:[['using statement','ensure disposal'],['IDisposable','define cleanup method'],['Dispose()','release resources'],['GC.SuppressFinalize()','optimize garbage collection']],e:'Proper resource management prevents leaks and ensures responsiveness.'}
]},
{t:'Capstone: Robust C# Application',c:'capstone',teach:'Combine exception handling, async/await, LINQ, and proper resource management. Build an application that: handles diverse errors with custom exceptions, uses async for I/O, processes collections with LINQ queries, and cleans up resources with using. Think about error recovery, user feedback, concurrency, and data integrity. Use defensive programming: validate input, log errors, and fail gracefully.',code:'class DataProcessor {\n  async Task<List<int>> FetchAndFilterAsync(string url) {\n    try {\n      using (var client = new HttpClient()) {\n        var response = await client.GetAsync(url);\n        if (!response.IsSuccessStatusCode) {\n          throw new HttpRequestException("Failed");\n        }\n        var data = await response.Content.ReadAsStringAsync();\n        var numbers = data.Split(\',\')\n          .Select(int.Parse)\n          .Where(x => x > 0)\n          .ToList();\n        return numbers;\n      }\n    } catch (Exception ex) {\n      Console.WriteLine($"Error: {ex.Message}");\n      return new List<int>();\n    }\n  }\n}',qs:[
{t:'mc',q:'Why use async for network requests?',o:['Required by syntax','Allows other work while waiting','Speeds up the request','Mandatory in C#'],a:1,e:'async prevents blocking the thread, keeping the application responsive.'},
{t:'mc',q:'What does using (var client = ...) provide?',o:['A namespace','Ensures the client is disposed','Creates a new variable','Nothing special'],a:1,e:'using guarantees cleanup of the HttpClient and its resources.'},
{t:'fill',q:'Complete the LINQ to filter positive numbers.',code:'var positives = numbers.___ (x => x > 0)',a:['Where'],e:'Where filters a sequence based on a condition.'},
{t:'tf',q:'Catching all exceptions with catch (Exception) is always a good practice.',o:TF,a:1,e:'Catch specific exceptions. Catching all can hide bugs and make debugging hard.'},
{t:'match',q:'Match each pattern to its benefit.',pairs:[['try-catch-finally','handle and recover'],['async-await','responsive I/O'],['using statement','guaranteed cleanup'],['LINQ filtering','clean data processing']],e:'Together, these patterns create robust, responsive, maintainable applications.'}
]}
]});

C({id:'c',name:'C',badge:'C',lvl:'Intermediate',pre:'Basic programming helps',goal:'Read and write C programs using pointers, arrays, strings, manual memory management, structs and multi-file programs.'});

U('c',{t:'Unit 1 · C Foundations',l:[
{t:'Program Structure',c:'structure',teach:'A C program starts executing at main. #include brings in standard library declarations such as stdio.h for printf. Every statement ends with a semicolon and blocks use curly braces. main returns an int to the operating system, 0 means success.',code:'#include <stdio.h>\n\nint main(void) {\n  printf("Hello, C\\n");\n  return 0;\n}',qs:[
{t:'mc',q:'Where does a C program start running?',o:['The first #include line','The main function','The first printf call','The top of the file'],a:1,e:'Execution begins at main. #include only pulls in declarations before compiling; it is not executed.'},
{t:'fill',q:'Complete the line that brings in printf.',code:'___ <stdio.h>',a:['#include'],e:'#include <stdio.h> gives access to standard input/output functions like printf and scanf.'},
{t:'mc',q:'What does main return to mean success?',o:['1','-1','0','void'],a:2,e:'Returning 0 from main is the standard way to tell the operating system the program succeeded.'},
{t:'mc',q:'Find the bug: why does this fail to compile?',code:'#include <stdio.h>\nint main(void) {\n  printf("Hi\\n")\n  return 0;\n}',o:['printf needs a semicolon after it','main must return void','Strings need single quotes','#include is missing a semicolon'],a:0,e:'Every statement needs a trailing semicolon. #include is a preprocessor directive and never takes one.'}]},
{t:'Variables and Types',c:'types',teach:'C is statically typed: every variable is declared with a type. Common types are int (whole numbers), float and double (decimals, double has more precision), char (one byte, holds a character or small integer), and the modifiers short, long, unsigned. sizeof(type) reports a type\'s size in bytes, which can vary by platform but int is commonly 4.',code:'int age = 30;\ndouble price = 9.99;\nchar grade = \'A\';\nunsigned int count = 5;\nprintf("%zu\\n", sizeof(int));',qs:[
{t:'mc',q:'Which type best stores a single letter?',o:['int','char','double','short'],a:1,e:'char holds one byte, enough for a single character. int or double would be unnecessarily large and wrong semantically.'},
{t:'fill',q:'Declare a variable that can hold a decimal value.',code:'___ price = 9.99;',a:['double','float'],e:'double (or float, with less precision) stores decimal numbers. int would truncate the fraction.'},
{t:'tf',q:'In C, you must declare a type for every variable before using it.',o:TF,a:0,e:'C is statically typed with no type inference by default (unlike C++ auto); every declaration names a type.'},
{t:'mc',q:'What does sizeof(int) typically print on common platforms?',o:['2','4','8','It never compiles'],a:1,e:'int is commonly 4 bytes on modern platforms, though the standard only guarantees it is at least 2.'}]},
{t:'Operators and Casting',c:'ops',teach:'Arithmetic uses + - * / %. Dividing two ints performs integer division and discards the fraction, so 7 / 2 is 3; % gives the remainder. Mixing an int with a double promotes the result to double. Casting like (double)a forces a conversion; (int)3.9 truncates toward zero to 3, it does not round.',code:'int a = 7, b = 2;\nprintf("%d\\n", a / b);\nprintf("%d\\n", a % b);\nprintf("%f\\n", (double)a / b);\nprintf("%d\\n", (int)3.9);',qs:[
{t:'mc',q:'What does this print?',code:'int a = 7, b = 2;\nprintf("%d\\n", a / b);',o:['3.5','3','4','3.0'],a:1,e:'Both operands are int, so this is integer division and the fraction is discarded.'},
{t:'mc',q:'What does this print?',code:'int x = 10;\nx += 5;\nx++;\nprintf("%d\\n", x);',o:['15','16','17','10'],a:1,e:'x becomes 15 after += 5, then 16 after the increment.'},
{t:'fill',q:'Cast a so the division keeps its fraction.',code:'int a = 7, b = 2;\ndouble r = (___) a / b;',a:['double'],e:'Casting a to double before dividing makes it a double division, giving 3.5.'},
{t:'mc',q:'What does (int)3.9 evaluate to?',o:['4','3','3.9','It is undefined'],a:1,e:'Casting a double to int truncates toward zero rather than rounding, so the result is 3.'},
{t:'tf',q:'10 % 3 evaluates to 1.',o:TF,a:0,e:'% gives the remainder: 10 equals 3 times 3 plus 1.'}]},
{t:'Input and Output',c:'io',teach:'printf uses format specifiers to print values: %d for int, %f for float/double, %c for char, %s for a char array (string), %zu for sizeof results. scanf reads input into variables using the same specifiers, and needs the address of the variable with &, except for arrays which already decay to an address.',code:'int age;\nprintf("Enter age: ");\nscanf("%d", &age);\nprintf("You are %d\\n", age);\n\nchar name[20];\nscanf("%s", name);\nprintf("Hi %s\\n", name);',qs:[
{t:'mc',q:'Which format specifier prints an int?',o:['%s','%f','%d','%c'],a:2,e:'%d formats an int in decimal. %f is for floating-point values, %c for a single character, %s for a string.'},
{t:'fill',q:'Complete the scanf call that reads an int into x.',code:'int x;\nscanf("%d", ___x);',a:['&'],e:'scanf needs the address of the variable to write into, so you pass &x for a plain int variable.'},
{t:'mc',q:'Find the bug: why might this crash or misbehave?',code:'int x;\nscanf("%d", x);',o:['%d is the wrong specifier','x should have the & operator: &x','scanf cannot read int','x must be initialized first'],a:1,e:'Without &, scanf receives the value of x (often garbage) instead of its address, and writes to an invalid location.'},
{t:'tf',q:'Reading a string with scanf("%s", name) requires passing &name when name is a char array.',o:TF,a:1,e:'An array name already evaluates to the address of its first element, so no & is needed (and using & would pass the wrong type).'}]},
{t:'Conditionals',c:'cond',teach:'if, else if and else choose between branches based on a condition. Any nonzero value is treated as true and 0 as false. Combine conditions with && (and), || (or), ! (not). switch compares an int or char against case labels; each case needs break or execution falls through into the next case.',code:'int n = 2;\nswitch (n) {\n  case 1:\n    printf("one\\n");\n    break;\n  case 2:\n    printf("two\\n");\n    break;\n  default:\n    printf("many\\n");\n}',qs:[
{t:'mc',q:'What does this print?',code:'int x = 5;\nif (x > 10) printf("A\\n");\nelse if (x > 3) printf("B\\n");\nelse printf("C\\n");',o:['A','B','C','B and C'],a:1,e:'x > 10 is false, x > 3 is true, so B prints and the else is skipped.'},
{t:'mc',q:'What does this print?',code:'int n = 1;\nswitch (n) {\n  case 1: printf("a");\n  case 2: printf("b"); break;\n  case 3: printf("c");\n}',o:['a','ab','abc','b'],a:1,e:'case 1 has no break, so execution falls through into case 2, printing b, then the break stops it.'},
{t:'tf',q:'In C, the condition in an if can be any int, and 0 means false.',o:TF,a:0,e:'C has no dedicated boolean type in classic C; any nonzero value is treated as true and 0 as false.'},
{t:'fill',q:'Complete the logical AND.',code:'if (age >= 18 ___ hasId) { }',a:['&&'],e:'&& requires both conditions to be true. || would need only one.'},
{t:'mc',q:'Find the bug: what is wrong here?',code:'int score = 80;\nif (score > 50 && < 90) {\n  printf("ok\\n");\n}',o:['Nothing, it compiles','Each side of && needs a full condition: score < 90','&& should be &','score must be unsigned'],a:1,e:'C does not allow chained comparisons; you must repeat the variable: score > 50 && score < 90.'}]},
{t:'Checkpoint: Foundations',c:'check1',teach:'Review: main as the entry point, static types with sizeof, integer division and casts, printf/scanf format specifiers with &, and conditionals with && and switch fall-through. Remember that integer division truncates and scanf needs an address.',code:'int a = 9;\nint b = 2;\nif (a / b == 4 && a % b == 1) {\n  printf("yes\\n");\n}',qs:[
{t:'mc',q:'What does this print?',code:'int a = 9, b = 2;\nif (a / b == 4 && a % b == 1) {\n  printf("yes\\n");\n} else {\n  printf("no\\n");\n}',o:['yes','no','4','Compile error'],a:0,e:'9 / 2 is 4 with integer division and 9 % 2 is 1, so both conditions hold.'},
{t:'match',q:'Match the C construct to its role.',pairs:[['main','program entry point'],['scanf','read input into a variable'],['(int)','cast that truncates'],['%','remainder']],e:'Each construct has one job covered in this unit: entry point, input, narrowing cast, remainder.'},
{t:'mc',q:'Which declaration compiles cleanly as written?',o:['int x = 3.5;','double x = 3;','char x = "A";','int x = ;'],a:1,e:'An int widens to double automatically with no cast needed. The others need a char literal with single quotes, a cast, or a value.'},
{t:'fill',q:'Complete the switch label that handles everything else.',code:'switch (n) {\n  case 1: printf("one"); break;\n  ___: printf("other");\n}',a:['default'],e:'default matches any value not covered by a case label.'},
{t:'order',q:'Put the lines in order.',items:['int n = 4;','n *= 3;','printf("%d\\n", n);'],e:'Declare, update, then print. The output would be 12.'}]}
]});

U('c',{t:'Unit 2 · Control Flow and Functions',l:[
{t:'Loops',c:'loops',teach:'for loops repeat with an init, condition, and update: for (int i = 0; i < n; i++). while checks the condition before each iteration; do-while checks after, so its body always runs at least once. break exits a loop early, continue skips to the next iteration.',code:'for (int i = 0; i < 3; i++) printf("%d", i);\nprintf("\\n");\n\nint j = 0;\nwhile (j < 3) { printf("%d", j); j++; }\nprintf("\\n");\n\nint k = 0;\ndo { printf("%d", k); k++; } while (k < 3);\nprintf("\\n");',qs:[
{t:'mc',q:'What does this print?',code:'for (int i = 0; i < 3; i++) printf("%d", i);',o:['123','012','0123','1 2 3'],a:1,e:'i starts at 0 and runs while i < 3, printing 0, 1, 2.'},
{t:'mc',q:'How many times does the body of this loop run?',code:'int k = 5;\ndo { printf("x"); k++; } while (k < 3);',o:['0','1','3','Infinite'],a:1,e:'do-while checks the condition after running the body once, so it always executes at least once even though 5 < 3 is false.'},
{t:'fill',q:'Complete the for loop header that counts from 0 up to and including 4.',code:'for (int i = 0; i ___ 5; i++) { }',a:['<'],e:'i < 5 stops after i reaches 4, the last value before 5, giving 0 through 4.'},
{t:'mc',q:'Find the bug: why does this loop never stop?',code:'int i = 0;\nwhile (i < 5) {\n  printf("%d", i);\n}',o:['The condition is wrong','i is never incremented inside the loop','while needs a semicolon','printf is missing arguments'],a:1,e:'Without i++ inside the loop, i stays 0 forever and the condition i < 5 is always true.'}]},
{t:'Functions',c:'functions',teach:'A function has a return type, a name, parameters, and a body. void means it returns nothing. Arguments in C are passed by value: the function gets a copy, so changing a plain parameter inside the function does not affect the caller\'s variable. A function must be declared (prototyped) before it is used if its definition comes later in the file.',code:'int square(int n) {\n  return n * n;\n}\n\nvoid greet(void) {\n  printf("hi\\n");\n}\n\nint main(void) {\n  printf("%d\\n", square(5));\n  greet();\n  return 0;\n}',qs:[
{t:'mc',q:'What does this print?',code:'void inc(int n) { n = n + 1; }\nint main(void) {\n  int x = 5;\n  inc(x);\n  printf("%d\\n", x);\n  return 0;\n}',o:['5','6','0','Compile error'],a:0,e:'C passes arguments by value, so inc receives a copy of x. Changing the copy does not change the caller\'s x.'},
{t:'fill',q:'Complete the function signature for a function returning nothing.',code:'___ printHello(void) {\n  printf("hello\\n");\n}',a:['void'],e:'void is the return type used when a function does not return a value.'},
{t:'mc',q:'Find the bug: why does this fail to compile as written at the top of the file?',code:'int main(void) {\n  printf("%d\\n", square(4));\n  return 0;\n}\n\nint square(int n) {\n  return n * n;\n}',o:['square is used before it is declared or defined','main must come last','square needs a void parameter','printf cannot take square(4)'],a:0,e:'Without a prototype or earlier definition, the compiler has not seen square yet when main calls it, so it either errors or warns depending on settings.'},
{t:'order',q:'Put the lines in order to define and call a function that doubles a number.',items:['int doubleIt(int n) {','  return n * 2;','}','printf("%d\\n", doubleIt(4));'],e:'Define the function with its braces, then call it afterward (or declare it earlier).'}]},
{t:'Arrays',c:'arrays',teach:'An array holds a fixed number of elements of the same type, indexed from 0. int arr[5] declares an array of 5 ints. C performs no automatic bounds checking, so reading or writing arr[5] or beyond is undefined behavior and a common source of bugs. Arrays are commonly traversed with a for loop using their known length.',code:'int arr[5] = {10, 20, 30, 40, 50};\nfor (int i = 0; i < 5; i++) {\n  printf("%d ", arr[i]);\n}\nprintf("\\n");\nint total = 0;\nfor (int i = 0; i < 5; i++) total += arr[i];\nprintf("%d\\n", total);',qs:[
{t:'mc',q:'What does this print?',code:'int arr[3] = {1, 2, 3};\nprintf("%d\\n", arr[1]);',o:['1','2','3','Compile error'],a:1,e:'Indexing starts at 0, so arr[1] is the second element, 2.'},
{t:'tf',q:'C automatically prevents you from reading past the end of an array.',o:TF,a:1,e:'C performs no bounds checking. Reading arr[10] on a 5-element array compiles and runs, but the result is undefined behavior.'},
{t:'fill',q:'Complete the sum loop.',code:'int total = 0;\nfor (int i = 0; i < 5; i___) total += arr[i];',a:['++'],e:'i++ advances the index by one each iteration so every element gets visited.'},
{t:'mc',q:'What does this print?',code:'int arr[5] = {10, 20, 30, 40, 50};\nint total = 0;\nfor (int i = 0; i < 5; i++) total += arr[i];\nprintf("%d\\n", total);',o:['50','150','100','5'],a:1,e:'10+20+30+40+50 equals 150.'}]},
{t:'Strings',c:'strings',teach:'C has no built-in string type; a string is a char array ending with a null terminator \\0. "Hello" occupies 6 bytes: 5 characters plus the null terminator. string.h provides strlen (length without the terminator), strcpy, strcat, and strcmp (0 means equal). Comparing with == compares addresses, not contents, so never use == to compare string contents.',code:'#include <string.h>\nchar s[] = "Hello";\nprintf("%zu\\n", strlen(s));\nprintf("%c\\n", s[1]);\n\nchar a[10] = "Cat";\nstrcat(a, "Dog");\nprintf("%s\\n", a);',qs:[
{t:'mc',q:'What does strlen("Hello") return?',o:['4','5','6','It depends on the compiler'],a:1,e:'strlen counts visible characters, not the null terminator, so "Hello" has length 5.'},
{t:'mc',q:'Find the bug: how should these strings be compared for equal content?',code:'char a[] = "cat";\nchar b[] = "cat";\nif (a == b) printf("equal\\n");',o:['Nothing is wrong','Use strcmp(a, b) == 0 instead of ==','Strings need single quotes','a and b must be pointers'],a:1,e:'== compares the array addresses, which differ even with identical content. strcmp compares the characters and returns 0 when equal.'},
{t:'fill',q:'Complete the call that returns the string length.',code:'char s[] = "abc";\nint n = ___(s);',a:['strlen'],e:'strlen(s) walks the characters until it finds the null terminator and returns the count.'},
{t:'tf',q:'Every C string must end with a null terminator character, \\0.',o:TF,a:0,e:'The null terminator marks the end of the string; functions like strlen and printf %s rely on it to know where to stop.'}]},
{t:'Scope and Storage',c:'scope',teach:'A variable declared inside a block (between { }) is local and only visible there; it is destroyed when the block ends. A variable declared outside any function is global and visible to the whole file. static inside a function makes a local variable keep its value between calls instead of resetting each time.',code:'int counter(void) {\n  static int count = 0;\n  count++;\n  return count;\n}\n\nint main(void) {\n  printf("%d\\n", counter());\n  printf("%d\\n", counter());\n  return 0;\n}',qs:[
{t:'mc',q:'What does this print?',code:'int counter(void) {\n  static int count = 0;\n  count++;\n  return count;\n}\nint main(void) {\n  printf("%d\\n", counter());\n  printf("%d\\n", counter());\n  return 0;\n}',o:['1 1','1 2','0 1','2 2'],a:1,e:'static makes count persist between calls instead of resetting to 0 each time, so it increments to 1 then 2.'},
{t:'tf',q:'A variable declared inside a function body is accessible from other functions in the file.',o:TF,a:1,e:'Local variables are scoped to the block where they are declared; other functions cannot see them unless passed in or made global.'},
{t:'fill',q:'Complete the keyword that makes a local variable keep its value across calls.',code:'___ int count = 0;',a:['static'],e:'static gives a local variable storage that lasts for the whole program, while keeping it scoped to the function.'},
{t:'mc',q:'Find the bug: why does count always print 1?',code:'int counter(void) {\n  int count = 0;\n  count++;\n  return count;\n}',o:['count is not static, so it resets to 0 every call','count should be global','The return statement is wrong','printf needs %s'],a:0,e:'Without static, count is a fresh local variable each call, initialized to 0 and incremented to 1 every time.'}]},
{t:'Checkpoint: Control Flow and Functions',c:'check2',teach:'Review: for/while/do-while loops, pass-by-value functions, array indexing from 0 with no bounds checking, char-array strings ending in a null terminator compared with strcmp, and static for persistent local state.',code:'int addOne(int n) { return n + 1; }\nint main(void) {\n  int arr[3] = {1, 2, 3};\n  int x = addOne(arr[1]);\n  printf("%d\\n", x);\n  return 0;\n}',qs:[
{t:'mc',q:'What does this print?',code:'int addOne(int n) { return n + 1; }\nint main(void) {\n  int arr[3] = {1, 2, 3};\n  int x = addOne(arr[1]);\n  printf("%d\\n", x);\n  return 0;\n}',o:['1','2','3','4'],a:2,e:'arr[1] is 2, and addOne returns 2 + 1 = 3.'},
{t:'match',q:'Match the construct to what it does.',pairs:[['do-while','runs the body at least once'],['strcmp','compares string contents'],['static','keeps a local value between calls'],['strlen','counts characters before the null terminator']],e:'Each tool in this unit has a distinct job: guaranteed first run, content comparison, persistence, and length.'},
{t:'tf',q:'Passing an int to a function and modifying the parameter inside changes the caller\'s variable.',o:TF,a:1,e:'C passes by value for plain variables, so the function only modifies its own copy.'},
{t:'fill',q:'Complete the loop condition that stops after 4 iterations (i from 0 to 3).',code:'for (int i = 0; i ___ 4; i++) { }',a:['<'],e:'i < 4 allows i to be 0, 1, 2, 3, which is exactly 4 iterations.'},
{t:'order',q:'Put the lines in order to sum an array.',items:['int total = 0;','for (int i = 0; i < 3; i++) {','  total += arr[i];','}'],e:'Initialize the accumulator, then loop over the array adding each element.'}]}
]});

U('c',{t:'Unit 3 · Pointers and Memory',l:[
{t:'Pointer Basics',c:'ptrbasics',teach:'A pointer stores the memory address of a variable. & gets the address of a variable, and * on a pointer dereferences it to access or change the value it points to. int *p = &x; declares p as a pointer to int, initialized to the address of x. An uninitialized or NULL pointer must not be dereferenced.',code:'int x = 5;\nint *p = &x;\nprintf("%d\\n", x);\nprintf("%d\\n", *p);\n*p = 10;\nprintf("%d\\n", x);',qs:[
{t:'mc',q:'What does & do when applied to a variable?',o:['Dereferences it','Gets its memory address','Doubles its value','Deletes it'],a:1,e:'& is the address-of operator, producing a pointer to the variable.'},
{t:'mc',q:'What does this print?',code:'int x = 5;\nint *p = &x;\n*p = 10;\nprintf("%d\\n", x);',o:['5','10','0','Compile error'],a:1,e:'Dereferencing p with *p = 10 writes through the pointer into x itself, so x becomes 10.'},
{t:'fill',q:'Declare a pointer to an int and point it at x.',code:'int x = 5;\nint ___p = &x;',a:['*'],e:'The * in the declaration marks p as a pointer to int; writing &x assigns it the address of x.'},
{t:'tf',q:'Dereferencing a NULL pointer is safe and simply returns 0.',o:TF,a:1,e:'Dereferencing NULL is undefined behavior and typically crashes the program; it does not safely return 0.'}]},
{t:'Pointers and Arrays',c:'ptrarrays',teach:'An array name, when used in most expressions, decays to a pointer to its first element. So arr and &arr[0] are equivalent as addresses. Pointer arithmetic moves by the size of the pointed-to type: p + 1 moves to the next element, not the next byte. *(p + i) is equivalent to p[i].',code:'int nums[3] = {1, 2, 3};\nint *p = nums;\nprintf("%d\\n", *p);\nprintf("%d\\n", *(p + 1));\np++;\nprintf("%d\\n", *p);',qs:[
{t:'mc',q:'What does this print?',code:'int nums[3] = {1, 2, 3};\nint *p = nums;\nprintf("%d\\n", *(p + 1));',o:['1','2','3','The address of nums[1]'],a:1,e:'p points at nums[0]; p + 1 points at nums[1], whose value is 2.'},
{t:'mc',q:'What does this print?',code:'int nums[3] = {1, 2, 3};\nint *p = nums;\np++;\nprintf("%d\\n", *p);',o:['1','2','3','Compile error'],a:1,e:'p starts at nums[0]; incrementing p moves it to nums[1], whose value is 2.'},
{t:'fill',q:'Complete the expression equivalent to p[i].',code:'int value = *(p ___ i);',a:['+'],e:'*(p + i) and p[i] are equivalent ways to access the i-th element through a pointer.'},
{t:'tf',q:'p + 1 on an int pointer moves forward by exactly one byte.',o:TF,a:1,e:'Pointer arithmetic scales by the size of the pointed-to type, so p + 1 moves forward by sizeof(int) bytes, not one byte.'}]},
{t:'Pointers and Functions',c:'ptrfuncs',teach:'Since C passes arguments by value, a function that needs to modify a caller\'s variable must receive a pointer to it. The caller passes &x, and the function declares the parameter as a pointer and writes through it with *param = value. This is how scanf("%d", &age) is able to fill in age.',code:'void incRef(int *n) {\n  *n = *n + 1;\n}\n\nint main(void) {\n  int x = 5;\n  incRef(&x);\n  printf("%d\\n", x);\n  return 0;\n}',qs:[
{t:'mc',q:'What does this print?',code:'void incRef(int *n) {\n  *n = *n + 1;\n}\nint main(void) {\n  int x = 5;\n  incRef(&x);\n  printf("%d\\n", x);\n  return 0;\n}',o:['5','6','0','Compile error'],a:1,e:'incRef receives the address of x and writes through the pointer, so the change is visible in main; x becomes 6.'},
{t:'fill',q:'Complete the call that lets inc modify x.',code:'void inc(int *n) { *n += 1; }\nint x = 5;\ninc(___x);',a:['&'],e:'Passing &x gives inc the address of x so it can modify the original variable, not just a copy.'},
{t:'mc',q:'Find the bug: why does x stay 5?',code:'void inc(int n) { n = n + 1; }\nint main(void) {\n  int x = 5;\n  inc(x);\n  printf("%d\\n", x);\n  return 0;\n}',o:['inc takes n by value, so it only changes a local copy','printf has the wrong specifier','x must be declared static','inc should return void'],a:0,e:'Without a pointer parameter, inc only receives a copy of x; modifying n never touches the original variable.'},
{t:'tf',q:'scanf("%d", &age) passes a pointer so scanf can write the input value into age.',o:TF,a:0,e:'scanf needs the address of age to write the parsed value there; without &, it could not modify the caller\'s variable.'}]},
{t:'Dynamic Memory',c:'malloc',teach:'malloc(n) allocates n bytes on the heap and returns a void* (often cast to the target pointer type), or NULL if allocation fails. Memory allocated with malloc stays reserved until explicitly released with free; forgetting to free it causes a memory leak. Using memory after freeing it (a dangling pointer) is undefined behavior.',code:'int *arr = malloc(3 * sizeof(int));\nif (arr != NULL) {\n  arr[0] = 1;\n  arr[1] = 2;\n  arr[2] = 3;\n  printf("%d\\n", arr[2]);\n  free(arr);\n}',qs:[
{t:'mc',q:'What must you do after you are finished with malloc\'d memory?',o:['Nothing, C cleans it up automatically','Call free on the pointer','Set the pointer to 0','Call delete on the pointer'],a:1,e:'Unlike languages with garbage collection, C requires an explicit free call to release heap memory, or it leaks.'},
{t:'tf',q:'Using a pointer after calling free on it is always safe as long as you do not call free twice.',o:TF,a:1,e:'Using a pointer after freeing it (a dangling pointer) is undefined behavior; the memory may already be reused.'},
{t:'fill',q:'Complete the call that allocates space for 3 ints.',code:'int *arr = ___(3 * sizeof(int));',a:['malloc'],e:'malloc(size) reserves that many bytes on the heap and returns a pointer to it.'},
{t:'mc',q:'Find the bug: what is wrong with this function?',code:'int *makeArray(void) {\n  int *arr = malloc(10 * sizeof(int));\n  arr[0] = 1;\n  return arr;\n}\nint main(void) {\n  int *a = makeArray();\n  printf("%d\\n", a[0]);\n  return 0;\n}',o:['Nothing; this is correct, and the caller should eventually free(a)','arr should not be a pointer','malloc cannot be used inside a function','a[0] should be arr[0] in main'],a:0,e:'This pattern is correct: heap memory outlives the function that allocated it. The caller is responsible for eventually calling free(a).'}]},
{t:'Structs',c:'structs',teach:'A struct groups related fields of possibly different types under one name. Access fields with the dot operator on a struct variable, or the arrow operator -> on a pointer to a struct (p->x means (*p).x). typedef struct {...} Name; lets you use Name directly as a type without writing struct each time. Structs are commonly passed to functions by pointer to avoid copying and to allow modification.',code:'typedef struct {\n  char name[20];\n  int age;\n} Person;\n\nPerson p1 = {"Ana", 30};\nprintf("%s %d\\n", p1.name, p1.age);\n\nPerson *ptr = &p1;\nptr->age = 31;\nprintf("%d\\n", p1.age);',qs:[
{t:'mc',q:'What does this print?',code:'typedef struct {\n  char name[20];\n  int age;\n} Person;\nPerson p1 = {"Ana", 30};\nprintf("%s %d\\n", p1.name, p1.age);',o:['Ana 30','30 Ana','Person 30','Compile error'],a:0,e:'The initializer fills name with "Ana" and age with 30, and printf prints them in that order.'},
{t:'fill',q:'Complete the field access through a pointer.',code:'Person *ptr = &p1;\nint years = ptr___age;',a:['->'],e:'The arrow operator accesses a field through a pointer to a struct; p->age is shorthand for (*p).age.'},
{t:'tf',q:'typedef struct {...} Person; lets you declare variables as just Person x; instead of struct Person x;.',o:TF,a:0,e:'typedef creates an alias for the anonymous struct type, so Person can be used directly as a type name.'},
{t:'order',q:'Put the lines in order to define and use a simple struct.',items:['typedef struct {','  int x;','  int y;','} Point;','Point p = {1, 2};'],e:'Define the struct with its fields inside the braces, name it with typedef, then create a variable with an initializer.'}]},
{t:'Checkpoint: Pointers and Memory',c:'check3',teach:'Review: & and * for addresses and dereferencing, array-pointer equivalence and pointer arithmetic, pass-by-pointer to let functions modify caller variables, malloc/free for heap memory, and structs with dot access.',code:'typedef struct { int x; } Box;\nvoid setX(Box *b, int v) { b->x = v; }\nint main(void) {\n  Box b = {0};\n  setX(&b, 7);\n  printf("%d\\n", b.x);\n  return 0;\n}',qs:[
{t:'mc',q:'What does this print?',code:'typedef struct { int x; } Box;\nvoid setX(Box *b, int v) { b->x = v; }\nint main(void) {\n  Box b = {0};\n  setX(&b, 7);\n  printf("%d\\n", b.x);\n  return 0;\n}',o:['0','7','Compile error','Undefined behavior'],a:1,e:'setX receives a pointer to b and writes 7 through it using ->, so b.x becomes 7 back in main.'},
{t:'match',q:'Match the operator or function to its role.',pairs:[['&','get the address of a variable'],['*','dereference a pointer'],['malloc','allocate heap memory'],['free','release heap memory']],e:'Each tool in this unit has one job: addressing, dereferencing, allocation, and release.'},
{t:'tf',q:'If p points at the first element of an int array, p + 1 points at the second element.',o:TF,a:0,e:'Pointer arithmetic on an int pointer advances by sizeof(int), landing exactly on the next element.'},
{t:'fill',q:'Complete the call that frees previously allocated memory.',code:'int *arr = malloc(10 * sizeof(int));\n___(arr);',a:['free'],e:'free releases heap memory back to the system so it can be reused.'},
{t:'mc',q:'Find the bug: why is this risky?',code:'int *p;\nprintf("%d\\n", *p);',o:['p is never initialized before being dereferenced','printf is missing a newline','*p should be p','int pointers cannot be printed'],a:0,e:'p holds an indeterminate address since it was never assigned, so dereferencing it is undefined behavior.'}]}

U('c',{t:'Unit 4 · Files, Tooling and Real Programs',l:[
{t:'File I/O',c:'files',teach:'fopen(path, mode) opens a file and returns a FILE*, or NULL on failure; always check for NULL before use. "w" opens for writing (creating or truncating), "r" for reading, "a" for appending. fprintf and fscanf work like printf/scanf but write to or read from a file. fclose releases the file when done.',code:'FILE *f = fopen("out.txt", "w");\nif (f != NULL) {\n  fprintf(f, "%d\\n", 42);\n  fclose(f);\n}\n\nFILE *f2 = fopen("out.txt", "r");\nint n;\nfscanf(f2, "%d", &n);\nprintf("%d\\n", n);\nfclose(f2);',qs:[
{t:'mc',q:'What does fopen return if the file cannot be opened?',o:['An empty string','0','NULL','It throws an error'],a:2,e:'fopen returns NULL on failure; C has no exceptions, so you must check the return value yourself.'},
{t:'fill',q:'Complete the mode string that opens a file for writing.',code:'FILE *f = fopen("out.txt", "___");',a:['w'],e:'"w" opens for writing, creating the file if needed or truncating it if it exists. "r" is for reading.'},
{t:'mc',q:'Find the bug: what is missing from this code?',code:'FILE *f = fopen("data.txt", "r");\nint n;\nfscanf(f, "%d", &n);\nprintf("%d\\n", n);',o:['The file is never closed with fclose','fscanf needs no &','printf needs %s','fopen mode should be "w"'],a:0,e:'The file handle should be released with fclose(f) when done to free resources, especially in longer programs.'},
{t:'tf',q:'You should always check that the pointer returned by fopen is not NULL before using it.',o:TF,a:0,e:'fopen can fail (missing file, no permission); using a NULL FILE* leads to undefined behavior, so checking first is essential.'}]},
{t:'The Preprocessor',c:'preprocessor',teach:'The preprocessor runs before compilation. #define NAME value creates a text substitution macro. #define SQUARE(x) ((x) * (x)) creates a function-like macro; parentheses around parameters and the whole expression avoid surprises with operator precedence. #ifndef / #define / #endif header guards prevent a header\'s contents from being included twice in one translation unit.',code:'#define SQUARE(x) ((x) * (x))\nprintf("%d\\n", SQUARE(5));\n\n#ifndef MYHEADER_H\n#define MYHEADER_H\n// declarations go here\n#endif',qs:[
{t:'mc',q:'What does this print?',code:'#define SQUARE(x) ((x) * (x))\nprintf("%d\\n", SQUARE(5));',o:['10','25','5','Compile error'],a:1,e:'SQUARE(5) expands to ((5) * (5)), which is 25.'},
{t:'mc',q:'Find the bug: why can this macro misbehave?',code:'#define SQUARE(x) x * x\nint r = SQUARE(1 + 2);',o:['Nothing, r is 9','Without parentheses it expands to 1 + 2 * 1 + 2, giving 5','SQUARE must be lowercase','Macros cannot take arguments'],a:1,e:'Text substitution with no parentheses expands to 1 + 2 * 1 + 2, which due to operator precedence is 5, not 9. Wrapping x and the whole expression in parentheses fixes it.'},
{t:'fill',q:'Complete the header guard opening.',code:'___ MYHEADER_H\n#define MYHEADER_H',a:['#ifndef'],e:'#ifndef checks whether MYHEADER_H is not yet defined, so the header\'s contents are only included once.'},
{t:'tf',q:'The preprocessor runs after the compiler checks your code for type errors.',o:TF,a:1,e:'The preprocessor runs first, doing textual substitution and inclusion before the compiler ever analyzes types.'}]},
{t:'Multi-file Programs',c:'multifile',teach:'Larger C programs split declarations into a header file (.h) and definitions into a source file (.c). Other files #include the header to see function prototypes and struct definitions without seeing the implementation. extern declares that a variable is defined in another file. This lets you compile files separately and link them together.',code:'// math_utils.h\nint add(int a, int b);\n\n// math_utils.c\n#include "math_utils.h"\nint add(int a, int b) { return a + b; }\n\n// main.c\n#include <stdio.h>\n#include "math_utils.h"\nint main(void) {\n  printf("%d\\n", add(2, 3));\n  return 0;\n}',qs:[
{t:'mc',q:'What typically goes inside a header file (.h)?',o:['Full function bodies only','Function prototypes and struct/type declarations','Only variable values','Compiled machine code'],a:1,e:'Headers declare the interface (prototypes, types) so other files know what is available without seeing the implementation.'},
{t:'fill',q:'Complete the include that pulls in a local header file.',code:'___ "math_utils.h"',a:['#include'],e:'#include with quotes looks for the header in the current project directory, as opposed to angle brackets for system headers.'},
{t:'tf',q:'Angle brackets, like #include <stdio.h>, and quotes, like #include "math_utils.h", search for headers in exactly the same way.',o:TF,a:1,e:'Angle brackets typically search system include paths first; quotes typically search the local project directory first, then fall back to system paths.'},
{t:'mc',q:'Find the bug: why might this cause a linker error about add being defined twice?',code:'// math_utils.h\nint add(int a, int b) { return a + b; }',o:['Nothing is wrong','The header has a full function body, so every file that includes it gets its own definition','add should return void','Headers cannot define functions'],a:1,e:'Putting a full function body in a header means every .c file that includes it compiles its own copy, and linking them together causes duplicate-symbol errors. Headers should normally hold only the prototype.'}]},
{t:'Function Pointers',c:'fnptr',teach:'A function pointer stores the address of a function and can be called through that pointer, which is useful for passing behavior around, such as a comparator to qsort. int (*op)(int, int) declares op as a pointer to a function taking two ints and returning int. Assign a function name (without calling it) to set it, then call op(args) like a normal function.',code:'int add(int a, int b) { return a + b; }\nint sub(int a, int b) { return a - b; }\n\nint (*op)(int, int) = add;\nprintf("%d\\n", op(3, 4));\nop = sub;\nprintf("%d\\n", op(3, 4));',qs:[
{t:'mc',q:'What does this print?',code:'int add(int a, int b) { return a + b; }\nint sub(int a, int b) { return a - b; }\nint (*op)(int, int) = add;\nprintf("%d\\n", op(3, 4));\nop = sub;\nprintf("%d\\n", op(3, 4));',o:['7 then 7','7 then -1','-1 then 7','Compile error'],a:1,e:'op first points at add, giving 3+4=7, then is reassigned to sub, giving 3-4=-1.'},
{t:'fill',q:'Complete the declaration of a function pointer taking two ints and returning int.',code:'int (___op)(int, int) = add;',a:['*'],e:'The * inside the parentheses marks op as a pointer to a function with that signature, distinguishing it from a function declaration.'},
{t:'tf',q:'Assigning a function to a function pointer requires writing the function name followed by parentheses, like op = add();.',o:TF,a:1,e:'Writing add() would call it immediately. To assign the function itself (its address) you write just the name: op = add;.'},
{t:'mc',q:'What is a common real use of function pointers in C?',o:['Declaring global constants','Passing custom behavior, like a comparator, into another function','Replacing all loops','Avoiding the need for structs'],a:1,e:'Function pointers let code like qsort accept a custom comparison function, enabling different behavior without rewriting the caller.'}]},
{t:'Common Bugs and Debugging',c:'debugging',teach:'Frequent C bugs: forgetting to initialize a variable before reading it, off-by-one errors in loop bounds, writing past the end of an array (buffer overflow), using a pointer after freeing it (dangling pointer), and forgetting & when calling scanf. Compiling with warnings enabled (like -Wall) and tools like valgrind catch many of these before they cause hard-to-find crashes.',code:'int arr[5];\nfor (int i = 0; i <= 5; i++) {\n  arr[i] = i; // bug: writes one past the end when i == 5\n}',qs:[
{t:'mc',q:'Find the bug: what is wrong with this loop?',code:'int arr[5];\nfor (int i = 0; i <= 5; i++) {\n  arr[i] = i;\n}',o:['Nothing is wrong','<= 5 allows i to reach 5, writing one past the last valid index, 4','arr should be arr[6]','i should start at 1'],a:1,e:'Valid indexes for a 5-element array are 0 through 4. <= 5 lets i reach 5, writing out of bounds, which is undefined behavior.'},
{t:'tf',q:'Reading an uninitialized local variable in C gives you a predictable value like 0.',o:TF,a:1,e:'An uninitialized local variable holds whatever garbage was already in that memory; the value is indeterminate, not reliably 0.'},
{t:'fill',q:'Complete the gcc flag that enables a broad set of useful warnings.',code:'gcc program.c -___ -o program',a:['Wall'],e:'-Wall turns on a broad set of useful compiler warnings that catch many common mistakes, like unused variables or mismatched types.'},
{t:'mc',q:'What is a dangling pointer?',o:['A pointer that was never initialized','A pointer that still refers to memory that has already been freed','A pointer to a global variable','A pointer declared with const'],a:1,e:'Using a pointer after its memory has been freed accesses memory that may already have been reused, leading to undefined behavior.'}]},
{t:'Capstone: Student Grade Tracker',c:'capstone',teach:'This capstone pulls together structs, arrays, pointers, loops and functions to track student grades. Read the program, then answer questions about what it prints, how to complete a missing piece, and how to fix a bug. Pay attention to how the array of structs is passed to functions by pointer so the data can be read and updated.',code:'typedef struct {\n  char name[20];\n  int score;\n} Student;\n\nint average(Student *list, int n) {\n  int total = 0;\n  for (int i = 0; i < n; i++) {\n    total += list[i].score;\n  }\n  return total / n;\n}\n\nvoid curve(Student *list, int n, int amount) {\n  for (int i = 0; i < n; i++) {\n    list[i].score += amount;\n  }\n}\n\nint main(void) {\n  Student students[3] = {{"Ana", 80}, {"Bo", 70}, {"Cy", 90}};\n  printf("%d\\n", average(students, 3));\n  curve(students, 3, 5);\n  printf("%d\\n", students[1].score);\n  return 0;\n}',qs:[
{t:'mc',q:'What does this program print?',code:'typedef struct { char name[20]; int score; } Student;\nint average(Student *list, int n) {\n  int total = 0;\n  for (int i = 0; i < n; i++) total += list[i].score;\n  return total / n;\n}\nvoid curve(Student *list, int n, int amount) {\n  for (int i = 0; i < n; i++) list[i].score += amount;\n}\nint main(void) {\n  Student students[3] = {{"Ana", 80}, {"Bo", 70}, {"Cy", 90}};\n  printf("%d\\n", average(students, 3));\n  curve(students, 3, 5);\n  printf("%d\\n", students[1].score);\n  return 0;\n}',o:['80 then 70','80 then 75','90 then 75','80 then 90'],a:1,e:'average is (80+70+90)/3 = 80 with integer division. curve adds 5 to every score, so Bo\'s score becomes 70+5=75.'},
{t:'fill',q:'Complete the parameter type so curve can modify the caller\'s array in place.',code:'void curve(Student ___list, int n, int amount) {\n  for (int i = 0; i < n; i++) list[i].score += amount;\n}',a:['*'],e:'A pointer parameter (which an array argument naturally decays into) lets curve write directly into the caller\'s array elements.'},
{t:'mc',q:'Find the bug: why does this version of average always print 0 for scores under 100?',code:'int average(Student *list, int n) {\n  int total = 0;\n  for (int i = 0; i < n; i++) total += list[i].score;\n  return total / n / 100;\n}',o:['Nothing is wrong','Dividing by an extra 100 shrinks a small integer average to 0 due to integer division','list should not be a pointer','n should start at 1'],a:1,e:'If total / n is under 100, dividing again by 100 with integer division truncates it to 0. The extra / 100 should not be there.'},
{t:'order',q:'Put the lines in order to add a new student to the array and print the new average.',items:['students[3].name[0] = \'D\';','students[3].score = 85;','int n = 4;','printf("%d\\n", average(students, n));'],e:'Set the new student\'s fields, update the count used for the average, then call average with the new count (the array itself must already have room for 4 elements).'},
{t:'tf',q:'Passing students (an array) to average gives the function a pointer to the first element, not a copy of the whole array.',o:TF,a:0,e:'Arrays decay to a pointer to their first element when passed to a function, so average operates on the original data, not a copy.'}]}
]});

{t:'Compiling and output',c:'hello',teach:'A C++ program needs a main function that returns int; the OS treats 0 as success. #include <iostream> gives access to cout, which sends values to the screen with <<. Every statement ends with a semicolon. A compiler (g++) turns source into an executable before it runs.',code:'#include <iostream>\nusing namespace std;\nint main() {\n    cout << "Hello, world" << endl;\n    return 0;\n}',qs:[
{t:'mc',q:'What does this program print?',code:'cout << "Hi" << endl;',o:['Hi','"Hi"','Hi\\n\\n','endl'],a:0,e:'cout sends the text Hi to the screen; endl just adds a newline and is not printed as text.'},
{t:'mc',q:'Which header declares cout?',o:['<iostream>','<string>','<vector>','<cstdio>'],a:0,e:'iostream provides the standard input/output streams cin and cout.'},
{t:'fill',q:'Complete the missing token so this line compiles.',code:'cout << "Hi"___',a:[';'],e:'Every C++ statement must end with a semicolon.'},
{t:'mc',q:'Find the bug: this file fails to compile.',code:'int main() {\n    cout << "Hi";\n    return 0\n}',o:['return 0 is missing a semicolon','main must return void','cout needs quotes around Hi','endl is required'],a:0,e:'return 0 needs a trailing semicolon like every statement.'},
{t:'order',q:'Put the lines in order to form a valid program.',items:['#include <iostream>','int main() {','    std::cout << "Go";','    return 0;','}'],e:'Includes come first, then main is opened, its body runs, and the brace closes it.'}]},
{t:'Variables and fundamental types',c:'vars',teach:'C++ is statically typed: you declare a type before a name, such as int, double, char, bool or std::string. auto lets the compiler infer the type from the initializer. Unlike dynamic languages, a variable keeps its declared type forever. Pitfall: declaring a variable without initializing it leaves it with garbage, unpredictable contents.',code:'int age = 30;\ndouble price = 9.99;\nchar grade = \'A\';\nbool ok = true;\nauto name = std::string("Ana");',qs:[
{t:'mc',q:'What type is inferred for x here?',code:'auto x = 3.5;',o:['double','int','float','string'],a:0,e:'A literal with a decimal point like 3.5 is a double by default.'},
{t:'mc',q:'What does this print?',code:'int x = 5;\nx = x + 2;\nstd::cout << x;',o:['7','5','52','x + 2'],a:0,e:'x is reassigned to 5 + 2, which is 7.'},
{t:'tf',q:'A variable declared with int can later be assigned a std::string value.',o:TF,a:1,e:'C++ is statically typed: an int variable can only ever hold int-compatible values.'},
{t:'fill',q:'Fill in the keyword so the compiler infers the type.',code:'___ total = 100;',a:['auto'],e:'auto deduces the type from the right-hand side, here int.'},
{t:'match',q:'Match each literal to its natural type.',pairs:[['42','int'],['3.14','double'],["'Z'",'char'],['true','bool']],e:'Single quotes make a char; a decimal point makes a double by default.'}]},
{t:'Operators and expressions',c:'ops',teach:'Arithmetic uses + - * / %. Integer / truncates toward zero and % gives the remainder; mixing an int with a double promotes the result to double. Comparison operators (== != < > <= >=) and logical operators (&& || !) produce bool. Pitfall: 7 / 2 is 3, not 3.5, because both operands are int.',code:'std::cout << 7 / 2 << "\\n";\nstd::cout << 7.0 / 2 << "\\n";\nstd::cout << 7 % 2 << "\\n";\nstd::cout << (3 > 2 && 1 < 0);',qs:[
{t:'mc',q:'What does this print?',code:'std::cout << 7 / 2;',o:['3','3.5','4','1'],a:0,e:'Both operands are int, so the division truncates to 3.'},
{t:'mc',q:'What does this print?',code:'std::cout << 7.0 / 2;',o:['3.5','3','4','3.0'],a:0,e:'Mixing a double with an int promotes the division to floating point, giving 3.5.'},
{t:'fill',q:'Fill in the operator that gives the remainder of a division.',code:'std::cout << 10 ___ 3;',a:['%'],e:'% is the modulo operator; 10 % 3 is 1.'},
{t:'mc',q:'What does this print?',code:'bool b = (5 > 3) && (2 == 2);\nstd::cout << b;',o:['1','true','0','false'],a:0,e:'cout prints bool values as 1 or 0 by default, and this expression is true.'},
{t:'tf',q:'In C++, the expression 9 / 2 evaluates to 4.5.',o:TF,a:1,e:'Integer division truncates, so 9 / 2 is 4.'}]},
{t:'Conditionals',c:'cond',teach:'if, else if and else choose which block runs based on a bool condition. Conditions must be in parentheses and blocks in braces (braces can be omitted for a single statement, but it is easy to introduce bugs that way). switch compares one value against several constant cases and needs break to avoid falling through. Pitfall: using = instead of == inside a condition assigns instead of comparing.',code:'int n = 7;\nif (n % 2 == 0) {\n    std::cout << "even";\n} else {\n    std::cout << "odd";\n}',qs:[
{t:'mc',q:'What does this print?',code:'int n = 10;\nif (n > 5) {\n    std::cout << "big";\n} else {\n    std::cout << "small";\n}',o:['big','small','nothing','error'],a:0,e:'10 > 5 is true, so the if branch runs.'},
{t:'mc',q:'Find the bug: this always takes the if branch, even when x is 3.',code:'int x = 3;\nif (x = 5) {\n    std::cout << "five";\n}',o:['= assigns instead of comparing; it should be ==','x must be declared const','if cannot take an integer','5 needs to be in quotes'],a:0,e:'x = 5 assigns 5 to x and the expression evaluates to 5, which is truthy, so the branch always runs.'},
{t:'fill',q:'Fill in the comparison operator for equality.',code:'if (n ___ 0) { std::cout << "zero"; }',a:['=='],e:'== compares values; = would assign.'},
{t:'mc',q:'What does this print?',code:'int n = 2;\nswitch (n) {\n    case 1: std::cout << "one"; break;\n    case 2: std::cout << "two"; break;\n    default: std::cout << "other";\n}',o:['two','one','other','twoother'],a:0,e:'n matches case 2, and break stops it from falling into default.'},
{t:'tf',q:'Omitting break in a switch case lets execution fall through into the next case.',o:TF,a:0,e:'Without break, control continues into the following case regardless of its label.'}]},
{t:'Loops',c:'loops',teach:'for(init; condition; update) repeats while condition is true, running update after each iteration; it suits a known number of steps. while(condition) checks first and may run zero times. do...while checks after the body, so it always runs at least once. Pitfall: forgetting to update the loop variable causes an infinite loop.',code:'for (int i = 0; i < 3; i++) {\n    std::cout << i;\n}\nint n = 0;\nwhile (n < 2) {\n    std::cout << "w";\n    n++;\n}',qs:[

U('cpp',{t:'Unit 2 · Functions and Data',l:[
{t:'Functions',c:'funcs',teach:'A function declares a return type, a name and typed parameters: returnType name(params) { ... }. void means it returns nothing. C++ allows overloading: several functions with the same name but different parameter types, and the compiler picks the right one. Pitfall: forgetting return in a non-void function is undefined and often a compile warning or error.',code:'int square(int n) {\n    return n * n;\n}\ndouble square(double n) {\n    return n * n;\n}\nstd::cout << square(3) << " " << square(2.5);',qs:[
{t:'mc',q:'What does this print?',code:'int square(int n) { return n * n; }\nstd::cout << square(4);',o:['16','8','4','Error'],a:0,e:'square(4) returns 4 * 4, which is 16.'},
{t:'mc',q:'What is it called when two functions share a name but take different parameter types?',o:['Overloading','Overriding','Recursion','Shadowing'],a:0,e:'Overloading lets the same name resolve to different functions based on argument types.'},
