{t:'mc',q:'Which change most improves accessibility for a logo image?',code:'<img src="logo.png">',o:['Add alt="Acme Co logo"','Add id="logo"','Wrap in span','Add width only'],a:0,e:'Informative images need descriptive alt text.'}]}
]});

C({id:'css',name:'CSS',badge:'CS',lvl:'Beginner',pre:'HTML basics',goal:'Style web pages with selectors, the cascade and box model, build layouts with flexbox and grid, and make them responsive with variables, transitions and animations.'});

U('css',{t:'Unit 1 · Selectors and Styling Basics',l:[
{t:'Rules and Linking',c:'rules',teach:'A CSS rule has a selector and a declaration block in braces. Each declaration is a property, a colon, a value and a semicolon. Link an external stylesheet from the HTML head with a link element; a style element or an inline style attribute also work, but a separate file is best. Comments look like /* this */. A missing semicolon breaks the declaration after it.',code:'p {\n  color: navy;\n  font-size: 18px;\n}\n/* in the HTML head */\n<link rel="stylesheet" href="style.css">',qs:[
{t:'mc',q:'In the rule h1 { color: red; }, what is color?',o:['The selector','The property','The value','The declaration block'],a:1,e:'color is the property name. h1 is the selector, red is the value, and everything inside the braces is the declaration block.'},
{t:'mc',q:'Which HTML element links an external stylesheet?',o:['<style src="a.css">','<link rel="stylesheet" href="a.css">','<script href="a.css">','<css file="a.css">'],a:1,e:'The link element with rel="stylesheet" goes in the head. A style element holds CSS text directly instead of pointing to a file.'},
{t:'fill',q:'Complete the declaration.',code:'p { color___ blue; }',a:[':'],e:'A property and its value are separated by a colon.'},
{t:'mc',q:'Find the bug: the font size is ignored. Why?',code:'p {\n  color: blue\n  font-size: 16px;\n}',o:['font-size needs quotes','The first declaration is missing its semicolon','p cannot take color','Braces must be on one line'],a:1,e:'Without the semicolon the browser reads "blue font-size: 16px" as one broken value. End every declaration with a semicolon.'},
{t:'tf',q:'CSS comments are written with // like in JavaScript.',o:TF,a:1,e:'CSS comments use /* ... */. Double slashes are not comments in CSS.'}]},
{t:'Selectors',c:'selectors',teach:'A selector chooses which elements a rule styles. A type selector names a tag (p), a class selector starts with a dot (.note) and an id selector starts with a hash (#main). Separate selectors with commas to share one rule. Classes can be reused on many elements, while an id should appear only once per page. Attribute selectors such as a[target="_blank"] match by attribute.',code:'p { color: black; }\n.note { color: gray; }\n#main { width: 600px; }\nh1, h2 { margin: 0; }\na[target="_blank"] { color: red; }',qs:[
{t:'mc',q:'Which selector styles elements with class="card"?',o:['card','#card','.card','*card'],a:2,e:'A dot means class. card alone would look for a card tag and # is for ids.'},
{t:'fill',q:'Select the element with id="hero".',code:'___ { color: red; }',a:['#hero'],e:'An id selector is a hash followed by the id name.'},
{t:'mc',q:'What does h1, h2 { margin: 0; } select?',o:['Only h2 inside h1','Both h1 and h2 elements','Elements with both tags at once','Nothing'],a:1,e:'A comma separates independent selectors that share the same declarations.'},
{t:'tf',q:'The same id should be reused on many elements in one page.',o:TF,a:1,e:'ids must be unique. Use a class when several elements share styling.'},
{t:'mc',q:'Find the bug: the element class="card" gets no style. Why?',code:'card {\n  padding: 10px;\n}',o:['padding needs a unit like em','card selects a card tag; a class needs .card','card must be uppercase','Classes need quotes'],a:1,e:'Without the dot this is a type selector for a non-existent card element.'},
{t:'match',q:'Match each selector to what it targets.',pairs:[['p','every paragraph'],['.intro','elements with class intro'],['#top','the element with id top'],['*','every element']],e:'A bare name is a tag, a dot is a class, a hash is an id and an asterisk is the universal selector.'}]},
{t:'Colors, Units and Backgrounds',c:'colors',teach:'Colors can be names (navy), hex (#1e90ff or short #fff), rgb(30 144 255) or hsl(). Hex needs 3 or 6 digits, or 4 or 8 with alpha. Lengths use px (fixed), % (relative to the parent), em (relative to the element font size) and rem (relative to the root font size). Use background-color for fills and background-image: url() for pictures.',code:'h1 {\n  color: #1e90ff;\n  background-color: rgb(240 240 240);\n  padding: 1rem;\n  width: 50%;\n  font-size: 2em;\n}\n.hero { background-image: url("hero.jpg"); }',qs:[
{t:'mc',q:'Which color is #ff0000?',o:['Blue','Red','Green','Black'],a:1,e:'Hex is red, green, blue pairs. ff for red with 00 for the others gives pure red.'},
{t:'mc',q:'What is a rem relative to?',o:['The parent font size','The font size of the root html element','The viewport width','The element width'],a:1,e:'rem stands for root em. Unlike em, it does not compound through nested elements.'},
{t:'fill',q:'Complete the property that sets a fill color.',code:'.box { background-___: yellow; }',a:['color'],e:'background-color paints the background of the box.'},
{t:'tf',q:'#fff is a valid short form of white.',o:TF,a:0,e:'Each short hex digit is doubled, so #fff means #ffffff.'},
{t:'mc',q:'Find the bug: why is this color ignored?',code:'p { color: #12345; }',o:['Hex colors need quotes','Five hex digits is not a valid length','color needs a unit','Hex cannot contain numbers'],a:1,e:'Valid lengths are 3, 4, 6 or 8 digits. Five digits makes the declaration invalid so the browser drops it.'},
{t:'match',q:'Match each unit to what it is relative to.',pairs:[['px','fixed pixels'],['%','the parent size'],['em','this element font size'],['rem','the root font size']],e:'px is absolute while the other three scale with something else.'}]},
{t:'Text and Fonts',c:'text',teach:'font-family takes a list: the browser uses the first available font, so end with a generic family like sans-serif. Quote names that contain spaces. font-size, font-weight and font-style change the glyphs. line-height sets line spacing, and a unitless number such as 1.5 means 1.5 times the font size. text-align aligns lines, and text-decoration or text-transform change underlines and capitalisation.',code:'body {\n  font-family: "Helvetica Neue", Arial, sans-serif;\n  font-size: 16px;\n  line-height: 1.5;\n}\nh1 {\n  text-align: center;\n  text-transform: uppercase;\n}\na { text-decoration: none; }',qs:[
{t:'mc',q:'Which declaration centers text inside its box?',o:['font-align: center;','text-align: center;','align-text: middle;','text: center;'],a:1,e:'text-align is the property for horizontal alignment of lines.'},
{t:'mc',q:'Why list several fonts in font-family?',o:['The browser mixes them together','Later ones are fallbacks if earlier ones are unavailable','Each applies to a different letter','It is required syntax'],a:1,e:'The browser walks the list and uses the first font it has. A generic family at the end guarantees a sensible result.'},
{t:'fill',q:'Remove the underline from links.',code:'a { text-decoration: ___; }',a:['none'],e:'text-decoration: none removes underlines.'},
{t:'mc',q:'What does line-height: 1.5 mean?',o:['1.5 pixels','1.5 times the font size','150 percent of the page','1.5 characters'],a:1,e:'A unitless line-height multiplies the element font size, and it scales well with inheritance.'},
{t:'mc',q:'Find the bug: the text does not center. Why?',code:'h1 { text-align: middle; }',o:['middle is not a valid value; use center','h1 cannot be aligned','text-align needs a px value','It needs !important'],a:0,e:'The valid keywords are left, right, center and justify. An invalid value is ignored.'}]},
{t:'Combinators and Pseudo-classes',c:'combinators',teach:'Combinators relate elements: a space is a descendant (nav a), > is a direct child (ul > li), + is the next sibling (h2 + p). A pseudo-class selects a state or position and uses one colon: :hover, :focus, :first-child, :nth-child(2). A pseudo-element creates or targets a part of an element and uses two colons: ::before and ::after, which show nothing unless content is set.',code:'nav a { color: white; }\nul > li { margin: 0; }\nh2 + p { font-weight: bold; }\na:hover { color: red; }\nli:first-child { font-weight: bold; }\n.tag::before { content: "#"; }',qs:[
{t:'mc',q:'What does ul > li select?',o:['Any li anywhere inside ul','li elements that are direct children of ul','ul elements inside li','The first li only'],a:1,e:'The > combinator matches direct children only. A space would match every descendant li, including nested ones.'},
{t:'mc',q:'What does h2 + p select?',o:['Every p after an h2','The p immediately following an h2','A p inside an h2','Both h2 and p'],a:1,e:'+ matches the next sibling only, not every later paragraph.'},
{t:'fill',q:'Style a link when the pointer is over it.',code:'a:___ { color: red; }',a:['hover'],e:'The :hover pseudo-class applies while the pointer is over the element.'},
{t:'mc',q:'Find the bug: no # appears before the tag. Why?',code:'.tag::before {\n  color: red;\n}',o:['::before needs a third colon','The content property is missing, so nothing is generated','.tag must be #tag','color cannot style a pseudo-element'],a:1,e:'A ::before or ::after box is created only when content is set, for example content: "#".'},
{t:'tf',q:'nav a selects only anchors that are direct children of nav.',o:TF,a:1,e:'A space is the descendant combinator, so it matches anchors at any depth inside nav. Use nav > a for direct children.'},
{t:'match',q:'Match each selector part to its meaning.',pairs:[[':hover','pointer is over it'],[':first-child','first among its siblings'],['::after','generated content after'],[':focus','has keyboard focus']],e:'Single-colon pseudo-classes describe state or position while the double colon creates a pseudo-element.'}]},
{t:'Checkpoint: Selectors and Styling',c:'check1',teach:'Review: a rule is selector plus declarations ending in semicolons; classes use a dot and ids a hash; hex colors have 3 or 6 digits; rem follows the root size; combinators describe relationships and pseudo-classes describe state.',code:'h1, h2 { text-align: center; }\n.card > p { color: #444; }\na:hover { color: crimson; }',qs:[
{t:'mc',q:'What does .card > p select?',o:['Every p on the page','p elements that are direct children of .card','Elements with class p','Cards inside paragraphs'],a:1,e:'The > means direct child, so only paragraphs placed straight inside .card match.'},
{t:'match',q:'Match each piece of syntax to its meaning.',pairs:[['.x','class selector'],['#x','id selector'],['a:hover','state selector'],['h1, h2','grouped selectors']],e:'These four forms cover the selectors you will write most.'},
{t:'fill',q:'Make headings bold.',code:'h1 { font-___: bold; }',a:['weight'],e:'font-weight controls boldness.'},
{t:'mc',q:'Find the bug: the font size does not apply.',code:'.note {\n  color: red;\n  font-size 14px;\n}',o:['The colon after font-size is missing','red needs quotes','.note must be #note','14px must be 14'],a:0,e:'Each declaration needs property, colon, value. Without the colon the browser ignores it.'},
{t:'mc',q:'Which is a valid hex color?',o:['#0af','#0a','#0afg','0af'],a:0,e:'#0af has three valid digits. #0a is too short, g is not a hex digit and 0af lacks the hash.'}]}
]});

U('css',{t:'Unit 2 · The Cascade and the Box Model',l:[
{t:'Specificity and the Cascade',c:'cascade',teach:'When rules conflict, the browser decides in this order: importance (!important), then specificity, then source order. Specificity ranks inline style highest, then ids, then classes, attributes and pseudo-classes, then type selectors. If specificity ties, the later rule wins. Avoid !important and long selectors, since they make later overrides hard.',code:'p { color: black; }\n.note { color: gray; }\np.note { color: blue; }\n#intro { color: green; }\n/* <p id="intro" class="note">\n   ends up green */',qs:[
{t:'mc',q:'A paragraph has id="intro" and class="note". Which color wins?',code:'.note { color: gray; }\n#intro { color: green; }',o:['gray, it is listed first','green, because an id is more specific than a class','Whichever the browser likes','Neither; they cancel out'],a:1,e:'An id selector outranks a class selector regardless of the order they are written.'},
{t:'mc',q:'What color is the paragraph text?',code:'p { color: red; }\np { color: blue; }',o:['red','blue','purple','black'],a:1,e:'Both rules have equal specificity, so the later one wins.'},
{t:'mc',q:'Which selector is more specific?',o:['p','.a','They are equal','Neither applies'],a:1,e:'A class outranks a type selector.'},
{t:'fill',q:'Complete the flag that overrides normal specificity.',code:'p { color: red ___; }',a:['!important'],e:'!important wins over normal declarations, but it should be a last resort.'},
{t:'tf',q:'A rule that appears later in the file always beats an earlier rule, whatever the selectors are.',o:TF,a:1,e:'Order only breaks ties. A more specific selector wins even when it comes first.'},
{t:'mc',q:'Find the bug: links stay blue even though a later rule says red. Why?',code:'.menu a { color: blue; }\na { color: red; }',o:['Later rules are ignored','.menu a is more specific than a, so it wins','red is not a valid color','a cannot be styled twice'],a:1,e:'A class plus a type beats a lone type selector. Make the second selector at least as specific, or change the first.'}]},
{t:'Inheritance',c:'inherit',teach:'Some properties pass from parent to child by default: color, font-family, font-size, line-height and text-align. Box properties such as margin, padding, border, background and width do not. Force a value with inherit, reset to the default with initial. Setting text styles on body is an easy way to style the whole page.',code:'body {\n  color: #333;\n  font-family: sans-serif;\n}\n.box {\n  border: 1px solid;\n}\n.box a {\n  color: inherit;\n}',qs:[
{t:'mc',q:'Which property is inherited by default?',o:['border','color','margin','width'],a:1,e:'Text properties like color inherit, while box properties do not.'},
{t:'mc',q:'What color is the paragraph text?',code:'body { color: green; }\n/* <body><p>Hello</p></body> */',o:['green','black','The browser default for p','No color'],a:0,e:'color inherits from body into the paragraph because the paragraph sets no color of its own.'},
{t:'fill',q:'Make links take their parent color.',code:'a { color: ___; }',a:['inherit'],e:'inherit copies the parent computed value.'},
{t:'tf',q:'margin is inherited by child elements by default.',o:TF,a:1,e:'Margin, padding and border describe an element own box, so they are not inherited.'},
{t:'mc',q:'Find the bug: the list items do not get a border.',code:'ul { border: 2px solid red; }\n/* expected a border around each li */',o:['border is not inherited, so only the ul gets one','red is invalid','li must be display block','ul cannot have borders'],a:0,e:'The border draws around the ul box only. To border items, target li directly.'},
{t:'match',q:'Match each keyword or property to its behaviour.',pairs:[['inherit','take the parent value'],['initial','reset to the default'],['color','inherited by default'],['padding','not inherited']],e:'Two keywords control inheritance, and the properties show the two default behaviours.'}]},
{t:'The Box Model',c:'boxmodel',teach:'Every element is a box made of content, padding, border and margin, from inside to outside. By default width sets only the content, so padding and border add to the total. box-sizing: border-box makes width include padding and border, which is easier to reason about. margin: 10px 20px means vertical then horizontal; four values go top, right, bottom, left. margin: 0 auto centers a block that has a width.',code:'* { box-sizing: border-box; }\n.card {\n  width: 300px;\n  padding: 20px;\n  border: 2px solid #ccc;\n  margin: 0 auto;\n}',qs:[
{t:'mc',q:'What is the order of the box layers from inside to outside?',o:['margin, border, padding, content','content, padding, border, margin','content, border, padding, margin','padding, content, margin, border'],a:1,e:'Content sits in the middle, padding surrounds it, then the border, and margin is the outer space.'},
{t:'mc',q:'What is the total rendered width?',code:'.box {\n  box-sizing: content-box;\n  width: 200px;\n  padding: 20px;\n  border: 5px solid;\n}',o:['200px','250px','225px','240px'],a:1,e:'200 + 20 + 20 + 5 + 5 = 250px, because padding and border add to the content width.'},
{t:'mc',q:'What is the total rendered width now?',code:'.box {\n  box-sizing: border-box;\n  width: 200px;\n  padding: 20px;\n  border: 5px solid;\n}',o:['200px','250px','150px','225px'],a:0,e:'With border-box the width already includes padding and border, so the box stays 200px wide.'},
{t:'mc',q:'What does margin: 10px 20px mean?',o:['10px top and left, 20px elsewhere','10px top and bottom, 20px left and right','10px left and right, 20px top and bottom','10px all sides'],a:1,e:'Two values are vertical then horizontal.'},
{t:'fill',q:'Center a block with a set width.',code:'.card { width: 300px; margin: 0 ___; }',a:['auto'],e:'auto splits the leftover horizontal space equally on both sides.'},
{t:'mc',q:'Find the bug: margin: 0 auto does not visibly move the box.',code:'.box { margin: 0 auto; }',o:['auto is invalid','The block has no width, so it already fills the line','margin needs px','Boxes cannot be centered'],a:1,e:'A block with no width stretches across its parent, leaving no spare space to share. Give it a width or max-width.'}]},
{t:'Display and Overflow',c:'display',teach:'display controls how a box flows. block elements start on a new line and accept width and height. inline elements flow within text and ignore width, height and vertical margins. inline-block flows like inline but accepts a size. display: none removes the element from the layout entirely, while visibility: hidden hides it but keeps its space. overflow decides what happens to content larger than its box: visible, hidden, scroll or auto.',code:'span { display: block; }\nli { display: inline-block; width: 100px; }\n.hidden { display: none; }\n.box {\n  height: 100px;\n  overflow: auto;\n}',qs:[
{t:'mc',q:'Which element type starts on a new line by default?',o:['span','a','div','strong'],a:2,e:'div is a block element. span, a and strong are inline.'},
{t:'mc',q:'What is the difference between display: none and visibility: hidden?',o:['None','none removes the space, hidden keeps an empty gap','hidden removes the space, none keeps a gap','They affect different elements'],a:1,e:'display: none takes the element out of layout while visibility: hidden only makes it invisible.'},
{t:'fill',q:'Add scrollbars only when the content overflows.',code:'.box { overflow: ___; }',a:['auto'],e:'auto shows scrollbars only when needed. scroll always shows them.'},
{t:'tf',q:'A span with width: 200px displays 200px wide by default.',o:TF,a:1,e:'width does not apply to inline elements. Make the span inline-block or block first.'},
{t:'mc',q:'Find the bug: the size has no effect.',code:'span {\n  width: 200px;\n  height: 50px;\n}',o:['span is inline, so width and height are ignored','Needs px after 200','span cannot be styled','height must come first'],a:0,e:'Inline boxes ignore width and height. Add display: inline-block or display: block.'}]},
{t:'Positioning',c:'position',teach:'position: static is the default normal flow. relative shifts an element from its normal place and also becomes the anchor for absolute children. absolute removes the element from flow and places it relative to the nearest positioned ancestor. fixed pins it to the viewport. sticky scrolls normally then sticks at a set offset. top, right, bottom and left have no effect on static elements, and z-index orders overlapping positioned elements.',code:'.parent { position: relative; }\n.badge {\n  position: absolute;\n  top: 0;\n  right: 0;\n}\n.nav {\n  position: sticky;\n  top: 0;\n  z-index: 10;\n}',qs:[
{t:'mc',q:'An absolutely positioned element is placed relative to what?',o:['The viewport always','Its nearest positioned ancestor','Its previous sibling','The body only'],a:1,e:'It looks up for the closest ancestor whose position is not static. If none exists it uses the page.'},
{t:'mc',q:'What does position: fixed do?',o:['Keeps it in normal flow','Pins it to the viewport so it stays when scrolling','Fixes it to its parent','Locks its width'],a:1,e:'A fixed element stays in the same spot on screen as the page scrolls.'},
{t:'fill',q:'Make the parent the anchor for an absolute badge.',code:'.parent { position: ___; }',a:['relative'],e:'position: relative makes the parent positioned without moving it.'},
{t:'mc',q:'Find the bug: top: 10px has no effect.',code:'.box {\n  top: 10px;\n}',o:['top needs a percentage','The box is static, and offsets only work on positioned elements','top is not a CSS property','Needs z-index'],a:1,e:'Set position to relative, absolute, fixed or sticky for the offsets to apply.'},
{t:'tf',q:'z-index controls which overlapping positioned element appears in front.',o:TF,a:0,e:'A higher z-index is drawn on top, within the same stacking context.'},
{t:'match',q:'Match each position value to its behaviour.',pairs:[['static','normal document flow'],['relative','offset from its normal spot'],['fixed','pinned to the viewport'],['sticky','scrolls, then sticks']],e:'Each value changes how the element is placed and whether it scrolls.'}]},
{t:'Checkpoint: Cascade, Box and Flow',c:'check2',teach:'Review: specificity decides conflicts before order, text properties inherit and box properties do not, border-box includes padding and border in the width, block and inline boxes differ, and absolute positioning needs a positioned ancestor.',code:'.box {\n  box-sizing: border-box;\n  width: 200px;\n  padding: 20px;\n  border: 5px solid;\n}',qs:[
{t:'mc',q:'How wide is this box on screen?',code:'.box {\n  box-sizing: border-box;\n  width: 200px;\n  padding: 20px;\n  border: 5px solid;\n}',o:['200px','250px','245px','150px'],a:0,e:'border-box keeps the specified width as the total including padding and border.'},
{t:'mc',q:'Which rule wins for an element with class="a b c"?',code:'#x { color: red; }\n.a.b.c { color: blue; }\n/* <p id="x" class="a b c"> */',o:['blue, three classes beat one id','red, an id outranks any number of classes','Neither','The last one always'],a:1,e:'Specificity compares id counts before class counts, so one id beats many classes.'},
{t:'fill',q:'Pin a header to the viewport.',code:'header { position: ___; top: 0; }',a:['fixed'],e:'position: fixed keeps the element in place relative to the viewport.'},
{t:'mc',q:'Find the bug: the badge appears in the page corner, not the card corner.',code:'.card { }\n.badge {\n  position: absolute;\n  top: 0;\n  right: 0;\n}',o:['The badge needs z-index','The card is not positioned; give it position: relative','top and right conflict','absolute is deprecated'],a:1,e:'With no positioned ancestor, the badge anchors to the page. Positioning the card gives it a reference.'},
{t:'match',q:'Match each property to its box part.',pairs:[['padding','space inside the border'],['border','line around the padding'],['margin','space outside the border'],['overflow','what happens to extra content']],e:'These properties control successive layers of the box and its content.'}]}
]});

U('css',{t:'Unit 3 · Flexbox and Grid Layout',l:[
{t:'Flexbox Basics',c:'flex',teach:'Put display: flex on a container and its direct children become flex items laid out along the main axis, a row by default. flex-direction switches the main axis to column. justify-content distributes items along the main axis (flex-start, center, space-between, space-around, space-evenly). align-items aligns them on the cross axis (stretch by default, center, flex-start). The flex declaration belongs on the parent, not the items.',code:'.bar {\n  display: flex;\n  flex-direction: row;\n  justify-content: space-between;\n  align-items: center;\n}',qs:[
{t:'mc',q:'Which element gets display: flex to lay out its children in a row?',o:['Each child','The parent container','The body only','The last child'],a:1,e:'display: flex goes on the container; its direct children become flex items.'},
{t:'mc',q:'In a flex row, which property spaces items along the horizontal main axis?',o:['align-items','justify-content','flex-wrap','align-content'],a:1,e:'justify-content works on the main axis. In a row that is horizontal.'},
{t:'mc',q:'With flex-direction: column, what does align-items: center do?',o:['Centers items vertically','Centers items horizontally','Does nothing','Reverses the order'],a:1,e:'In a column the main axis is vertical, so align-items works on the horizontal cross axis.'},
{t:'fill',q:'Push the first item to the left, the last to the right, and spread the rest evenly between.',code:'.bar { display: flex; justify-content: ___; }',a:['space-between'],e:'space-between puts the free space between items with none at the ends.'},
{t:'mc',q:'Find the bug: the three boxes stack vertically.',code:'.box {\n  display: flex;\n}\n/* <div class="wrap"><div class="box">...</div> x3 */',o:['flex needs a width','display: flex is on the items instead of their wrapper','box must be inline','flex is not a display value'],a:1,e:'The container .wrap must be display: flex. Putting it on each item flexes only their own children.'}]},
{t:'Flex Sizing, Wrap and Gap',c:'flexsize',teach:'flex-grow shares leftover space between items, flex-shrink lets items shrink when space is tight, and flex-basis sets the starting size. The shorthand flex: 1 means grow equally. By default items stay on one line (nowrap); flex-wrap: wrap lets them move to the next line. gap adds space between items without extra margins at the edges.',code:'.row {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 16px;\n}\n.item { flex: 1 1 200px; }\n.sidebar { flex: 0 0 250px; }',qs:[
{t:'mc',q:'Three items each have flex: 1. How is the space shared?',o:['The first takes all','Equally between the three','By content size only','They do not grow'],a:1,e:'Equal flex-grow values split the free space equally.'},
{t:'mc',q:'A 600px flex row holds two items, with no gap. A is flex: 1 and B is flex: 2. How wide is B?',o:['200px','300px','400px','600px'],a:2,e:'The space is split 1 to 2, so A gets 200px and B gets 400px.'},
{t:'fill',q:'Let items move onto a new line when they run out of room.',code:'.row { display: flex; flex-wrap: ___; }',a:['wrap'],e:'flex-wrap: wrap allows multiple lines. The default is nowrap.'},
{t:'tf',q:'By default flex items wrap onto new lines when the row is full.',o:TF,a:1,e:'The default is nowrap, so items shrink instead. Set flex-wrap: wrap to allow wrapping.'},
{t:'mc',q:'What does gap do in a flex container?',o:['Adds space between items','Adds space only at the outer edges','Changes item size','Adds a border'],a:0,e:'gap puts consistent space between items, which is neater than margins on every item.'},
{t:'match',q:'Match each flex property to its job.',pairs:[['flex-grow','share extra space'],['flex-shrink','shrink when tight'],['flex-basis','starting size'],['gap','space between items']],e:'The three flex longhands cover growing, shrinking and starting size, while gap handles spacing.'}]},
{t:'Grid Basics',c:'grid',teach:'CSS Grid lays out rows and columns together. Set display: grid and define columns with grid-template-columns. The fr unit is one share of the free space, and repeat(3, 1fr) means three equal columns. gap spaces rows and columns. Rows are created automatically as items are added. Without grid-template-columns, a grid has a single column.',code:'.grid {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 20px;\n}\n.page { grid-template-columns: 250px 1fr; }',qs:[
{t:'mc',q:'What does 1fr mean?',o:['One pixel','One share of the available free space','100 percent of the page','One row'],a:1,e:'fr divides remaining space in proportion. 1fr 2fr gives the second column twice the room.'},
{t:'mc',q:'Ignoring gaps, how wide are the columns in a 300px grid?',code:'.g {\n  display: grid;\n  grid-template-columns: 1fr 2fr;\n}',o:['150px and 150px','100px and 200px','200px and 100px','300px and 300px'],a:1,e:'Three shares in total: 1 share is 100px and 2 shares are 200px.'},
{t:'fill',q:'Create three equal columns.',code:'.grid { grid-template-___: repeat(3, 1fr); }',a:['columns'],e:'grid-template-columns defines the column tracks.'},
{t:'mc',q:'What is the main difference between grid and flexbox?',o:['Grid is two-dimensional while flexbox works along one axis at a time','Grid is only for text','Flexbox cannot align','Grid cannot have gaps'],a:0,e:'Grid controls rows and columns together. Flexbox arranges items along a single main axis.'},
{t:'mc',q:'Find the bug: the items stack in one column.',code:'.grid {\n  display: grid;\n  gap: 10px;\n}',o:['gap is invalid','No columns are defined, so there is one column','display: grid needs a height','Items need float'],a:1,e:'Add grid-template-columns, for example repeat(3, 1fr), to create more than one column.'},
{t:'tf',q:'grid-template-columns: repeat(4, 100px) makes four columns of 100px.',o:TF,a:0,e:'repeat(count, size) repeats the track size.'}]},
{t:'Grid Placement and Areas',c:'gridplace',teach:'Items normally fill cells in order, but you can place them. grid-column: 1 / 3 runs from line 1 to line 3 (two columns) and grid-column: span 2 covers two tracks. grid-template-areas names regions in a text map, and grid-area on a child puts it there. repeat(auto-fit, minmax(200px, 1fr)) makes as many columns of at least 200px as fit, a responsive grid with no media query.',code:'.layout {\n  display: grid;\n  grid-template-columns: 200px 1fr;\n  grid-template-areas:\n    "head head"\n    "side main";\n}\n.head { grid-area: head; }\n.wide { grid-column: span 2; }',qs:[
{t:'mc',q:'How many columns does grid-column: 1 / 3 cover?',o:['1','2','3','4'],a:1,e:'The numbers are grid lines. From line 1 to line 3 spans two columns.'},
{t:'mc',q:'What does repeat(auto-fit, minmax(200px, 1fr)) create?',o:['Exactly 200 columns','As many columns of at least 200px as fit, sharing leftover space','One column','Rows of 200px'],a:1,e:'The browser fits as many tracks as it can while each is at least 200px wide and at most 1fr.'},
{t:'fill',q:'Place the item in the named region.',code:'.head { grid-___: head; }',a:['area'],e:'grid-area assigns an item to a name from grid-template-areas.'},
{t:'mc',q:'Find the bug: the header item is not placed in the header region.',code:'.layout { grid-template-areas: "head head" "side main"; }\n.header { grid-area: header; }',o:['The area name header does not match the template name head','Areas must be numbers','grid-area needs px','The template needs three rows'],a:0,e:'The name in grid-area must match one in the template exactly. Use grid-area: head.'},
{t:'match',q:'Match each grid feature to its purpose.',pairs:[['grid-row','place on rows'],['grid-area','put in a named region'],['minmax(a, b)','size range for a track'],['span 2','cover two tracks']],e:'These tools let items leave the default flow and size tracks flexibly.'}]},
{t:'Alignment and Centering',c:'align',teach:'Centering is easy with modern layout. A flex container with justify-content: center and align-items: center centers a child both ways. A grid container with place-items: center does the same in one line. margin: 0 auto centers a block horizontally when it has a width, and text-align: center centers inline content inside a block. Remember that the properties act on the container, and the axis depends on flex-direction.',code:'.center {\n  display: flex;\n  justify-content: center;\n  align-items: center;\n  height: 300px;\n}\n.grid-center {\n  display: grid;\n  place-items: center;\n}',qs:[
{t:'mc',q:'Which approach centers a child both horizontally and vertically?',o:['text-align: center only','display: grid with place-items: center','margin: auto 0','float: center'],a:1,e:'place-items: center on a grid container centers items on both axes. Flexbox with two center values also works.'},
{t:'mc',q:'What does text-align: center center?',o:['Block boxes in their parent','Inline content such as text inside the box','Only images','Flex items vertically'],a:1,e:'It aligns inline content within a block. To center a block, use margin: 0 auto or flex or grid.'},
{t:'fill',q:'Center items on both axes in a grid.',code:'.grid { display: grid; place-___: center; }',a:['items'],e:'place-items is a shorthand for align-items and justify-items.'},
{t:'mc',q:'Find the bug: the item should move horizontally to the center of the row, but it moves vertically.',code:'.row {\n  display: flex;\n  align-items: center;\n}',o:['align-items works on the cross axis; use justify-content: center for horizontal','center is invalid','flex rows cannot be centered','Needs display: grid'],a:0,e:'In a row the main axis is horizontal, so justify-content centers horizontally and align-items centers vertically.'},
{t:'tf',q:'margin: 0 auto centers a block horizontally when the block has a width.',o:TF,a:0,e:'auto margins share the leftover horizontal space equally.'}]},
{t:'Checkpoint: Flexbox and Grid',c:'check3',teach:'Review: flex on the parent lays items along one axis with justify-content and align-items, flex-wrap and gap handle wrapping and spacing, and grid defines rows and columns with fr, repeat and areas. Choose flex for one-dimensional rows or columns and grid for two-dimensional layouts.',code:'.row { display: flex; gap: 10px; }\n.row > div { flex: 1; }\n.grid {\n  display: grid;\n  grid-template-columns: repeat(2, 1fr);\n}',qs:[
{t:'mc',q:'Three divs in .row each have flex: 1. What is their width relationship?',code:'.row { display: flex; gap: 10px; }\n.row > div { flex: 1; }',o:['Equal widths','The first is widest','Each is its content width','They stack'],a:0,e:'Equal flex values share the free space equally.'},
{t:'fill',q:'Center the items along the main axis.',code:'.bar { display: flex; justify-content: ___; }',a:['center'],e:'justify-content: center groups items in the middle of the main axis.'},
{t:'mc',q:'Find the bug: the grid has one column.',code:'.grid {\n  display: grid;\n  grid-template-column: 1fr 1fr;\n}',o:['The property is grid-template-columns, plural, so this one is ignored','1fr is invalid','display grid needs height','gap is missing'],a:0,e:'A misspelled property is dropped by the browser. The correct name is grid-template-columns.'},
{t:'mc',q:'Which layout is the best fit for a 2D card gallery with rows and columns?',o:['Grid','Inline text','position: fixed','float'],a:0,e:'Grid controls both rows and columns, which suits galleries. Flexbox is best for a single row or column.'},
{t:'match',q:'Match each property to what it does.',pairs:[['flex-direction','sets the main axis direction'],['fr','a share of free space'],['gap','space between items or tracks'],['grid-column','which columns an item spans']],e:'Each is a core tool: axis, sizing share, spacing and placement.'}]}
]});

U('css',{t:'Unit 4 · Responsive Design, Variables and Motion',l:[
{t:'Media Queries and Mobile First',c:'media',teach:'Add <meta name="viewport" content="width=device-width, initial-scale=1"> to the HTML head so phones use their real width. A media query applies rules only when a condition holds: @media (min-width: 768px) { ... }. Mobile-first means writing base styles for small screens and adding min-width queries to enhance larger ones. Conditions need parentheses, and others include max-width, orientation and prefers-color-scheme.',code:'<meta name="viewport" content="width=device-width, initial-scale=1">\n\n.grid { grid-template-columns: 1fr; }\n@media (min-width: 768px) {\n  .grid { grid-template-columns: 1fr 1fr; }\n}',qs:[
{t:'mc',q:'Why add the viewport meta tag?',o:['It speeds up CSS','So mobile browsers lay the page out at the device width instead of a zoomed-out desktop width','It enables flexbox','It sets the font'],a:1,e:'Without it many phones pretend to be about 980px wide and shrink the page.'},
{t:'mc',q:'How many columns does .grid have at a viewport width of 500px?',code:'.grid { grid-template-columns: 1fr; }\n@media (min-width: 768px) {\n  .grid { grid-template-columns: 1fr 1fr; }\n}',o:['One','Two','Three','Zero'],a:0,e:'500px is below 768px, so the media query does not apply and the base single column stays.'},
{t:'fill',q:'Apply the rule at 768px and wider.',code:'@media (___-width: 768px) { }',a:['min'],e:'min-width means this width or larger, the building block of mobile-first CSS.'},
{t:'mc',q:'Find the bug: the media query does not work.',code:'@media min-width: 768px {\n  .grid { gap: 2rem; }\n}',o:['The condition needs parentheses: (min-width: 768px)','768px must be 768','@media must be uppercase','Needs a semicolon'],a:0,e:'Media features go in parentheses, for example @media (min-width: 768px).'},
{t:'match',q:'Match each media condition to its meaning.',pairs:[['min-width','this width or wider'],['max-width','this width or narrower'],['orientation','portrait or landscape'],['prefers-color-scheme','light or dark preference']],e:'Media queries test viewport size and user preferences.'}]},
{t:'Flexible Units and Images',c:'fluid',teach:'Fluid design avoids fixed sizes. max-width: 100% with height: auto keeps images inside their container and preserves proportions. vw and vh are percentages of the viewport width and height. min(), max() and clamp(min, preferred, max) pick values within limits, so font-size: clamp(1.5rem, 4vw, 3rem) scales smoothly but never leaves its range. object-fit: cover fills a box by cropping the image.',code:'img {\n  max-width: 100%;\n  height: auto;\n}\n.container {\n  width: min(90%, 1000px);\n  margin: 0 auto;\n}\nh1 { font-size: clamp(1.5rem, 4vw, 3rem); }\n.thumb { object-fit: cover; }',qs:[
{t:'mc',q:'What does img { max-width: 100%; height: auto; } achieve?',o:['It stretches the image','The image never overflows its container and keeps its proportions','It hides the image','It repeats the image'],a:1,e:'The image can shrink to fit, and height: auto stops it from becoming distorted.'},
{t:'mc',q:'What is 1vw?',o:['1 pixel','1 percent of the viewport width','1 percent of the parent width','1 percent of the font size'],a:1,e:'vw is relative to the viewport width, not the parent.'},
{t:'mc',q:'Which value does clamp(1rem, 10vw, 2rem) give when 10vw is smaller than 1rem?',o:['10vw','1rem','2rem','It is invalid'],a:1,e:'clamp never goes below its minimum, so it returns 1rem.'},
{t:'fill',q:'Make an image fill its box by cropping the excess.',code:'.thumb { object-fit: ___; }',a:['cover'],e:'object-fit: cover scales the image to fill the box and crops what does not fit.'},
{t:'mc',q:'Find the bug: the picture runs off the edge on phones.',code:'img { width: 800px; }',o:['A fixed width is wider than a small screen; use max-width: 100%','800px is invalid','img cannot have width','Needs a border'],a:0,e:'A fixed width does not adapt. max-width: 100% lets the image shrink on small screens.'},
{t:'tf',q:'height: auto keeps an image aspect ratio as its width changes.',o:TF,a:0,e:'With auto, the height follows the width using the natural ratio.'}]},
{t:'Custom Properties',c:'vars',teach:'Custom properties, also called CSS variables, start with two dashes and are declared inside a rule: --brand: #6c5ce7. Read one with var(--brand), and add a fallback as var(--text, white). Declare shared values on :root so the whole page can use them. A custom property can be overridden inside a narrower selector, and descendants see the new value. Names are case-sensitive.',code:':root {\n  --brand: #6c5ce7;\n  --gap: 16px;\n}\n.btn {\n  background: var(--brand);\n  margin: var(--gap);\n  color: var(--text, white);\n}\n.dark { --brand: #a29bfe; }',qs:[
{t:'mc',q:'How does a custom property name begin?',o:['A dollar sign','Two dashes','An at sign','A hash'],a:1,e:'Custom properties begin with --, for example --brand.'},
{t:'mc',q:'What color is the text if --text is not defined anywhere?',code:'.btn { color: var(--text, white); }',o:['black','white','No color','The declaration breaks the page'],a:1,e:'The second argument to var() is the fallback used when the variable is missing.'},
{t:'fill',q:'Use the variable.',code:'.btn { background: ___(--brand); }',a:['var'],e:'var() reads the value of a custom property.'},
{t:'mc',q:'Find the bug: the background does not change.',code:':root { --brand: tomato; }\n.btn { background: --brand; }',o:['Variables are used through var(--brand)','--brand needs quotes','tomato is invalid','Move it to body'],a:0,e:'A bare --brand is not a value. Wrap it as var(--brand).'},
{t:'mc',q:'What happens to elements inside .dark?',code:':root { --brand: #6c5ce7; }\n.dark { --brand: #a29bfe; }\n.btn { background: var(--brand); }',o:['A .btn inside .dark uses #a29bfe','All buttons use #a29bfe','Nothing changes','An error occurs'],a:0,e:'Custom properties cascade and inherit, so a button inside .dark sees the overridden value while others keep the root one.'},
{t:'tf',q:'Custom property names are case-sensitive, so --Brand and --brand are different.',o:TF,a:0,e:'They are distinct names. Using consistent lowercase avoids mistakes.'}]},
{t:'Transitions and Transforms',c:'transition',teach:'A transition animates a property change smoothly: transition: background 0.3s ease. It runs when a value changes, commonly on :hover. Put the transition on the base state so it also plays when returning. transform moves or reshapes an element visually with translate, scale, rotate and skew, without shifting neighbours in the layout. Not everything can animate; switching display does not transition.',code:'.btn {\n  background: navy;\n  transition: background 0.3s ease, transform 0.3s;\n}\n.btn:hover {\n  background: teal;\n  transform: scale(1.1);\n}',qs:[
{t:'mc',q:'Where is it best to place the transition declaration?',o:['Only in :hover','On the base rule so it animates in both directions','In the HTML','On the body'],a:1,e:'If the transition is only on :hover, the return to the normal state jumps. On the base rule it eases both ways.'},
{t:'mc',q:'What does transform: translateX(50px) do?',o:['Moves the element 50px to the right','Scales it by 50','Rotates 50 degrees','Adds 50px of padding'],a:0,e:'translateX shifts the element horizontally without moving other elements.'},
{t:'fill',q:'Enlarge the element by 20 percent.',code:'.btn:hover { transform: ___(1.2); }',a:['scale'],e:'scale(1.2) draws the element at 120 percent size.'},
{t:'mc',q:'Find the bug: the button snaps back instantly when the pointer leaves.',code:'.btn { background: navy; }\n.btn:hover {\n  background: teal;\n  transition: background 0.3s;\n}',o:['The transition is only on :hover, so only the hover-in is animated','teal is invalid','transition needs 1s','Needs !important'],a:0,e:'Move transition to .btn so both directions animate.'},
{t:'tf',q:'You can smoothly transition an element from display: none to display: block.',o:TF,a:1,e:'display is not animatable that way. Transition opacity or transform instead.'}]},
{t:'Keyframe Animations',c:'anim',teach:'Animations run on their own and can have many steps. Define them with @keyframes name using from and to or percentages, then apply with the animation shorthand: name, duration, timing, delay, iteration count and direction. infinite repeats forever and alternate plays back and forth. Names are case-sensitive. Respect users who prefer less motion with @media (prefers-reduced-motion: reduce).',code:'@keyframes pulse {\n  from { transform: scale(1); }\n  to { transform: scale(1.2); }\n}\n.dot {\n  animation: pulse 2s infinite alternate;\n}\n@media (prefers-reduced-motion: reduce) {\n  .dot { animation: none; }\n}',qs:[
{t:'mc',q:'What is the main difference between a transition and an animation?',o:['Transitions need a trigger and go between two states; animations can run automatically through keyframes','They are identical','Animations only work on color','Transitions work only on text'],a:0,e:'A transition reacts to a change, while an animation follows its own keyframe timeline.'},
{t:'mc',q:'What does infinite mean in the animation shorthand?',o:['It lasts one hour','It repeats forever','It starts slowly','It reverses once'],a:1,e:'animation-iteration-count: infinite keeps repeating the animation.'},
{t:'fill',q:'Define the animation steps.',code:'@___ spin {\n  to { transform: rotate(360deg); }\n}',a:['keyframes'],e:'@keyframes declares the named steps of an animation.'},
{t:'mc',q:'Find the bug: nothing animates.',code:'@keyframes pulse { to { opacity: 0; } }\n.dot { animation: Pulse 1s; }',o:['The name Pulse does not match pulse; names are case-sensitive','1s is too short','opacity cannot animate','Needs infinite'],a:0,e:'The animation name must exactly match the @keyframes name.'},
{t:'order',q:'Put the code in order so the box fades in.',items:['@keyframes fade {','  from { opacity: 0; }','  to { opacity: 1; }','}','.box { animation: fade 1s; }'],e:'Define the keyframes first, then apply them with the animation property.'},
{t:'match',q:'Match each animation property to its role.',pairs:[['animation-duration','length of one cycle'],['animation-delay','wait before starting'],['animation-iteration-count','how many repeats'],['animation-direction','forwards or alternating']],e:'These longhands are what the animation shorthand combines.'}]},
{t:'Capstone: Responsive Card Layout',c:'capstone',teach:'This stylesheet builds a mobile-first card grid. A custom property holds the spacing, the base rule gives one column, a media query upgrades to three columns on wider screens, and a transition adds a hover lift. Read it from top to bottom: variables, base layout, effects, then the breakpoint.',code:':root { --gap: 1rem; }\n.cards { display: grid; gap: var(--gap); grid-template-columns: 1fr; }\n.card { padding: 1rem; transition: transform 0.2s; }\n.card:hover { transform: translateY(-4px); }\n@media (min-width: 700px) {\n  .cards { grid-template-columns: repeat(3, 1fr); }\n}',qs:[
{t:'mc',q:'How many columns are shown at a viewport width of 900px?',code:':root { --gap: 1rem; }\n.cards { display: grid; gap: var(--gap); grid-template-columns: 1fr; }\n@media (min-width: 700px) {\n  .cards { grid-template-columns: repeat(3, 1fr); }\n}',o:['One','Two','Three','Four'],a:2,e:'900px is at least 700px, so the media query applies and overrides the single column.'},
{t:'mc',q:'How many columns are shown at 400px?',o:['One','Three','Two','None'],a:0,e:'The media query does not apply below 700px, so the base single column stays.'},
{t:'fill',q:'Complete the three equal columns.',code:'.cards { grid-template-columns: ___(3, 1fr); }',a:['repeat'],e:'repeat(3, 1fr) is the short way to write 1fr 1fr 1fr.'},
{t:'mc',q:'Find the bug: the cards show three columns even on phones.',code:'.cards { grid-template-columns: 1fr; }\n@media (max-width: 700px) {\n  .cards { grid-template-columns: repeat(3, 1fr); }\n}',o:['max-width applies the three columns to narrow screens; use min-width','1fr is invalid','repeat cannot be used in media queries','gap is missing'],a:0,e:'max-width: 700px matches small screens. Mobile-first uses min-width so large screens get the extra columns.'},
{t:'order',q:'Put the rules in order for a mobile-first layout.',items:['.cards { grid-template-columns: 1fr; }','@media (min-width: 700px) {','  .cards { grid-template-columns: repeat(3, 1fr); }','}'],e:'The base style comes first, then the media query overrides it for wider screens.'},
{t:'match',q:'Match each part of the stylesheet to its job.',pairs:[['var(--gap)','reuse one spacing value'],['grid','arrange cards in columns'],['transition','smooth the hover lift'],['min-width query','three columns on wide screens']],e:'Each feature plays one role in the finished responsive component.'}]}
]});
