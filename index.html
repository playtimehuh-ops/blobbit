U('sql',{t:'Unit 1 · SELECT Basics',l:[
{t:'Selecting columns',c:'select',teach:'SELECT lists the columns you want, FROM names the table. Use * to get every column, or name columns separated by commas to pick just some. AS renames a column in the output only; it does not change the table. Statements end with a semicolon.',code:'SELECT name, age FROM pets;\nSELECT * FROM pets;\nSELECT name AS pet_name FROM pets;',qs:[
{t:'mc',q:'Which keyword chooses which table to read from?',o:['FROM','SELECT','AS','WHERE'],a:0,e:'FROM names the table the query reads from.'},
{t:'mc',q:'What is the column header in the output of this query?',code:'SELECT name AS pet_name FROM pets;',o:['pet_name','name','pets','AS'],a:0,e:'AS renames the output column to pet_name; the underlying column name is unchanged.'},
{t:'fill',q:'Complete the query to select every column.',code:'SELECT ___ FROM pets;',a:['*'],e:'* means all columns.'},
{t:'mc',q:'Find the bug: this query fails.',code:'FROM pets SELECT name;',o:['SELECT must come before FROM','FROM cannot be used with SELECT','name is misspelled','A semicolon is missing'],a:0,e:'SQL requires the SELECT clause first, then FROM.'},
{t:'order',q:'Put the clauses in order.',items:['SELECT name, age','FROM pets'],e:'A basic query starts with SELECT, then FROM.'}]},
{t:'Filtering with WHERE',c:'where',teach:'WHERE filters rows to just the ones matching a condition, placed after FROM. Use = for equality, <> for not equal, and < > <= >= for comparisons. Text values need quotes; numbers do not. WHERE is checked row by row before any row is returned.',code:'SELECT name FROM pets WHERE type = \'cat\';\nSELECT name FROM pets WHERE age > 2;\nSELECT name FROM pets WHERE type <> \'dog\';',qs:[
{t:'mc',q:'Which clause filters rows based on a condition?',o:['WHERE','SELECT','FROM','AS'],a:0,e:'WHERE keeps only rows that match its condition.'},
{t:'mc',q:'What does this return?',code:'-- pets(name,type,age)\n-- Rex dog 3\n-- Mia cat 5\n-- Tom cat 2\nSELECT name FROM pets WHERE type = \'cat\';',o:['Mia and Tom','Rex','Mia only','Rex, Mia and Tom'],a:0,e:'Only rows where type equals cat are returned: Mia and Tom.'},
{t:'fill',q:'Fill in the operator so only pets older than 3 are returned.',code:'SELECT name FROM pets WHERE age ___ 3;',a:['>'],e:'> keeps rows strictly greater than 3.'},
{t:'mc',q:'Find the bug: this query fails.',code:'SELECT name FROM pets WHERE type = cat;',o:['cat needs quotes since it is text','WHERE must come before FROM','= should be ==','type is not a real column'],a:0,e:'Text literals need quotes; without them SQL looks for a column named cat.'},
{t:'tf',q:'WHERE age > 2 keeps rows where age is exactly 2.',o:TF,a:1,e:'> excludes rows equal to 2; only strictly greater rows match.'}]},
{t:'Combining conditions',c:'logic',teach:'AND requires both conditions to be true, OR requires at least one, and NOT reverses a condition. IN(list) checks membership against several values, and BETWEEN a AND b checks an inclusive range. Parentheses control how conditions group.',code:'SELECT name FROM pets WHERE type = \'cat\' AND age > 2;\nSELECT name FROM pets WHERE type = \'dog\' OR type = \'fish\';\nSELECT name FROM pets WHERE age BETWEEN 2 AND 3;\nSELECT name FROM pets WHERE type IN (\'cat\',\'dog\');',qs:[
{t:'mc',q:'Which keyword requires both conditions to be true?',o:['AND','OR','NOT','IN'],a:0,e:'AND needs every condition to hold.'},
{t:'mc',q:'What does this return?',code:'-- pets ages: Rex 3, Mia 5, Tom 2, Fin 1\nSELECT name FROM pets WHERE age BETWEEN 2 AND 3;',o:['Rex and Tom','Mia and Fin','Rex, Mia and Tom','Tom only'],a:0,e:'BETWEEN is inclusive, so ages 2 and 3 match: Tom(2) and Rex(3).'},
{t:'fill',q:'Fill in the keyword so pets that are a cat or a dog are returned.',code:'SELECT name FROM pets WHERE type = \'cat\' ___ type = \'dog\';',a:['OR'],e:'OR needs at least one condition to be true.'},
{t:'mc',q:'Find the bug: the second condition is not valid.',code:'SELECT name FROM pets WHERE type = \'cat\' AND \'dog\';',o:['\'dog\' alone is not a condition; it needs a column and operator','AND should be OR','Quotes are not needed around dog','WHERE cannot use AND'],a:0,e:'A condition needs a column and comparison, such as type = \'dog\', not a bare value.'},
{t:'match',q:'Match each keyword to what it does.',pairs:[['AND','both conditions must be true'],['OR','at least one condition is true'],['NOT','reverses a condition'],['BETWEEN','checks an inclusive range']],e:'Each keyword combines or reverses conditions differently.'}]},
{t:'Pattern matching with LIKE',c:'like',teach:'LIKE matches text against a pattern. % matches any number of characters (including zero), and _ matches exactly one character. Patterns are written in quotes, so \'A%\' matches anything starting with A.',code:'SELECT name FROM owners WHERE name LIKE \'A%\';\nSELECT name FROM owners WHERE city LIKE \'%A\';\nSELECT name FROM owners WHERE name LIKE \'_o\';',qs:[
{t:'mc',q:'Which wildcard in LIKE matches any number of characters?',o:['%','_','*','?'],a:0,e:'% matches zero or more characters.'},
{t:'mc',q:'What does this return?',code:'-- owners: Al, Bo, Cy\nSELECT name FROM owners WHERE name LIKE \'_o\';',o:['Bo','Al','Cy','Al and Bo'],a:0,e:'_ matches exactly one character before o, so only Bo matches; Al ends in l and Cy ends in y.'},
{t:'fill',q:'Fill in the comparison keyword for pattern matching.',code:'SELECT name FROM owners WHERE name ___ \'A%\';',a:['LIKE'],e:'LIKE compares text against a pattern.'},
{t:'mc',q:'Find the bug: this query fails.',code:'SELECT name FROM owners WHERE name LIKE \'A%\' AND LIKE \'B%\';',o:['The second LIKE needs its own column, e.g. OR name LIKE \'B%\'','LIKE cannot use %','AND must always be OR','Patterns cannot start with a letter'],a:0,e:'Each condition needs its own column and operator; LIKE alone is not complete.'},
{t:'tf',q:'The pattern \'a_\' matches a string that is exactly two characters long and starts with a.',o:TF,a:0,e:'_ matches exactly one character, so the pattern requires exactly two characters total.'}]},
{t:'NULL means unknown',c:'null',teach:'NULL represents a missing or unknown value, not zero or empty text. Test for it with IS NULL or IS NOT NULL; using = NULL never matches anything, even other NULLs. Comparisons involving NULL evaluate to unknown, so such rows are excluded from WHERE unless you check for NULL directly.',code:'SELECT name FROM pets WHERE owner_id IS NULL;\nSELECT name FROM pets WHERE owner_id IS NOT NULL;',qs:[
{t:'mc',q:'Which condition correctly finds rows where a column has no value?',o:['column IS NULL','column = NULL','column == NULL','column = \'\''],a:0,e:'IS NULL is the correct way to test for a missing value.'},
{t:'mc',q:'What does this return?',code:'-- pets owner_id: Rex 1, Mia 1, Tom 2, Fin NULL\nSELECT name FROM pets WHERE owner_id IS NULL;',o:['Fin','Rex','Tom','No rows'],a:0,e:'Only Fin has no owner_id, so it is the only match.'},
{t:'tf',q:'SELECT name FROM pets WHERE owner_id = NULL; returns the pets with no owner.',o:TF,a:1,e:'= NULL never matches, even for NULL values; IS NULL must be used instead.'},
{t:'fill',q:'Complete the condition to find pets that do have an owner.',code:'SELECT name FROM pets WHERE owner_id IS ___ NULL;',a:['NOT'],e:'IS NOT NULL finds rows where the value is present.'},
{t:'mc',q:'Find the bug: this query never returns any rows.',code:'SELECT name FROM pets WHERE owner_id <> NULL;',o:['Comparisons with NULL never return true; use IS NOT NULL','<> should be !=','owner_id is spelled wrong','WHERE cannot use NULL'],a:0,e:'Any comparison operator against NULL yields unknown, so no rows are ever returned this way.'}]},
{t:'Sorting with ORDER BY and LIMIT',c:'orderlimit',teach:'ORDER BY sorts result rows by one or more columns, ascending (ASC, the default) or descending (DESC). LIMIT restricts how many rows come back, often combined with ORDER BY to get the top N rows. ORDER BY runs after WHERE, so it only sorts rows that passed the filter.',code:'SELECT name, age FROM pets ORDER BY age;\nSELECT name, age FROM pets ORDER BY age DESC;\nSELECT name FROM pets ORDER BY age DESC LIMIT 1;',qs:[
{t:'mc',q:'Which clause sorts results from largest to smallest?',o:['ORDER BY ... DESC','ORDER BY ... ASC','LIMIT','GROUP BY'],a:0,e:'DESC sorts in descending order.'},
{t:'mc',q:'What does this return?',code:'-- pets ages: Rex 3, Mia 5, Tom 2, Fin 1\nSELECT name FROM pets ORDER BY age DESC LIMIT 1;',o:['Mia','Fin','Rex','Tom'],a:0,e:'Sorting by age descending puts Mia (5) first, and LIMIT 1 keeps only that row.'},
{t:'fill',q:'Complete the query so the oldest pet is listed first.',code:'SELECT name FROM pets ORDER BY age ___;',a:['DESC'],e:'DESC sorts from highest to lowest.'},
{t:'mc',q:'Find the bug: this query is not valid.',code:'SELECT name FROM pets ORDER BY age LIMIT 1 DESC;',o:['DESC must come right after the column, before LIMIT','LIMIT must come before ORDER BY','age cannot be sorted','1 should be in quotes'],a:0,e:'The correct order is ORDER BY age DESC LIMIT 1.'},
{t:'order',q:'Put the clauses of this query in the correct order.',items:['SELECT name','FROM pets','WHERE age > 1','ORDER BY age DESC','LIMIT 2'],e:'SQL clauses run in this order: SELECT list, FROM, WHERE, ORDER BY, LIMIT.'}]},
{t:'Checkpoint: SELECT Basics',c:'cp1',teach:'Review: SELECT and FROM choose data, WHERE filters rows, AND/OR/NOT/IN/BETWEEN combine conditions, LIKE matches patterns, IS NULL checks for missing values, and ORDER BY/LIMIT control the final order and count.',code:'SELECT name FROM pets\nWHERE type = \'cat\' AND age > 2\nORDER BY age DESC;',qs:[
{t:'mc',q:'What does this return?',code:'-- pets(name,type,age): Rex dog 3, Mia cat 5, Tom cat 2, Fin fish 1\nSELECT name FROM pets WHERE type = \'cat\' AND age > 2 ORDER BY age DESC;',o:['Mia','Tom','Mia and Tom','Rex'],a:0,e:'Only Mia is a cat older than 2; Tom is a cat but only 2 years old.'},
{t:'mc',q:'Which operator checks for an inclusive range of values?',o:['BETWEEN','IN','LIKE','IS NULL'],a:0,e:'BETWEEN a AND b includes both endpoints.'},
{t:'tf',q:'ORDER BY always runs before WHERE.',o:TF,a:1,e:'WHERE filters rows first; ORDER BY then sorts whatever is left.'},
{t:'fill',q:'Complete the condition to find pets with no owner.',code:'SELECT name FROM pets WHERE owner_id IS ___;',a:['NULL'],e:'IS NULL finds rows with a missing value.'},
{t:'match',q:'Match each clause to its job.',pairs:[['WHERE','filters rows by condition'],['ORDER BY','sorts the results'],['LIMIT','caps the number of rows'],['LIKE','matches a text pattern']],e:'Each clause plays a distinct role in a query.'}]}
]});

U('sql',{t:'Unit 2 · JOINs and Aggregation',l:[
{t:'INNER JOIN',c:'innerjoin',teach:'INNER JOIN combines rows from two tables based on a matching condition. SELECT c.name, o.name FROM customers c JOIN orders o ON c.id = o.customer_id returns customer and order info for orders that have a customer. Columns from either table can be used in SELECT; unmatched rows are excluded.',code:'SELECT c.name, o.amount FROM customers c\nINNER JOIN orders o ON c.id = o.customer_id\nWHERE o.amount > 50;',qs:[
{t:'mc',q:'What does INNER JOIN return?',o:['All rows from the first table','Rows from both tables where the condition matches','All rows from both tables','Nothing if the condition is false'],a:1,e:'INNER JOIN keeps only matching rows from both tables.'},
{t:'mc',q:'In the query SELECT a.x, b.y FROM a JOIN b ON a.id = b.a_id, what is ON for?',o:['Specifying which rows to return','Defining how the tables connect','A shorthand for AND','Renaming a column'],a:1,e:'ON defines the join condition that pairs rows from the two tables.'},
{t:'fill',q:'Complete the join to match customer IDs.',code:'SELECT * FROM customers c JOIN orders o ON c.___ = o.customer_id;',a:['id'],e:'ON matches the customer id column with the foreign key.'},
{t:'tf',q:'INNER JOIN returns all rows even if there is no match in the other table.',o:TF,a:1,e:'INNER JOIN excludes unmatched rows. LEFT JOIN would keep unmatched rows from the left table.'},
{t:'order',q:'Put the clauses in order for a join query.',items:['SELECT c.name, o.amount','FROM customers c','JOIN orders o ON c.id = o.customer_id','WHERE o.amount > 100'],e:'SELECT, FROM, JOIN, WHERE is the correct order.'}
]},
{t:'LEFT and RIGHT JOIN',c:'outerjoin',teach:'LEFT JOIN keeps all rows from the left table and matching rows from the right; unmatched right rows are omitted. RIGHT JOIN is the opposite: all right rows, matched left rows. FULL OUTER JOIN (in some databases) keeps all rows from both, filling unmatched columns with NULL.',code:'SELECT c.name, o.amount FROM customers c\nLEFT JOIN orders o ON c.id = o.customer_id\nORDER BY c.name;',qs:[
{t:'mc',q:'What does LEFT JOIN return?',o:['All rows from the left table and matching right rows','All rows from both tables','Only rows that match in both tables','Rows from the left table only if there is a match'],a:0,e:'LEFT JOIN includes all left rows, whether or not they match the right table.'},
{t:'mc',q:'When would a column be NULL in a LEFT JOIN result?',o:['Always','Never','When the right table has no matching row','When the left table has no value'],a:2,e:'If there is no match in the right table, its columns are NULL.'},
{t:'fill',q:'Complete the join to keep all customers whether or not they have orders.',code:'SELECT c.name FROM customers c ___ JOIN orders o ON c.id = o.customer_id;',a:['LEFT'],e:'LEFT JOIN includes all customers, even those with no orders.'},
{t:'mc',q:'What is the difference between LEFT JOIN and INNER JOIN?',o:['Speed','LEFT keeps unmatched left rows, INNER does not','They are the same','LEFT is for text, INNER for numbers'],a:1,e:'LEFT JOIN includes unmatched left rows (with NULL from the right); INNER excludes them.'},
{t:'match',q:'Match each join type to what it returns.',pairs:[['INNER JOIN','matching rows only'],['LEFT JOIN','all left + matching right'],['RIGHT JOIN','all right + matching left'],['FULL OUTER','all rows from both']],e:'Join types differ in how they handle unmatched rows.'}
]},
{t:'Aggregation and GROUP BY',c:'groupby',teach:'Aggregate functions COUNT, SUM, AVG, MAX, MIN work on sets of rows. GROUP BY splits rows into groups based on column values and computes aggregates per group. SELECT department, COUNT(*) FROM employees GROUP BY department counts employees per department. HAVING filters groups after aggregation, like WHERE filters rows before.',code:'SELECT department, COUNT(*) as emp_count, AVG(salary) as avg_sal\nFROM employees\nGROUP BY department\nHAVING COUNT(*) > 5;',qs:[
{t:'mc',q:'What does COUNT(*) return?',o:['The number of distinct values','The number of rows','The first row','0'],a:1,e:'COUNT(*) counts all rows in the result set or group.'},
{t:'mc',q:'What does this return?',code:'-- employees dept: Alice IT, Bob Sales, Carol IT, Dave Sales, Eve Sales\nSELECT dept, COUNT(*) FROM employees GROUP BY dept;',o:['5 rows','2 rows: IT 2, Sales 3','1 row','Alice 1, Bob 1, ...'],a:1,e:'GROUP BY dept creates groups IT and Sales, then COUNT(*) counts rows per group.'},
{t:'fill',q:'Complete the query to show total salary per department.',code:'SELECT department, ___ (salary) FROM employees GROUP BY department;',a:['SUM'],e:'SUM adds up values in a column.'},
{t:'mc',q:'What is HAVING used for?',o:['Filtering rows before grouping','Filtering groups after aggregation','Sorting results','Creating a column alias'],a:1,e:'HAVING applies a condition to groups after GROUP BY, like WHERE for groups.'},
{t:'order',q:'Put the clauses in order for grouping.',items:['SELECT department, COUNT(*)','FROM employees','GROUP BY department','HAVING COUNT(*) > 10'],e:'SELECT list, FROM, GROUP BY, HAVING is the correct order.'}
]},
{t:'Aggregate Functions',c:'aggfuncs',teach:'COUNT counts non-null rows or distinct values: COUNT(*) or COUNT(DISTINCT id). SUM totals a numeric column. AVG averages. MAX and MIN find highest and lowest. ROUND(number, digits) rounds to a number of decimal places. These return one row per group.',code:'SELECT\n  COUNT(*) as total,\n  COUNT(DISTINCT customer_id) as num_customers,\n  SUM(amount) as revenue,\n  AVG(amount) as avg_order,\n  MAX(amount) as largest,\n  MIN(amount) as smallest\nFROM orders;',qs:[
{t:'mc',q:'What is the difference between COUNT(*) and COUNT(column)?',o:['Same thing','COUNT(*) counts all rows, COUNT(column) ignores NULLs','COUNT(column) is faster','No difference'],a:1,e:'COUNT(*) counts all rows; COUNT(column) skips NULL values.'},
{t:'mc',q:'What does COUNT(DISTINCT customer_id) do?',o:['Counts all customers','Counts unique customer IDs','Counts orders','Removes duplicates'],a:1,e:'DISTINCT makes COUNT count each value only once.'},
{t:'fill',q:'Complete the aggregation to find the highest price.',code:'SELECT ___ (price) FROM products;',a:['MAX'],e:'MAX returns the largest value in a column.'},
{t:'tf',q:'AVG includes NULL values in the average.',o:TF,a:1,e:'AVG ignores NULLs and averages the remaining values.'},
{t:'match',q:'Match each function to what it does.',pairs:[['SUM','total of a column'],['AVG','average value'],['MAX','highest value'],['COUNT','number of rows']],e:'Aggregate functions summarize data across rows.'}
]},
{t:'Multiple Grouping and Subqueries',c:'multigroupsub',teach:'GROUP BY multiple columns groups by each combination. SELECT year, month, SUM(sales) FROM transactions GROUP BY year, month breaks sales down by year and month. Subqueries are queries inside queries: SELECT * FROM (SELECT * FROM orders WHERE amount > 100) sub fetch a filtered set. Subqueries in WHERE: WHERE customer_id IN (SELECT id FROM customers WHERE country = \'USA\').',code:'SELECT year, month, SUM(sales) FROM sales GROUP BY year, month ORDER BY year, month;\nSELECT * FROM orders WHERE amount > (SELECT AVG(amount) FROM orders);',qs:[
{t:'mc',q:'What does GROUP BY year, month do?',o:['Groups by year, then month','Sorts by both columns','Creates rows for each year and month','Filters to matching rows'],a:0,e:'Multiple columns in GROUP BY create groups for each combination.'},
{t:'mc',q:'What is a subquery?',o:['A query in a column name','A query inside another query','Part of a JOIN','An outer query'],a:1,e:'A subquery is a SELECT statement nested inside another.'},
{t:'fill',q:'Complete the subquery to find orders above average.',code:'SELECT * FROM orders WHERE amount > (SELECT ___ (amount) FROM orders);',a:['AVG'],e:'The subquery computes the average, and the outer query filters.'},
{t:'tf',q:'A subquery can appear in WHERE, SELECT, or FROM clauses.',o:TF,a:0,e:'Subqueries are flexible and can be used in many places.'},
{t:'order',q:'Put in order to group by multiple columns.',items:['SELECT year, quarter, SUM(sales)','FROM sales','GROUP BY year, quarter','ORDER BY year, quarter'],e:'GROUP BY lists each column; the result has one row per combination.'}
]},
{t:'Checkpoint: JOINs and Aggregation',c:'check2',teach:'Review: INNER JOIN combines matching rows, LEFT/RIGHT JOIN keep all rows from one side. GROUP BY aggregates by column values; aggregate functions COUNT, SUM, AVG, MAX, MIN summarize rows. HAVING filters groups. Subqueries enable complex filtering and computation.',code:'SELECT c.name, COUNT(o.id) as order_count, SUM(o.amount) as total\nFROM customers c\nLEFT JOIN orders o ON c.id = o.customer_id\nGROUP BY c.name\nHAVING SUM(o.amount) > 500;',qs:[
{t:'mc',q:'What does this query return?',code:'SELECT c.name FROM customers c LEFT JOIN orders o ON c.id = o.customer_id WHERE o.id IS NULL;',o:['Customers with orders','Customers with no orders','All customers','No rows'],a:1,e:'WHERE o.id IS NULL after LEFT JOIN finds customers with no matching orders.'},
{t:'mc',q:'What does GROUP BY do before aggregates?',o:['Sorts rows','Partitions rows into groups','Filters rows','Renames columns'],a:1,e:'GROUP BY divides rows into groups, then aggregates compute per group.'},
{t:'fill',q:'Complete the query to show department salary totals.',code:'SELECT department, SUM(salary) FROM employees GROUP BY ___;',a:['department'],e:'GROUP BY the same column that appears in SELECT.'},
{t:'tf',q:'INNER JOIN and LEFT JOIN always return the same rows.',o:TF,a:1,e:'LEFT JOIN includes unmatched left rows (with NULL); INNER does not.'},
{t:'match',q:'Match each concept to its role.',pairs:[['JOIN','combine tables on a condition'],['GROUP BY','partition into groups'],['HAVING','filter groups after aggregation'],['Subquery','query within a query']],e:'These tools enable complex data analysis across tables.'}
]}
]});

U('sql',{t:'Unit 3 · Modifying Data',l:[
{t:'INSERT',c:'insert',teach:'INSERT INTO adds new rows to a table. INSERT INTO table (col1, col2) VALUES (val1, val2) inserts one row. VALUES (...), (...), (...) inserts multiple rows at once. Omit column names to insert into every column in order, but listing columns is safer. NULL for unspecified required columns causes an error.',code:'INSERT INTO pets (name, type, age) VALUES (\'Buddy\', \'dog\', 5);\nINSERT INTO pets (name, type, age) VALUES\n  (\'Whiskers\', \'cat\', 3),\n  (\'Nemo\', \'fish\', 1);',qs:[
{t:'mc',q:'What does INSERT INTO do?',o:['Selects rows','Adds new rows to a table','Updates existing rows','Deletes rows'],a:1,e:'INSERT INTO adds rows to a table.'},
{t:'mc',q:'What does this insert?',code:'INSERT INTO pets (name, age) VALUES (\'Rex\', 7);',o:['One row','Two rows','Nothing','An error'],a:0,e:'One VALUES clause inserts one row; type is not provided, so it will be NULL if nullable.'},
{t:'fill',q:'Complete the statement to add a single row.',code:'INSERT INTO products (name, price) ___ (\'Widget\', 9.99);',a:['VALUES'],e:'VALUES provides the data for the inserted row.'},
{t:'tf',q:'You must list all columns when using INSERT.',o:TF,a:1,e:'You can omit columns to insert NULL (if allowed) or a default value. Listing columns is safer.'},
{t:'match',q:'Match each part to its role.',pairs:[['INSERT INTO','specify table'],['(col1, col2)','choose columns'],['VALUES','provide data'],['(val1, val2)','one row of data']],e:'INSERT INTO table (columns) VALUES (values) adds a new row.'}
]},
{t:'UPDATE',c:'update',teach:'UPDATE modifies existing rows. UPDATE table SET col1 = val1, col2 = val2 WHERE condition changes rows matching the condition. Always use WHERE; without it, every row is updated. Use column names and expressions: SET salary = salary * 1.1 for a 10% raise.',code:'UPDATE employees SET salary = 50000 WHERE department = \'Sales\';\nUPDATE pets SET age = age + 1 WHERE type = \'cat\';',qs:[
{t:'mc',q:'What does UPDATE do?',o:['Adds rows','Modifies existing rows','Removes rows','Selects rows'],a:1,e:'UPDATE changes data in existing rows.'},
{t:'mc',q:'What does WHERE do in an UPDATE?',o:['Required syntax','Specifies which rows to update','Filters before modifying','Nothing; it is optional'],a:1,e:'WHERE identifies which rows to change; without it, all rows are modified.'},
{t:'fill',q:'Complete the update to raise all salaries by 1000.',code:'UPDATE employees SET salary = salary ___ 1000;',a:['+'],e:'The expression computes a new value based on the old value.'},
{t:'mc',q:'Find the bug: this update is dangerous.',code:'UPDATE products SET price = 99;',o:['price should be a string','This updates every row; use WHERE to limit it','99 needs quotes','UPDATE must use SET twice'],a:1,e:'Without WHERE, all rows are updated. Always check that WHERE limits the scope correctly.'},
{t:'order',q:'Put the clauses in order to update.',items:['UPDATE employees','SET salary = 60000','WHERE id = 5'],e:'UPDATE table, SET changes, WHERE conditions.'}
]},
{t:'DELETE',c:'delete',teach:'DELETE FROM removes rows. DELETE FROM table WHERE condition deletes rows matching the condition. Always use WHERE; without it, the entire table is emptied. Deletion is permanent. A DELETE with no WHERE should be avoided unless the intent is to clear the table.',code:'DELETE FROM orders WHERE customer_id = 3;\nDELETE FROM orders WHERE created_date < \'2020-01-01\';',qs:[
{t:'mc',q:'What does DELETE FROM do?',o:['Adds rows','Changes rows','Removes rows','Selects rows'],a:2,e:'DELETE FROM removes rows from a table.'},
{t:'mc',q:'What happens with DELETE FROM orders; without WHERE?',o:['One row is deleted','Rows are updated','The entire table is emptied','Nothing, the query fails'],a:2,e:'Without WHERE, all rows are deleted. Always use WHERE unless that is the intent.'},
{t:'fill',q:'Complete the delete to remove old orders.',code:'DELETE FROM orders WHERE created_date ___ \'2019-01-01\';',a:['<'],e:'< selects rows before the date.'},
{t:'tf',q:'DELETE can be undone with Ctrl+Z.',o:TF,a:1,e:'Once DELETE executes, the rows are gone. Use transactions to roll back if needed.'},
{t:'match',q:'Match each SQL command to what it does.',pairs:[['INSERT','add new rows'],['UPDATE','modify existing rows'],['DELETE','remove rows'],['SELECT','read rows']],e:'These four commands cover the main data operations.'}
]},
{t:'Transactions and Rollback',c:'transactions',teach:'Transactions group multiple operations so they all succeed or all fail together. BEGIN (or START TRANSACTION) starts a transaction, COMMIT saves changes, ROLLBACK undoes changes. Transactions ensure data integrity; if an error occurs mid-transaction, ROLLBACK restores the original state. Use them when related operations must all succeed.',code:'BEGIN;\nUPDATE accounts SET balance = balance - 100 WHERE id = 1;\nUPDATE accounts SET balance = balance + 100 WHERE id = 2;\nCOMMIT;',qs:[
{t:'mc',q:'What does COMMIT do?',o:['Starts a transaction','Saves changes permanently','Undoes changes','Ends the database'],a:1,e:'COMMIT makes all transaction changes permanent.'},
{t:'mc',q:'What does ROLLBACK do?',o:['Saves changes','Undoes all changes in the transaction','Starts a new transaction','Deletes the table'],a:1,e:'ROLLBACK reverts all changes to the state before BEGIN.'},
{t:'fill',q:'Complete the statement to start a transaction.',code:'___ BEGIN;',a:['BEGIN','START TRANSACTION'],e:'BEGIN starts a transaction; some databases use START TRANSACTION.'},
{t:'mc',q:'When should you use transactions?',o:['Always, for every statement','For related operations that must all succeed','For SELECT statements only','Never, they slow things down'],a:1,e:'Use transactions when multiple operations are interdependent.'},
{t:'order',q:'Put in order to transfer money safely.',items:['BEGIN;','UPDATE accounts SET balance = balance - 100 WHERE id = 1;','UPDATE accounts SET balance = balance + 100 WHERE id = 2;','COMMIT;'],e:'BEGIN, perform updates, then COMMIT to make all changes at once.'}
]},
{t:'TRUNCATE and DROP',c:'truncatetable',teach:'TRUNCATE TABLE removes all rows but keeps the table structure; it is faster than DELETE but cannot be rolled back in some databases. DROP TABLE deletes the entire table, including structure and data. ALTER TABLE modifies table structure: ADD COLUMN, DROP COLUMN, RENAME COLUMN.',code:'TRUNCATE TABLE logs;\nDROP TABLE old_data;\nALTER TABLE employees ADD COLUMN bonus DECIMAL(10, 2);',qs:[
{t:'mc',q:'What is the difference between TRUNCATE and DELETE?',o:['Same thing','TRUNCATE is faster and removes all rows; DELETE uses WHERE','DELETE is faster','No difference'],a:1,e:'TRUNCATE empties the table quickly; DELETE removes rows one by one.'},
{t:'mc',q:'What does DROP TABLE do?',o:['Removes all rows','Removes the table structure and all data','Empties the table','Renames the table'],a:1,e:'DROP TABLE deletes the entire table.'},
{t:'fill',q:'Complete the alter to add a column.',code:'ALTER TABLE employees ADD COLUMN salary ___;}',a:['DECIMAL','DECIMAL(10, 2)','DECIMAL(10,2)'],e:'DECIMAL specifies a numeric type for currency or precise values.'},
{t:'tf',q:'TRUNCATE can be rolled back if done in a transaction.',o:TF,a:1,e:'Most SQL databases cannot roll back TRUNCATE, even in transactions. DELETE can be rolled back.'},
{t:'match',q:'Match each operation to its effect.',pairs:[['TRUNCATE','empty table, keep structure'],['DROP','delete table entirely'],['DELETE','remove specific rows'],['ALTER','modify table structure']],e:'Different operations have different scopes and reversibility.'}
]},
{t:'Checkpoint: Modifying Data',c:'check3',teach:'Review: INSERT adds rows, UPDATE modifies them, DELETE removes them. Always use WHERE to limit scope. Transactions group operations for safety; COMMIT saves, ROLLBACK undoes. TRUNCATE empties tables, DROP deletes them. ALTER TABLE changes structure. Careful use prevents data loss.',code:'BEGIN;\nINSERT INTO accounts (name, balance) VALUES (\'Alice\', 1000);\nUPDATE accounts SET balance = balance + 50 WHERE name = \'Bob\';\nDELETE FROM accounts WHERE balance < 0;\nCOMMIT;',qs:[
{t:'mc',q:'What does this transaction do?',code:'BEGIN;\nUPDATE products SET price = 99 WHERE id = 5;\nROLLBACK;',o:['Price is set to 99','Price is unchanged','An error occurs','The table is deleted'],a:1,e:'ROLLBACK undoes the UPDATE, so the price remains unchanged.'},
{t:'mc',q:'What is safest when deleting rows?',o:['DELETE without WHERE is fastest','Use DELETE with a specific WHERE clause','Use TRUNCATE for speed','Delete by renaming the table'],a:1,e:'WHERE prevents accidental deletion of unintended rows.'},
{t:'fill',q:'Complete the transaction to safely insert and update.',code:'BEGIN;\nINSERT INTO users (name) VALUES (\'Eve\');\nUPDATE users SET status = \'active\' WHERE name = \'Eve\';\n___;}',a:['COMMIT'],e:'COMMIT saves both the insert and update as one atomic operation.'},
{t:'tf',q:'DELETE rows can be recovered with ROLLBACK if in a transaction.',o:TF,a:0,e:'Within a transaction, ROLLBACK reverts deletes. After COMMIT, recovery depends on backups.'},
{t:'match',q:'Match each safety practice to its benefit.',pairs:[['USE WHERE','limit scope of changes'],['USE TRANSACTIONS','atomic operations'],['Test on copy','avoid production errors'],['ROLLBACK when wrong','undo mistakes']],e:'These practices prevent costly data loss.'}
]}
]});

U('sql',{t:'Unit 4 · Advanced Queries',l:[
{t:'Subqueries in SELECT and FROM',c:'subqueryselect',teach:'Subqueries in SELECT can return a single value or a row. SELECT (SELECT MAX(salary) FROM employees) as highest_pay returns one scalar. Subqueries in FROM create a temporary table: FROM (SELECT * FROM orders WHERE amount > 100) as big_orders filters before the outer query. Alias the subquery result with AS.',code:'SELECT name, salary,\n  (SELECT AVG(salary) FROM employees) as avg_salary\nFROM employees;\nSELECT avg_order FROM\n  (SELECT AVG(amount) as avg_order FROM orders) sub;',qs:[
{t:'mc',q:'What does a scalar subquery in SELECT return?',o:['Multiple rows','One value per row','NULL','Error'],a:1,e:'A scalar subquery returns one value, used in the SELECT list.'},
{t:'mc',q:'What is a subquery in FROM called?',o:['Derived table','Nested query','Inline view','All of these'],a:3,e:'A subquery in FROM is a temporary table, often called a derived table or subquery.'},
{t:'fill',q:'Complete the subquery alias.',code:'SELECT * FROM (SELECT * FROM orders WHERE amount > 100) ___',a:['as sub','sub'],e:'Subqueries in FROM need an alias to reference them.'},
{t:'tf',q:'A subquery in SELECT can return multiple rows.',o:TF,a:1,e:'A scalar subquery returns one value. Multiple rows cause an error.'},
{t:'order',q:'Put in order to use a derived table.',items:['SELECT total_orders FROM','(SELECT COUNT(*) as total_orders FROM orders) sub'],e:'Subquery in FROM, then reference it in outer SELECT.'}
]},
{t:'UNION and Set Operations',c:'union',teach:'UNION combines results from multiple queries into one result set, removing duplicates. UNION ALL keeps duplicates. Queries must have the same number of columns with compatible types. Column names come from the first query. Use UNION to merge partial results or data from different sources.',code:'SELECT name FROM customers WHERE country = \'USA\'\nUNION\nSELECT name FROM leads WHERE country = \'USA\'\nORDER BY name;',qs:[
{t:'mc',q:'What does UNION do?',o:['Joins tables','Combines query results, removing duplicates','Groups rows','Filters results'],a:1,e:'UNION merges multiple queries\' results and removes duplicate rows.'},
{t:'mc',q:'What is the difference between UNION and UNION ALL?',o:['Same thing','UNION removes duplicates, UNION ALL keeps them','UNION is faster','No real difference'],a:1,e:'UNION deduplicates; UNION ALL keeps all rows including duplicates.'},
{t:'fill',q:'Complete the set operation to combine results without removing duplicates.',code:'SELECT id FROM orders\n___\nSELECT id FROM archived_orders;',a:['UNION ALL'],e:'UNION ALL includes all rows from both queries.'},
{t:'mc',q:'What must be true for two queries to use UNION?',o:['Same column names','Same order','Same number of columns with compatible types','Both SELECT *'],a:2,e:'UNION queries need matching column counts and types.'},
{t:'match',q:'Match each set operation to its behavior.',pairs:[['UNION','combine, remove duplicates'],['UNION ALL','combine, keep duplicates'],['ORDER BY','sort final result'],['AS alias','name a column']],e:'Set operations merge query results efficiently.'}
]},
{t:'Window Functions',c:'window',teach:'Window functions perform calculations over a set of rows while keeping individual rows. ROW_NUMBER() assigns a row number per partition. RANK() and DENSE_RANK() rank rows. LAG() and LEAD() access previous/next rows. OVER(PARTITION BY ... ORDER BY ...) defines the window. Use them for rankings, running totals, and comparisons.',code:'SELECT name, salary,\n  ROW_NUMBER() OVER (ORDER BY salary DESC) as rank,\n  LAG(salary) OVER (ORDER BY salary DESC) as prev_salary\nFROM employees;',qs:[
{t:'mc',q:'What does ROW_NUMBER() do?',o:['Counts rows','Assigns a unique row number','Ranks rows with ties','Finds gaps'],a:1,e:'ROW_NUMBER() gives each row a sequential number.'},
{t:'mc',q:'What is the OVER clause for?',o:['Specifies the window','Opens a connection','Starts a transaction','Joins tables'],a:0,e:'OVER defines the window: how rows are partitioned and ordered.'},
{t:'fill',q:'Complete the window function to rank employees by salary.',code:'SELECT name, salary, RANK() ___ (ORDER BY salary DESC) FROM employees;',a:['OVER'],e:'OVER specifies how rows are ordered for the window function.'},
{t:'tf',q:'Window functions remove rows from the result like WHERE does.',o:TF,a:1,e:'Window functions keep all rows and add computed columns; they do not filter.'},
{t:'match',q:'Match each window function to its purpose.',pairs:[['ROW_NUMBER()','sequential numbering'],['RANK()','ranking with ties'],['LAG()','access previous row'],['LEAD()','access next row']],e:'Window functions enable complex analytics while preserving all rows.'}
]},
{t:'Common Table Expressions (CTE)',c:'cte',teach:'CTEs (WITH clauses) create temporary named queries reused in the main query. WITH cte AS (SELECT ...) main_query uses cte. CTEs improve readability and avoid repeating complex subqueries. Recursive CTEs can process hierarchical or recursive data.',code:'WITH recent_orders AS (\n  SELECT customer_id, SUM(amount) as total\n  FROM orders WHERE created_date > \'2024-01-01\'\n  GROUP BY customer_id\n)\nSELECT c.name, ro.total FROM customers c\nJOIN recent_orders ro ON c.id = ro.customer_id;',qs:[
{t:'mc',q:'What is a CTE?',o:['A table in the database','A named temporary result used in a query','A view','A transaction'],a:1,e:'A CTE (Common Table Expression) is a temporary named query used in the main query.'},
{t:'mc',q:'Where does the WITH clause go?',o:['After SELECT','Before SELECT, at the start','At the end','In JOIN'],a:1,e:'WITH starts the query; it defines CTEs before the main SELECT.'},
{t:'fill',q:'Complete the CTE definition.',code:'___ top_products AS (SELECT * FROM products WHERE price > 1000)',a:['WITH'],e:'WITH introduces a CTE.'},
{t:'tf',q:'A CTE is permanent like a database view.',o:TF,a:1,e:'CTEs exist only for the current query; views are permanent database objects.'},
{t:'order',q:'Put in order to use a CTE.',items:['WITH high_earners AS (','SELECT * FROM employees WHERE salary > 100000)','SELECT * FROM high_earners','WHERE department = \'IT\''],e:'WITH defines the CTE, then main query uses it.'}
]},
{t:'Indexes and Performance',c:'indexperf',teach:'Indexes speed up queries by creating sorted structures for fast lookup. CREATE INDEX idx_name ON table(column) adds an index. Without indexes, queries scan every row. Indexes slow down INSERT and UPDATE slightly but speed up SELECT. Use indexes on columns in WHERE, JOIN ON, and ORDER BY.',code:'CREATE INDEX idx_email ON users(email);\nCREATE INDEX idx_date ON orders(order_date);\nSELECT * FROM orders WHERE order_date = \'2024-01-15\';',qs:[
{t:'mc',q:'What do indexes do?',o:['Store data','Speed up queries by enabling fast lookups','Replace WHERE','Encrypt the database'],a:1,e:'Indexes enable fast access to rows without scanning every one.'},
{t:'mc',q:'What is a tradeoff with indexes?',o:['No tradeoff','They slow updates but speed queries','They break queries','They require more RAM'],a:1,e:'Indexes accelerate SELECT but slow INSERT and UPDATE slightly.'},
{t:'fill',q:'Complete the index creation on the id column.',code:'CREATE INDEX idx_id ON customers (___);',a:['id'],e:'Specify the column to index.'},
{t:'tf',q:'Indexes always improve performance.',o:TF,a:1,e:'Indexes help SELECT but hinder INSERT/UPDATE. They are beneficial when reads far outnumber writes.'},
{t:'match',q:'Match each concept to its role.',pairs:[['Index','speed up lookups'],['WHERE','filter rows'],['SELECT *','retrieve columns'],['ORDER BY','sort results']],e:'Indexes work with queries to optimize performance.'}
]},
{t:'Capstone: Advanced SQL',c:'capstone',teach:'Combine all skills: write complex queries with JOINs, subqueries, window functions, CTEs, and aggregations. Optimize with indexes. Use transactions for data integrity. Analyze real scenarios: find top customers, track trends, detect anomalies. Write clear SQL; reuse logic with CTEs; test edge cases.',code:'WITH customer_stats AS (\n  SELECT customer_id, COUNT(*) as num_orders, SUM(amount) as total\n  FROM orders WHERE year = 2024\n  GROUP BY customer_id\n),\nranked AS (\n  SELECT c.name, cs.num_orders, cs.total,\n    RANK() OVER (ORDER BY cs.total DESC) as rank\n  FROM customers c JOIN customer_stats cs ON c.id = cs.customer_id\n)\nSELECT * FROM ranked WHERE rank <= 10;',qs:[
{t:'mc',q:'What do the multiple CTEs do?',o:['They conflict','customer_stats computes totals; ranked adds ranking','They are unnecessary','They query the same data'],a:1,e:'Each CTE solves one part; the final query combines them.'},
{t:'mc',q:'Why use a CTE instead of a subquery?',o:['Performance','Readability and reusability','Required for ranking','No reason'],a:1,e:'CTEs make complex queries clearer by naming intermediate results.'},
{t:'fill',q:'Complete the CTE keyword.',code:'___ high_value_orders AS (SELECT * FROM orders WHERE amount > 5000)',a:['WITH'],e:'WITH starts the CTE definition.'},
{t:'tf',q:'Window functions and CTEs can be used together.',o:TF,a:0,e:'Both are powerful features that combine well for complex analytics.'},
{t:'match',q:'Match each advanced feature to its use.',pairs:[['Subquery','query within query'],['CTE','reusable named query'],['Window function','rank or compare rows'],['Index','speed lookups']],e:'Together, these create efficient, readable, maintainable SQL.'}
]}
]});

C({id:'blocks',name:'Visual Programming with Blocks',badge:'VB',lvl:'Beginner',pre:'none',goal:'Learn programming fundamentals through visual block-based programming'});
U('blocks',{t:'Unit 1',l:[{t:'Starting and Stopping',c:'u1l1',teach:'Programs begin with a start block and end with a stop block. Every visual program needs a clear entry point and a way to terminate. Start blocks trigger when the program runs, and stop blocks cleanly end execution.',code:'// Starting and Stopping block example',qs:[{t:'mc',q:'What is the main purpose of starting and stopping?',o:['Store data','Control flow','Create animations','Handle events'],a:1,e:'Understanding the purpose helps you use blocks effectively.'},{t:'tf',q:'Starting and Stopping is essential for interactive programs.',o:['True','False'],a:0,e:'This concept is fundamental to block-based programming.'},{t:'fill',q:'The block that _____ is used for control flow.',code:'block = ___',a:['repeat','if','wait'],e:'Several blocks serve different control purposes.'},{t:'match',q:'Match blocks to their function.',pairs:[['move forward','change position'],['repeat','run multiple times'],['if','conditional execution'],['broadcast','send message']],e:'Each block type has a specific purpose.'},{t:'order',q:'Put these steps in logical order.',items:['Set up the sprite','Define event handler','Respond to input'],e:'This is the typical program flow.'}]},{t:'Events and Triggers',c:'u1l2',teach:'Events are things that happen: mouse click, key press, sprite clicked. Blocks listen for events and run code when triggered. Event-driven programming makes interactive and responsive applications that react to user input.',code:'// Events and Triggers block example',qs:[{t:'mc',q:'What is the main purpose of events and triggers?',o:['Store data','Control flow','Create animations','Handle events'],a:1,e:'Understanding the purpose helps you use blocks effectively.'},{t:'tf',q:'Events and Triggers is essential for interactive programs.',o:['True','False'],a:0,e:'This concept is fundamental to block-based programming.'},{t:'fill',q:'The block that _____ is used for control flow.',code:'block = ___',a:['repeat','if','wait'],e:'Several blocks serve different control purposes.'},{t:'match',q:'Match blocks to their function.',pairs:[['move forward','change position'],['repeat','run multiple times'],['if','conditional execution'],['broadcast','send message']],e:'Each block type has a specific purpose.'},{t:'order',q:'Put these steps in logical order.',items:['Set up the sprite','Define event handler','Respond to input'],e:'This is the typical program flow.'}]},{t:'Sprites and Costumes',c:'u1l3',teach:'A sprite is a character or object on stage. Each sprite has a costume (appearance). You can switch costumes to animate. Multiple sprites work together to create scenes and tell stories with code.',code:'// Sprites and Costumes block example',qs:[{t:'mc',q:'What is the main purpose of sprites and costumes?',o:['Store data','Control flow','Create animations','Handle events'],a:1,e:'Understanding the purpose helps you use blocks effectively.'},{t:'tf',q:'Sprites and Costumes is essential for interactive programs.',o:['True','False'],a:0,e:'This concept is fundamental to block-based programming.'},{t:'fill',q:'The block that _____ is used for control flow.',code:'block = ___',a:['repeat','if','wait'],e:'Several blocks serve different control purposes.'},{t:'match',q:'Match blocks to their function.',pairs:[['move forward','change position'],['repeat','run multiple times'],['if','conditional execution'],['broadcast','send message']],e:'Each block type has a specific purpose.'},{t:'order',q:'Put these steps in logical order.',items:['Set up the sprite','Define event handler','Respond to input'],e:'This is the typical program flow.'}]},{t:'The Stage and Backdrop',c:'u1l4',teach:'The stage is where sprites appear. Backdrops set the scene (forest, space, classroom). Scripts can change the backdrop to set scenes. The coordinate system has x and y positions for placing sprites anywhere.',code:'// The Stage and Backdrop block example',qs:[{t:'mc',q:'What is the main purpose of the stage and backdrop?',o:['Store data','Control flow','Create animations','Handle events'],a:1,e:'Understanding the purpose helps you use blocks effectively.'},{t:'tf',q:'The Stage and Backdrop is essential for interactive programs.',o:['True','False'],a:0,e:'This concept is fundamental to block-based programming.'},{t:'fill',q:'The block that _____ is used for control flow.',code:'block = ___',a:['repeat','if','wait'],e:'Several blocks serve different control purposes.'},{t:'match',q:'Match blocks to their function.',pairs:[['move forward','change position'],['repeat','run multiple times'],['if','conditional execution'],['broadcast','send message']],e:'Each block type has a specific purpose.'},{t:'order',q:'Put these steps in logical order.',items:['Set up the sprite','Define event handler','Respond to input'],e:'This is the typical program flow.'}]},{t:'Coordinates and Positioning',c:'u1l5',teach:'Each sprite has x and y coordinates. Moving to (0, 0) centers the sprite. Positive x goes right, positive y goes up. Understanding coordinates lets you position sprites precisely and create movement patterns.',code:'// Coordinates and Positioning block example',qs:[{t:'mc',q:'What is the main purpose of coordinates and positioning?',o:['Store data','Control flow','Create animations','Handle events'],a:1,e:'Understanding the purpose helps you use blocks effectively.'},{t:'tf',q:'Coordinates and Positioning is essential for interactive programs.',o:['True','False'],a:0,e:'This concept is fundamental to block-based programming.'},{t:'fill',q:'The block that _____ is used for control flow.',code:'block = ___',a:['repeat','if','wait'],e:'Several blocks serve different control purposes.'},{t:'match',q:'Match blocks to their function.',pairs:[['move forward','change position'],['repeat','run multiple times'],['if','conditional execution'],['broadcast','send message']],e:'Each block type has a specific purpose.'},{t:'order',q:'Put these steps in logical order.',items:['Set up the sprite','Define event handler','Respond to input'],e:'This is the typical program flow.'}]},{t:'Checkpoint: Unit 1 Review',c:'u1l6',teach:'Review the key block concepts from Unit 1. Practice combining blocks to create interactive programs. Understanding visual programming fundamentals prepares you for advanced projects.',code:'// Unit 1 checkpoint: combine blocks',qs:[{t:'mc',q:'Which blocks are most commonly used together?',o:['Move and turn','Sound and sprite','Wait and repeat','All of the above'],a:3,e:'Great blocks combine multiple concepts.'},{t:'tf',q:'You understand how to chain blocks together.',o:['True','False'],a:0,e:'Block composition is key to creating programs.'},{t:'fill',q:'To repeat code, use the _____ block.',code:'block = ___',a:['repeat','forever'],e:'Loops are essential for animation and control.'},{t:'match',q:'Recall block categories.',pairs:[['Motion','move and turn'],['Control','if and repeat'],['Sensing','user input'],['Sound','audio effects']],e:'Organizing blocks by category helps understanding.'},{t:'order',q:'Steps to create an interactive program.',items:['Plan the program','Add sprites and backdrops','Attach event handlers','Test and debug'],e:'This is the development workflow.'}]}]});
U('blocks',{t:'Unit 2',l:[{t:'Moving and Direction',c:'u2l1',teach:'Move forward block advances the sprite. Turn right/left blocks rotate. Point towards blocks face a direction. Combining these creates paths and animations. Direction is measured in degrees (0=up, 90=right, 180=down, 270=left).',code:'// Moving and Direction block example',qs:[{t:'mc',q:'What is the main purpose of moving and direction?',o:['Store data','Control flow','Create animations','Handle events'],a:1,e:'Understanding the purpose helps you use blocks effectively.'},{t:'tf',q:'Moving and Direction is essential for interactive programs.',o:['True','False'],a:0,e:'This concept is fundamental to block-based programming.'},{t:'fill',q:'The block that _____ is used for control flow.',code:'block = ___',a:['repeat','if','wait'],e:'Several blocks serve different control purposes.'},{t:'match',q:'Match blocks to their function.',pairs:[['move forward','change position'],['repeat','run multiple times'],['if','conditional execution'],['broadcast','send message']],e:'Each block type has a specific purpose.'},{t:'order',q:'Put these steps in logical order.',items:['Set up the sprite','Define event handler','Respond to input'],e:'This is the typical program flow.'}]},{t:'Repeat Loops',c:'u2l2',teach:'Repeat blocks run code multiple times. Repeat 10 times runs the inner blocks ten times. Forever loops run indefinitely until stopped. Loops avoid rewriting the same code and power animations and continuous behaviors.',code:'// Repeat Loops block example',qs:[{t:'mc',q:'What is the main purpose of repeat loops?',o:['Store data','Control flow','Create animations','Handle events'],a:1,e:'Understanding the purpose helps you use blocks effectively.'},{t:'tf',q:'Repeat Loops is essential for interactive programs.',o:['True','False'],a:0,e:'This concept is fundamental to block-based programming.'},{t:'fill',q:'The block that _____ is used for control flow.',code:'block = ___',a:['repeat','if','wait'],e:'Several blocks serve different control purposes.'},{t:'match',q:'Match blocks to their function.',pairs:[['move forward','change position'],['repeat','run multiple times'],['if','conditional execution'],['broadcast','send message']],e:'Each block type has a specific purpose.'},{t:'order',q:'Put these steps in logical order.',items:['Set up the sprite','Define event handler','Respond to input'],e:'This is the typical program flow.'}]},{t:'Conditionals: If and Else',c:'u2l3',teach:'If blocks check conditions and run code only if true. If-else blocks run different code depending on the condition. Conditions compare values: equals, greater than, less than. Conditionals make programs make decisions.',code:'// Conditionals: If and Else block example',qs:[{t:'mc',q:'What is the main purpose of conditionals: if and else?',o:['Store data','Control flow','Create animations','Handle events'],a:1,e:'Understanding the purpose helps you use blocks effectively.'},{t:'tf',q:'Conditionals: If and Else is essential for interactive programs.',o:['True','False'],a:0,e:'This concept is fundamental to block-based programming.'},{t:'fill',q:'The block that _____ is used for control flow.',code:'block = ___',a:['repeat','if','wait'],e:'Several blocks serve different control purposes.'},{t:'match',q:'Match blocks to their function.',pairs:[['move forward','change position'],['repeat','run multiple times'],['if','conditional execution'],['broadcast','send message']],e:'Each block type has a specific purpose.'},{t:'order',q:'Put these steps in logical order.',items:['Set up the sprite','Define event handler','Respond to input'],e:'This is the typical program flow.'}]},{t:'Timing and Delays',c:'u2l4',teach:'Wait blocks pause execution for a duration. Wait 1 second pauses one second. Timing creates animation frames and choreography. Combining waits with loops creates smooth, timed effects.',code:'// Timing and Delays block example',qs:[{t:'mc',q:'What is the main purpose of timing and delays?',o:['Store data
