U('ts',{t:'Unit 1 · Basics',l:[
{t:'Compiling and Output',c:'compile',teach:'TypeScript adds types to JavaScript, but browsers and Node only run JavaScript. You compile TypeScript to JavaScript using tsc (TypeScript compiler). The simplest program logs output with console.log. Compilation catches type errors before runtime, which JavaScript does not do. Save your code as a .ts file, run tsc filename.ts to create a .js file, then run it with node.',code:'const message: string = "Hello, TypeScript";\nconsole.log(message);',qs:[
{t:'mc',q:'What file extension do TypeScript source files use?',o:['.js','.ts','.tsx','.script'],a:1,e:'TypeScript files are .ts. After compilation, they become .js files.'},
{t:'mc',q:'What command compiles a TypeScript file to JavaScript?',o:['run test.ts','tsc test.ts','compile test.ts','jsx test.ts'],a:1,e:'tsc is the TypeScript compiler. Running tsc test.ts creates test.js.'},
{t:'tf',q:'TypeScript code runs directly in the browser without compilation.',o:TF,a:1,e:'TypeScript must be compiled to JavaScript first. Browsers and Node cannot execute TypeScript directly.'},
{t:'fill',q:'Complete the command to compile myapp.ts to JavaScript.',code:'___ myapp.ts',a:['tsc'],e:'The tsc command (TypeScript Compiler) translates .ts files to .js.'},
{t:'mc',q:'What does this code do when compiled and run?',code:'const x: number = 42;\nconsole.log(x);',o:['Logs 42 to the console','Throws a type error during compilation','Prints "42" as a string','Creates a file named x'],a:0,e:'The code is valid TypeScript that compiles to JavaScript and logs 42 to the console.'}
]},
{t:'Variables and Types',c:'types',teach:'TypeScript lets you declare the type of a variable with a colon. The types include number, string, boolean, null, and undefined. You can also omit the type and let TypeScript infer it from the assigned value. Prefer explicit types for function parameters and return values. A type error at compile time is caught before your code runs, unlike JavaScript.',code:'let age: number = 30;\nlet name: string = "Alice";\nlet isActive: boolean = true;\nconst score = 100;\nconsole.log(age, name, isActive, score);',qs:[
{t:'mc',q:'How do you declare a variable with an explicit type in TypeScript?',o:['let x as number','let x: number','let x -> number','let x#number'],a:1,e:'TypeScript uses a colon (:) between the name and type.'},
{t:'mc',q:'What is the inferred type of x?',code:'const x = "hello";',o:['string','text','String','unknown'],a:0,e:'TypeScript infers the type from the value. "hello" is a string, so x is string.'},
{t:'mc',q:'What happens if you assign the wrong type?',code:'let count: number = "five";',o:['It compiles and runs fine','TypeScript shows a type error at compile time','It converts the string to a number','It prints a warning but continues'],a:1,e:'TypeScript rejects assigning a string to a number variable. You must fix the type error before compiling.'},
{t:'fill',q:'Fill in the type for a variable holding a true or false value.',code:'let isValid: ___ = true;',a:['boolean'],e:'The boolean type in TypeScript holds true or false values.'},
{t:'order',q:'Put the lines in order to declare and use a typed variable.',items:['let age: number = 25;','age = age + 1;','console.log(age);','console.log("done");'],e:'Declare the variable, modify it, then print twice with different messages.'}
]},
{t:'Operators and Expressions',c:'ops',teach:'TypeScript uses the same operators as JavaScript: +, -, *, /, % for arithmetic, and ===, !==, <, > for comparison. String concatenation with + works the same. The key difference is that TypeScript catches mistakes like comparing incompatible types. Boolean operators like &&, ||, and ! work the same. Avoid == and !=, which do type coercion.',code:'const x: number = 10;\nconst y: number = 3;\nconsole.log(x + y);\nconsole.log(x % y);\nconsole.log(x > y);\nconsole.log(x === y);',qs:[
{t:'mc',q:'What does this print?',code:'const a: number = 7;\nconst b: number = 2;\nconsole.log(a % b);',o:['3','3.5','1','0'],a:2,e:'7 % 2 is 1 (the remainder when 7 is divided by 2).'},
{t:'mc',q:'Which expression is true?',o:['5 === "5"','5 == "5"','5 > "3"','5 !== 5'],a:1,e:'=== compares strict type and value, so a number is never equal to a string. == does type coercion and is best avoided.'},
{t:'fill',q:'Fill in the operator to check if two values are not equal.',code:'if (x ___ 5) {\n  console.log("not five");\n}',a:['!=='],e:'!== is the strict inequality operator in TypeScript.'},
{t:'tf',q:'In TypeScript, the + operator always adds numbers.',o:TF,a:1,e:'If one operand is a string, + joins them as text: 1 + "2" becomes "12".'},
{t:'mc',q:'What does this print?',code:'const name: string = "Alex";\nconst greeting: string = "Hello, " + name;\nconsole.log(greeting);',o:['Hello, Alex','Hello, + Alex','name','undefined'],a:0,e:'The + operator joins the strings "Hello, " and "Alex" to produce "Hello, Alex".'}
]},
{t:'Conditionals',c:'cond',teach:'if, else if, and else branch based on boolean conditions, just like JavaScript. TypeScript checks that the condition is actually a boolean or something truthiness can be evaluated on. Values like 0, empty strings, null, undefined, and false are falsy; everything else is truthy. The ternary operator cond ? a : b picks between two values and works the same way.',code:'const score: number = 85;\nif (score >= 90) {\n  console.log("A");\n} else if (score >= 80) {\n  console.log("B");\n} else {\n  console.log("C");\n}',qs:[
{t:'mc',q:'What does this print?',code:'const age: number = 16;\nif (age >= 18) {\n  console.log("adult");\n} else {\n  console.log("minor");\n}',o:['adult','minor','16','true'],a:1,e:'16 is not >= 18, so the else branch runs.'},
{t:'mc',q:'What does this print?',code:'const x: number = 5;\nconst result: string = x > 3 ? "yes" : "no";\nconsole.log(result);',o:['yes','no','5','x > 3'],a:0,e:'The ternary operator checks if 5 > 3 (true) and returns "yes".'},
{t:'fill',q:'Fill in the keyword for the branch when a condition is false.',code:'if (x > 0) {\n  console.log("positive");\n} ___ {\n  console.log("not positive");\n}',a:['else'],e:'else runs when the if condition is false.'},
{t:'tf',q:'In TypeScript, the condition in an if statement must be a boolean.',o:TF,a:0,e:'Any value can be a condition, and TypeScript evaluates its truthiness. Falsy: 0, "", false, null, undefined, NaN.'},
{t:'mc',q:'Find the bug: what is wrong with this code?',code:'const num: number = 10;\nif (num = 5) {\n  console.log("equal");\n}',o:['= assigns instead of comparing; use ===','num is reassigned which is not allowed','if needs a boolean condition, not a number','= cannot be used inside if parentheses'],a:0,e:'A single = assigns a value. Use === to compare. This assigns 5 to num instead of testing equality.'}
]},
{t:'Loops',c:'loops',teach:'A for loop repeats code a set number of times. The form is for (let i = 0; i < limit; i++) { body }. A while loop repeats while a condition is true. Both require a way to stop looping or you get an infinite loop. TypeScript does not change loops from JavaScript, but adds type safety. You can declare typed variables inside the loop.',code:'for (let i: number = 0; i < 3; i++) {\n  console.log(i);\n}\nlet j: number = 0;\nwhile (j < 3) {\n  console.log(j);\n  j = j + 1;\n}',qs:[
{t:'mc',q:'How many times does this loop print?',code:'for (let i: number = 0; i < 5; i++) {\n  console.log("hi");\n}',o:['4 times','5 times','6 times','infinite'],a:1,e:'The loop runs when i is 0, 1, 2, 3, 4. When i becomes 5, the condition i < 5 is false and the loop stops.'},
{t:'mc',q:'What does this loop print?',code:'for (let i: number = 1; i <= 3; i++) {\n  console.log(i);\n}',o:['0 1 2 3','1 2 3','1 2','2 3 4'],a:1,e:'The loop starts at i=1 and continues while i <= 3, so i is 1, 2, and 3.'},
{t:'fill',q:'Complete the while condition to loop while x is less than 10.',code:'let x: number = 0;\nwhile (x ___ 10) {\n  x = x + 1;\n}',a:['<'],e:'The < operator checks if x is less than 10.'},
{t:'tf',q:'A for loop must always have exactly three parts inside the parentheses.',o:TF,a:0,e:'Yes, a for loop has init, condition, and increment: for (init; cond; inc).'},
{t:'mc',q:'What does this print?',code:'for (let i: number = 5; i > 2; i--) {\n  console.log(i);\n}',o:['5 4 3','5 4 3 2','2 3 4 5','infinite'],a:0,e:'The loop counts down from 5 while i > 2, printing 5, 4, and 3. When i is 2, the condition is false.'}
]},
{t:'Checkpoint: Basics',c:'cp1',teach:'Review: TypeScript adds type annotations to JavaScript. Compile .ts files to .js with tsc. Use let and const with types or let TypeScript infer. Operators work like JavaScript: ===, <, >, +, -, *, /, %. Conditionals and loops control program flow. Every variable has a type checked at compile time.',code:'const name: string = "Bob";\nlet score: number = 0;\nfor (let i: number = 0; i < 5; i++) {\n  score = score + i;\n}\nconsole.log(`${name} scored ${score}`);',qs:[
{t:'mc',q:'What does this print?',code:'const x: number = 10;\nconst y: number = 3;\nconsole.log(x % y);',o:['3','3.33','1','7'],a:2,e:'10 % 3 is 1, the remainder.'},
{t:'mc',q:'What is the type of greeting?',code:'const greeting = "Welcome";',o:['string','String','text','unknown'],a:0,e:'TypeScript infers the type from the value. "Welcome" is a string.'},
{t:'order',q:'Put the lines in order to print "Done" after a countdown from 3 to 1.',items:['for (let i: number = 3; i > 0; i--) {','  console.log(i);','}','console.log("Done");'],e:'The loop counts down from 3 to 1, then the final log runs after.'},
{t:'match',q:'Match each operator to its meaning.',pairs:[['===','strict equality'],['%','remainder'],['>','greater than'],['!==','not equal']],e:'These operators compare and test values.'},
{t:'mc',q:'Find the bug: why does this code not work?',code:'let age: number = "25";\nconsole.log(age);',o:['You cannot assign a string to a number variable','The type should be string, not number','age must be initialized with a number','const should be used instead of let'],a:0,e:'TypeScript rejects assigning "25" (a string) to age (number type).'}
]}
]});

U('ts',{t:'Unit 2 · Functions and Data',l:[
{t:'Functions and Types',c:'fntypes',teach:'A function in TypeScript has types for parameters and the return value. Write function name(param: type): returnType { body }. The return type is optional but recommended. Parameters are required by default unless you add ? to make them optional, like param?: string. If a function does not return a value, its return type is void. Type safety prevents passing the wrong types to functions.',code:'function greet(name: string): string {\n  return "Hello, " + name;\n}\nfunction logNumber(n: number): void {\n  console.log(n);\n}\nconsole.log(greet("Alice"));\nlogNumber(42);',qs:[
{t:'mc',q:'How do you declare a function parameter with a type?',o:['function f(x number)','function f(x: number)','function f(number x)','function f(x->number)'],a:1,e:'Use a colon between the name and type: param: type.'},
{t:'mc',q:'What is the return type of this function?',code:'function double(n: number): number {\n  return n * 2;\n}',o:['string','void','number','any'],a:2,e:'The function returns a number after the colon.'},
{t:'fill',q:'Fill in the return type for a function that returns true or false.',code:'function isEven(n: number): ___ {\n  return n % 2 === 0;\n}',a:['boolean'],e:'The function returns a boolean value.'},
{t:'tf',q:'All function parameters in TypeScript must have a type annotation.',o:TF,a:0,e:'Yes, parameters must be typed. The return type is recommended but technically optional.'},
{t:'mc',q:'What does this function do when called with (5)?',code:'function add(a: number, b: number): number {\n  return a + b;\n}\nconsole.log(add(5, 3));',o:['Prints 8','Prints 5','Prints 3','Type error because 5 lacks a type'],a:0,e:'The function adds 5 and 3, returning 8.'}
]},
{t:'Arrays',c:'arrays',teach:'An array holds multiple values of the same type. Declare an array with Type[] like number[] or string[]. Access elements with [index], where 0 is the first element. The length property tells you how many elements. Methods like push, pop, slice, and map work as in JavaScript. Avoid mixing types in an array unless you use union types.',code:'const numbers: number[] = [1, 2, 3];\nconsole.log(numbers[0]);\nconsole.log(numbers.length);\nnumbers.push(4);\nconst doubled = numbers.map((n) => n * 2);',qs:[
{t:'mc',q:'How do you declare an array of strings in TypeScript?',o:['string[]','[string]','Array<string>','string Array'],a:0,e:'Use Type[] syntax: string[] is an array of strings.'},
{t:'mc',q:'What is the value of arr[1]?',code:'const arr: number[] = [10, 20, 30];',o:['10','20','30','undefined'],a:1,e:'Index 1 is the second element, which is 20.'},
{t:'fill',q:'Fill in the type for an array of boolean values.',code:'const flags: ___ = [true, false, true];',a:['boolean[]'],e:'Use boolean[] for an array of booleans.'},
{t:'mc',q:'What does this print?',code:'const arr: string[] = ["a", "b", "c"];\nconsole.log(arr.length);',o:['1','2','3','undefined'],a:2,e:'The array has 3 elements, so length is 3.'},
{t:'tf',q:'You can mix numbers and strings in a number[] array.',o:TF,a:1,e:'A number[] array holds only numbers. Mixing types requires a union type.'}
]},
{t:'Objects and Interfaces',c:'objint',teach:'An interface describes the shape of an object: what properties it has and their types. Use interface Name { prop: type; } to define it, then use Name as a type. Objects must have all the properties declared in the interface with the correct types. This prevents mistakes like forgetting a property or misspelling it. Interfaces are checked at compile time but do not exist in the compiled JavaScript.',code:'interface User {\n  name: string;\n  age: number;\n  email: string;\n}\nconst user: User = {\n  name: "Alice",\n  age: 30,\n  email: "alice@example.com"\n};\nconsole.log(user.name);',qs:[
{t:'mc',q:'How do you define an interface for an object?',o:['class User { }','type User { }','interface User { }','define User { }'],a:2,e:'Use the interface keyword to describe the shape of an object.'},
{t:'mc',q:'What is the type of user.age?',code:'interface Person { age: number; }\nconst user: Person = { age: 25 };',o:['string','number','Person','any'],a:1,e:'The interface says age is a number.'},
{t:'fill',q:'Complete the interface by adding a property for a user\'s email.',code:'interface User {\n  name: string;\n  ___: string;\n}',a:['email'],e:'Add email as a property with type string.'},
{t:'mc',q:'Find the bug: why does this code fail?',code:'interface Point { x: number; y: number; }\nconst p: Point = { x: 1 };',o:['Point requires both x and y properties','x must be a string','Point is not a type','y is optional and does not need a value'],a:0,e:'The interface requires both x and y. Objects must have all properties.'},
{t:'tf',q:'Interfaces exist in the compiled JavaScript output.',o:TF,a:1,e:'Interfaces are a TypeScript feature only. They disappear during compilation and do not appear in the .js file.'}
]},
{t:'Union Types',c:'union',teach:'A union type lets a variable hold values of multiple types, written with |. For example, string | number means the value can be a string or a number. This is useful when a function can accept multiple types. After declaring a union, you often need to check the type before using it (a type guard). Union types make code more flexible while staying type-safe.',code:'let id: string | number;\nid = "ABC123";\nconsole.log(id);\nid = 123;\nconsole.log(id);\nfunction processId(id: string | number): void {\n  console.log("ID:", id);\n}',qs:[
{t:'mc',q:'What does the type string | number mean?',o:['A string and a number together','Either a string or a number','A string that contains a number','A number converted to a string'],a:1,e:'The | operator means "or". The value can be one type or the other.'},
{t:'fill',q:'Declare a variable that can hold a string or a number.',code:'let value: ___ = "hello";',a:['string | number'],e:'Use the | operator to create a union type.'},
{t:'mc',q:'Which type annotation allows both strings and numbers?',o:['any','string','number','string | number'],a:3,e:'A union of string | number accepts either type.'},
{t:'tf',q:'A variable with type string | number can always use string methods like toUpperCase().',o:TF,a:1,e:'If the variable is a number, calling a string method fails. You must check the type first.'},
{t:'mc',q:'What is a valid value for x?',code:'const x: boolean | string = ???;',o:['42','true','null','undefined'],a:1,e:'true is a boolean, which is in the union type boolean | string.'}
]},
{t:'Type Guards',c:'guards',teach:'After creating a union type, you must guard against using methods that do not work on all types. typeof is the common guard: typeof x === "string" checks if x is a string. Then inside that if block, TypeScript knows x is a string and allows string methods. instanceof checks if a value is an instance of a class. If the type is not narrowed, TypeScript will not let you call type-specific methods to prevent runtime errors.',code:'function describe(value: string | number): void {\n  if (typeof value === "string") {\n    console.log("Length:", value.length);\n  } else {\n    console.log("Absolute value:", Math.abs(value));\n  }\n}\ndescribe("hello");\ndescribe(42);',qs:[
{t:'mc',q:'What keyword do you use to check if a value is a string?',o:['is','check','typeof','instance'],a:2,e:'typeof is the operator to check a value type: typeof x === "string".'},
{t:'mc',q:'After the if check, what type is x inside the block?',code:'if (typeof x === "string") {\n  // x is ???\n}',o:['string | number','number','string','any'],a:2,e:'Inside the if block, TypeScript knows the guard succeeded, so x is narrowed to string.'},
{t:'fill',q:'Complete the guard to check if x is a number.',code:'if (typeof x ___ "number") {',a:['==='],e:'Use === to compare the type.'},
{t:'tf',q:'Type guards allow TypeScript to understand which methods are safe to call.',o:TF,a:0,e:'Yes, by narrowing the type, the compiler knows which methods exist and which might fail.'},
{t:'mc',q:'What does this print?',code:'const val: string | number = "42";\nif (typeof val === "string") {\n  console.log(val.toUpperCase());\n}',o:['42','42 (no uppercase letters)','undefined','Type error'],a:1,e:'The variable is "42", a string. toUpperCase() returns "42" (no letters to uppercase).'}
]},
{t:'Checkpoint: Functions and Data',c:'cp2',teach:'Review: Functions have typed parameters and return types. Arrays hold multiple values of one type: Type[]. Interfaces describe object shapes. Union types let variables hold multiple types: type1 | type2. Type guards like typeof narrow union types so you can safely call type-specific methods.',code:'interface Product {\n  name: string;\n  price: number;\n}\nfunction getPrice(item: string | Product): number {\n  if (typeof item === "string") {\n    return 0;\n  } else {\n    return item.price;\n  }\n}',qs:[
{t:'mc',q:'What does this function return when called with (5, 3)?',code:'function max(a: number, b: number): number {\n  return a > b ? a : b;\n}',o:['15','5','3','8'],a:1,e:'5 > 3 is true, so the function returns a, which is 5.'},
{t:'mc',q:'What is wrong with this code?',code:'const arr: number[] = [1, "two", 3];',o:['Cannot mix number and string in a number[] array','The array needs a type','1 and 3 must be strings','number[] requires parentheses'],a:0,e:'A number[] can only hold numbers. To mix types, use (string | number)[].'},
{t:'order',q:'Put the lines in order to define and use an interface.',items:['interface User { name: string; }','const user: User = { name: "Bob" };','console.log(user.name);'],e:'Define the interface first, then create an object that matches it, then use it.'},
{t:'match',q:'Match each keyword to its purpose.',pairs:[['interface','describes object shape'],['typeof','checks a type at runtime'],['string[]','array of strings'],[' | ','union type']],e:'These are core TypeScript features for types and guards.'},
{t:'mc',q:'Find the bug: why does this code fail?',code:'function greet(name: string): string {\n  console.log(name);\n}',o:['Missing return statement for a string return type','name is a reserved keyword','console.log must end with a semicolon','string type should be capitalized'],a:0,e:'The return type is string, but the function has no return statement. Either return a string or change the return type to void.'}
]}
]});

U('ts',{t:'Unit 3 · Generics and Advanced Types',l:[
{t:'Generics Basics',c:'generics',teach:'A generic is a placeholder for a type, written with angle brackets <>. It lets you write functions and types that work with any type. For example, function identity<T>(x: T): T returns whatever type you pass in. Instead of writing separate functions for numbers and strings, one generic function handles all types. Generics are type-safe: the compiler checks that you use the type consistently.',code:'function identity<T>(x: T): T {\n  return x;\n}\nconst num = identity<number>(42);\nconst str = identity<string>("hello");\nconst arr = identity<number[]>([1, 2, 3]);',qs:[
{t:'mc',q:'What does <T> mean in a function declaration?',o:['A template for HTML','A placeholder for any type','A return type','A generic type parameter'],a:2,e:'T is a type variable. When you call the function, T becomes whatever type you pass in.'},
{t:'mc',q:'What is the type of result?',code:'function first<T>(arr: T[]): T {\n  return arr[0];\n}\nconst result = first<string>(["a", "b"]);',o:['string[]','T','string','unknown'],a:2,e:'T is replaced with string, so the function returns a string.'},
{t:'fill',q:'Fill in the generic parameter to say this function works with any type.',code:'function wrap<___>(value: T): T[] {',a:['T'],e:'T is the conventional name for a type parameter.'},
{t:'mc',q:'What does this function do?',code:'function pair<T>(a: T, b: T): T[] {\n  return [a, b];\n}',o:['Creates a tuple','Creates an array with two items of the same type','Creates a string','Creates a union type'],a:1,e:'The function returns an array [T, T] with two items of type T.'},
{t:'tf',q:'A generic function must specify the type when called.',o:TF,a:1,e:'TypeScript can infer the type from the arguments, so you often omit <Type>.'}
]},
{t:'Optional and Readonly',c:'optread',teach:'Add ? to a property to make it optional, so it does not need a value. Add readonly to a property to prevent reassignment after creation. These constraints make interfaces more flexible and safer. An optional parameter in a function is similar: param?: type means the parameter can be omitted. Both features work together to express exactly what properties are needed and what can change.',code:'interface Config {\n  name: string;\n  readonly version: string;\n  timeout?: number;\n}\nconst cfg: Config = {\n  name: "MyApp",\n  version: "1.0"\n};\ncfg.name = "NewApp";\n// cfg.version = "2.0"; // Error: readonly',qs:[
{t:'mc',q:'What does the ? mean in an interface property?',o:['Required','Optional','Readonly','Nullable'],a:1,e:'? means the property does not have to be present on objects of this type.'},
{t:'mc',q:'What happens if you try to assign to a readonly property?',code:'interface User { readonly id: number; }',o:['It works fine','TypeScript shows a compile error','It is ignored at runtime','It converts to let'],a:1,e:'readonly prevents reassignment. TypeScript catches this at compile time.'},
{t:'fill',q:'Make this function parameter optional by adding a character.',code:'function log(msg: string ___): void {',a:['?'],e:'Add ? after the type to make a parameter optional.'},
{t:'tf',q:'A readonly property cannot be changed after the object is created.',o:TF,a:0,e:'Yes, readonly prevents reassignment. The object is immutable in that sense.'},
{t:'mc',q:'Which objects are valid for this interface?',code:'interface Point { x: number; y?: number; }',o:['{ x: 1, y: 2 }','{ x: 1 }','Both of the above','Neither of the above'],a:2,e:'Both are valid because y is optional (the ?) so it can be present or absent.'}
]},
{t:'Discriminated Unions',c:'discunion',teach:'A discriminated union uses a literal property to distinguish between different shapes. Each type in the union has a unique value for the literal property (the discriminator). This lets TypeScript narrow the type without explicit typeof checks. The pattern is common in state management and error handling. When you check the discriminator, TypeScript automatically narrows the type.',code:'interface Success { status: "ok"; data: string; }\ninterface Error { status: "error"; message: string; }\ntype Result = Success | Error;\nfunction handle(result: Result) {\n  if (result.status === "ok") {\n    console.log(result.data);\n  } else {\n    console.log(result.message);\n  }\n}',qs:[
{t:'mc',q:'What is the purpose of the discriminator in a discriminated union?',o:['To add a label','To let TypeScript narrow the type','To check if a value is defined','To convert between types'],a:1,e:'The discriminator is a literal property that distinguishes variants, allowing automatic type narrowing.'},
{t:'mc',q:'After checking status === "ok", what properties can you access?',code:'interface Success { status: "ok"; data: string; }\ninterface Fail { status: "fail"; reason: string; }\ntype Result = Success | Fail;',o:['data and reason','status, data, and reason','Only status','status and data'],a:3,e:'TypeScript narrows Result to Success, so you can access status and data.'},
{t:'fill',q:'Complete the discriminator check for a request type.',code:'if (request.___ === "login") {',a:['type'],e:'The discriminator is often a field like type or status.'},
{t:'mc',q:'What does this discriminated union represent?',code:'type Action = { type: "add"; value: number } | { type: "reset"; };',o:['Multiple unrelated types','Two actions with different payloads','A single action type','An error union'],a:1,e:'The union has two variants distinguished by the type field.'},
{t:'tf',q:'You must always use typeof checks with discriminated unions.',o:TF,a:1,e:'Discriminated unions use literal property checks instead, which are more precise.'}
]},
{t:'Classes',c:'classes',teach:'A class groups data (properties) and functions (methods) together. Use class Name { } to define one, constructor() to initialize, and this to access properties. Methods are functions inside the class. Properties can have types and visibility modifiers: public (default), private (only inside the class), and protected (only inside the class and subclasses). Classes compile to JavaScript constructor functions.',code:'class Animal {\n  public name: string;\n  private age: number;\n  constructor(name: string, age: number) {\n    this.name = name;\n    this.age = age;\n  }\n  getAge(): number {\n    return this.age;\n  }\n}\nconst dog = new Animal("Rex", 5);',qs:[
{t:'mc',q:'How do you declare a private property in a class?',o:['private prop: type','prop: private type','private prop','#prop: type'],a:0,e:'Use the private keyword before the property name.'},
{t:'mc',q:'What does the constructor do?',code:'class Person { constructor(name: string) {} }',o:['Defines the class','Initializes a new instance','Checks the type','Deletes an instance'],a:1,e:'The constructor runs when you use new to create an instance.'},
{t:'fill',q:'Fill in the keyword to create a new instance of a class.',code:'const obj = ___ MyClass();',a:['new'],e:'Use new to instantiate a class.'},
{t:'mc',q:'Can you access a private property from outside the class?',code:'class Secret { private value: number; }',o:['Yes, always','No, only from inside the class','Only with a getter','Yes, if you declare it public first'],a:1,e:'private prevents access from outside. TypeScript enforces this at compile time.'},
{t:'tf',q:'Methods in a class are functions that can use this to access properties.',o:TF,a:0,e:'Yes, methods are functions belonging to the class, and this refers to the instance.'}
]},
{t:'Modules and Tooling',c:'modules',teach:'TypeScript projects use modules to organize code across files. Use export to make something available from a file, and import to use it in another file. export default exports one main thing per file. A tsconfig.json file configures how TypeScript compiles, with options like target (JavaScript version) and outDir (where to put .js files). Build tools like tsc watch for changes and recompile automatically.',code:'// math.ts\nexport function add(a: number, b: number): number {\n  return a + b;\n}\n// main.ts\nimport { add } from "./math";\nconsole.log(add(2, 3));',qs:[
{t:'mc',q:'What does export do?',o:['Saves a file','Makes a value available to other files','Compiles the code','Deletes old files'],a:1,e:'export lets other files import and use the exported value.'},
{t:'mc',q:'How do you import a named export from another file?',o:['import add from "./math"','import * from "./math"','import { add } from "./math"','import "./math" as add'],a:2,e:'Use import { name } from "./file" to import a named export.'},
{t:'fill',q:'Complete the statement to export a function as the default export.',code:'___ default function greet() { }',a:['export'],e:'export default makes a value the main export of a file.'},
{t:'tf',q:'A tsconfig.json file tells TypeScript how to compile your project.',o:TF,a:0,e:'tsconfig.json configures compiler options like target, module, and outDir.'},
{t:'mc',q:'What is the purpose of import at the top of a file?',o:['To declare variables','To use code from another file','To test the code','To compile to JavaScript'],a:1,e:'import brings in exported values from other files so you can use them.'}
]},
{t:'Checkpoint: Generics and Advanced Types',c:'cp3',teach:'Review: Generics let functions and types work with any type using <T>. Optional properties use ? and readonly prevents reassignment. Discriminated unions use a literal property for type narrowing. Classes group data and methods with visibility control. Modules organize code with import and export. TypeScript configurations guide compilation.',code:'interface Container<T> {\n  readonly value: T;\n  isEmpty?: boolean;\n}\ntype Result<T> = { status: "ok"; data: T } | { status: "error"; message: string };\nclass Box<T> {\n  constructor(public value: T) {}\n}',qs:[
{t:'mc',q:'What does this generic function return for string?',code:'function identity<T>(x: T): T { return x; }',o:['string','T','any','unknown'],a:0,e:'T is replaced with string, so it returns a string.'},
{t:'mc',q:'Which statement is valid?',code:'interface Item { readonly id: number; }',o:['item.id = 2','new Item()','const item: Item = { id: 1 }','const item: Item = {}'],a:2,e:'The interface requires an id property. readonly prevents reassignment but the property is required.'},
{t:'order',q:'Put the lines in order to define and use a generic interface.',items:['interface Wrapper<T> { value: T; }','const box: Wrapper<number> = { value: 42 };','console.log(box.value);'],e:'Define the generic interface, then use it with a concrete type, then access properties.'},
{t:'match',q:'Match each TypeScript feature to its use.',pairs:[['Generics','reusable code for any type'],['discriminated unions','type narrowing with a literal'],['private','hide a property inside a class'],['readonly','prevent reassignment']],e:'These features control types, access, and mutability.'},
{t:'mc',q:'Find the bug: why does this code fail?',code:'export default function a() { }\nexport default function b() { }',o:['A file can only have one default export','Functions must be named differently','Both should use export not export default','export is not valid for functions'],a:0,e:'Each file can have only one default export. Use named exports or keep only one default.'}
]}
]});

U('ts',{t:'Unit 4 · Advanced Patterns',l:[
{t:'Utility Types',c:'util',teach:'TypeScript provides utility types to transform types: Partial<T> makes all properties optional, Required<T> makes all required, Readonly<T> makes all readonly, Record<K, V> maps keys to values, and Omit<T, K> removes properties. Pick<T, K> selects specific properties. These reduce repetition and express common patterns. They work as shortcuts for common type transformations without writing new interfaces.',code:'interface User { id: number; name: string; email: string; }\ntype UserPreview = Pick<User, "id" | "name">;\ntype PartialUser = Partial<User>;\ntype ReadonlyUser = Readonly<User>;\nconst partial: PartialUser = { name: "Bob" };',qs:[
{t:'mc',q:'What does Partial<T> do?',o:['Makes all properties required','Makes all properties optional','Makes properties readonly','Removes all properties'],a:1,e:'Partial<T> makes every property optional, so you can omit any of them.'},
{t:'mc',q:'What properties does Pick<User, "id" | "name"> have?',code:'interface User { id: number; name: string; email: string; }',o:['All three properties','Only id and name','Only id','Only name and email'],a:1,e:'Pick selects specific properties from the original type.'},
{t:'fill',q:'Complete the utility type to make all properties of T readonly.',code:'const x: ___ <User> = user;',a:['Readonly'],e:'Readonly<T> makes every property readonly.'},
{t:'mc',q:'What does Omit<User, "email"> do?',code:'interface User { id: number; name: string; email: string; }',o:['Removes the email property','Adds an email property','Makes email optional','Returns only the email property'],a:0,e:'Omit removes the specified properties from the type.'},
{t:'tf',q:'Record<K, V> maps keys of type K to values of type V.',o:TF,a:0,e:'Yes, Record<"a" | "b", number> has keys "a" and "b" both mapping to numbers.'}
]},
{t:'Null Safety and Optional Chaining',c:'nullsafe',teach:'JavaScript allows null and undefined, which cause many runtime errors. TypeScript has strict null checks: variables do not include null or undefined unless you explicitly allow it with type | null. Optional chaining with ?. accesses a property only if the object is not null, otherwise it returns undefined. Nullish coalescing ?? provides a default only if the value is null or undefined, unlike || which treats false and 0 as missing.',code:'const user: { name: string } | null = null;\nconsole.log(user?.name);\nconst fallback = user?.email ?? "no email";\nfunction log(msg: string | null): void {\n  console.log(msg ?? "empty");\n}',qs:[
{t:'mc',q:'What does optional chaining (?) do?',o:['Checks if a value is not null','Accesses a property safely','Converts undefined to null','Requires all properties to exist'],a:1,e:'Optional chaining accesses a property only if the object exists, returning undefined otherwise.'},
{t:'mc',q:'What does this print?',code:'const x: { name: string } | null = null;\nconsole.log(x?.name);',o:['null','undefined','An error','name'],a:1,e:'x is null, so x?.name returns undefined instead of crashing.'},
{t:'fill',q:'Complete the operator for nullish coalescing to provide a default.',code:'const value = maybeNull ___ "default";',a:['??'],e:'?? returns the right side only if the left is null or undefined.'},
{t:'mc',q:'What is the difference between ?? and ||?',o:['No difference','?? only treats null/undefined as missing, || treats falsy values as missing','|| is safer than ??','?? is for strings, || is for numbers'],a:1,e:'|| treats 0, false, and "" as missing. ?? only treats null and undefined as missing.'},
{t:'tf',q:'With strict null checks, a string variable might contain null.',o:TF,a:1,e:'No, string excludes null. You must explicitly write string | null to allow null.'}
]},
{t:'Advanced Patterns',c:'patterns',teach:'Type narrowing is the process of moving from a broader type to a more specific one. Custom type guards use is keyword: function isString(x: unknown): x is string { }. Assertion signatures promise the type changed: function assertExists(x: T | null): asserts x is T { }. These patterns let you write safer, more expressive code. They communicate intent and let TypeScript track type changes you know are true.',code:'function isString(value: unknown): value is string {\n  return typeof value === "string";\n}\nfunction assertExists<T>(value: T | null): asserts value is T {\n  if (value === null) throw new Error("Value is null");\n}\nconst x: unknown = "hello";\nif (isString(x)) {\n  console.log(x.toUpperCase());\n}',qs:[
{t:'mc',q:'What does a custom type guard do?',o:['Checks a type at runtime','Creates a new type','Converts one type to another','Removes a property from a type'],a:0,e:'A type guard checks at runtime and narrows the type if it passes.'},
{t:'mc',q:'What does x is string mean in a function return type?',code:'function isString(x: unknown): x is string { }',o:['Returns true or false','Returns a string','Converts x to a string','Guarantees x is a string after returning true'],a:3,e:'x is string tells TypeScript that if the function returns true, x is narrowed to string.'},
{t:'fill',q:'Fill in the keyword for a custom type guard.',code:'function isNumber(x: unknown): x ___ number {',a:['is'],e:'The is keyword is used in type guards to indicate a type is narrowed.'},
{t:'mc',q:'What does asserts value is T mean?',code:'function assertExists<T>(value: T | null): asserts value is T { }',o:['The function throws if value is null','The function promises value is T if it does not throw','The function is optional','The function returns T'],a:1,e:'An assertion signature promises that if the function returns, the type is narrowed.'},
{t:'tf',q:'Type guards are checked at compile time by TypeScript.',o:TF,a:1,e:'Type guards run at runtime and then TypeScript narrows the type based on the result.'}
]},
{t:'Practical Code Review',c:'practical',teach:'Real TypeScript code uses interfaces, type guards, and null safety together. When reviewing code, check that functions have complete type annotations, objects match their interfaces, union types are narrowed before use, and null/undefined are handled. Common mistakes: forgetting to check null, mixing types in arrays, and skipping parameter types. Strong types make code self-documenting and catch bugs before runtime.',code:'interface ApiResponse {\n  status: number;\n  data: { users: Array<{ id: number; name: string }> } | null;\n}\nfunction processResponse(response: ApiResponse): string[] {\n  if (response.data?.users) {\n    return response.data.users.map(u => u.name);\n  }\n  return [];\n}',qs:[
{t:'mc',q:'What is wrong with this function signature?',code:'function getUser(id) { }',o:['Missing parameter type','Missing return type','Both parameter and return types','id is a reserved word'],a:2,e:'Functions should have complete type annotations for both parameters and return values.'},
{t:'mc',q:'Find the bug: what happens with this code?',code:'interface User { name: string; }\nconst users: User[] = [ { name: "A" }, { name: "B", id: 1 } ];',o:['The second object has an extra property id','id is not in the User interface so TypeScript rejects it','The array type is wrong','name must be optional'],a:1,e:'Objects must match the interface. Extra properties are not allowed unless the interface has index signatures.'},
{t:'fill',q:'Complete the check to safely access a deeply nested property.',code:'const name = obj?.user?.profile?.___ ??"Unknown";',a:['name'],e:'Chain optional chaining with ?? to provide a default.'},
{t:'mc',q:'What should you check before using a property that might be null?',code:'interface Result { data: string | null; }',o:['The data type','If data is not null','The Result interface','The function signature'],a:1,e:'Before using data as a string, check it is not null with optional chaining or an if guard.'},
{t:'tf',q:'Code with complete types is easier to maintain and less prone to bugs.',o:TF,a:0,e:'Yes, explicit types make code clearer and catch errors at compile time.'}
]},
{t:'Real-World Examples',c:'examples',teach:'TypeScript shines in real projects: APIs define response types as interfaces, error handling uses discriminated unions for success and failure, form validation uses type guards, and state management tracks state type through functions. These patterns appear in React, Express, and other frameworks. Building a project with TypeScript means writing types first, then code. The types serve as documentation and prevent entire categories of bugs.',code:'interface LoginRequest { email: string; password: string; }\ntype LoginResult = \n  | { status: "success"; token: string }\n  | { status: "error"; reason: string };\nfunction login(req: LoginRequest): LoginResult {\n  if (req.email && req.password) {\n    return { status: "success", token: "abc123" };\n  }\n  return { status: "error", reason: "Invalid input" };\n}',qs:[
{t:'mc',q:'In a real project, why define types for API responses?',o:['Makes the code run faster','Documents what the API returns','Requires less code to write','Makes the file smaller'],a:1,e:'Types document the shape of responses and catch errors when the API changes.'},
{t:'mc',q:'What is the advantage of using a discriminated union for login results?',code:'type LoginResult = \n  | { status: "success"; token: string }\n  | { status: "error"; reason: string };',o:['Smaller file size','Allows the same properties on both variants','TypeScript narrows the type when you check status','Faster execution'],a:2,e:'When you check the status field, TypeScript knows which properties exist, preventing errors.'},
{t:'fill',q:'Complete the pattern for type-safe form validation.',code:'if (___ Field(email, isEmail)) {',a:['validateRequired'],e:'A validation function checks and narrows types.'},
{t:'mc',q:'What pattern helps manage state changes in a real app?',o:['Loose typing','Discriminated unions for each state','No type checking','Using any type'],a:1,e:'Discriminated unions represent different states with different properties, making state transitions type-safe.'},
{t:'tf',q:'Writing types first helps you design better code architecture.',o:TF,a:0,e:'Yes, thinking about types clarifies how data flows and what functions should do.'}
]},
{t:'Capstone: TypeScript',c:'capstone',teach:'This capstone reviews a realistic TypeScript function that handles API requests. Study the code: userRequest has a typed parameter, the response type is a discriminated union, optional chaining handles null, and a type guard narrows the union. Then answer questions about the code: what happens with different inputs, what types apply where, and why the code is safe. Real TypeScript is building systems where types prevent errors and clarify intent.',code:'interface UserRequest { id: number; }\ntype ApiResponse = \n  | { ok: true; data: { id: number; name: string } }\n  | { ok: false; error: string };\nfunction fetchUser(req: UserRequest): ApiResponse {\n  if (req.id < 0) {\n    return { ok: false, error: "Invalid ID" };\n  }\n  return { ok: true, data: { id: req.id, name: "Alice" } };\n}\nconst resp = fetchUser({ id: 5 });\nif (resp.ok) {\n  console.log(resp.data.name);\n}',qs:[
{t:'mc',q:'What type is the variable resp?',code:'const resp = fetchUser({ id: 5 });',o:['{ ok: true; data: { ... } }','ApiResponse','string','object'],a:1,e:'fetchUser returns ApiResponse, so resp has that union type.'},
{t:'mc',q:'What does the check if (resp.ok) do?',o:['Checks if ok is a string','Narrows resp to the success variant','Converts resp to a boolean','Executes twice'],a:1,e:'When you check resp.ok is true, TypeScript narrows resp to the success variant with the data property.'},
{t:'mc',q:'What would happen if you called fetchUser({ id: -1 })?',o:['It returns success with data','It returns the error variant','It throws an error','It returns null'],a:1,e:'The function checks id < 0 and returns the error variant with a message.'},
{t:'fill',q:'If resp.ok is false, what property holds the error message?',code:'if (!resp.ok) {\n  console.log(resp.___);\n}',a:['error'],e:'The error variant has an error property with the message.'},
{t:'mc',q:'Why is this code type-safe?',code:'if (resp.ok) {\n  console.log(resp.data.name);\n}',o:['resp is checked for truthiness','The check narrows resp so data exists','name is guaranteed to be a string','The function cannot fail'],a:1,e:'The discriminated union with ok as the discriminator lets TypeScript know data exists inside the if block.'}
]}
]});

U('java',{t:'Unit 1 · Java Foundations',l:[
{t:'Program Structure',c:'structure',teach:'Every Java program lives inside a class. Execution starts at the method public static void main(String[] args). Statements end with a semicolon and blocks use curly braces. The file name must match the public class name, and Java is case-sensitive: Main and main are different.',code:'public class Hello {\n  public static void main(String[] args) {\n    System.out.println("Hello, Java");\n  }\n}',qs:[
{t:'mc',q:'Where does a Java program begin running?',o:['The first line of the file','The main method','The constructor of the first class','The method named start'],a:1,e:'The JVM looks for public static void main(String[] args). Java has no top-level statements in a file, so the first line does not run on its own.'},
{t:'fill',q:'Complete the statement that prints a line.',code:'System.out.___("Hi");',a:['println'],e:'println prints the text and then a newline. print would not add the newline, but println is the one that prints a full line.'},
{t:'mc',q:'What does this print?',code:'System.out.print("A");\nSystem.out.print("B");\nSystem.out.println("C");',o:['A B C on three lines','ABC','ABC then nothing else, with no newline','CBA'],a:1,e:'print does not add a newline, so A and B stay on the same line; println prints C and then ends the line. The result is ABC.'},
{t:'mc',q:'Find the bug: this class does not compile.',code:'public class Main {\n  public static void main(String[] args) {\n    System.out.println("Hi")\n  }\n}',o:['main must return int','The println line is missing a semicolon','Strings need single quotes','The class must be named Hello'],a:1,e:'Every statement ends with a semicolon. The other options are not rules of Java: main returns void and strings use double quotes.'}]},
{t:'Variables and Types',c:'types',teach:'Java is statically typed: you declare a type for every variable. The eight primitives are byte, short, int, long, float, double, char and boolean. int holds whole numbers, double holds decimals, boolean holds true or false. Use var for local type inference. A literal long needs an L suffix and a float needs an f suffix.',code:'int age = 30;\ndouble price = 9.99;\nboolean ready = true;\nchar grade = \'A\';\nlong big = 3000000000L;\nvar name = "Ana";',qs:[
{t:'mc',q:'Which type is best for the value 3.14?',o:['int','double','boolean','char'],a:1,e:'double stores decimals. int would reject the fraction.'},
{t:'fill',q:'Declare a whole-number variable.',code:'___ count = 5;',a:['int'],e:'int is the standard whole-number type.'},
{t:'tf',q:'Java lets you assign a string to an int variable if the text looks like a number.',o:TF,a:1,e:'Java is statically typed. int n = "5"; does not compile; you must parse it with Integer.parseInt.'},
{t:'mc',q:'Find the bug: why does this fail to compile?',code:'long big = 3000000000;',o:['long cannot hold that value','The literal is an int and is too large; it needs an L suffix','Variables must be final','long needs a decimal point'],a:1,e:'An unsuffixed integer literal is an int, and 3000000000 exceeds int range. Writing 3000000000L makes it a long.'},
{t:'match',q:'Match each value to its best type.',pairs:[['true','boolean'],['42','int'],['2.5','double'],['"hi"','String']],e:'Each literal has a natural type: boolean for true/false, int for whole numbers, double for decimals, String for text.'}]},
{t:'Operators and Casting',c:'ops',teach:'Arithmetic uses + - * / %. Dividing two ints performs integer division and drops the fraction, so 7 / 2 is 3. Use % for the remainder. Mixing in a double promotes the result to double. Narrowing needs an explicit cast such as (int) 3.9, which truncates to 3, not rounds. Compound assignment looks like x += 2 and ++ adds one.',code:'int a = 7, b = 2;\nSystem.out.println(a / b);\nSystem.out.println(a % b);\nSystem.out.println((double) a / b);\nSystem.out.println((int) 3.9);',qs:[
{t:'mc',q:'What does this print?',code:'System.out.println(7 / 2);',o:['3.5','3','4','3.0'],a:1,e:'Both operands are int, so integer division drops the fraction. The 3.5 would need a double operand.'},
{t:'mc',q:'What does this print?',code:'int x = 10;\nx += 5;\nx++;\nSystem.out.println(x);',o:['15','16','17','10'],a:1,e:'x becomes 15 after += 5 and 16 after ++.'},
{t:'fill',q:'Cast so the division keeps its fraction.',code:'int a = 7, b = 2;\ndouble r = (___) a / b;',a:['double'],e:'Casting a to double first makes the division a double division, giving 3.5. Casting the whole result after dividing would be too late.'},
{t:'mc',q:'What does (int) 3.9 evaluate to?',o:['4','3','3.9','It does not compile'],a:1,e:'Casting a double to int truncates toward zero; it does not round.'},
{t:'tf',q:'10 % 3 evaluates to 1.',o:TF,a:0,e:'% gives the remainder: 10 = 3*3 + 1.'}]},
{t:'Strings',c:'strings',teach:'String is a class, not a primitive, and strings are immutable: methods like toUpperCase return a new string. Compare contents with equals, never ==, which compares references. Useful methods are length, charAt, substring, indexOf, contains, trim, split and replace. Join with + or String.format. Indexes start at 0.',code:'String s = "Hello";\nSystem.out.println(s.length());\nSystem.out.println(s.charAt(1));\nSystem.out.println(s.substring(1, 3));\nSystem.out.println(s.toUpperCase());\nSystem.out.println(s.equals("Hello"));',qs:[
{t:'mc',q:'What does this print?',code:'String s = "Hello";\nSystem.out.println(s.substring(1, 3));',o:['Hel','el','ell','He'],a:1,e:'substring(start, end) includes start and excludes end, so indexes 1 and 2 give "el".'},
{t:'mc',q:'How should you compare the contents of two strings?',o:['a == b','a.equals(b)','a = b','a.same(b)'],a:1,e:'equals compares characters. == compares whether both variables point to the same object, which can be false for equal text.'},
{t:'mc',q:'What does this print?',code:'String s = "java";\ns.toUpperCase();\nSystem.out.println(s);',o:['JAVA','java','Java','It does not compile'],a:1,e:'Strings are immutable; toUpperCase returns a new string which was discarded here, so s is unchanged.'},
{t:'fill',q:'Complete the call that gives the number of characters.',code:'String s = "abc";\nint n = s.___();',a:['length'],e:'For strings it is length() with parentheses; arrays use the length field with no parentheses.'},
{t:'order',q:'Put the lines in order to print the first character.',items:['String s = "Blob";','char c = s.charAt(0);','System.out.println(c);'],e:'Declare the string, read index 0, then print it. Using c before it is declared would not compile.'}]},
{t:'Conditionals',c:'cond',teach:'if, else if and else choose between branches using boolean conditions. Combine conditions with && (and), || (or) and ! (not). The condition must be a boolean; if (x = 5) is an error, unlike some languages. The switch statement matches a value against case labels; each old-style case needs break or it falls through. Modern switch uses arrows and needs no break.',code:'int n = 2;\nswitch (n) {\n  case 1 -> System.out.println("one");\n  case 2 -> System.out.println("two");\n  default -> System.out.println("many");\n}\nString kind = n > 1 ? "big" : "small";',qs:[
{t:'mc',q:'What does this print?',code:'int x = 5;\nif (x > 10) System.out.println("A");\nelse if (x > 3) System.out.println("B");\nelse System.out.println("C");',o:['A','B','C','B and C'],a:1,e:'x > 10 is false, x > 3 is true, so B prints and the else is skipped.'},
{t:'mc',q:'What does this print?',code:'int n = 1;\nswitch (n) {\n  case 1: System.out.print("a");\n  case 2: System.out.print("b"); break;\n  case 3: System.out.print("c");\n}',o:['a','ab','abc','b'],a:1,e:'Old-style case 1 has no break, so execution falls through into case 2, prints b, then hits break.'},
{t:'tf',q:'In Java, if (x = 5) is valid when x is an int.',o:TF,a:1,e:'The assignment produces an int, not a boolean, so it does not compile. Use == to compare.'},
{t:'fill',q:'Complete the logical AND.',code:'if (age >= 18 ___ hasId) { }',a:['&&'],e:'&& means both must be true. || would require only one.'},
{t:'mc',q:'Find the bug: what is wrong?',code:'int score = 80;\nif (score > 50 && < 90) {\n  System.out.println("ok");\n}',o:['Nothing; it compiles','Each side of && needs a full condition: score < 90','&& must be replaced with &','score must be double'],a:1,e:'Java does not allow chained comparisons, so write score > 50 && score < 90.'}]},
{t:'Checkpoint: Foundations',c:'check1',teach:'Review: program structure with main, static typing and primitives, integer division and casts, immutable strings compared with equals, and conditionals with && and ||. Remember that integer division truncates, strings use equals, and switch cases fall through without break.',code:'int a = 9;\nString s = "ab";\nif (a / 2 == 4 && s.length() == 2) {\n  System.out.println("yes");\n}',qs:[
{t:'mc',q:'What does this print?',code:'int a = 9;\nString s = "ab";\nif (a / 2 == 4 && s.length() == 2) {\n  System.out.println("yes");\n} else {\n  System.out.println("no");\n}',o:['yes','no','4','Compile error'],a:0,e:'9 / 2 is 4 with integer division and the string length is 2, so both conditions hold.'},
{t:'match',q:'Match the Java construct to its role.',pairs:[['main','program entry point'],['equals','compare string contents'],['(int)','cast that truncates'],['%','remainder']],e:'Each construct has one job in this unit: entry point, content comparison, narrowing cast, remainder.'},
{t:'mc',q:'Which declaration compiles?',o:['int x = 3.5;','double x = 3;','boolean x = 1;','String x = \'hi\';'],a:1,e:'An int widens to double automatically. The others need a cast, a boolean literal, or double quotes.'},
{t:'fill',q:'Complete the modern switch label that handles everything else.',code:'switch (n) {\n  case 1 -> System.out.println("one");\n  ___ -> System.out.println("other");\n}',a:['default'],e:'default matches any value not covered by a case.'},
{t:'order',q:'Put the lines in order.',items:['int n = 4;','n *= 3;','System.out.println(n);'],e:'Declare, update, then print. The output is 12.'}]}
]});

U('java',{t:'Unit 2 · Loops, Methods and Classes',l:[
{t:'Loops',c:'loops',teach:'A for loop packs initialisation, condition and update into one line: for (int i = 0; i < 3; i++). while checks the condition before each pass, and do-while runs the body once before checking. break leaves the loop and continue skips to the next pass. The classic pitfall is forgetting to change the loop variable, which creates an infinite loop.',code:'for (int i = 0; i < 3; i++) {\n  System.out.println(i);\n}\nint n = 3;\nwhile (n > 0) {\n  n--;\n}\ndo {\n  n++;\n} while (n < 2);',qs:[
{t:'mc',q:'How many times does the body of this loop run?',code:'for (int i = 0; i < 5; i++) { }',o:['4','5','6','0'],a:1,e:'i takes the values 0, 1, 2, 3 and 4. When i reaches 5 the condition i < 5 is false, so the body runs 5 times.'},
{t:'mc',q:'What does this print?',code:'int sum = 0;\nfor (int i = 1; i <= 4; i++) {\n  sum += i;\n}\nSystem.out.println(sum);',o:['6','10','4','15'],a:1,e:'The loop adds 1 + 2 + 3 + 4 = 10. The condition uses <=, so 4 is included.'},
{t:'mc',q:'What does this print?',code:'for (int i = 0; i < 6; i++) {\n  if (i == 2) continue;\n  if (i == 4) break;\n  System.out.print(i);\n}',o:['0123','013','01','0134'],a:1,e:'continue skips printing 2, and break stops the loop when i is 4 before it prints. That leaves 0, 1 and 3.'},
{t:'fill',q:'Complete the do-while loop.',code:'do {\n  n++;\n} ___ (n < 3);',a:['while'],e:'A do-while loop ends with the keyword while followed by its condition and a semicolon.'},
{t:'mc',q:'Find the bug: what is wrong with this loop?',code:'int i = 0;\nwhile (i < 3) {\n  System.out.println(i);\n}',o:['while cannot be used with int','i is never changed, so the loop never ends','The condition must use <=','println cannot be in a loop'],a:1,e:'Nothing inside the loop changes i, so i < 3 stays true forever. Adding i++ inside the body fixes it.'}]},
{t:'Arrays',c:'arrays',teach:'An array holds a fixed number of values of one type. Create one with a literal like int[] a = {4, 8, 15} or with new int[3], which fills it with zeros. Indexes start at 0, the size is in the length field (no parentheses), and the size can never change. Reading past the end throws ArrayIndexOutOfBoundsException. Loop with a for-each: for (int x : a).',code:'int[] a = {4, 8, 15};\nSystem.out.println(a.length);\nSystem.out.println(a[0]);\nint[] z = new int[3];\nz[1] = 7;\nfor (int x : a) {\n  System.out.println(x);\n}',qs:[
{t:'mc',q:'What is the index of the last element of an array of length 5?',o:['5','4','6','1'],a:1,e:'Indexes run from 0 to length - 1, so the last index is 4.'},
{t:'mc',q:'What does this print?',code:'int[] a = new int[3];\na[1] = 7;\nSystem.out.println(a[0] + a[1]);',o:['7','0','8','It does not compile'],a:0,e:'new int[3] fills the array with zeros, so a[0] is 0 and a[1] is 7. The sum is 7.'},
{t:'fill',q:'Complete the expression that gives the array size.',code:'int[] nums = {1, 2, 3};\nint n = nums.___;',a:['length'],e:'For arrays length is a field, written without parentheses. Strings use length() as a method.'},
{t:'tf',q:'You can add a fourth element to an int[] that was created with three slots.',o:TF,a:1,e:'Array size is fixed when it is created. Use an ArrayList when you need a collection that grows.'},
{t:'mc',q:'Find the bug: this code throws an exception at run time. Why?',code:'int[] a = {1, 2, 3};\nfor (int i = 0; i <= a.length; i++) {\n  System.out.println(a[i]);\n}',o:['a.length should be a.length()','i <= a.length reaches index 3, which does not exist','Arrays cannot be looped','i must start at 1'],a:1,e:'The valid indexes are 0 to 2. Using <= lets i become 3, which throws ArrayIndexOutOfBoundsException. Use i < a.length.'},
{t:'order',q:'Put the lines in order to print the first element.',items:['int[] a = new int[2];','a[0] = 9;','System.out.println(a[0]);'],e:'Create the array, store a value, then read it. Reading before storing would print 0.'}]},
{t:'Methods',c:'methods',teach:'A method has a return type, a name, parameters and a body: static int add(int a, int b) { return a + b; }. Use void when nothing is returned. Overloading allows several methods with the same name but different parameter lists. Java is always pass by value: a method gets a copy of a primitive, so changing it does not affect the caller. Every path of a non-void method must return a value.',code:'static int add(int a, int b) {\n  return a + b;\n}\nstatic double add(double a, double b) {\n  return a + b;\n}\nstatic void greet(String name) {\n  System.out.println("Hi " + name);\n}',qs:[
{t:'mc',q:'Which return type means a method returns nothing?',o:['null','void','empty','none'],a:1,e:'void marks a method with no result. null is a value for references, not a return type.'},
{t:'mc',q:'What does this print?',code:'static void change(int x) {\n  x = 99;\n}\n// in main\nint n = 5;\nchange(n);\nSystem.out.println(n);',o:['99','5','0','It does not compile'],a:1,e:'The method receives a copy of n. Changing the copy does not touch the caller\'s variable.'},
{t:'fill',q:'Complete the return type.',code:'static ___ square(int n) {\n  return n * n;\n}',a:['int'],e:'n * n of two ints is an int, so int is the matching return type.'},
{t:'tf',q:'Two methods in the same class may share a name if their parameter lists differ.',o:TF,a:0,e:'That is overloading. The compiler picks the version that matches the argument types.'},
{t:'mc',q:'Find the bug: why does this not compile?',code:'static int sign(int n) {\n  if (n > 0) {\n    return 1;\n  } else if (n < 0) {\n    return -1;\n  }\n}',o:['int methods cannot use if','Not every path returns a value (when n is 0)','sign is a reserved word','else if needs braces on one line'],a:1,e:'When n is 0 neither branch runs and the method ends without returning. Add a final return 0 or a plain else.'}]},
{t:'Classes and Objects',c:'classes',teach:'A class is a blueprint and an object is one instance made with new. Fields hold the state, methods hold the behaviour, and a constructor (same name as the class, no return type) sets up a new object. Inside it, this refers to the current object. Variables of class type hold references, so two variables can point to the same object.',code:'class Dog {\n  String name;\n  Dog(String name) {\n    this.name = name;\n  }\n  void bark() {\n    System.out.println(name + " says woof");\n  }\n}\nDog d = new Dog("Rex");',qs:[
{t:'mc',q:'Which keyword creates a new object?',o:['make','new','create','this'],a:1,e:'new allocates the object and runs its constructor.'},
{t:'mc',q:'What does this print?',code:'class Point { int x; Point(int x) { this.x = x; } }\n// in main\nPoint p = new Point(1);\nPoint q = p;\nq.x = 9;\nSystem.out.println(p.x);',o:['1','9','0','It does not compile'],a:1,e:'q = p copies the reference, not the object. Both names point to the same Point, so the change shows through p.'},
{t:'fill',q:'Complete the object creation.',code:'Dog d = ___ Dog("Rex");',a:['new'],e:'Objects are created with the new keyword followed by a constructor call.'},
{t:'tf',q:'A constructor has the same name as its class and declares no return type.',o:TF,a:0,e:'That is the rule. If you add a return type such as void, it becomes an ordinary method.'},
{t:'mc',q:'Find the bug: new Dog("Rex") does not compile. Why?',code:'class Dog {\n  String name;\n  void Dog(String name) {\n    this.name = name;\n  }\n}',o:['name must be private','void makes Dog a normal method, so no constructor takes a String','this cannot be used with fields','Classes need a main method'],a:1,e:'With void in front it is just a method that happens to be named Dog. The class only has the default no-argument constructor.'},
{t:'match',q:'Match each term to its meaning.',pairs:[['field','variable that stores object state'],['constructor','runs when new is used'],['this','the current object'],['method','behaviour an object can perform']],e:'Fields store state, constructors initialise it, this names the current object, and methods are the behaviour.'}]},
{t:'Encapsulation, static and final',c:'encap',teach:'Encapsulation means hiding fields with private and exposing controlled access through getters and setters, so the class can validate changes. static members belong to the class itself, shared by all objects, and are used as ClassName.member. final means the value cannot be reassigned after it is set. Accessing a private field from another class does not compile.',code:'class Account {\n  private double balance;\n  static int count = 0;\n  final String id;\n  Account(String id) { this.id = id; count++; }\n  double getBalance() { return balance; }\n  void deposit(double amt) {\n    if (amt > 0) balance += amt;\n  }\n}',qs:[
{t:'mc',q:'Why make a field private and add a setter?',o:['It makes the program run faster','The class can validate and control every change','Java requires all fields to be private','Private fields can be shared between classes'],a:1,e:'A setter can reject bad values, such as a negative deposit. Java does not force private, but it is the standard way to protect state.'},
{t:'mc',q:'What does this print?',code:'class Counter {\n  static int total = 0;\n  Counter() { total++; }\n}\n// in main\nnew Counter();\nnew Counter();\nSystem.out.println(Counter.total);',o:['0','1','2','It does not compile'],a:2,e:'total is static, so both objects share one variable. Each constructor call adds one, giving 2.'},
{t:'fill',q:'Complete the getter.',code:'public int getAge() {\n  return ___.age;\n}',a:['this'],e:'this.age reads the field of the current object.'},
{t:'tf',q:'A final field can be assigned a new value any time after the object is created.',o:TF,a:1,e:'final means it can be set only once, in its declaration or the constructor.'},
{t:'mc',q:'Find the bug: why does this fail to compile?',code:'class Account { private double balance; }\n// in another class\nAccount a = new Account();\na.balance = -5;',o:['balance must be an int','balance is private and cannot be accessed from another class','Account needs a constructor','Doubles cannot be negative'],a:1,e:'Private members are visible only inside their own class. A public setter is the safe way to change it.'}]},
{t:'Checkpoint: Loops, Methods and Classes',c:'check2',teach:'Review: loops and break/continue, fixed-size arrays with zero-based indexes, methods with return types and pass by value, classes with constructors and this, and private fields with static and final. Remember that references are copied, not objects.',code:'static int total(int[] a) {\n  int s = 0;\n  for (int x : a) s += x;\n  return s;\n}\nSystem.out.println(total(new int[]{2, 3, 5}));',qs:[
{t:'mc',q:'What does this print?',code:'static int total(int[] a) {\n  int s = 0;\n  for (int x : a) s += x;\n  return s;\n}\nSystem.out.println(total(new int[]{2, 3, 5}));',o:['3','10','235','It does not compile'],a:1,e:'The for-each adds 2 + 3 + 5 = 10 and the method returns it.'},
{t:'match',q:'Match each keyword to its effect.',pairs:[['break','leaves the loop'],['continue','skips to the next pass'],['static','belongs to the class'],['final','cannot be reassigned']],e:'These four keywords each control one thing: loop exit, loop skip, class-level membership and single assignment.'},
{t:'mc',q:'What does this print?',code:'int[] a = {1, 2, 3};\nint[] b = a;\nb[0] = 50;\nSystem.out.println(a[0]);',o:['1','50','0','It does not compile'],a:1,e:'Arrays are objects, so b = a copies the reference. Both names refer to the same array.'},

{t:'order',q:'Put the lines in order to define and call a method.',items:['static int twice(int n) {','  return n * 2;','}','System.out.println(twice(4));'],e:'The method is declared first with its body, then called. The call prints 8.'}]}
