U('java',{t:'Unit 3 · OOP, Collections and Generics',l:[
{t:'Inheritance and Polymorphism',c:'inherit',teach:'A subclass inherits the fields and methods of its parent using extends. Java allows only one parent class. Use super to call the parent constructor or method, and @Override to replace a parent method. Polymorphism means a parent-typed variable can hold a subclass object, and the overridden version of the method runs. If the parent has no no-argument constructor, the child must call super(...) first.',code:'class Animal {\n  String sound() { return "..."; }\n}\nclass Dog extends Animal {\n  @Override\n  String sound() { return "Woof"; }\n}\nAnimal a = new Dog();\nSystem.out.println(a.sound());',qs:[
{t:'mc',q:'Which keyword makes one class inherit from another?',o:['implements','extends','inherits','super'],a:1,e:'extends names the parent class. implements is for interfaces.'},
{t:'mc',q:'What does this print?',code:'class Animal { String sound() { return "..."; } }\nclass Dog extends Animal {\n  @Override String sound() { return "Woof"; }\n}\nAnimal a = new Dog();\nSystem.out.println(a.sound());',o:['...','Woof','Animal','It does not compile'],a:1,e:'The method that runs depends on the real object (a Dog), not the variable type. That is polymorphism.'},
{t:'tf',q:'A Java class can extend two classes at the same time.',o:TF,a:1,e:'Java allows a single parent class. Use interfaces when you need several types.'},
{t:'fill',q:'Complete the subclass declaration.',code:'class Cat ___ Animal {\n}',a:['extends'],e:'A subclass names its parent after the keyword extends.'},
{t:'mc',q:'Find the bug: why does Child not compile?',code:'class Parent {\n  Parent(String name) { }\n}\nclass Child extends Parent {\n  Child() { }\n}',o:['Child must be abstract','The Child constructor never calls super(...) with a String','Parent must be final','Constructors cannot be empty'],a:1,e:'Parent has no no-argument constructor, so Child must call super("something") on its first line.'},
{t:'match',q:'Match each item to its role.',pairs:[['extends','inherit from a class'],['super','refer to the parent'],['@Override','replace a parent method'],['new Dog()','create the object']],e:'Each word has one job in inheritance: declare the parent, reach the parent, mark a replacement and construct the object.'}]},
{t:'Abstract Classes and Interfaces',c:'iface',teach:'An interface defines a contract: methods a class promises to provide. A class uses implements and may implement many interfaces. Interface methods are public, so implementations must be public too. An abstract class cannot be instantiated and may hold fields, constructors and partly written methods; it can also declare abstract methods that subclasses must complete. Interfaces can offer default methods with a body.',code:'interface Shape {\n  double area();\n}\nclass Square implements Shape {\n  double s;\n  Square(double s) { this.s = s; }\n  public double area() { return s * s; }\n}\nShape sh = new Square(3);\nSystem.out.println(sh.area());',qs:[
{t:'mc',q:'What does this print?',code:'interface Shape { double area(); }\nclass Square implements Shape {\n  double s;\n  Square(double s) { this.s = s; }\n  public double area() { return s * s; }\n}\nShape sh = new Square(3);\nSystem.out.println(sh.area());',o:['9','9.0','3.0','It does not compile'],a:1,e:'area returns a double, so 3 * 3 prints as 9.0.'},
{t:'mc',q:'Which line fails to compile?',o:['Shape s = new Square(2);','Shape s = new Shape();','Square q = new Square(2);','Object o = new Square(2);'],a:1,e:'An interface cannot be instantiated. It is used as a type, with a concrete class on the right side of new.'},
{t:'fill',q:'Complete the class header.',code:'class Square ___ Shape {\n}',a:['implements'],e:'A class implements an interface, while it extends a class.'},
{t:'tf',q:'A class can implement more than one interface.',o:TF,a:0,e:'Multiple interfaces are allowed, which is how Java gets flexible types without multiple class inheritance.'},
{t:'mc',q:'Find the bug: why does this not compile?',code:'interface Shape { double area(); }\nclass Circle implements Shape {\n  double area() { return 3.14; }\n}',o:['area must return int','The implementation must be public','Circle needs a main method','Interfaces cannot have methods'],a:1,e:'Interface methods are implicitly public, and an implementation cannot have weaker access. Write public double area().'},
{t:'mc',q:'Which feature belongs to an abstract class but not to an interface?',o:['Declaring methods','Holding instance fields with state','Being used as a variable type','Being extended or implemented'],a:1,e:'Abstract classes can hold instance fields and constructors. Interfaces describe behaviour and cannot hold instance state.'}]},
{t:'ArrayList',c:'arraylist',teach:'ArrayList is a resizable list from java.util, so import it. Declare it by the List interface: List<String> names = new ArrayList<>(). Key methods are add, get(index), set, remove, size, contains and isEmpty. Lists hold objects only, so use Integer instead of int. Printing a list shows [a, b]. On List<Integer>, remove(1) removes by index, not by value.',code:'import java.util.*;\n\nList<String> names = new ArrayList<>();\nnames.add("Ana");\nnames.add("Bo");\nSystem.out.println(names.get(0));\nSystem.out.println(names.size());\nfor (String n : names) {\n  System.out.println(n);\n}',qs:[
{t:'mc',q:'What does this print?',code:'List<String> list = new ArrayList<>();\nlist.add("a");\nlist.add("b");\nlist.add("c");\nlist.remove(1);\nSystem.out.println(list);',o:['[a, c]','[b, c]','[a, b]','[a, b, c]'],a:0,e:'remove(1) removes the element at index 1, which is "b". The rest shift left.'},
{t:'mc',q:'Which call gives the number of items in a List?',o:['list.length','list.length()','list.size()','list.count()'],a:2,e:'Collections use size(). length is for arrays and length() is for strings.'},
{t:'fill',q:'Complete the creation of the list.',code:'List<String> l = new ___<>();',a:['ArrayList'],e:'ArrayList is the resizable-array implementation of List.'},
{t:'mc',q:'Find the bug: why does this not compile?',code:'List<int> nums = new ArrayList<>();',o:['ArrayList needs a size','Generic types cannot be primitives; use Integer','List must be imported from java.io','nums needs to be final'],a:1,e:'Type arguments must be objects. Write List<Integer>; int values are boxed automatically.'},
{t:'mc',q:'What does this print?',code:'List<Integer> xs = new ArrayList<>();\nxs.add(10);\nxs.add(20);\nSystem.out.println(xs.get(xs.size() - 1));',o:['10','20','2','It throws an exception'],a:1,e:'size() is 2, so size() - 1 is index 1, the last element, 20.'},
{t:'order',q:'Put the lines in order to print the list size.',items:['List<String> l = new ArrayList<>();','l.add("x");','System.out.println(l.size());'],e:'Create the list, add an item, then ask for the size. It prints 1.'}]},
{t:'HashMap and HashSet',c:'maps',teach:'A Map stores key-value pairs. HashMap gives fast lookup by key: put, get, containsKey, remove, size and getOrDefault. Putting an existing key replaces its value. get returns null for a missing key. A Set stores unique values, so HashSet ignores duplicates. Neither guarantees iteration order. Loop a map with entrySet() or keySet().',code:'Map<String, Integer> ages = new HashMap<>();\nages.put("Ana", 30);\nages.put("Bo", 25);\nSystem.out.println(ages.get("Ana"));\nSystem.out.println(ages.getOrDefault("Cy", 0));\nSet<Integer> ids = new HashSet<>();\nids.add(1);\nids.add(1);',qs:[
{t:'mc',q:'What does this print?',code:'Map<String, Integer> m = new HashMap<>();\nm.put("a", 1);\nm.put("a", 2);\nSystem.out.println(m.get("a") + " " + m.size());',o:['1 2','2 1','2 2','1 1'],a:1,e:'The second put replaces the value for the same key, so a maps to 2 and the map still has one entry.'},
{t:'mc',q:'What does this print?',code:'Set<Integer> s = new HashSet<>();\ns.add(1);\ns.add(1);\ns.add(2);\nSystem.out.println(s.size());',o:['1','2','3','It throws an exception'],a:1,e:'Sets keep unique values only. The duplicate 1 is ignored, leaving 1 and 2.'},
{t:'fill',q:'Complete the call that stores a pair.',code:'ages.___("Ana", 30);',a:['put'],e:'put(key, value) stores or replaces a mapping.'},
{t:'mc',q:'What does get return for a key that is not in the map?',o:['0','An empty string','null','It throws an exception'],a:2,e:'get returns null when the key is absent. Use getOrDefault to supply a fallback.'},
{t:'mc',q:'Find the bug: this crashes when "zz" is missing. Why?',code:'Map<String, Integer> counts = new HashMap<>();\nint n = counts.get("zz");',o:['int cannot hold counts','get returns null, and unboxing null into an int throws NullPointerException','HashMap needs a size','get requires two arguments'],a:1,e:'The missing key gives null, which cannot be unboxed to int. Use getOrDefault("zz", 0) instead.'},
{t:'tf',q:'HashMap guarantees that entries come back in the order you inserted them.',o:TF,a:1,e:'HashMap makes no ordering promise. LinkedHashMap keeps insertion order and TreeMap sorts by key.'}]},
{t:'Generics',c:'generics',teach:'Generics let a class or method work with a type chosen by the caller, written in angle brackets. A type parameter such as T stands for that type: class Box<T>. The compiler then checks types, so you avoid casts and catch mistakes early. Type arguments must be objects, not primitives. A generic method declares its own parameter before the return type: static <T> T first(List<T> xs).',code:'class Box<T> {\n  private T value;\n  Box(T v) { value = v; }\n  T get() { return value; }\n}\nBox<String> b = new Box<>("hi");\nString s = b.get();\nstatic <T> T first(List<T> xs) {\n  return xs.get(0);\n}',qs:[
{t:'mc',q:'What is the main benefit of generics?',o:['Faster execution','Compile-time type safety without casts','Shorter variable names','Automatic memory freeing'],a:1,e:'The compiler knows the element type, so it rejects wrong types and removes the need to cast.'},
{t:'mc',q:'What does this print?',code:'class Box<T> {\n  private T value;\n  Box(T v) { value = v; }\n  T get() { return value; }\n}\nBox<Integer> b = new Box<>(5);\nSystem.out.println(b.get() + 1);',o:['5','6','51','It does not compile'],a:1,e:'get returns an Integer, which unboxes for the addition: 5 + 1 is 6.'},
{t:'fill',q:'Complete the type argument.',code:'Box<___> b = new Box<>("hi");',a:['String'],e:'The constructor argument is a String, so the box is a Box<String>.'},
{t:'mc',q:'Find the bug: which line fails to compile?',code:'List<String> names = new ArrayList<>();\nnames.add("Ana");\nnames.add(42);',o:['The first add','The second add, because 42 is not a String','The declaration','None; it compiles'],a:1,e:'The list accepts only Strings. Catching this at compile time is exactly what generics provide.'},
{t:'tf',q:'List<int> is a valid type in Java.',o:TF,a:1,e:'Type arguments must be reference types. Use List<Integer>.'},
{t:'match',q:'Match each piece of syntax to its meaning.',pairs:[['Box<T>','generic class with a type parameter'],['<>','diamond: infer the type argument'],['List<String>','list restricted to strings'],['static <T> T id(T x)','generic method']],e:'Each form uses angle brackets differently: declaring a parameter, letting the compiler infer it, supplying it and declaring a method-level one.'}]},
{t:'Checkpoint: OOP, Collections and Generics',c:'check3',teach:'Review: extends and overriding, interfaces with implements, ArrayList and its size(), HashMap and HashSet for lookup and uniqueness, and generics for type-safe containers. Remember that a variable\'s type decides what you can call, while the object decides which override runs.',code:'List<String> names = new ArrayList<>();\nnames.add("Bo");\nnames.add("Ana");\nMap<String, Integer> m = new HashMap<>();\nfor (String n : names) {\n  m.put(n, n.length());\n}\nSystem.out.println(m.get("Ana"));',qs:[
{t:'mc',q:'What does this print?',code:'List<String> names = new ArrayList<>();\nnames.add("Bo");\nnames.add("Ana");\nMap<String, Integer> m = new HashMap<>();\nfor (String n : names) {\n  m.put(n, n.length());\n}\nSystem.out.println(m.get("Ana"));',o:['2','3','Ana','null'],a:1,e:'Each name maps to its length, and "Ana" has 3 characters.'},
{t:'match',q:'Match each type to its best use.',pairs:[['ArrayList','ordered, growable sequence'],['HashMap','lookup by key'],['HashSet','unique values'],['interface','contract several classes can share']],e:'Each type answers a different need: sequence, key lookup, uniqueness and a shared contract.'},
{t:'mc',q:'What does this print?',code:'class A { String hi() { return "A"; } }\nclass B extends A { @Override String hi() { return "B"; } }\nA x = new B();\nSystem.out.println(x.hi());',o:['A','B','AB','It does not compile'],a:1,e:'The object is a B, so its overriding hi runs even though the variable type is A.'},
{t:'fill',q:'Complete the generic declaration.',code:'Map<String, ___> m = new HashMap<>();\nm.put("a", 1);',a:['Integer'],e:'The value 1 is stored as an Integer; primitives cannot be type arguments.'},
{t:'mc',q:'Find the bug: why does this fail to compile?',code:'Set<String> s = new HashSet<>();\ns.add("a");\nString first = s.get(0);',o:['HashSet needs a size','Sets have no get(index) method','a must be an int','Sets cannot hold strings'],a:1,e:'A Set has no positions, so there is no get(index). Use a List if you need index access.'}]}
]});

U('java',{t:'Unit 4 · Exceptions, Streams and Concurrency',l:[
{t:'Exceptions',c:'exceptions',teach:'Exceptions signal that something went wrong. Wrap risky code in try, handle a specific type in catch, and put cleanup in finally, which runs whether or not an exception happened. throw raises one. Checked exceptions such as IOException must be caught or declared with throws; unchecked ones (RuntimeException and subclasses) need not be. Put specific catches before general ones.',code:'try {\n  int[] a = new int[2];\n  a[5] = 1;\n} catch (ArrayIndexOutOfBoundsException e) {\n  System.out.println("bad index");\n} finally {\n  System.out.println("done");\n}\nif (x < 0) throw new IllegalArgumentException("neg");',qs:[
{t:'mc',q:'What does this print?',code:'try {\n  int[] a = new int[2];\n  a[5] = 1;\n  System.out.println("ok");\n} catch (ArrayIndexOutOfBoundsException e) {\n  System.out.println("bad index");\n} finally {\n  System.out.println("done");\n}',o:['ok then done','bad index then done','bad index only','done then bad index'],a:1,e:'The assignment throws, so "ok" is skipped, the catch prints bad index, and finally always runs afterwards.'},
{t:'fill',q:'Complete the statement that raises an exception.',code:'___ new IllegalArgumentException("negative");',a:['throw'],e:'throw raises an exception object. throws, with an s, is used in a method signature.'},
{t:'mc',q:'What is true about a checked exception such as IOException?',o:['It can never be caught','It must be caught or declared with throws','It is thrown only by the JVM','It stops the program immediately'],a:1,e:'The compiler enforces handling of checked exceptions. Unchecked ones, like NullPointerException, are not enforced.'},
{t:'mc',q:'Find the bug: why does this not compile?',code:'try {\n  readFile();\n} catch (Exception e) {\n  System.out.println("general");\n} catch (IOException e) {\n  System.out.println("io");\n}',o:['finally is missing','The IOException catch is unreachable after the broader Exception catch','catch needs two parameters','readFile must be static'],a:1,e:'Exception already catches every IOException, so the later block can never run. Order specific types first.'},
{t:'tf',q:'The finally block runs even when the try block completes without any exception.',o:TF,a:0,e:'finally is for cleanup and runs in both the normal and the exceptional case.'},
{t:'match',q:'Match each keyword to its purpose.',pairs:[['try','wrap risky code'],['catch','handle a thrown exception'],['finally','cleanup that always runs'],['throws','declare an exception in a signature']],e:'These four keywords form the exception toolkit: guard, handle, clean up and declare.'}]},
{t:'Lambdas and Functional Interfaces',c:'lambdas',teach:'A lambda is a short anonymous function written as (params) -> expression. It can be used wherever a functional interface is expected, meaning an interface with exactly one abstract method. Common ones are Predicate (test, returns boolean), Function (apply), Consumer (accept, returns nothing) and Supplier (get). A method reference such as String::length is shorthand for a lambda. Captured local variables must be effectively final.',code:'Predicate<Integer> even = n -> n % 2 == 0;\nFunction<String, Integer> len = String::length;\nList<String> words = new ArrayList<>(List.of("ccc", "a", "bb"));\nwords.sort((a, b) -> a.length() - b.length());\nwords.forEach(System.out::println);\nSystem.out.println(even.test(4));',qs:[
{t:'mc',q:'What does this print?',code:'Predicate<Integer> even = n -> n % 2 == 0;\nSystem.out.println(even.test(4));',o:['4','true','false','It does not compile'],a:1,e:'4 % 2 is 0, so the predicate returns true.'},
{t:'mc',q:'What does this print?',code:'Function<Integer, Integer> twice = x -> x * 2;\nSystem.out.println(twice.apply(5));',o:['5','10','25','twice'],a:1,e:'apply runs the lambda with x = 5, giving 10.'},
{t:'mc',q:'Where can a lambda be used?',o:['Anywhere a variable is allowed','Where a functional interface (one abstract method) is expected','Only inside static methods','Only with the Thread class'],a:1,e:'The lambda supplies the body of the single abstract method, so the target type must be a functional interface.'},
{t:'fill',q:'Complete the method reference.',code:'Function<String, Integer> f = String::___;',a:['length'],e:'String::length is the same as s -> s.length().'},
{t:'mc',q:'Find the bug: why does this not compile?',code:'int count = 0;\nList<String> xs = List.of("a", "b");\nxs.forEach(x -> count++);',o:['forEach needs two arguments','A lambda cannot change a captured local variable','List.of returns null','count must be a double'],a:1,e:'Local variables used in a lambda must be effectively final. Use an AtomicInteger or a normal loop to count.'},
{t:'match',q:'Match each functional interface to its method.',pairs:[['Predicate<T>','test: returns boolean'],['Function<T,R>','apply: returns a result'],['Consumer<T>','accept: returns nothing'],['Supplier<T>','get: takes no input']],e:'Each standard interface fixes the input and output shape of its single method.'}]},
{t:'Streams',c:'streams',teach:'A stream processes a collection as a pipeline: a source (list.stream()), intermediate steps such as filter, map and sorted, and one terminal step such as collect, toList, count, sum or forEach. Nothing runs until the terminal operation. Streams do not change the source, and a stream can be used only once.',code:'List<Integer> nums = List.of(1, 2, 3, 4, 5, 6);\nint total = nums.stream()\n  .filter(n -> n % 2 == 0)\n  .mapToInt(n -> n * n)\n  .sum();\nList<String> up = List.of("a", "b").stream()\n  .map(String::toUpperCase)\n  .toList();',qs:[
{t:'mc',q:'What does this print?',code:'List<Integer> nums = List.of(1, 2, 3, 4, 5, 6);\nint total = nums.stream()\n  .filter(n -> n % 2 == 0)\n  .mapToInt(n -> n * n)\n  .sum();\nSystem.out.println(total);',o:['12','56','91','20'],a:1,e:'The even numbers are 2, 4 and 6, whose squares are 4, 16 and 36. They add up to 56.'},
{t:'mc',q:'Which of these is an intermediate operation?',o:['count','filter','forEach','sum'],a:1,e:'filter returns another stream. count, forEach and sum are terminal operations that produce a result and end the pipeline.'},
{t:'fill',q:'Complete the terminal operation that counts matches.',code:'long c = nums.stream().filter(n -> n > 3).___();',a:['count'],e:'count is a terminal operation that returns how many elements remain.'},
{t:'tf',q:'Calling filter on a stream removes elements from the original list.',o:TF,a:1,e:'Streams never modify their source. The filtered result is a new sequence.'},
{t:'mc',q:'Find the bug: what goes wrong here?',code:'Stream<String> s = List.of("a", "b").stream();\ns.forEach(System.out::println);\ns.forEach(System.out::println);',o:['Nothing; it prints four lines','The second use throws IllegalStateException because the stream is already consumed','forEach is not allowed on strings','The list must be mutable'],a:1,e:'A stream can be consumed once. Create a new stream from the list for a second pass.'},
{t:'order',q:'Put the pipeline in order.',items:['list.stream()','.filter(s -> s.length() > 1)','.map(String::toUpperCase)','.toList();'],e:'A pipeline begins at the source, applies intermediate steps, and ends with a terminal operation.'}]},
{t:'Enums, Records and Optional',c:'modern',teach:'An enum is a fixed set of named constants and works well in switch. A record is a compact immutable data class: the header declares the components, and Java generates the constructor, accessors like p.x(), equals, hashCode and toString. Optional<T> wraps a value that may be absent, making the missing case explicit through methods like orElse, isPresent and ifPresent.',code:'enum Level { LOW, HIGH }\nrecord Point(int x, int y) { }\nPoint p = new Point(1, 2);\nSystem.out.println(p.x());\nSystem.out.println(p);\nOptional<String> o = Optional.empty();\nSystem.out.println(o.orElse("none"));',qs:[
{t:'mc',q:'What does this print?',code:'record Point(int x, int y) { }\nSystem.out.println(new Point(3, 4));',o:['Point','Point[x=3, y=4]','3 4','It does not compile'],a:1,e:'A record gets a generated toString that shows its name and components.'},
{t:'mc',q:'What does this print?',code:'Optional<String> o = Optional.empty();\nSystem.out.println(o.orElse("none"));',o:['null','none','Optional.empty','It throws an exception'],a:1,e:'The Optional is empty, so orElse supplies the fallback value.'},
{t:'fill',q:'Complete the call that gives a fallback.',code:'String s = opt.___("n/a");',a:['orElse'],e:'orElse returns the wrapped value if present, otherwise the given default.'},
{t:'tf',q:'Two records with equal component values are equal according to equals.',o:TF,a:0,e:'Records generate equals and hashCode based on all components.'},
{t:'mc',q:'Find the bug: why does this not compile?',code:'record Point(int x, int y) { }\nPoint p = new Point(1, 2);\np.x = 5;',o:['Records need a main method','Record components are final, so they cannot be reassigned','x must be accessed as p.x()','Point needs an extends clause'],a:1,e:'Records are immutable. To change a value, create a new record with the new component.'}]},
{t:'Threads and Concurrency',c:'threads',teach:'A Thread runs code in parallel with the rest of the program. Create one with a Runnable lambda and call start(); calling run() directly just runs on the current thread. join() waits for a thread to finish. Shared mutable data causes race conditions, such as lost updates from count++, which you prevent with synchronized or AtomicInteger. An ExecutorService manages a pool of threads and should be shut down when finished.',code:'Thread t = new Thread(() -> System.out.println("B"));\nSystem.out.println("A");\nt.start();\nt.join();\nSystem.out.println("C");\nExecutorService ex = Executors.newFixedThreadPool(2);\nFuture<Integer> f = ex.submit(() -> 42);\nSystem.out.println(f.get());\nex.shutdown();',qs:[
{t:'mc',q:'What does this print?',code:'Thread t = new Thread(() -> System.out.println("B"));\nSystem.out.println("A");\nt.start();\nt.join();\nSystem.out.println("C");',o:['A B C','B A C','A C B','C B A'],a:0,e:'A prints before the thread starts, and join waits for B to finish before C prints, so the order is fixed.'},
{t:'mc',q:'What does start() do that run() does not?',o:['Nothing; they are identical','start() begins a new thread that executes run()','start() stops the thread','run() is only for static methods'],a:1,e:'start() creates a new thread. Calling run() directly executes the code on the current thread.'},
{t:'fill',q:'Complete the keyword that lets only one thread at a time enter the method.',code:'private ___ void inc() {\n  count++;\n}',a:['synchronized'],e:'synchronized locks the object during the method so increments do not interleave and get lost.'},
{t:'mc',q:'Find the bug: the work does not run in parallel. Why?',code:'Thread t = new Thread(() -> heavyWork());\nt.run();',o:['Threads need a name','run() executes on the calling thread; use start()','heavyWork must be static','join must come first'],a:1,e:'run() is an ordinary method call. Only start() launches a separate thread.'},
{t:'mc',q:'Why can two threads running count++ on a shared int lose updates?',o:['Java forbids shared variables','count++ is a read, add and write sequence that can interleave','Integers are immutable','The JVM allows only one core'],a:1,e:'Both threads can read the same old value and each write back the same result. Use synchronized or AtomicInteger.'},
{t:'tf',q:'An ExecutorService should be shut down when you have finished submitting work.',o:TF,a:0,e:'Its worker threads keep the program alive until shutdown is called.'}]},
{t:'Capstone: Word Counter',c:'capstone',teach:'This small program counts words and reports the repeated ones. It combines a HashMap with getOrDefault, a for-each over split text, and a stream with filter, map, sorted and forEach. Read it top to bottom: build the counts first, then query them. Keys are words and values are how many times each appears.',code:'String text = "to be or not to be";\nMap<String, Integer> counts = new HashMap<>();\nfor (String w : text.split(" ")) {\n  counts.put(w, counts.getOrDefault(w, 0) + 1);\n}\ncounts.entrySet().stream()\n  .filter(e -> e.getValue() > 1)\n  .map(Map.Entry::getKey)\n  .sorted()\n  .forEach(System.out::println);',qs:[
{t:'mc',q:'What does the program print?',code:'String text = "to be or not to be";\nMap<String, Integer> counts = new HashMap<>();\nfor (String w : text.split(" ")) {\n  counts.put(w, counts.getOrDefault(w, 0) + 1);\n}\ncounts.entrySet().stream()\n  .filter(e -> e.getValue() > 1)\n  .map(Map.Entry::getKey)\n  .sorted()\n  .forEach(System.out::println);',o:['be and to, each on its own line','to and be, each on its own line','Every word, one per line','Nothing'],a:0,e:'Only "to" and "be" appear twice. sorted puts them in alphabetical order, so be prints before to.'},
{t:'mc',q:'After the loop, what does counts.get("or") return?',o:['0','1','2','null'],a:1,e:'"or" appears once in the text, so its count is 1.'},
{t:'fill',q:'Complete the increment so unseen words start from zero.',code:'counts.put(w, counts.getOrDefault(w, ___) + 1);',a:['0'],e:'For a word not yet in the map, getOrDefault gives 0, and adding 1 stores a first count of 1.'},
{t:'mc',q:'Find the bug: this version throws on the first word. Why?',code:'for (String w : text.split(" ")) {\n  counts.put(w, counts.get(w) + 1);\n}',o:['split returns a list','get returns null for a new word and unboxing it throws NullPointerException','put cannot take an expression','The loop variable must be an int'],a:1,e:'The first time a word appears there is no entry, so get returns null. getOrDefault avoids the problem.'},
{t:'order',q:'Put the counting code in order.',items:['String text = "a b a";','Map<String, Integer> counts = new HashMap<>();','for (String w : text.split(" ")) {','  counts.put(w, counts.getOrDefault(w, 0) + 1);','}'],e:'Prepare the text and map, loop over the words, and update the count inside the loop body.'},
{t:'match',q:'Match each part of the program to its job.',pairs:[['split(" ")','breaks the text into words'],['HashMap','stores a count per word'],['filter','keeps words seen more than once'],['sorted','puts the output in order']],e:'The program flows from splitting to counting to filtering to ordered output.'}]}
]});

U('kt',{t:'Unit 1 · Kotlin Fundamentals',l:[
{t:'Variables and Types',c:'vars',teach:'Kotlin uses var for mutable variables and val for immutable ones. val is preferred when the value never changes because it makes code safer and easier to reason about. Kotlin infers types from the initializer, so you often do not need to write types explicitly. Types include Int, Long, Double, String, and Boolean.',code:'val age = 30\nvar count = 0\ncount = count + 1\nval name: String = "Ada"\nprintln("$name is $age")',qs:[
{t:'mc',q:'Which keyword declares a variable that cannot be reassigned?',o:['var','val','let','const'],a:1,e:'val creates an immutable binding. var allows reassignment.'},
{t:'mc',q:'What does this print?',code:'val x = 5\nval y = x\nval x = 10\nprintln(y)',o:['5','10','15','Error'],a:0,e:'y gets a copy of 5, and the new x does not affect y. The two x declarations are in different scopes or would be a redeclaration error; this shows how assignment works.'},
{t:'fill',q:'Fill in the keyword for a value that never changes.',code:'___ PI = 3.14159',a:['val'],e:'val is immutable and best for constants.'},
{t:'mc',q:'What is the type of "hello"?',o:['Char','String','Text','Literal'],a:1,e:'Text in quotes is a String. Char is a single character in single quotes.'},
{t:'match',q:'Match each keyword to its property.',pairs:[['val','immutable'],['var','mutable'],['Int','whole number'],['String','text']],e:'val and var control reassignability; Int and String are types.'}
]},
{t:'Operators and Type Inference',c:'ops',teach:'Arithmetic uses + - * / %. Division of two Ints uses integer division: 7 / 2 equals 3. The == operator compares values (not identity). Kotlin infers String type from double-quoted literals, Int from plain numbers, and Double from decimals. Use template strings with $ inside double quotes to embed expressions.',code:'val a = 7\nval b = 2\nprintln(a / b)\nprintln(a % b)\nval name = "Bob"\nval greeting = "Hello, $name"',qs:[
{t:'mc',q:'What does 7 / 2 equal in Kotlin?',o:['3','3.5','4','3.0'],a:0,e:'Two Ints divide with integer division, truncating to 3.'},
{t:'mc',q:'What does this print?',code:'val a = 10\nval b = 3\nprintln("$a % $b = ${a % b}")',o:['10 % 3 = 10','10 % 3 = 1','10 % 3 = 3.33','Error'],a:1,e:'The % operator gives the remainder, and $ embeds variables while ${expr} embeds expressions.'},
{t:'tf',q:'String type is inferred from a decimal number like 3.5.',o:TF,a:1,e:'3.5 is a Double, not a String. Only text in quotes is a String.'},
{t:'fill',q:'Complete the template string.',code:'val n = 5\nprintln("The number is $___")',a:['n'],e:'Inside a String with double quotes, $ accesses a variable directly.'},
{t:'order',q:'Put the lines in order to print the quotient and remainder.',items:['val a = 10','val b = 3','println(a / b)','println(a % b)'],e:'Declare variables first, then print quotient and remainder in order.'}
]},
{t:'Strings and Ranges',c:'strings',teach:'Strings are immutable. Access characters with s[0] and substrings with s.substring(start, end) where end is exclusive. length gives the string length. Ranges express sequences: 1..5 is 1 to 5 inclusive, 1 until 5 is 1 to 4, 5 downTo 1 counts down, 1..5 step 2 skips. for (i in range) iterates.',code:'val s = "Kotlin"\nprintln(s[0])\nprintln(s.substring(1, 4))\nprintln(s.length)\nfor (i in 1..3) println(i)',qs:[
{t:'mc',q:'What does "Kotlin"[1] give?',o:['K','o','t','l'],a:1,e:'Index 0 is K; index 1 is o.'},
{t:'mc',q:'What does "Kotlin".substring(0, 3) return?',o:['Kotlin',' Kot','Ko','otin'],a:1,e:'substring(0, 3) takes characters at indexes 0, 1, 2 (not 3), giving "Kot".'},
{t:'fill',q:'Fill in the range that counts down from 5 to 1.',code:'for (i in ___) println(i)',a:['5 downTo 1'],e:'downTo creates a descending range.'},
{t:'tf',q:'The range 1..5 includes both 1 and 5.',o:TF,a:0,e:'.. is inclusive on both ends. Use until for exclusive end: 1 until 5 goes 1 to 4.'},
{t:'match',q:'Match each method or operator to its effect.',pairs:[['[i]','access character at index i'],['substring(a,b)','extract substring'],['length','count of characters'],['.uppercase()','convert to uppercase']],e:'These are core string operations in Kotlin.'}
]},
{t:'Conditionals and Boolean Logic',c:'cond',teach:'if, else if, and else choose branches. Combine conditions with && (and), || (or), and ! (not). when replaces switch and is more flexible: when (x) { 1 -> ... 2 -> ... else -> ... }. All paths must be covered or you need else.',code:'val age = 18\nwhen (age) {\n  in 0..12 -> println("child")\n  in 13..17 -> println("teen")\n  else -> println("adult")\n}',qs:[
{t:'mc',q:'What does this print?',code:'val x = 10\nif (x > 5) println("big")\nelse println("small")',o:['big','small','10','Error'],a:0,e:'10 > 5 is true, so the if branch executes.'},
{t:'mc',q:'What does this print?',code:'val a = true\nval b = false\nprintln(a && b)',o:['true','false','undefined','Error'],a:1,e:'&& requires both sides true. true && false is false.'},
{t:'fill',q:'Complete the in check for a range.',code:'if (age in ___) println("teen")',a:['13..17'],e:'in checks whether a value belongs to a range.'},
{t:'tf',q:'!true equals false.',o:TF,a:0,e:'! (not) flips the boolean: !true is false and !false is true.'},
{t:'order',q:'Put the lines in order to classify a number.',items:['val n = 5','if (n > 10) println("big")','else if (n > 0) println("small")','else println("zero or negative")'],e:'Declare first, then test conditions in order of priority.'}
]},
{t:'Collections: Lists and Maps',c:'cols',teach:'listOf creates an immutable list, mutableListOf creates a mutable one. Access with list[i], add with list.add(item), and iterate with for (item in list). mapOf creates an immutable map, and mutableMapOf is mutable. Access map[key] and iterate with for ((k, v) in map).',code:'val nums = listOf(1, 2, 3)\nprintln(nums[0])\nval map = mapOf("a" to 1, "b" to 2)\nprintln(map["a"])\nfor ((k, v) in map) println("$k -> $v")',qs:[
{t:'mc',q:'What does listOf(10, 20, 30)[1] give?',o:['10','20','30','Error'],a:1,e:'Index 0 is 10; index 1 is 20.'},
{t:'mc',q:'What type is nums in val nums = listOf(1, 2, 3)?',o:['MutableList','List','Array','Collection'],a:1,e:'listOf creates an immutable List. mutableListOf would make a MutableList.'},
{t:'fill',q:'Fill in the method to add to a mutable list.',code:'val items = mutableListOf(1, 2)\nitems.___(3)\nprintln(items)',a:['add'],e:'The add method appends an element to a mutable list.'},
{t:'mc',q:'What does this print?',code:'val map = mapOf("x" to 10)\nprintln(map["x"])',o:['map["x"]','10','x','Error'],a:1,e:'Accessing a map with a key returns the associated value.'},
{t:'match',q:'Match each collection type to a property.',pairs:[['List','immutable sequence'],['MutableList','can grow or shrink'],['Map','key-value pairs'],['to','syntax for key -> value']],e:'Collections have different mutability and iteration patterns.'}
]},
{t:'Checkpoint: Fundamentals',c:'check1',teach:'Review: val is immutable and preferred; var is mutable. Kotlin infers types. Integer division truncates. Strings use $ for templates and have methods like substring and length. Ranges work with for and in. Collections include List and Map with different mutability.',code:'val name = "Kotlin"\nfor (i in 0 until name.length) {\n  println("${i + 1}: ${name[i]}")\n}',qs:[
{t:'mc',q:'What does this print?',code:'val x = 7\nval y = 2\nprintln("$x / $y = ${x / y}")',o:['7 / 2 = 3.5','7 / 2 = 3','7 / 2 = 7','Error'],a:1,e:'Two Ints divide with integer division, and template strings embed expressions with ${}.'},
{t:'mc',q:'Which declares an immutable list?',o:['listOf(1, 2, 3)','mutableListOf(1, 2, 3)','list(1, 2, 3)','List[1, 2, 3]'],a:0,e:'listOf is immutable; mutableListOf allows modification.'},
{t:'fill',q:'Complete the when expression to match multiple values.',code:'when (x) {\n  1, 2 -> println("one or two")\n  ___ -> println("other")\n}',a:['else'],e:'else catches any value not matched by earlier branches.'},
{t:'tf',q:'The range 1 until 5 includes 5.',o:TF,a:1,e:'until is exclusive at the end, so 1 until 5 is 1, 2, 3, 4 (not 5).'},
{t:'order',q:'Put the lines in order to print the second element of a list.',items:['val nums = listOf(10, 20, 30)','val second = nums[1]','println(second)'],e:'Declare the list, access index 1, then print.'}
]}
]});

U('kt',{t:'Unit 2 · Functions and Defaults',l:[
{t:'Functions and Parameters',c:'funcs',teach:'fun keyword declares a function. fun add(a: Int, b: Int): Int returns the sum. Parameters have explicit types, and the return type comes after the arrow. A function can be called by name with arguments in order. Return stops and exits the function. If a function has only one expression, you can use = instead of curly braces.',code:'fun greet(name: String): String = "Hello, $name"\nfun sum(a: Int, b: Int): Int {\n  return a + b\n}\nprintln(greet("Ada"))\nprintln(sum(3, 4))',qs:[
{t:'mc',q:'What is the return type of fun add(x: Int, y: Int): Double?',o:['Int','Double','Unit','Number'],a:1,e:'The type after the colon before the function body is the return type.'},
{t:'mc',q:'How is greet("Bob") called?',o:['greet function with argument Bob','greet Bob','Bob.greet()','Error'],a:0,e:'greet("Bob") calls the function greet with the string argument "Bob".'},
{t:'fill',q:'Complete the function that returns the absolute value.',code:'fun abs(x: Int): Int = ___',a:['if (x < 0) -x else x'],e:'The function body is a single expression that returns early if x is negative.'},
{t:'tf',q:'A Kotlin function can have no return statement if it returns Unit.',o:TF,a:0,e:'Functions that return Unit (no value) omit the explicit return type and the return statement.'},
{t:'order',q:'Put the lines in order.',items:['fun double(n: Int): Int = n * 2','val result = double(5)','println(result)'],e:'Define the function, call it with an argument, then print the result.'}
]},
{t:'Default Parameters and Named Arguments',c:'defaults',teach:'Parameters can have default values: fun greet(name: String = "World"). When calling, you can pass arguments by name: greet(name="Alice") or use positional order. Named arguments are useful when a function has many optional parameters.',code:'fun describe(s: String, count: Int = 1): String {\n  return "$s (x$count)"\n}\nprintln(describe("hi"))\nprintln(describe("bye", 3))\nprintln(describe(count = 2, s = "ok"))',qs:[
{t:'mc',q:'What does describe("hello") print when describe has a default count of 1?',o:['hello (x1)','hello','hello 1','Error'],a:0,e:'The default value 1 is used when count is not provided.'},
{t:'mc',q:'Which call is valid?',o:['describe(count = 2, "hi")','describe("hi", 2)','describe(2, "hi")','describe()'],a:1,e:'Positional arguments must come before named ones, or all must be named.'},
{t:'fill',q:'Complete the function with a default value.',code:'fun power(base: Int, exp: Int = ___): Int = base * base',a:['2'],e:'The default is 2 for squaring when exp is not provided.'},
{t:'mc',q:'What does this print?',code:'fun msg(greeting: String = "Hi", name: String): String = "$greeting, $name"\nprintln(msg(name = "Sue"))',o:['Hi, Sue','Sue','Hi','Error'],a:0,e:'greeting uses the default "Hi" and name is provided by name argument.'},
{t:'match',q:'Match each call style to its effect.',pairs:[['fun f(a: Int, b: Int = 5)','b can be omitted'],['f(1, 2)','positional arguments'],['f(b = 2, a = 1)','named arguments'],['f(1)','uses default for b']],e:'Defaults and named arguments make function calls flexible.'}
]},
{t:'Lambdas and Higher-Order Functions',c:'lambdas',teach:'Lambdas are anonymous functions: { x -> x * 2 } is a function that doubles. Pass a lambda to a function that accepts a lambda parameter. List.map applies a lambda to each element. List.filter keeps elements where the lambda returns true. List.forEach calls a lambda for each element.',code:'val nums = listOf(1, 2, 3)\nval doubled = nums.map { x -> x * 2 }\nval evens = nums.filter { x -> x % 2 == 0 }\nnums.forEach { x -> println(x) }',qs:[
{t:'mc',q:'What does { x -> x + 1 } do?',o:['adds 1 to x and returns the result','adds 1 to x','defines a variable','Error'],a:0,e:'This lambda takes x and returns x + 1. It can be passed to functions or assigned.'},
{t:'mc',q:'What does listOf(1, 2, 3).map { x -> x * 2 } return?',o:['[2, 4, 6]','[1, 2, 3]','[1, 4, 9]','Error'],a:0,e:'map applies the lambda to each element: 1*2=2, 2*2=4, 3*2=6.'},
{t:'fill',q:'Complete the filter to keep even numbers.',code:'val nums = listOf(1, 2, 3, 4)\nval evens = nums.filter { x -> x ___ == 0 }',a:['%'],e:'The modulo operator % returns 0 for even numbers.'},
{t:'tf',q:'A lambda can access variables from its surrounding scope.',o:TF,a:0,e:'Lambdas are closures and can access variables from the enclosing function or class.'},
{t:'order',q:'Put the lines in order to double each number and print.',items:['val nums = listOf(1, 2, 3)','val doubled = nums.map { x -> x * 2 }','doubled.forEach { x -> println(x) }'],e:'Create the list, transform it, then iterate and print.'}
]},
{t:'Collections with Lambdas',c:'funccol',teach:'Collections support many functional operations: map transforms, filter selects, fold reduces to a single value starting with an initial value, and find returns the first matching element. Chaining operations is clean: list.filter {...}.map{...}. These operations return new collections rather than modifying in place.',code:'val nums = listOf(1, 2, 3, 4, 5)\nval result = nums\n  .filter { x -> x > 2 }\n  .map { x -> x * 2 }\nprintln(result)\nval sum = nums.fold(0) { acc, x -> acc + x }',qs:[
{t:'mc',q:'What does listOf(1, 2, 3, 4, 5).filter { x -> x > 2 } return?',o:['[1, 2]','[3, 4, 5]','[2, 3, 4, 5]','5'],a:1,e:'filter keeps elements where the condition is true: 3, 4, 5.'},
{t:'mc',q:'What does listOf(1, 2, 3).fold(0) { acc, x -> acc + x } give?',o:['0','3','6','Error'],a:2,e:'fold starts with 0, then 0+1=1, 1+2=3, 3+3=6.'},
{t:'fill',q:'Complete the operation to find the first even number.',code:'val nums = listOf(1, 3, 4, 5)\nval even = nums.___ { x -> x % 2 == 0 }',a:['find'],e:'find returns the first element matching the condition, or null if none match.'},
{t:'mc',q:'What does this chain return?',code:'listOf(1, 2, 3).filter { x -> x > 1 }.map { x -> x * 2 }',o:['[2, 3]','[4, 6]','[2, 4, 6]','[1, 2, 3]'],a:1,e:'filter keeps 2, 3 then map doubles them to 4, 6.'},
{t:'match',q:'Match each operation to its effect.',pairs:[['map','transform each element'],['filter','keep matching elements'],['fold','reduce to single value'],['find','first matching element or null']],e:'These functional operations handle different transformation patterns.'}
]},
{t:'Extension Functions',c:'ext',teach:'Extension functions add methods to existing types without inheritance. fun String.scream(): String = this.uppercase() + "!" adds scream to String. this refers to the receiver object. Extensions are useful for convenience and do not pollute the class.',code:'fun String.shout(): String = this.uppercase() + "!"\nval msg = "hello"\nprintln(msg.shout())\nfun List<Int>.sum(): Int {\n  var total = 0\n  for (x in this) total += x\n  return total\n}',qs:[
{t:'mc',q:'What does the receiver type in fun String.scream() refer to?',o:['A parameter named receiver','The type this function extends','A return type','A function parameter'],a:1,e:'String is the receiver type; this is an instance of String inside the function.'},
{t:'mc',q:'What does "hello".shout() return when shout is defined as { uppercase() + "!" }?',o:['hello!','HELLO!','shout','Error'],a:1,e:'uppercase() converts "hello" to "HELLO", then adds "!" to get "HELLO!".'},
{t:'fill',q:'Complete the extension that repeats a string.',code:'fun String.repeat(n: Int): String = ___',a:['this + this.repeat(n - 1)','(1..n).map { this }.joinToString("")'],e:'One approach uses recursion or concatenation; another creates a list and joins.'},
{t:'tf',q:'Extension functions can change the original object.',o:TF,a:1,e:'Extensions do not modify the receiver; they return new values or perform actions.'},
{t:'order',q:'Put the lines in order to use an extension.',items:['fun Int.isEven(): Boolean = this % 2 == 0','val n = 4','println(n.isEven())'],e:'Define the extension, create an Int, then call the new method.'}
]},
{t:'Checkpoint: Functions',c:'check2',teach:'Review: fun defines functions with typed parameters and return types. Default parameters and named arguments customize calls. Lambdas are anonymous functions passed to higher-order functions like map, filter, and fold. Extension functions add methods to types. Operations chain for readable data transformations.',code:'val nums = listOf(1, 2, 3, 4, 5)\nval result = nums\n  .filter { x -> x % 2 == 0 }\n  .map { x -> x * x }\nprintln(result)',qs:[
{t:'mc',q:'What does this filter and map chain return?',code:'listOf(1, 2, 3, 4).filter { x -> x > 1 }.map { x -> x * 2 }',o:['[4, 6, 8]','[2, 4, 6]','[1, 2, 3, 4]','[2, 3, 4]'],a:0,e:'filter keeps 2, 3, 4; map doubles to 4, 6, 8.'},
{t:'mc',q:'What does fun greet(name: String = "World"): String mean?',o:['name is required','name can be omitted','World must be passed','Error'],a:1,e:'Default parameters make arguments optional.'},
{t:'fill',q:'Complete the lambda that checks if a number is odd.',code:'val isOdd = { x: Int -> x % 2 ___ 1 }',a:['=='],e:'A number is odd if the remainder when divided by 2 is 1.'},
{t:'tf',q:'map returns a new list without modifying the original.',o:TF,a:0,e:'map, filter, and other collection operations create new collections in Kotlin.'},
{t:'order',q:'Put the operations in order for readability.',items:['val result = nums','  .filter { x -> x > 0 }','  .map { x -> x * 2 }','  .fold(0) { a, x -> a + x }'],e:'Chain from source to filter to map to fold (reduce).'}
]}
]});

U('kt',{t:'Unit 3 · Classes and Inheritance',l:[
{t:'Classes and Properties',c:'classes',teach:'class defines a type. Properties with var or val hold data. A primary constructor is defined in the class header: class Person(val name: String, var age: Int). Methods are functions inside the class. this refers to the instance. Getters and setters for properties are generated automatically; use custom get/set blocks to override.',code:'class Person(val name: String, var age: Int) {\n  fun greet(): String = "Hi, I am $name"\n  fun birthday() {\n    age++\n  }\n}\nval p = Person("Bob", 30)\nprintln(p.greet())',qs:[
{t:'mc',q:'What does class Person(val name: String) create?',o:['A variable named name','A property name on Person objects','A function','Error'],a:1,e:'val in the constructor creates an immutable property on each instance.'},
{t:'mc',q:'What does p.age = 31 do when age is var age: Int?',o:['Does nothing','Sets the age property','Calls a setter','Error'],a:1,e:'var allows both getting and setting. The setter is called automatically.'},
{t:'fill',q:'Complete the class with a constructor parameter.',code:'class Point(___ x: Double, val y: Double) { }',a:['val'],e:'val or var in the constructor creates a property on the instance.'},
{t:'tf',q:'val properties have a setter generated automatically.',o:TF,a:1,e:'val is read-only after initialization. var has both getter and setter.'},
{t:'match',q:'Match each member to its role.',pairs:[['val name: String','immutable property'],['var age: Int','mutable property'],['fun greet()','method'],['this.name','reference to property']],e:'Classes combine properties and methods into a type.'}
]},
{t:'Inheritance and Open',c:'inherit',teach:'open allows a class to be inherited. class Dog(name: String) : Animal(name) extends Animal. The base class constructor is called with the colon and arguments. Derived classes inherit all members and can override methods marked open with the override keyword. super refers to the base class.',code:'open class Animal(val name: String) {\n  open fun speak(): String = "Some sound"\n}\nclass Dog(name: String) : Animal(name) {\n  override fun speak(): String = "Woof"\n}\nval d = Dog("Rex")\nprintln(d.speak())',qs:[
{t:'mc',q:'Why must a class be marked open to be inherited?',o:['For safety; final by default','For performance','For clarity','By convention only'],a:0,e:'Kotlin makes classes final by default so inheritance is explicit and intentional.'},
{t:'mc',q:'What does class Dog(name: String) : Animal(name) do?',o:['Creates a Dog that contains an Animal','Dog inherits from Animal','Copies Animal into Dog','Error'],a:1,e:'The colon and Animal(name) mean Dog inherits and calls the parent constructor.'},
{t:'fill',q:'Complete the override keyword.',code:'class Cat(name: String) : Animal(name) {\n  ___ fun speak(): String = "Meow"\n}',a:['override'],e:'override explicitly marks a method as replacing a parent implementation.'},
{t:'mc',q:'What does super.speak() call?',o:['The current class speak','The parent class speak','A static method','Error'],a:1,e:'super refers to members in the parent class.'},
{t:'order',q:'Put in order to create and use a derived class.',items:['open class Vehicle { }','class Car : Vehicle { }','val c = Car()','c.method()'],e:'Define the base class as open, inherit, instantiate, then use.'}
]},
{t:'Generics',c:'generics',teach:'Generics parameterize types over other types. class Box<T> holds any type T. When you create Box<String>, T is String. Functions can also use generics: fun <T> first(list: List<T>): T returns the first element of any List. Bounds restrict types: <T : Number> means T must be a Number or subtype.',code:'class Box<T>(val item: T) {\n  fun get(): T = item\n}\nval intBox = Box(42)\nval strBox = Box("Hello")\nfun <T> printList(list: List<T>) {\n  for (x in list) println(x)\n}',qs:[
{t:'mc',q:'What is T in class Box<T>?',o:['A variable','A type parameter','A property','An error'],a:1,e:'T is a placeholder for any type; it is replaced when the class is used.'},
{t:'mc',q:'What is the type of intBox when created as Box(42)?',o:['Box<Any>','Box<Int>','Box<Number>','Box'],a:1,e:'Kotlin infers T as Int from the argument 42.'},
{t:'fill',q:'Complete the generic function signature.',code:'fun ___ <T> get(list: List<T>): T = list[0]',a:['val','fun'],e:'This is a function declaration, so fun starts it (val is for variables).'},
{t:'tf',q:'Generics are erased at runtime; Box<Int> and Box<String> are the same at runtime.',o:TF,a:0,e:'Kotlin uses type erasure like Java, so generic info is lost at runtime.'},
{t:'match',q:'Match each generic use to its meaning.',pairs:[['Box<String>','Box holding a String'],['<T : Number>','T must be Number or subtype'],['fun <T> first(l: List<T>)','generic function'],['T.getClass()','access T at runtime']],e:'Generics make functions and classes reusable with type safety.'}
]},
{t:'Data Classes and Destructuring',c:'data',teach:'data class automatically generates equals, hashCode, toString, and copy methods. Useful for holding related data. Destructuring breaks a data class into variables: val (name, age) = person creates name and age from the data class. Works with lists too: val (a, b, c) = listOf(1, 2, 3).',code:'data class Person(val name: String, val age: Int)\nval p = Person("Ana", 25)\nval (name, age) = p\nprintln("$name is $age")\nval copy = p.copy(age = 26)',qs:[
{t:'mc',q:'What does a data class automatically generate?',o:['only properties','equals, hashCode, toString, copy','only toString','Error'],a:1,e:'data classes generate useful methods for comparing and printing.'},
{t:'mc',q:'What does val (x, y) = listOf(1, 2) do?',o:['Declares x and y with nothing assigned','Assigns x = 1 and y = 2','Creates a list','Error'],a:1,e:'Destructuring breaks collections into individual variables.'},
{t:'fill',q:'Complete the copy method call to create a modified version.',code:'val p2 = person.___ (age = 26)',a:['copy'],e:'copy creates a new instance with one or more fields changed.'},
{t:'tf',q:'Two data class instances with the same field values are equal with ==.',o:TF,a:0,e:'data classes implement equals properly, so value equality works.'},
{t:'order',q:'Put the lines in order.',items:['data class Point(val x: Int, val y: Int)','val p = Point(1, 2)','val (a, b) = p','println("$a, $b")'],e:'Define the data class, create an instance, destructure, then print.'}
]},
{t:'Sealed Classes',c:'sealed',teach:'sealed classes restrict which types can inherit from them, useful for representing a fixed set of possibilities. Instead of a large hierarchy, use sealed class Expr { class Num : Expr, class Add : Expr, ... }. Pattern matching with when then handles all cases cleanly: when (expr) { is Num -> ... is Add -> ... }.',code:'sealed class Result\ndata class Success(val data: String) : Result()\ndata class Error(val message: String) : Result()\n\nfun handle(r: Result) {\n  when (r) {\n    is Success -> println(r.data)\n    is Error -> println(r.message)\n  }\n}',qs:[
{t:'mc',q:'Why use sealed classes instead of open classes?',o:['Performance','To restrict possible subclasses','Readability only','Mandatory for inheritance'],a:1,e:'sealed classes limit the possible subclasses, making pattern matching exhaustive.'},
{t:'mc',q:'What does is Success check?',o:['Whether r equals Success','Whether r is an instance of Success','Success is a variable','Error'],a:1,e:'is performs an instanceof check and smart casts in pattern matching.'},
{t:'fill',q:'Complete the pattern match.',code:'when (result) {\n  is Success -> println(result.data)\n  ___ -> println("Failed")\n}',a:['is Error','else'],e:'is Error or else handles the Error case or anything not Success.'},
{t:'tf',q:'Sealed classes are always abstract and cannot be instantiated directly.',o:TF,a:0,e:'Sealed classes themselves cannot be instantiated, only their subclasses.'},
{t:'match',q:'Match each concept to its use.',pairs:[['sealed class','restrict subclasses'],['is Num','type check in when'],['when (expr)','pattern matching'],['data class Success','subclass with fields']],e:'Sealed classes and pattern matching work together for type-safe code.'}
]},
{t:'Checkpoint: Classes',c:'check3',teach:'Review: Classes define types with properties and methods. open enables inheritance, override replaces parent methods, and super accesses parent members. Generics parameterize types and functions. data classes generate useful methods, and sealed classes restrict subclasses for safe pattern matching.',code:'sealed class Shape\ndata class Circle(val radius: Double) : Shape()\ndata class Rectangle(val width: Double, val height: Double) : Shape()\n\nfun area(s: Shape): Double = when (s) {\n  is Circle -> 3.14159 * s.radius * s.radius\n  is Rectangle -> s.width * s.height\n}',qs:[
{t:'mc',q:'What does sealed do in sealed class Shape?',o:['Makes it read-only','Restricts which classes can inherit','Makes it final','Error'],a:1,e:'sealed limits subclasses to those defined in the same file.'},
{t:'mc',q:'Why does when handle Circle and Rectangle exhaustively?',o:['The IDE checks','is catches all types','Shape is sealed so those are all possibilities','Error'],a:2,e:'Sealing Shape guarantees when handles every subclass case.'},
{t:'fill',q:'Complete the when to handle both subclasses.',code:'when (shape) {\n  is Circle -> println("circle")\n  ___ -> println("rect")\n}',a:['is Rectangle','else'],e:'is Rectangle or else completes the pattern match.'},
{t:'tf',q:'data classes require overriding equals manually.',o:TF,a:1,e:'data classes generate equals automatically for value comparison.'},
{t:'order',q:'Put in order to work with sealed class results.',items:['sealed class Result','data class Ok(val value: String) : Result()','when (r) {','  is Ok -> println(r.value)','  is Err -> println(r.error)','  }'],e:'Define sealed, define subtypes, then pattern match.'}
]}
]});

U('kt',{t:'Unit 4 · Null Safety and Coroutines',l:[
{t:'Nullable Types',c:'nullable',teach:'In Kotlin, types are non-null by default. String cannot hold null. To allow null, use String?. Use the ?. safe call operator to call methods only if the object is not null. The ?: Elvis operator provides a default: name ?: "Guest" returns name if not null, else "Guest".',code:'val name: String? = null\nval len = name?.length ?: 0\nprintln(len)\nif (name != null) {\n  println(name.uppercase())\n}',qs:[
{t:'mc',q:'What is the type of a variable that can be null or a String?',o:['String','String?','Any','Nullable'],a:1,e:'String? is the nullable version; String alone cannot hold null.'},
{t:'mc',q:'What does name?.length return when name is null?',o:['0','null','Error','Length of "null"'],a:1,e:'The safe call operator ?. returns null if the receiver is null, otherwise calls the method.'},
{t:'fill',q:'Complete the Elvis operator to give a default.',code:'val title = heading ___ "Untitled"',a:['?:'],e:'?: returns the left side if not null, else the right side.'},
{t:'tf',q:'Accessing a property on a nullable type requires null safety.',o:TF,a:0,e:'You must use ?. or check != null first.'},
{t:'match',q:'Match each null safety syntax to its role.',pairs:[['String?','type allows null'],['?.','safe call operator'],['?: ','Elvis operator (default)'],['?:','chain safe calls']],e:'Kotlin requires explicit null handling for safety.'}
]},
{t:'Let and Smart Casts',c:'letcast',teach:'The let function runs a block if the object is not null: name?.let { n -> println(n) }. After a null check like if (name != null), Kotlin smart-casts name to String, allowing direct use without ?. Blocks can have multiple statements; the last expression is the result.',code:'val x: Int? = 5\nval doubled = x?.let { it * 2 } ?: 0\nif (x != null) {\n  println(x + 1)\n}\nval msg = name?.let { "Hello, $it" } ?: "No name"',qs:[
{t:'mc',q:'What does name?.let { it.uppercase() } do?',o:['Always runs uppercase','Runs uppercase only if name is not null','Returns null if name is null','Error'],a:1,e:'let runs the block only if the receiver is not null.'},
{t:'mc',q:'After if (age != null) { }, what is the type of age inside the block?',o:['Int?','Int','Any','Nullable'],a:1,e:'Smart casts make age non-null inside the block after the check.'},
{t:'fill',q:'Complete the let call with a parameter.',code:'val n: Int? = 10\nval result = n?.___ { x -> x * 2 }',a:['let'],e:'let runs the block if n is not null.'},
{t:'tf',q:'after x != null check, x smart-casts from Int? to Int.',o:TF,a:0,e:'Kotlin compiler tracks the check and allows use without the ? modifier.'},
{t:'order',q:'Put the lines in order to safely use a nullable value.',items:['val age: Int? = null','age?.let { a -> println(a) }','val years = age ?: 0','println(years)'],e:'Declare, use let for safety, use Elvis for default, print.'}
]},
{t:'Collections of Nullable Types',c:'nullcol',teach:'List<String?> holds a list where each element might be null. List<String> means all elements are non-null. Filter with filterNotNull() removes nulls and changes List<String?> to List<String>. map over nullables uses ?.to chain operations safely.',code:'val names: List<String?> = listOf("Alice", null, "Bob")\nval nonNull = names.filterNotNull()\nprintln(nonNull)\nval lengths = names.mapNotNull { it?.length }',qs:[
{t:'mc',q:'What is the type of a list that might contain nulls?',o:['List<String>','List<String?>','List<Nullable>','List<Any>'],a:1,e:'List<String?> means each element can be a String or null.'},
{t:'mc',q:'What does filterNotNull() do?',o:['Removes empty lists','Removes null elements and returns List<T>','Returns an empty list','Error'],a:1,e:'filterNotNull eliminates nulls and changes the type from List<T?> to List<T>.'},
{t:'fill',q:'Complete the operation to extract non-null lengths.',code:'val items: List<String?> = listOf("a", null, "bb")\nval lens = items.___ { it?.length }',a:['mapNotNull'],e:'mapNotNull applies a function that may return null and filters out nulls.'},
{t:'mc',q:'What does listOf("a", null, "b").filterNotNull() return?',o:['["a", null, "b"]','["a", "b"]','null','Error'],a:1,e:'filterNotNull removes null and returns a list of non-null strings.'},
{t:'match',q:'Match each type to its meaning.',pairs:[['List<String>','all elements non-null'],['List<String?>','elements might be null'],['List<String?>?','list itself might be null'],['filterNotNull','remove nulls from list']],e:'Null safety extends to collection types and operations.'}
]},
{t:'Try-Catch and Result',c:'errors',teach:'try-catch handles exceptions. try { risky code } catch (e: Exception) { handle }. finally runs regardless. The Result type represents Success or Failure: Result.success(value) or Result.failure(exception). Use getOrNull() to extract the value or null, and getOrElse to provide a default.',code:'try {\n  val n = "abc".toInt()\n} catch (e: NumberFormatException) {\n  println("Not a number")\n}\n\nval result = try {\n  "42".toInt()\n} catch (e: Exception) {\n  0\n}',qs:[
{t:'mc',q:'What does try-catch do?',o:['Tries to run code; catches returns success','Catches errors so they do not crash','Prevents null errors','Skips code'],a:1,e:'try-catch lets you handle exceptions gracefully instead of crashing.'},
{t:'mc',q:'What happens if an exception is not caught?',o:['It is ignored','The program crashes','It is converted to null','Nothing special'],a:1,e:'An uncaught exception terminates the program.'},
{t:'fill',q:'Complete the catch to handle NumberFormatException.',code:'try {\n  s.toInt()\n} ___ (e: NumberFormatException) {\n  println("bad")\n}',a:['catch'],e:'catch specifies the exception type and binds it to e.'},
{t:'tf',q:'finally always runs, even if an exception is thrown.',o:TF,a:0,e:'finally is useful for cleanup like closing files or connections.'},
{t:'order',q:'Put in order to handle and recover from an error.',items:['val n = try { "5".toInt() }','catch (e: Exception) { 0 }','println(n)'],e:'Try to parse, catch if it fails with a default, then print result.'}
]},
{t:'Coroutines Basics',c:'corout',teach:'Coroutines are lightweight threads for async tasks. launch starts a coroutine without returning a value. async starts a coroutine and returns an Deferred that can be awaited. delay(ms) suspends without blocking. withContext switches to another context. GlobalScope (simple) or runBlocking (for testing) runs coroutines.',code:'import kotlinx.coroutines.*\n\nrunBlocking {\n  launch {\n    delay(1000)\n    println("Done")\n  }\n  val result = async {\n    delay(500)\n    42\n  }\n  println(result.await())\n}',qs:[
{t:'mc',q:'What is the difference between launch and async?',o:['launch waits for result, async does not','async waits for result with await, launch does not','Both are the same','launch is faster'],a:1,e:'async returns a Deferred that can be awaited; launch fires and forgets.'},
{t:'mc',q:'What does delay(1000) do in a coroutine?',o:['Blocks the thread for 1 second','Suspends the coroutine for 1 second','Crashes','Does nothing'],a:1,e:'delay suspends the coroutine without blocking the thread, allowing others to run.'},
{t:'fill',q:'Complete the call to await a result.',code:'val result = async { 42 }\nval value = result.___()',a:['await'],e:'await gets the value from a Deferred when it is ready.'},
{t:'tf',q:'Coroutines require multiple threads.',o:TF,a:1,e:'Coroutines are lightweight and many can share one thread.'},
{t:'order',q:'Put the lines in order to run multiple async tasks.',items:['val a = async { compute1() }','val b = async { compute2() }','val x = a.await()','val y = b.await()','println(x + y)'],e:'Start both async, await both results, then combine.'}
]},
{t:'Capstone: Kotlin Mastery',c:'capstone',teach:'Apply all Kotlin concepts: types, functions, classes, inheritance, generics, null safety, collections, and coroutines. Write a program that demonstrates multiple features: sealed classes for type safety, data classes for data, nullable handling with let and Elvis, lambdas for transformations, and extension functions for convenience. Think about when to use open, override, when for pattern matching, and async for concurrency.',code:'sealed class Event\ndata class Click(val x: Int, val y: Int) : Event()\ndata class Scroll(val delta: Int) : Event()\n\nfun describe(e: Event): String = when (e) {\n  is Click -> "Click at ${e.x}, ${e.y}"\n  is Scroll -> "Scroll by ${e.delta}"\n}\n\nfun main() {\n  val events = listOf(Click(10, 20), Scroll(5))\n  events.forEach { println(describe(it)) }\n}',qs:[
{t:'mc',q:'Why is Event sealed?',o:['Performance reason','To restrict subclasses to Click and Scroll','To require inheritance','Optional style choice'],a:1,e:'Sealed ensures when handles all Event types exhaustively.'},
{t:'mc',q:'What is the benefit of data class Click(...)?',o:['Enforces immutability','Generates equals, hashCode, toString, copy','Required for sealing','Provides performance boost'],a:1,e:'data classes provide useful generated methods for data holding.'},
{t:'fill',q:'Complete the pattern to match Click events.',code:'when (event) {\n  ___ -> println("clicked")\n  is Scroll -> println("scrolled")\n}',a:['is Click'],e:'is Click matches Click instances in the sealed Event hierarchy.'},
{t:'tf',q:'Extension functions can add methods to sealed class subclasses.',o:TF,a:0,e:'Extensions work on any type, including data classes that inherit from sealed.'},
{t:'match',q:'Match each Kotlin feature to its use in the capstone.',pairs:[['sealed class Event','restrict type possibilities'],['data class Click','hold event data with methods'],['when (event)','pattern match all cases'],['is Click','type check and smart cast']],e:'The capstone combines type safety, data representation, and pattern matching.'}
]}
]});

U('cs',{t:'Unit 1 · C# Foundations',l:[
{t:'Program Structure',c:'structure',teach:'A C# program starts executing at the Main method, inside a class (or, with top-level statements, directly in Program.cs). using System; brings in the System namespace so you can write Console.WriteLine without the full name. Statements end with a semicolon and blocks use curly braces. Console.WriteLine prints a line and adds a newline; Console.Write does not.',code:'using System;\n\nclass Program {\n  static void Main() {\n    Console.WriteLine("Hello, C#");\n  }\n}',qs:[
{t:'mc',q:'Which method does the C# runtime call first in a classic console app?',o:['The constructor of Program','Main','The first line of the file','Console.WriteLine'],a:1,e:'Execution begins at Main (or the implicit Main generated from top-level statements). Classes do not run code just by being defined.'},
{t:'fill',q:'Complete the directive that lets you use Console without the full namespace.',code:'___ System;',a:['using'],e:'using System; imports the System namespace so Console, which lives in System, can be used by its short name.'},
{t:'mc',q:'What does this print?',code:'Console.Write("A");\nConsole.Write("B");\nConsole.WriteLine("C");',o:['A B C on three lines','ABC','ABC with no newline after','CBA'],a:1,e:'Write does not add a newline, so A and B join C on one line; WriteLine then ends the line, printing ABC.'},
{t:'mc',q:'Find the bug: why does this fail to compile?',code:'class Program {\n  static void Main() {\n    Console.WriteLine("Hi")\n  }\n}',o:['Main must return int','The WriteLine call is missing a semicolon','Strings need single quotes','The class must be named Hello'],a:1,e:'Every statement needs a trailing semicolon. Main can return void, and C# strings use double quotes.'}]},
{t:'Variables and Types',c:'types',teach:'C# is statically typed. Common types: int (whole numbers), double (decimals), bool (true/false), char (one character), string (text). var lets the compiler infer the type from the initializer, but the variable is still statically typed from then on; var x; with no initializer does not compile.',code:'int age = 30;\ndouble price = 9.99;\nbool ready = true;\nchar grade = \'A\';\nvar name = "Ana";\nConsole.WriteLine(name.Length);',qs:[
{t:'mc',q:'Which type is best for the value 3.14?',o:['int','double','bool','char'],a:1,e:'double stores decimal values. int would drop the fractional part.'},
{t:'fill',q:'Declare a whole-number variable.',code:'___ count = 5;',a:['int'],e:'int is the standard whole-number type in C#.'},
{t:'tf',q:'var infers a type once, at declaration, and the variable keeps that type afterward.',o:TF,a:0,e:'var is resolved at compile time from the initializer; it is not a dynamic type, so reassigning a different type later is an error.'},
{t:'mc',q:'Find the bug: why does this fail to compile?',code:'var x;\nx = 5;',o:['var cannot hold an int','var needs an initializer on the same line so the compiler can infer a type','x should be named differently','5 needs a type suffix'],a:1,e:'var requires an initializer so the compiler knows what type to infer; it cannot be declared and assigned on separate lines.'},
{t:'match',q:'Match each value to its best type.',pairs:[['true','bool'],['42','int'],['2.5','double'],['"hi"','string']],e:'Each literal has a natural C# type: bool for true/false, int for whole numbers, double for decimals, string for text.'}]},
{t:'Operators and Casting',c:'ops',teach:'Arithmetic uses + - * / %. Dividing two ints performs integer division and truncates toward zero, so 7 / 2 is 3. Use % for the remainder. Mixing in a double promotes the result to double. Narrowing needs an explicit cast like (int)3.9, which truncates rather than rounds. Compound assignment looks like x += 2 and ++ adds one.',code:'int a = 7, b = 2;\nConsole.WriteLine(a / b);\nConsole.WriteLine(a % b);\nConsole.WriteLine((double)a / b);\nConsole.WriteLine((int)3.9);',qs:[
{t:'mc',q:'What does this print?',code:'Console.WriteLine(7 / 2);',o:['3.5','3','4','3.0'],a:1,e:'Both operands are int, so integer division truncates the fraction, giving 3.'},
{t:'mc',q:'What does this print?',code:'int x = 10;\nx += 5;\nx++;\nConsole.WriteLine(x);',o:['15','16','17','10'],a:1,e:'x becomes 15 after += 5, then 16 after the increment.'},
{t:'fill',q:'Cast so the division keeps its fraction.',code:'int a = 7, b = 2;\ndouble r = (___) a / b;',a:['double'],e:'Casting a to double first makes the division a double division, giving 3.5.'},
{t:'mc',q:'What does (int)3.9 evaluate to?',o:['4','3','3.9','It does not compile'],a:1,e:'Casting a double to int truncates toward zero; it does not round.'},
{t:'tf',q:'10 % 3 evaluates to 1.',o:TF,a:0,e:'% gives the remainder: 10 equals 3 times 3 plus 1.'}]},
{t:'Strings',c:'strings',teach:'string holds text and is immutable: methods like ToUpper return a new string instead of changing the original. Unlike some languages, C# overloads == on string to compare contents, so "cat" == "cat" is true. Useful members: Length, Substring, IndexOf, Contains, Trim, Split, and string interpolation with $"...{expr}...". Indexes start at 0.',code:'string s = "Hello";\nConsole.WriteLine(s.Length);\nConsole.WriteLine(s[1]);\nConsole.WriteLine(s.Substring(1, 3));\nConsole.WriteLine(s.ToUpper());\nint n = 5;\nConsole.WriteLine($"n is {n}");',qs:[
{t:'mc',q:'What does this print?',code:'string s = "Hello";\nConsole.WriteLine(s.Substring(1, 3));',o:['Hel','ell','He','Hell'],a:1,e:'Substring(start, length) takes 3 characters beginning at index 1: e, l, l, giving "ell".'},
{t:'mc',q:'How does == behave for two string variables with the same content?',o:['It always returns false','It compares the characters and returns true','It compares memory addresses only','It throws an exception'],a:1,e:'C# overloads == for string to compare contents, so two strings with the same characters are == even if they are different objects.'},
{t:'mc',q:'What does this print?',code:'string s = "java";\ns.ToUpper();\nConsole.WriteLine(s);',o:['JAVA','java','Java','It does not compile'],a:1,e:'Strings are immutable; ToUpper returns a new string which was discarded here, so s is unchanged.'},
{t:'fill',q:'Complete the interpolated string that embeds the variable n.',code:'int n = 5;\nConsole.WriteLine($"n is {___}");',a:['n'],e:'Inside an interpolated string, braces hold an expression to embed; here it is simply the variable n.'},
{t:'order',q:'Put the lines in order to print the first character of a string.',items:['string s = "Blob";','char c = s[0];','Console.WriteLine(c);'],e:'Declare the string, read index 0, then print it. Using c before it is declared would not compile.'}]},
{t:'Conditionals',c:'cond',teach:'if, else if and else choose between branches using bool conditions. Combine conditions with && (and), || (or) and ! (not). Unlike some languages, the condition must be a genuine bool; if (x = 5) does not compile because assignment produces an int. switch can match a value against cases; modern switch expressions use => and need no break.',code:'int n = 2;\nstring kind = n switch {\n  1 => "one",\n  2 => "two",\n  _ => "many"\n};\nConsole.WriteLine(kind);',qs:[
{t:'mc',q:'What does this print?',code:'int x = 5;\nif (x > 10) Console.WriteLine("A");\nelse if (x > 3) Console.WriteLine("B");\nelse Console.WriteLine("C");',o:['A','B','C','B and C'],a:1,e:'x > 10 is false, x > 3 is true, so B prints and the else is skipped.'},
{t:'mc',q:'What does this print?',code:'int n = 1;\nswitch (n) {\n  case 1:\n    Console.Write("a");\n    goto case 2;\n  case 2:\n    Console.Write("b");\n    break;\n  case 3:\n    Console.Write("c");\n    break;\n}',o:['a','ab','abc','b'],a:1,e:'case 1 explicitly falls into case 2 using goto case 2 (C# requires this instead of implicit fall-through), printing a then b.'},
{t:'tf',q:'In C#, if (x = 5) is valid when x is an int.',o:TF,a:1,e:'Assignment produces an int, not a bool, and C# requires the if condition to be a bool, so this does not compile. Use == to compare.'},
{t:'fill',q:'Complete the logical AND.',code:'if (age >= 18 ___ hasId) { }',a:['&&'],e:'&& means both conditions must be true. || would require only one.'},
{t:'mc',q:'Find the bug: what is wrong?',code:'int score = 80;\nif (score > 50 && < 90) {\n  Console.WriteLine("ok");\n}',o:['Nothing; it compiles','Each side of && needs a full condition: score < 90','&& must be replaced with &','score must be double'],a:1,e:'C# does not allow chained comparisons; you must repeat the variable: score > 50 && score < 90.'}]},
{t:'Checkpoint: Foundations',c:'check1',teach:'Review: Main as the entry point, static types with var inference, integer division and casts, immutable strings compared with ==, and conditionals with && and switch expressions. Remember that integer division truncates and string == compares content in C#.',code:'int a = 9;\nstring s = "ab";\nif (a / 2 == 4 && s.Length == 2) {\n  Console.WriteLine("yes");\n}',qs:[
